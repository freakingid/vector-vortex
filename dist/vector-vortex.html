//   fadeOut    s — the fade when setState() names a silence
//   noise      () => number in [0, 1) — fills the noise buffer
//   layerSink  optional ({ ctx, track, index, layer, out }) => node | null
// The optional groups (0.3.0, 0.4.0). Absent, a group builds no node and
// changes nothing:
//   gating     { thresholds: { 2, 3, 4 }, ramp } — tier gates and setIntensity(f)
//   sweep      { minHz, maxHz, q, tc } — a low-pass and setSweep(f)
//   highpass   { hz, tc } — a Butterworth high-pass and setHighpass(on)
//   limiter    { threshold, knee, ratio, attack, release } — a compressor node
//   duck       { gain, ramp, dipGain, dipHold } — setDuck(on) and dip()
//   onBeat     optional (t) => void — each note of a `beat: true` layer, at its start
//
// Signal path: note envelopes -> layer gate -> [track gain, crossfaded]
//   -> [sweep] -> [highpass] -> [limiter] -> duck -> [dip] -> engine.music
// ⛔ The duck and the dip sit AFTER the limiter: in front of it, a 6 dB duck
// comes out as about 2 dB.
// ⛔ The high-pass sits BEFORE it, with the sweep: it is a tone change on the
// programme and belongs on the same side of the limiter as the other one, so
// what the limiter sees is the sound the host asked for.
function createMusic(engine, options) {
  if (!engine || typeof engine.unlock !== "function") {
    throw new Error("createMusic: engine must come from createAudioEngine()");
  }
  const opts = options || {};
  const lookahead = audioRequireNum(opts, "createMusic", "lookahead");
  const crossfade = audioRequireNum(opts, "createMusic", "crossfade");
  const fadeOut   = audioRequireNum(opts, "createMusic", "fadeOut");
  // DEPARTURE 1: the noise source is injected, so a host keeps its own seeded
  // stream and the build holds no unseeded draw.
  if (typeof opts.noise !== "function") throw new Error("createMusic: options.noise must be a function");
  const noise = opts.noise;
  // DEPARTURE 4: a host's per-layer insert. Returns the node a layer's gate
  // should feed (which the host has connected onward to `out`), or null for
  // the plain path. A lab hangs SOLO and MUTE here; a game passes none.
  const layerSink = typeof opts.layerSink === "function" ? opts.layerSink : null;
  const gating   = audioGroup(opts, "gating", ["ramp"]);
  if (gating) {
    if (!gating.thresholds || typeof gating.thresholds !== "object") {
      throw new Error("createMusic: options.gating.thresholds must be an object");
    }
    for (const tier of [2, 3, 4]) audioRequireNum(gating.thresholds, "createMusic: options.gating.thresholds", tier);
  }
  const sweepOpts = audioGroup(opts, "sweep", ["minHz", "maxHz", "q", "tc"]);
  const hpOpts    = audioGroup(opts, "highpass", ["hz", "tc"]);
  const limitOpts = audioGroup(opts, "limiter", ["threshold", "knee", "ratio", "attack", "release"]);
  const duckOpts  = audioGroup(opts, "duck", ["gain", "ramp", "dipGain", "dipHold"]);
  if (opts.onBeat !== undefined && typeof opts.onBeat !== "function") {
    throw new Error("createMusic: options.onBeat must be a function");
  }
  const onBeat = opts.onBeat || null;
  const tracks = opts.tracks === undefined ? {} : opts.tracks;
  audioCheckTracks(tracks, gating);
  const sweepHz = f => sweepOpts.minHz * Math.pow(sweepOpts.maxHz / sweepOpts.minHz, f);

  return {
    duck: null,          // GainNode: the menu duck, after the limiter. Unity without the duck group
    dipNode: null,       // GainNode after the duck (duck group only): the event dips
    limiter: null,       // compressor node (limiter group only)
    highpass: null,      // high-pass BiquadFilterNode (highpass group only)
    sweep: null,         // low-pass BiquadFilterNode (sweep group only)
    inlet: null,         // the node a track gain feeds: the first of sweep, highpass, limiter, duck
    trackGain: null,     // GainNode for the currently-scheduled track; replaced (crossfaded) on setState
    state: "off",        // current track name, or a name with no track (silence)
    track: null,         // the active step table, or null for a silence
    step: 0,             // scheduler cursor into track.steps
    nextStepTime: 0,     // absolute ctx time of the next step to schedule
    layerGates: null,    // [{ node, tier, target, from, at }] parallel to this.track.layers, or null
    noiseBuf: null,      // lazily-built 2 s mono white-noise buffer, for `noise: true` layers
    intensity: 0,        // 0..1, held by setIntensity(); read only by the gates
    sweepLevel: 1,       // 0..1, held by setSweep(); 1 is fully open
    sweepTarget: null,   // Hz last targeted, so a per-frame setSweep() is idempotent
    highpassed: false,   // last high-pass target, so a per-frame setHighpass() is idempotent
    ducked: false,       // last duck target, so a per-frame setDuck() is idempotent
    duckLevels: [],      // breakpoints scheduled on the duck (audioLevelAt)
    dipLevels: [],       // breakpoints scheduled on the dip

    // Lazily build the post-track chain once the bus graph exists (first user
    // gesture), downstream first. Each node is built ONCE per graph, at the
    // level held so far: a level, not a change.
    ensureGraph() {
      if (this.duck || !engine.ctx || !engine.music) return;
      const ctx = engine.ctx;
      let out = engine.music;
      if (duckOpts) {
        this.dipNode = ctx.createGain();
        this.dipNode.gain.value = 1.0;
        this.dipNode.connect(out);
        out = this.dipNode;
      }
      this.duck = ctx.createGain();
      this.duck.gain.value = this.ducked ? duckOpts.gain : 1.0;   // honour a duck asked for before the graph
      this.duck.connect(out);
      out = this.duck;
      if (limitOpts) {
        const l = ctx.createDynamicsCompressor();
        l.threshold.value = limitOpts.threshold;
        l.knee.value = limitOpts.knee;
        l.ratio.value = limitOpts.ratio;
        l.attack.value = limitOpts.attack;
        l.release.value = limitOpts.release;
        l.connect(out);
        this.limiter = l;
        out = l;
      }
      // ⛔ AFTER THE LIMITER IN BUILD ORDER IS BEFORE IT IN SIGNAL ORDER: this
      // chain is wired downstream first, so the node built here feeds the
      // limiter and the sweep below feeds this one. Built at the level held so
      // far, never at a change, exactly like the duck.
      if (hpOpts) {
        const h = ctx.createBiquadFilter();
        h.type = "highpass";
        h.Q.value = AUDIO_BUTTERWORTH_Q;
        h.frequency.value = this.highpassed ? hpOpts.hz : AUDIO_HP_OFF_HZ;
        h.connect(out);
        this.highpass = h;
        out = h;
      }
      if (sweepOpts) {
        const s = ctx.createBiquadFilter();
        s.type = "lowpass";
        s.Q.value = sweepOpts.q;
        this.sweepTarget = sweepHz(this.sweepLevel);
        s.frequency.value = this.sweepTarget;
        s.connect(out);
        this.sweep = s;
        out = s;
      }
      this.inlet = out;
    },

    // A layer's gate level at the held intensity: 1 or 0, never between.
    gateTarget(tier) {
      if (!gating || !tier || tier === 1) return 1;
      return this.intensity >= gating.thresholds[tier] ? 1 : 0;
    },

    // The first bar line at or after `now`, on the scheduler's own grid: the
    // step under the cursor starts at nextStepTime, and a bar starts on every
    // step index divisible by the track's `bar`.
    nextBar(now) {
      const stepDur = this.track.stepDur, bar = this.track.bar;
      let k = Math.ceil((now - this.nextStepTime) / stepDur - 1e-9);
      const idx = (((this.step + k) % bar) + bar) % bar;
      if (idx) k += bar - idx;
      return this.nextStepTime + k * stepDur;
    },

    // The intensity setter, 0..1, clamped. OO's gate loop, idempotent: a gate
    // moves only when its target flips. DEPARTURE 5: ⛔ THE CHANGE LATCHES TO
    // THE NEXT BAR LINE, where the gate ramps over gating.ramp; the source
    // ramped at currentTime, and a layer entering mid-phrase sounds like a bug.
    // A flip back before that bar line withdraws the waiting change.
    setIntensity(f) {
      this.intensity = audioClamp01(f);
      if (!engine.ctx || !gating || !this.track || !this.layerGates) return;
      const now = engine.ctx.currentTime;
      let tBar = null;
      for (const lg of this.layerGates) {
        const target = this.gateTarget(lg.tier);
        if (target === lg.target) continue;
        const prev = lg.target, p = lg.node.gain;
        lg.target = target;
        if (lg.at >= now) {                      // still waiting for its bar line
          p.cancelScheduledValues(lg.at);
          const back = target === lg.from;
          lg.at = -Infinity;
          if (back) continue;
        }
        if (tBar === null) tBar = this.nextBar(now);
        lg.from = prev;
        lg.at = tBar;
        p.cancelScheduledValues(tBar);
        p.setValueAtTime(prev, tBar);
        p.linearRampToValueAtTime(target, tBar + gating.ramp);
      }
    },

    // The sweep, 0..1 (1 fully open): minHz * (maxHz / minHz)^f, moved with a
    // time constant so it never steps. It adds no notes, so it does not latch.
    setSweep(f) {
      this.sweepLevel = audioClamp01(f);
      if (!engine.ctx || !sweepOpts) return;
      this.ensureGraph();
      if (!this.sweep) return;
      const hz = sweepHz(this.sweepLevel);
      if (hz === this.sweepTarget) return;
      this.sweepTarget = hz;
      this.sweep.frequency.setTargetAtTime(hz, engine.ctx.currentTime, sweepOpts.tc);
    },

    // ⛔ THE HIGH-PASS, ON OR OFF (0.4.0). Idempotent under per-frame calls —
    // the host is expected to call it every frame with a boolean — so it
    // automates on the flip and on nothing else. ⛔ It MOVES BY setTargetAtTime
    // over highpass.tc and ⛔ NEVER by a bare .value after the graph is built:
    // a .value during a ramp is a step, and this one's whole job is to arrive
    // and leave without a click. "Off" is AUDIO_HP_OFF_HZ, a pass-through, so
    // the node stays in the path and the transition is a frequency move.
    setHighpass(on) {
      if (!hpOpts) return;
      on = !!on;
      if (on === this.highpassed) return;
      if (!engine.ctx) { this.highpassed = on; return; }   // no graph yet: ensureGraph honours it
      this.ensureGraph();                                  // build at the CURRENT level first
      this.highpassed = on;
      if (!this.highpass) return;
      this.highpass.frequency.setTargetAtTime(on ? hpOpts.hz : AUDIO_HP_OFF_HZ,
                                              engine.ctx.currentTime, hpOpts.tc);
    },

    // The menu duck, OO's setDuck: idempotent under per-frame calls, and ⛔ a
    // RAMP over duck.ramp, never a bare .value set.
    setDuck(on) {
      if (!duckOpts) return;
      on = !!on;
      if (on === this.ducked) return;
      if (!engine.ctx) { this.ducked = on; return; }   // no graph yet: ensureGraph honours it
      this.ensureGraph();                              // build at the CURRENT level first
      this.ducked = on;
      if (!this.duck) return;
      const t = engine.ctx.currentTime, p = this.duck.gain;
      const from = audioLevelAt(this.duckLevels, t), to = on ? duckOpts.gain : 1.0;
      p.cancelScheduledValues(t);
      p.setValueAtTime(from, t);
      p.linearRampToValueAtTime(to, t + duckOpts.ramp);
      this.duckLevels = [[t, from], [t + duckOpts.ramp, to]];
    },

    // An event dip (DEPARTURE 7): down to duck.dipGain over duck.ramp, held
    // duck.dipHold, back to unity over duck.ramp. Its own node, so a dip inside
    // a duck multiplies and neither cancels the other. A dip during a dip
    // starts again from the level it has reached.
    dip() {
      if (!duckOpts || !engine.ctx) return;
      this.ensureGraph();
      if (!this.dipNode) return;
      const t = engine.ctx.currentTime, p = this.dipNode.gain, r = duckOpts.ramp;
      const from = audioLevelAt(this.dipLevels, t), low = duckOpts.dipGain;
      p.cancelScheduledValues(t);
      p.setValueAtTime(from, t);
      p.linearRampToValueAtTime(low, t + r);
      p.setValueAtTime(low, t + r + duckOpts.dipHold);
      p.linearRampToValueAtTime(1.0, t + r + duckOpts.dipHold + r);
      this.dipLevels = [[t, from], [t + r, low], [t + r + duckOpts.dipHold, low], [t + r + duckOpts.dipHold + r, 1.0]];
    },

    // Crossfade to a named track. Fades out and retires the previous track's
    // gain (already-scheduled notes ring out and nothing new feeds it), and
    // starts a fresh gain ramping up for the new one. A name with no track
    // fades to silence over fadeOut and leaves trackGain null, so the
    // scheduler idles.
    setState(s) {
      if (!engine.ctx) return;
      this.ensureGraph();
      if (s === this.state) return;
      const ctx = engine.ctx, t = ctx.currentTime;
      const next = tracks[s] || null;
      if (this.trackGain) {
        const g = this.trackGain, fade = next ? crossfade : fadeOut;
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.linearRampToValueAtTime(0.0001, t + fade);
        this.trackGain = null;
      }
      this.state = s;
      this.track = next;
      this.step = 0;
      this.layerGates = null;
      if (this.track && this.duck) {
        this.nextStepTime = t;                    // start scheduling from now, never in the past
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(1, t + crossfade);
        g.connect(this.inlet);
        this.trackGain = g;
        // One persistent gate per layer, built straight at its target for the
        // CURRENT intensity (OO's idiom): the track-level crossfade above fades
        // the whole track in, so a gate needs no ramp of its own. Later changes
        // latch to a bar line in setIntensity(). Without a tier a gate is open.
        this.layerGates = this.track.layers.map((layer, index) => {
          const node = ctx.createGain();
          const target = this.gateTarget(layer.tier);
          node.gain.value = target;
          const sink = layerSink ? layerSink({ ctx, track: s, index, layer, out: g }) : null;
          node.connect(sink || g);
          return { node, tier: layer.tier || 1, target, from: target, at: -Infinity };
        });
      }
    },

    // The lookahead scheduler: once per frame, schedule every step whose start
    // time falls inside the next `lookahead` seconds, on the context's clock.
    update() {
      if (!engine.ctx) return;
      this.ensureGraph();
      if (!this.track || !this.trackGain) return;
      const ctx = engine.ctx, now = ctx.currentTime, horizon = now + lookahead;
      const stepDur = this.track.stepDur;
      // DEPARTURE 2: ⛔ STALL RESYNC. No frame runs while a tab is hidden, and
      // a hidden tab is a shipped pause source, so a long gap is routine. The
      // source clamped every missed step to `now` and fired them all at once
      // (931 notes after 60 s). Past one lookahead behind, skip the whole
      // missed steps instead: the cursor and the clock advance together, so bar
      // phase holds, and nothing that should already have sounded is played.
      if (this.nextStepTime < now - lookahead) {
        const missed = Math.floor((now - this.nextStepTime) / stepDur);
        this.nextStepTime += missed * stepDur;
        this.step = (this.step + missed) % this.track.steps;
      }
      let guard = 1024;                           // bound catch-up (never dump the loop)
      while (this.nextStepTime < horizon && guard-- > 0) {
        this.scheduleStep(this.step, this.nextStepTime);
        this.nextStepTime += stepDur;
        this.step = (this.step + 1) % this.track.steps;
      }
    },

    scheduleStep(step, tStep) {
      if (!engine.ctx || !this.track || !this.layerGates) return;
      const t = Math.max(tStep, engine.ctx.currentTime); // a late step must not schedule into the past
      const layers = this.track.layers;
      // Every layer is scheduled unconditionally, whatever its mark and
      // whatever the intensity. Gating is a downstream GAIN gate
      // (this.layerGates), never a scheduling omission.
      for (let i = 0; i < layers.length; i++) {
        const cell = layers[i].steps[step];
        if (!cell) continue;
        this.playNote(layers[i], cell, t, i);
        if (onBeat && layers[i].beat) onBeat(t);     // DEPARTURE 7: the onset, on the context clock
      }
    },

    // Lazily build a cached 2 s mono white-noise buffer, for `noise: true` layers.
    ensureNoiseBuf() {
      if (this.noiseBuf || !engine.ctx) return;
      const ctx = engine.ctx, n = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = noise() * 2 - 1;   // DEPARTURE 1
      this.noiseBuf = buf;
    },

    playNote(layer, cell, t, layerIndex) {
      if (!engine.ctx || !this.track || !this.layerGates) return;
      const ctx = engine.ctx, dur = cell.dur * this.track.stepDur;
      const peak = (cell.g == null ? 1 : cell.g) * layer.gain;
      const atk = Math.min(layer.atk == null ? 0.4 : layer.atk, dur * 0.5);
      const rel = Math.min(layer.rel == null ? 0.5 : layer.rel, dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + atk);
      g.gain.setValueAtTime(peak, t + Math.max(atk, dur - rel));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      let sink = g;
      if (layer.cutoff) {
        const f = ctx.createBiquadFilter();
        f.type = "lowpass";
        f.Q.value = layer.q || 1;
        f.frequency.setValueAtTime(layer.cutoff, t);
        if (layer.cutoffTo)
          f.frequency.exponentialRampToValueAtTime(layer.cutoffTo, t + Math.min(layer.cutoffTime || dur, dur));
        f.connect(sink); sink = f;
      }
      if (layer.hp) {
        const f = ctx.createBiquadFilter();
        f.type = "highpass"; f.frequency.value = layer.hp;
        f.connect(sink); sink = f;
      }
      if (layer.noise) {
        this.ensureNoiseBuf();
        const s = ctx.createBufferSource();
        s.buffer = this.noiseBuf; s.connect(sink);
        s.start(t); s.stop(t + dur + 0.05);
      } else {
        const freqs = layer.detune ? [cell.f, cell.f * Math.pow(2, layer.detune / 1200)] : [cell.f];
        for (const fr of freqs) {
          const o = ctx.createOscillator();
          o.type = layer.type; o.frequency.setValueAtTime(fr, t);
          if (layer.drop)
            o.frequency.exponentialRampToValueAtTime(Math.max(24, fr * Math.pow(2, -layer.drop / 12)),
                                                     t + (layer.dropTime || 0.06));
          o.connect(sink); o.start(t); o.stop(t + dur + 0.1);
        }
      }
      g.connect(this.layerGates[layerIndex].node);   // through this layer's gate
    },
  };
}

// ---------------------------------------------------------------------------
// The SFX player (0.2.0). A sound is a RECIPE, plain data:
//   { osc: [ { type, f, to } ] | noise: true, glide, filter: { type, f, to, q },
//     sweep, atk, hold, rel, gain }
//   osc     one or two oscillators; type is a wave name, f the start frequency
//           and `to` (optional) the end frequency, reached over `glide` s
//   noise   true instead of osc: the injected generator's buffer, looped
//   filter  optional; type "lowpass" or "highpass", f -> `to` over `sweep` s
//   atk / hold / rel  s: the envelope, rising to `gain` (linear peak)
// A recipe names exactly one of osc and noise. A `to` needs its glide or sweep.
//
// play(recipe, { pitch, when }) sounds it once. `pitch` multiplies every
// frequency in it, the filter's included, so one recipe serves many voices.
// `when` is an absolute context time (default: now). Every source stops itself
// at the end of the release.
//
// hold(recipe) starts a voice that sustains at `gain` until stop(). It returns
// { set(t01), stop() }: set() moves every frequency to f * (to / f)^t01 on an
// exponential curve (glide and sweep are not read), and stop() releases over
// `rel` and stops every source. Held before a context exists, it returns a
// handle whose calls do nothing.
const SFX_WAVES = ["sine", "square", "sawtooth", "triangle"];
const SFX_FILTERS = ["lowpass", "highpass"];
const SFX_RECIPE_FIELDS = ["osc", "noise", "glide", "filter", "sweep", "atk", "hold", "rel", "gain"];
const SFX_FLOOR = 0.0001;     // an exponential ramp's silence: it cannot reach 0
const SFX_TAIL = 0.02;        // s a source outlives its release, so it never clicks off
const SFX_SET_TC = 0.01;      // s time constant of a held voice's set()

function sfxPositive(v) { return typeof v === "number" && isFinite(v) && v > 0; }

// Throws on a recipe the player cannot build, naming the field.
function sfxCheckRecipe(r) {
  const bad = why => { throw new Error("sfx recipe: " + why); };
  if (!r || typeof r !== "object") bad("must be an object");
  for (const k of Object.keys(r)) if (SFX_RECIPE_FIELDS.indexOf(k) < 0) bad("unknown field " + k);
  const hasOsc = r.osc !== undefined, hasNoise = r.noise === true;
  if (r.noise !== undefined && r.noise !== true) bad("noise must be true or absent");
  if (hasOsc === hasNoise) bad("needs exactly one of osc and noise");
  let glides = false;
  if (hasOsc) {
    if (!Array.isArray(r.osc) || r.osc.length < 1 || r.osc.length > 2) bad("osc must hold one or two oscillators");
    for (const o of r.osc) {
      if (!o || SFX_WAVES.indexOf(o.type) < 0) bad("osc type must be one of " + SFX_WAVES.join(", "));
      if (!sfxPositive(o.f)) bad("osc f must be > 0");
      if (o.to !== undefined) { if (!sfxPositive(o.to)) bad("osc to must be > 0"); glides = true; }
    }
  }
  if (glides && !sfxPositive(r.glide)) bad("an osc `to` needs glide > 0");
  if (r.filter !== undefined) {
    const fl = r.filter;
    if (!fl || SFX_FILTERS.indexOf(fl.type) < 0) bad("filter type must be one of " + SFX_FILTERS.join(", "));
    if (!sfxPositive(fl.f)) bad("filter f must be > 0");
    if (fl.q !== undefined && !sfxPositive(fl.q)) bad("filter q must be > 0");
    if (fl.to !== undefined) {
      if (!sfxPositive(fl.to)) bad("filter to must be > 0");
      if (!sfxPositive(r.sweep)) bad("a filter `to` needs sweep > 0");
    }
  }
  if (!sfxPositive(r.atk)) bad("atk must be > 0");
  if (typeof r.hold !== "number" || !isFinite(r.hold) || r.hold < 0) bad("hold must be >= 0");
  if (!sfxPositive(r.rel)) bad("rel must be > 0");
  if (!sfxPositive(r.gain)) bad("gain must be > 0");
}

// createSfxPlayer(engine, { noise })
//   noise  () => number in [0, 1) — fills the noise buffer once
// Signal path: sources -> [filter] -> envelope gain -> engine.sfx
function createSfxPlayer(engine, options) {
  if (!engine || typeof engine.unlock !== "function") {
    throw new Error("createSfxPlayer: engine must come from createAudioEngine()");
  }
  const opts = options || {};
  if (typeof opts.noise !== "function") throw new Error("createSfxPlayer: options.noise must be a function");
  const noise = opts.noise;
  let noiseBuf = null;

  // A cached 1 s mono white-noise buffer, filled from the injected generator.
  function ensureNoiseBuf() {
    if (noiseBuf || !engine.ctx) return;
    const ctx = engine.ctx, n = ctx.sampleRate;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = noise() * 2 - 1;
    noiseBuf = buf;
  }

  // The node set: one gain, at most one filter, one or two sources. Started at
  // t, connected to the sfx bus, envelope attack scheduled; never stopped here.
  function voice(r, pitch, t) {
    const ctx = engine.ctx;
    const g = ctx.createGain();
    g.gain.setValueAtTime(SFX_FLOOR, t);
    g.gain.exponentialRampToValueAtTime(r.gain, t + r.atk);
    g.connect(engine.sfx);
    let sink = g, filter = null;
    if (r.filter) {
      filter = ctx.createBiquadFilter();
      filter.type = r.filter.type;
      filter.Q.value = r.filter.q || 1;
      filter.frequency.setValueAtTime(r.filter.f * pitch, t);
      filter.connect(g);
      sink = filter;
    }
    const sources = [], oscs = [];
    if (r.noise) {
      ensureNoiseBuf();
      const s = ctx.createBufferSource();
      s.buffer = noiseBuf; s.loop = true;
      s.connect(sink); s.start(t);
      sources.push(s);
    } else {
      for (const o of r.osc) {
        const s = ctx.createOscillator();
        s.type = o.type;
        s.frequency.setValueAtTime(o.f * pitch, t);
        s.connect(sink); s.start(t);
        sources.push(s); oscs.push(s);
      }
    }
    return { g, filter, sources, oscs };
  }

  function play(recipe, o) {
    sfxCheckRecipe(recipe);
    const po = o || {};
    const pitch = po.pitch === undefined ? 1 : po.pitch;
    if (!sfxPositive(pitch)) throw new Error("sfx play: pitch must be > 0");
    if (!engine.ctx || !engine.sfx) return;
    const now = engine.ctx.currentTime;
    const t = typeof po.when === "number" && po.when > now ? po.when : now;
    const v = voice(recipe, pitch, t);
    const end = t + recipe.atk + recipe.hold + recipe.rel;
    recipe.osc && recipe.osc.forEach((osc, i) => {
      if (osc.to !== undefined) v.oscs[i].frequency.exponentialRampToValueAtTime(osc.to * pitch, t + recipe.glide);
    });
    if (v.filter && recipe.filter.to !== undefined) {
      v.filter.frequency.exponentialRampToValueAtTime(recipe.filter.to * pitch, t + recipe.sweep);
    }
    v.g.gain.setValueAtTime(recipe.gain, t + recipe.atk + recipe.hold);
    v.g.gain.exponentialRampToValueAtTime(SFX_FLOOR, end);
    for (const s of v.sources) s.stop(end + SFX_TAIL);
  }

  function hold(recipe) {
    sfxCheckRecipe(recipe);
    if (!engine.ctx || !engine.sfx) return { set() {}, stop() {} };
    const ctx = engine.ctx;
    const v = voice(recipe, 1, ctx.currentTime);
    let stopped = false;
    const along = (a, b, k) => (b === undefined ? a : a * Math.pow(b / a, k));
    return {
      set(t01) {
        if (stopped || typeof t01 !== "number" || !isFinite(t01)) return;
        const k = Math.min(1, Math.max(0, t01)), now = ctx.currentTime;
        recipe.osc && recipe.osc.forEach((osc, i) => {
          v.oscs[i].frequency.setTargetAtTime(along(osc.f, osc.to, k), now, SFX_SET_TC);
        });
        if (v.filter) v.filter.frequency.setTargetAtTime(along(recipe.filter.f, recipe.filter.to, k), now, SFX_SET_TC);
      },
      stop() {
        if (stopped) return;
        stopped = true;
        const now = ctx.currentTime, gain = v.g.gain;
        gain.cancelScheduledValues(now);
        gain.setValueAtTime(Math.max(gain.value, SFX_FLOOR), now);
        gain.exponentialRampToValueAtTime(SFX_FLOOR, now + recipe.rel);
        for (const s of v.sources) s.stop(now + recipe.rel + SFX_TAIL);
      },
    };
  }

  return { VERSION: AUDIO_VERSION, play, hold };
}

// ==========================================================================
// 17-audio-tracks.js
// ==========================================================================
// 17-audio-tracks.js — the music, as DATA: `title`, `pulse` and `drive` (GDD 11.3, 11.7).
//
// ⛔ COMPOSED IN tools/music-lab.html AND PORTED VERBATIM. This whole file is
// the lab's BLOCK B, character for character (test-cs009-p2.js). Never re-tune
// a gain here: move the slider in the lab, press COPY TABLE, and paste what it
// prints over this file.
//
// ⛔ A `tier` ONLY ON A LAYER MARKED PASS, and only on a track with `bar` (steps
// per bar): a tier change waits for the bar line (GDD 11.5). A layer with no
// tier is the always-on foundation, and ⛔ THE MELODY IS ALWAYS FOUNDATION.
// `pulse` earns two layers (Paul's D1, CS010): `cycle` at tier 2, the hook, and
// `tick` at tier 3, the groove. `title` is untiered. `audition` is the lab's
// PASS / FAIL mark; the scheduler reads neither it nor `tier`. ✅ Paul marked
// every `title` and `pulse` layer PASS in the lab (2026-09-16), after the
// articulation pass below. The music plays through a limiter (CS010), so those
// gains are Paul's lab balance as he set it.
// ⚠ `drive` (CS012 P1, O13) is UNAUDITIONED and UNTIERED: no layer carries a
// mark or a tier, and its gains are the composer's. Paul's lab session marks,
// tiers and balances it, and ports as its own commit.
// `heart` and `drive`'s `kick` are marked `beat: true` (CS010 P4): the engine
// reports each of their onsets through `onBeat`, on the context clock. A hand
// edit; COPY TABLE keeps it. One such layer per track.
//
// ⛔ EVERY LAYER IS WRITTEN AS A PART, to be recognisable played solo (GDD
// 11.4(c)): a tune, a line, a figure or a groove. Never texture.
//
// ⚠ SETTLED — EVERY NOTE IS STRUCK, NEVER SWELLED (Paul, 2026-09-16; GDD 11.3).
// The game is punch and staccato, right on the beat; a soft attack or a long
// ring reads as imprecise. So, on every layer:
//   attack   atk <= 0.005 s
//   decay    it starts within 0.05 s of the onset: `rel` is at least the note's
//            sounding length, so nothing holds and nothing fades in
//   length   a note SOUNDS for at most its layer's GATE, in steps, whatever its
//            written length: the rhythm is carried by the onsets
//   filter   a sweep closes over the note (bright to dark), never opens
//
// ⛔ THIS FILE READS NO GAME GLOBAL. The lab runs it with no config object.

// MIDI note number to Hz. 69 is A4.
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// One layer's empty step row.
function trackRow(n) { return new Array(n).fill(null); }

// Writes one note into a row. `dur` is in steps; `g` scales the layer's gain.
// A noise layer reads no pitch, so its cells pass 69 and `f` stays positive.
function trackNote(row, step, m, dur, g) { row[step] = { f: midiHz(m), dur: dur, g: g }; }

// ---------------------------------------------------------------------------
// TITLE. G major, 120 BPM (Paul's pick), 16 steps to a bar, 8 bars: 16 s to
// the loop point.
// A (bars 0-3) states a four-bar theme that settles on A over D. B (bars 4-7)
// answers it, climbing to G5 and falling home to F#4, which leans back into
// bar 0's G. Four layers, each struck and short (the header's rule):
//   theme   the tune, and nothing else carries it
//   bells   a four-note falling figure on each bar's second half, high
//   glow    two chord tones a bar under the tune, stabbed
//   ground  the root on beat one, the fifth on beat four
// ---------------------------------------------------------------------------
function buildTitleTrack() {
  const BAR = 16, BARS = 8, STEPS = BAR * BARS;
  const theme = trackRow(STEPS), bells = trackRow(STEPS), glow = trackRow(STEPS), ground = trackRow(STEPS);
  // Each chord: [ground's root, bells' four falling tones, glow's two tones].
  const CHORD = {
    G:  [43, [91, 86, 83, 79], [59, 62]],
    Em: [40, [88, 83, 79, 76], [59, 55]],
    C:  [36, [88, 84, 79, 76], [60, 64]],
    D:  [38, [90, 86, 81, 78], [62, 57]],
    Bm: [47, [90, 86, 83, 78], [62, 59]],
  };
  const PROG = ["G", "Em", "C", "D", "G", "Bm", "C", "D"];
  // The most steps a note SOUNDS for, per layer (the header's rule).
  const GATE = { theme: 3, bells: 1, glow: 2, ground: 2 };
  // The tune: one row per bar, each note [step, midi, dur].
  const TUNE = [
    [[0, 71, 8], [8, 74, 4], [12, 71, 4]],
    [[0, 76, 8], [8, 74, 4], [12, 71, 4]],
    [[0, 72, 6], [6, 71, 2], [8, 67, 8]],
    [[0, 69, 16]],
    [[0, 71, 8], [8, 74, 4], [12, 79, 4]],
    [[0, 78, 8], [8, 74, 8]],
    [[0, 76, 6], [6, 74, 2], [8, 72, 4], [12, 71, 4]],
    [[0, 69, 8], [8, 66, 8]],
  ];
  for (let b = 0; b < BARS; b++) {
    const s0 = b * BAR, ch = CHORD[PROG[b]];
    for (const n of TUNE[b]) trackNote(theme, s0 + n[0], n[1], Math.min(n[2], GATE.theme), n[0] === 0 ? 1 : 0.85);
    for (let i = 0; i < 4; i++) trackNote(bells, s0 + 8 + i * 2, ch[1][i], GATE.bells, i === 0 ? 0.9 : 0.65);
    trackNote(glow, s0, ch[2][0], GATE.glow, 0.9);
    trackNote(glow, s0 + 8, ch[2][1], GATE.glow, 0.8);

// ---------------------------------------------------------------------------
// PULSE. Classic's gameplay track (GDD 13). E minor, 120 BPM (Paul's pick), 16
// steps to a bar, 36 bars: 72 s to the loop point. Sparse, tonal, and struck.
//   A (bars 0-11)   the tune stated low and plain over Em Cmaj7 G D, twice,
//                   then a four-bar answer. Heart once a bar; ticks from bar 4.
//   B (bars 12-23)  the tune lifts an octave into the relative major's colours
//                   (Cmaj7 D Bm7 Em). Heart twice a bar; the bassline walks.
//   C (bars 24-35)  the peak: the busiest bassline and ticks, the tune at its
//                   highest, then the opening motif returns (bar 32) and a B
//                   major bar pulls back to bar 0's Em.
// Six layers, each struck and short (the header's rule):
//   melody    the tune, and nothing else carries it
//   swell     two chord tones a bar, stabbed
//   bassline  the root's rhythm, a different figure per section
//   cycle     three chord tones against eight eighths, so the figure shifts
//   heart     lub-dub
//   tick      a syncopated noise figure, never on a bar's downbeat
// ---------------------------------------------------------------------------

  const BAR = 16, BARS = 36, STEPS = BAR * BARS;
  const melody = trackRow(STEPS), swell = trackRow(STEPS), bassline = trackRow(STEPS),
        cycle = trackRow(STEPS), heart = trackRow(STEPS), tick = trackRow(STEPS);
  // Each chord: [bassline's root, cycle's three tones, swell's two tones].

  const PROG = [
    "Em", "Cmaj7", "G", "D", "Em", "Cmaj7", "G", "D", "Am7", "Cmaj7", "Em", "D",       // A
    "Cmaj7", "D", "Bm7", "Em", "Cmaj7", "D", "G", "G", "Am7", "Bm7", "Cmaj7", "D",     // B
    "Em", "D", "Cmaj7", "G", "Am7", "Em", "Cmaj7", "D", "Em", "Cmaj7", "Am7", "B",     // C

  // The most steps a note SOUNDS for, per layer (the header's rule).
  const GATE = { melody: 3, swell: 2, bassline: 2, cycle: 1, heart: 1, tick: 1 };
  // The tune: one row per bar, each note [step, midi, dur].
  const TUNE = [
    [[0, 76, 6], [6, 74, 2], [8, 71, 8]],                   // A
    [[0, 67, 4], [4, 71, 4], [8, 76, 8]],
    [[0, 74, 6], [6, 72, 2], [8, 71, 8]],
    [[0, 69, 12], [12, 66, 4]],
    [[0, 76, 6], [6, 74, 2], [8, 71, 6], [14, 67, 2]],
    [[0, 67, 4], [4, 71, 4], [8, 76, 4], [12, 79, 4]],
    [[0, 78, 6], [6, 74, 2], [8, 71, 8]],
    [[0, 69, 16]],
    [[0, 72, 8], [8, 76, 8]],
    [[0, 74, 4], [4, 71, 12]],
    [[0, 67, 8], [8, 71, 4], [12, 69, 4]],
    [[0, 66, 16]],
    [[0, 79, 8], [8, 76, 8]],                               // B
    [[0, 78, 6], [6, 76, 2], [8, 74, 8]],
    [[0, 83, 8], [8, 81, 4], [12, 78, 4]],
    [[0, 79, 12]],
    [[0, 76, 4], [4, 79, 4], [8, 83, 8]],
    [[0, 81, 6], [6, 78, 2], [8, 74, 8]],
    [[0, 79, 16]],
    [[8, 74, 4], [12, 71, 4]],
    [[0, 72, 6], [6, 76, 2], [8, 81, 8]],
    [[0, 78, 6], [6, 74, 2], [8, 71, 8]],
    [[0, 76, 8], [8, 79, 8]],
    [[0, 78, 8], [8, 81, 8]],
    [[0, 79, 6], [6, 78, 2], [8, 76, 8]],                   // C
    [[0, 78, 6], [6, 76, 2], [8, 74, 8]],
    [[0, 76, 4], [4, 79, 4], [8, 83, 8]],
    [[0, 81, 6], [6, 79, 2], [8, 74, 8]],
    [[0, 76, 8], [8, 72, 8]],
    [[0, 71, 6], [6, 74, 2], [8, 76, 8]],
    [[0, 79, 8], [8, 76, 8]],
    [[0, 78, 16]],
    [[0, 76, 6], [6, 74, 2], [8, 71, 8]],

  // tick's [step, g].
  const SECTION = [
    { bass: [[0, 0, 6, 1], [6, 7, 2, 0.7], [8, 0, 8, 0.85]],
      order: [0, 1, 2, 0, 1, 2, 0, 1],

// ==========================================================================
// 18-audio-director.js
// ==========================================================================
// 18-audio-director.js — kit-audio's intensity director (GDD 11.4; CS010 P2).
//
// ⛔ KIT-SHAPED, and part of kit-audio (16-audio-engine.NOTES.md): no config
// object, no game object, no game global. The host names its inputs, weights
// them, and hands over a reading and a clock each frame. It names no game term.
//
// createDirector({ attack, release, weights }) -> { frame(inputs, now), reset(), hold(), level }
//   weights  { name: w >= 0 }. frame() reads inputs[name] for each, clamps
//            it to 0..1, and sums w * input; the sum is clamped to 0..1.
//   frame    smooths that sum on the clock it is handed (seconds), one pole:
//            level += (raw - level) * (1 - e^(-dt / tau)), tau = attack while
//            the sum is above the level, release otherwise. Returns the level.
//            ⛔ ASYMMETRIC ON PURPOSE: symmetric smoothing makes layers flutter.
//            The first frame after reset() only takes the clock (dt 0). A clock
//            that did not move forward moves nothing.
//   reset    level 0, and forget the clock.
//   hold     keep the level, forget the clock: call it while the host is paused,
//            so the next frame only takes the clock and the pause is SKIPPED,
//            never integrated as if it were play (Paul, 2026-09-16).
//   level    the smoothed value, 0..1.
// ⛔ No allocation per frame.

function createDirector(opts) {
  const o = opts || {};
  function seconds(v, name) {
    if (typeof v !== "number" || !isFinite(v) || v <= 0) throw new Error("createDirector: " + name + " must be seconds > 0");
    return v;
  }
  const attack = seconds(o.attack, "attack");
  const release = seconds(o.release, "release");
  if (!o.weights || typeof o.weights !== "object") throw new Error("createDirector: weights is required");
  const names = Object.keys(o.weights);
  const weights = names.map(n => {
    const w = o.weights[n];
    if (typeof w !== "number" || !isFinite(w) || w < 0) throw new Error("createDirector: weight " + n + " must be a number >= 0");
    return w;
  });

  let level = 0;
  let last = null;   // the clock at the previous frame, or null after reset()

  return {
    frame(inputs, now) {
      let raw = 0;
      for (let i = 0; i < names.length; i++) raw += weights[i] * audioClamp01(inputs[names[i]]);
      raw = audioClamp01(raw);
      if (typeof now !== "number" || !isFinite(now)) return level;
      const dt = last === null ? 0 : now - last;
      last = now;
      if (dt > 0) {
        const tau = raw > level ? attack : release;
        level = audioClamp01(level + (raw - level) * (1 - Math.exp(-dt / tau)));
      }
      return level;
    },
    reset() { level = 0; last = null; },
    hold() { last = null; },
    get level() { return level; },
  };
}

// ==========================================================================
// 19-sfx.js
// ==========================================================================
// 19-sfx.js — the game's side of the audio engine: the instances, built from C.
//
// ⛔ 16-audio-engine.js is kit-shaped and reads no game global. THIS file is
// where C crosses into it, exactly as 23-main.js hands createInput() its
// tunables. Verbose on purpose.
//
// ⛔ THE NOISE SOURCE IS ITS OWN STREAM, from its own seed (01-rng.js's header),
// and never the run's: an audio draw must not move a spawn lane.
//
// ⛔ EVERY FUNCTION IN THIS FILE RETURNS EARLY WHILE AudioSys.ctx IS NULL, so
// nothing sounds before the first user gesture and the headless suite, which
// has no audio API, runs every call as a no-op. The context is created by
// AudioSys.unlock(), which 23-main.js passes to createInput() as onGesture.

// The tracks are MUSIC_TRACKS, declared in 17-audio-tracks.js (the lab's BLOCK
// B). Nothing here edits them.

const AudioSys = createAudioEngine({
  volRamp: C.AUDIO_VOL_RAMP,
  vol: {
    master: C.AUDIO_VOL_DEFAULT / C.AUDIO_VOL_STEPS,
    music:  C.AUDIO_VOL_DEFAULT / C.AUDIO_VOL_STEPS,
    sfx:    C.AUDIO_VOL_DEFAULT / C.AUDIO_VOL_STEPS,
    voice:  C.AUDIO_VOL_DEFAULT / C.AUDIO_VOL_STEPS,
  },
});

// ⛔ THE RIM PULSE'S ONSETS (CS010 P4; Paul's D10). createMusic reports each
// note of a `beat: true` layer (`heart`) through onBeat, at its START TIME on the
// context clock, which the lookahead reaches up to C.MUSIC_LOOKAHEAD EARLY. So
// the time is only written down here, into a fixed ring (no allocation), and
// beatGlow() lights nothing until the clock reaches it. Never an AnalyserNode.
const BEAT_ONSETS = new Float64Array(C.RIM_PULSE_RING).fill(-Infinity);
let beatOnsetNext = 0;

function noteBeat(t) {
  if (!AudioSys.ctx) return;
  BEAT_ONSETS[beatOnsetNext] = t;
  beatOnsetNext = (beatOnsetNext + 1) % BEAT_ONSETS.length;
}

// 0..1 at context time `now`: 1 on the latest onset the clock has REACHED,
// falling linearly to 0 over C.RIM_PULSE_TIME. An onset still ahead reads nothing.
function beatGlow(now) {
  if (!AudioSys.ctx) return 0;
  let last = -Infinity;
  for (let i = 0; i < BEAT_ONSETS.length; i++) {
    const t = BEAT_ONSETS[i];
    if (t <= now && t > last) last = t;
  }
  const g = 1 - (now - last) / C.RIM_PULSE_TIME;
  return g > 0 ? g : 0;
}

const MusicSys = createMusic(AudioSys, {
  tracks:    MUSIC_TRACKS,
  lookahead: C.MUSIC_LOOKAHEAD,
  crossfade: C.MUSIC_CROSSFADE,
  fadeOut:   C.MUSIC_FADE_OUT,
  noise:     mulberry32(C.AUDIO_NOISE_SEED),
  // kit-audio 0.3.0's groups (CS010 P1). No director drives them yet: every
  // gate is open, the sweep is fully open, and the duck and dip sit at unity.
  gating:    { thresholds: C.LAYER_THRESHOLD, ramp: C.LAYER_CROSSFADE },
  sweep:     { minHz: C.FILTER_MIN_HZ, maxHz: C.FILTER_MAX_HZ, q: C.FILTER_Q, tc: C.FILTER_TC },
  // kit-audio 0.4.0's high-pass (CS012 P5; GDD 14.2's third airborne channel,
  // O7). ⛔ It is driven by 23-main.js's audioFrame(), which is where the board
  // is read — this file names no `state`, and the engine names no game term.
  highpass:  { hz: C.JUMP_HP_HZ, tc: C.JUMP_HP_TC },
  limiter:   C.MUSIC_LIMIT,
  duck:      { gain: C.MUSIC_DUCK_GAIN, ramp: C.MUSIC_DUCK_RAMP, dipGain: C.MUSIC_DIP_GAIN, dipHold: C.MUSIC_DIP_HOLD },
  onBeat:    noteBeat,
});

// ⛔ THE INTENSITY DIRECTOR (CS010 P2; GDD 11.4), built from C. The input names
// are 23-main.js's dangerInputs() fields, which is the one reader of the board.
// `combo` is always 0 in Classic (D6), and nothing is rescaled for it.
const Director = createDirector({
  attack:  C.INT_ATTACK,
  release: C.INT_RELEASE,
  weights: {
    count:     C.INT_W_COUNT,
    proximity: C.INT_W_PROXIMITY,
    combo:     C.INT_W_COMBO,
    peril:     C.INT_W_PERIL,
    heat:      C.INT_W_HEAT,
  },
});

// The SFX player (CS009 P4). Its noise is a SECOND instance of the audio seed's
// stream, so it shares no draws with MusicSys's buffer or with the run. The
// recipes are C.SFX; the seats call sfx() below.
const Sfx = createSfxPlayer(AudioSys, {
  noise: mulberry32(C.AUDIO_NOISE_SEED),
});

// ⛔ THE ONE CALL EVERY SEAT MAKES (CS009 P5; plan §7): sfx(name, voice). `name`
// is a C.SFX event; `voice` is an entity's sfxVoice, and only the kill passes
// one — it picks the pitch from C.SFX_KILL_PITCH, and anything unknown plays
// the recipe at its own pitch. ⛔ A SEAT WRITES NO `state` AND DRAWS NOTHING:
// this reads C and plays, so an audio-on run spends exactly the draws of an
// audio-off one. Headless and before the first gesture it returns at once.
function sfx(name, voice) {
  if (!AudioSys.ctx) return;
  const pitch = voice == null ? undefined : C.SFX_KILL_PITCH[voice];
  Sfx.play(C.SFX[name], { pitch });
  // ⛔ THE MUSIC DIPS RIDE ON THE SEAT (CS010 P2, R8; GDD 11.6): no seat of
  // their own, so the seat lines are unchanged.
  if (C.MUSIC_DIP_EVENTS.indexOf(name) >= 0) MusicSys.dip();
}

// ⛔ THE SURGER CHARGE TONE (GDD 6.3, 11.8; plan §7). A HELD voice per Surger
// in its telegraph, reconciled against the board once per frame by
// 23-main.js's audioFrame(), and ⛔ keyed by the entity in this Map — no field on
// the entity. Each frame the voice's pitch is set from chargeTip(), so the tone
// follows the fuse and never a clock of its own.
//
// `live` is what Game's audioFrame() reports about the frame:
//   true   play steps ran and the run is live: set() each telegraphing Surger's
//          voice, start the missing ones, stop the rest
//   false  the frame ends frozen or off play — pause, any menu, game over, the
//          death freeze: ⛔ STOP EVERY VOICE, so the tone cannot run ahead of a
//          frozen fuse or play out after one
//   null   the run is live but no step ran (a display faster than the step
//          rate): leave every voice as it is. The fuse did not move and is not
//          frozen, and a stop here would chop the tone every other frame at 120 Hz.
// A Surger is found by what it reads, not its class: a `chargeTip()` and the
// phase "telegraph". One that died or was filtered is simply not seen.
const SURGE_TONES = new Map();   // entity -> { voice, frame }
let surgeToneFrame = 0;

function reconcileSurgeTones(enemies, live) {
  if (!AudioSys.ctx || live === null) return;
  surgeToneFrame++;
  if (live) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead || e.phase !== "telegraph" || typeof e.chargeTip !== "function") continue;
      let tone = SURGE_TONES.get(e);
      if (!tone) { tone = { voice: Sfx.hold(C.SFX.surgeCharge), frame: 0 }; SURGE_TONES.set(e, tone); }
      tone.frame = surgeToneFrame;
      tone.voice.set(e.chargeTip());
    }
  }
  for (const [e, tone] of SURGE_TONES) {
    if (tone.frame === surgeToneFrame) continue;
    tone.voice.stop();
    SURGE_TONES.delete(e);
  }
}

// ⛔ MUSIC BY SCREEN (CS009 P3; plan §0's reading). PURE: four arguments in, a
// MusicSys state name out, and nothing read but C. 23-main.js's audioFrame()
// calls it every frame with the screen, where OPTIONS was opened from, the run's
// mode and the MUSIC TRACK setting.
//   title, mode, depth, and OPTIONS and its pages opened from the title: "title"
//   play (the dive is play), pause, and OPTIONS and its pages opened from pause:
//     the gameplay track, C.MODE_TRACK[mode] on "auto", else the setting itself
//   gameover: MUSIC_SILENCE, which createMusic fades out over C.MUSIC_FADE_OUT
// RESTART is a screen change to play, so it starts the gameplay track again.
const MUSIC_SILENCE = "off";   // a name with no track, and createMusic's starting state
const MUSIC_OPTIONS_PAGES = ["options", "controls", "keyboard", "gamepad", "credits"];

function musicStateFor(screen, optionsFrom, mode, trackSetting) {
  if (screen === "gameover") return MUSIC_SILENCE;
  const inRun = screen === "play" || screen === "pause" ||
                (optionsFrom === "pause" && MUSIC_OPTIONS_PAGES.indexOf(screen) >= 0);
  if (!inRun) return "title";
  return trackSetting === "auto" ? C.MODE_TRACK[mode] : trackSetting;
}

// ⛔ THE MENU DUCK BY SCREEN (CS010 P2; Paul's D9). PURE, beside musicStateFor:
// true on pause, and on OPTIONS and its pages opened from pause. Not on title,
// mode, START DEPTH, the title's OPTIONS, play or game over. These are also the
// screens where audioFrame() holds intensity and the sweep.
function duckFor(screen, optionsFrom) {
  return screen === "pause" ||
         (optionsFrom === "pause" && MUSIC_OPTIONS_PAGES.indexOf(screen) >= 0);
}

// ==========================================================================
// 20-achievements.js
// ==========================================================================
// 20-achievements.js — the unlock store and its evaluator (GDD 15.5, 15.7).
// CS015 P1.
//
// ⛔ KIT-SHAPED FROM THIS COMMIT: the future kit-achievements
// (src/20-achievements.NOTES.md, which doubles as its draft documentation).
// ⛔ IT NAMES NO GAME OBJECT, NO GAME GLOBAL AND NO ENTRY IN THE GAME'S CONFIG,
// in either direction. Everything crosses as an option: `defs` (the definition
// table, which the caller keeps wherever its own rules put it), `load` / `save`
// (a stored value in, a stored value out) and `now` (the clock, in ms).
// createScores() below it in the build is the shipped precedent for the seam.
//
// ⛔ THE CLOCK IS INJECTED AND THIS FILE NEVER READS THE PLATFORM'S. A module
// that reads the platform clock cannot be driven by a test at all, and a week
// key read on a hot path would roll the ISO week inside one session
// (PLANNED-FEATURES-CS015.md §1.5: 9.2 faked days over 100,008 steps).
//
// ⛔ NO EVALUATION SEAT EXISTS YET. evaluate() is the module and P2 seats it, at
// the clear edge and at the run's end. Nothing in the shipped build calls it, so
// nothing writes the store.
//
// THE STORED VALUE (GDD 15.5, A6), one object under one declared key:
//   { lifetimeUnlocked: [id, …],        untiered lifetime rows
//     lifetimeTiers:    { id: index },  ⛔ MONOTONIC — only ever raised
//     weeklyUnlocked:   [id, …],        emptied when the week rolls
//     weekKey:          "YYYY-Www" }    ⛔ an ISO year-week computed in UTC
// Arrays rather than Sets: a Set does not survive JSON, and the caller's store
// stringifies. Loading is known-value-else-default PER FIELD — an unknown id is
// dropped, a tier index past its row's tier count clamps, and a `weekKey` that
// is not the current week empties the weekly list alone.

// ---------------------------------------------------------------------------
// THE ISO YEAR-WEEK, IN UTC
// ---------------------------------------------------------------------------
//
// ⛔ THESE FIVE NUMBERS ARE ISO-8601's DEFINITION, NOT TUNABLES, so they are
// local rather than options: nothing tunes what a week is. (The caller's own
// "every tunable in the config" rule is about knobs a tuning pass turns; a
// module that may not read that config could not take them from there anyway.)
const MS_PER_DAY = 86400000;
const DAYS_PER_WEEK = 7;
const THURSDAY_INDEX = 3;      // Monday is 0, so Thursday — the year-deciding day
const ANCHOR_DAY_OF_JANUARY = 4;   // ISO week 1 is the week holding 4 January
const WEEKS_PER_YEAR_ORDINAL = 53; // the widest ISO year, for a monotone ordinal

// Monday is 0, Sunday is 6 — ISO's numbering, not the platform's.
function isoDayIndex(ms) {
  return (new Date(ms).getUTCDay() + 6) % DAYS_PER_WEEK;
}

// ⛔ "YYYY-Www", UTC. A LOCAL reading rolls mid-session and differs across
// devices: read at Sunday 23:30 UTC this gives the EARLIER week, where any zone
// east of UTC would already have rolled. The ISO YEAR is the year of the week's
// Thursday, which is why 2027-01-03 is 2026-W53 and 2021-01-01 is 2020-W53.
function isoWeekKey(ms) {
  const at = new Date(ms);
  const day = Date.UTC(at.getUTCFullYear(), at.getUTCMonth(), at.getUTCDate());
  const thursday = day + (THURSDAY_INDEX - isoDayIndex(day)) * MS_PER_DAY;
  const year = new Date(thursday).getUTCFullYear();
  const anchor = Date.UTC(year, 0, ANCHOR_DAY_OF_JANUARY);
  const firstMonday = anchor - isoDayIndex(anchor) * MS_PER_DAY;
  const week = Math.round((thursday - firstMonday) / (DAYS_PER_WEEK * MS_PER_DAY)) + 1;
  return year + "-W" + (week < 10 ? "0" + week : String(week));
}

// A monotone whole number per week, so the rotation is arithmetic on the KEY and
// never on a clock. An unparseable key reads 0, which is a week like any other.
function weekOrdinal(key) {
  const m = /^(\d+)-W(\d+)$/.exec(typeof key === "string" ? key : "");
  return m === null ? 0 : Number(m[1]) * WEEKS_PER_YEAR_ORDINAL + Number(m[2]);
}

// ---------------------------------------------------------------------------
// THE FACTORY
// ---------------------------------------------------------------------------
//
// createAchievements({ defs, load, save, now }) returns the unlock store over
// one definition table. Every option is validated here and throws with a named
// message, so a malformed table fails at boot rather than mid-evaluation.
//
// ⛔ TWO TABLES, KEPT APART. `defs.lifetime` is what exists and what each row
// reads; `defs.weekly` is the POOL that rotates, `defs.perWeek` of it live in
// any one week. Neither names the other's numbers, and ⛔ nothing derives a pool
// index from a lifetime row's tier.
//
// A ROW is { id, mode, fact } plus EXACTLY ONE OF:
//   tiers: [t1, t2, …]  ascending thresholds; the unlock's `tier` is the 1-based
//                       index reached, and ⛔ it only ever rises
//   at: n               one threshold; the unlock's `tier` is 0
// `id` is SAVE DATA and is never renamed. `mode` is a mode name, or null for
// either — the tag belongs to the achievement, not to the store. `fact` names
// the field the caller's facts object carries.
//
// ⛔ NOTHING IS CACHED. load() runs on every call, so a caller that switches
// which store it hands back needs no hook here — createScores' rule, for the
// same reason.
function createAchievements(options) {
  const opts = options || {};
  const { defs, load, save, now } = opts;

  for (const name of ["load", "save", "now"]) {
    if (typeof opts[name] !== "function") throw new Error("createAchievements: options." + name + " must be a function");
  }
  if (!defs || typeof defs !== "object") throw new Error("createAchievements: options.defs must be the definition table");
  if (!Array.isArray(defs.lifetime)) throw new Error("createAchievements: options.defs.lifetime must be an array");
  if (!Array.isArray(defs.weekly)) throw new Error("createAchievements: options.defs.weekly must be an array");
  const pool = defs.weekly;
  const perWeek = defs.perWeek;
  if (!Number.isInteger(perWeek) || perWeek < 1) throw new Error("createAchievements: options.defs.perWeek must be a whole number >= 1");
  if (perWeek > pool.length) throw new Error("createAchievements: options.defs.perWeek is larger than the weekly pool");

  // The rows, indexed by id, with every id unique across BOTH tables: one id is
  // one achievement, whichever table it sits in.
  const rows = {};
  function admit(row, weekly) {
    if (!row || typeof row !== "object") throw new Error("createAchievements: every row must be an object");
    if (typeof row.id !== "string" || row.id === "") throw new Error("createAchievements: every row needs a non-empty id");
    if (Object.prototype.hasOwnProperty.call(rows, row.id)) throw new Error("createAchievements: duplicate id " + JSON.stringify(row.id));
    if (typeof row.fact !== "string" || row.fact === "") throw new Error("createAchievements: row " + JSON.stringify(row.id) + " needs a non-empty fact");
    if (!(row.mode === null || (typeof row.mode === "string" && row.mode !== ""))) {
      throw new Error("createAchievements: row " + JSON.stringify(row.id) + "'s mode must be a mode name or null");
    }
    const tiered = Array.isArray(row.tiers);
    const flat = row.at !== undefined;
    if (tiered === flat) throw new Error("createAchievements: row " + JSON.stringify(row.id) + " needs exactly one of tiers and at");
    if (tiered) {
      if (weekly) throw new Error("createAchievements: weekly row " + JSON.stringify(row.id) + " may not be tiered");
      if (row.tiers.length < 1) throw new Error("createAchievements: row " + JSON.stringify(row.id) + " has an empty tiers list");
      for (let i = 0; i < row.tiers.length; i++) {
        if (!Number.isFinite(row.tiers[i])) throw new Error("createAchievements: row " + JSON.stringify(row.id) + " has a non-finite threshold");
        if (i > 0 && row.tiers[i] <= row.tiers[i - 1]) throw new Error("createAchievements: row " + JSON.stringify(row.id) + "'s tiers must ascend");
      }
    } else if (!Number.isFinite(row.at)) {
      throw new Error("createAchievements: row " + JSON.stringify(row.id) + " has a non-finite threshold");
    }
    rows[row.id] = row;
  }
  for (const row of defs.lifetime) admit(row, false);
  for (const row of pool) admit(row, true);

  const poolIds = {};
  for (const row of pool) poolIds[row.id] = true;
  const known = id => typeof id === "string" && Object.prototype.hasOwnProperty.call(rows, id);
  const tieredRow = id => known(id) && Array.isArray(rows[id].tiers);
  // An untiered LIFETIME row: the weekly pool has its own list.
  const flatRow = id => known(id) && !Array.isArray(rows[id].tiers) && poolIds[id] !== true;

  // ⛔ THE ROTATION IS A FUNCTION OF THE WEEK AND OF NOTHING ELSE. A stride walk
  // over the pool: the start moves every week, the stride every pool-length
  // weeks, and a collision steps to the next free index — so the picks are
  // always distinct and, over time, every entry is reached. ⛔ Integer
  // arithmetic on the key: no draw, no clock, no board.
  function weeklyFor(key) {
    const n = pool.length;
    const ord = weekOrdinal(key);
    const stride = n === 1 ? 1 : 1 + Math.floor(ord / n) % (n - 1);
    const taken = {};
    const out = [];
    let i = ord % n;
    while (out.length < perWeek) {
      if (taken[i] === true) { i = (i + 1) % n; continue; }
      taken[i] = true;
      out.push(pool[i].id);
      i = (i + stride) % n;
    }
    return out;
  }

  // The stored value, validated field by field against the table, for `key`'s
  // week. ⛔ A weekKey that is not this week empties the weekly list ALONE: the
  // lifetime stores are not week-scoped and a roll must not touch them.
  function read(key) {
    const d = load();
    const held = d !== null && typeof d === "object" ? d : {};
    const out = { lifetimeUnlocked: [], lifetimeTiers: {}, weeklyUnlocked: [], weekKey: key };
    if (Array.isArray(held.lifetimeUnlocked)) {
      for (const id of held.lifetimeUnlocked) {
        if (flatRow(id) && out.lifetimeUnlocked.indexOf(id) < 0) out.lifetimeUnlocked.push(id);
      }
    }
    if (held.lifetimeTiers !== null && typeof held.lifetimeTiers === "object") {
      for (const id of Object.keys(held.lifetimeTiers)) {
        if (!tieredRow(id)) continue;
        const n = held.lifetimeTiers[id];
        if (!Number.isInteger(n) || n < 1) continue;
        out.lifetimeTiers[id] = Math.min(n, rows[id].tiers.length);
      }
    }
    if (held.weekKey === key && Array.isArray(held.weeklyUnlocked)) {
      const live = weeklyFor(key);
      for (const id of held.weeklyUnlocked) {
        if (live.indexOf(id) >= 0 && out.weeklyUnlocked.indexOf(id) < 0) out.weeklyUnlocked.push(id);
      }
    }
    return out;
  }

  // The unlock payload (A11), shaped so server-backing later is wiring: `tier`
  // is 0 for an untiered row, `weekKey` is null for a lifetime one, and `at` is
  // the injected clock's reading.
  function unlock(out, id, tier, key, at) {
    out.push({ id, tier, weekKey: key, at });
  }

  return {
    // The current ISO year-week, from the injected clock.
    weekKey() { return isoWeekKey(now()); },
    // The ids live in one named week — pure, and callable for any week.
    weeklyFor,
    // The ids live in THIS week.
    weekly() { return weeklyFor(isoWeekKey(now())); },
    // The stored value as this build reads it, for a caller that shows it.
    snapshot() {
      const held = read(isoWeekKey(now()));
      return { lifetimeUnlocked: held.lifetimeUnlocked.slice(),
               lifetimeTiers: Object.assign({}, held.lifetimeTiers),
               weeklyUnlocked: held.weeklyUnlocked.slice(),
               weekKey: held.weekKey };
    },
    // Every row the facts satisfy that is not held already, as an array of
    // payloads, newest state written once. ⛔ A row whose mode the facts do not
    // match is skipped, and ⛔ a fact that is not a finite number is a SKIP
    // rather than a comparison against undefined.
    evaluate(facts) {
      const f = facts !== null && typeof facts === "object" ? facts : {};
      const mode = typeof f.mode === "string" ? f.mode : null;
      // ⛔ ONE CLOCK READING PER CALL: the week and the stamp are the same
      // instant, and a faked clock that advances per call cannot split them.
      const at = now();
      const key = isoWeekKey(at);
      const held = read(key);
      const out = [];
      const matches = row => row.mode === null || row.mode === mode;
      for (const row of defs.lifetime) {
        const v = f[row.fact];
        if (!matches(row) || !Number.isFinite(v)) continue;
        if (Array.isArray(row.tiers)) {
          let reached = 0;
          for (let i = 0; i < row.tiers.length; i++) if (v >= row.tiers[i]) reached = i + 1;
          // ⛔ MONOTONIC: a weaker run reaches a lower tier and writes nothing.
          if (reached > (held.lifetimeTiers[row.id] || 0)) {
            held.lifetimeTiers[row.id] = reached;
            unlock(out, row.id, reached, null, at);
          }
        } else if (v >= row.at && held.lifetimeUnlocked.indexOf(row.id) < 0) {
          held.lifetimeUnlocked.push(row.id);
          unlock(out, row.id, 0, null, at);
        }
      }
      // ⛔ Only the week's own five are live. A pool row outside the rotation is
      // not evaluated, so it cannot be banked against a week it was never in.
      for (const id of weeklyFor(key)) {
        const row = rows[id];
        const v = f[row.fact];
        if (!matches(row) || !Number.isFinite(v)) continue;
        if (v >= row.at && held.weeklyUnlocked.indexOf(id) < 0) {
          held.weeklyUnlocked.push(id);
          unlock(out, id, 0, key, at);
        }
      }
      if (out.length > 0) save(held);
      return out;
    },
  };
}

// --------------------------------------------------------------------------
// lib/kit-names/kit-names.js
// --------------------------------------------------------------------------
const KitNames = (function () {
// kit-names — client module. Plain ES module, no build step, no dependencies.
// Contract: docs/kit-names.md. Pure functions and constants — no storage, no
// DOM, no network. Shared display-name rules for kit-profile and
// kit-leaderboard.

const VERSION = '0.1.0';

const ALLOWED_CHARS_RE = /^[A-Za-z0-9 _-]*$/;

const MAX_NAME_LENGTH = 12;

const NAME_CHANGE_NOTICE =
  "Scores you've already posted will keep the name you used at the time.\n" +
  'Only new scores will show your new name.';

function validateName(raw) {
  if (typeof raw !== 'string') {
    return { ok: false, reason: 'empty', normalized: null };
  }

  const collapsed = raw.trim().replace(/\s+/g, ' ');

  // Charset check runs BEFORE uppercasing — see docs/kit-names.md §2.1.
  // Uppercasing can introduce characters that pass this check ('ß' -> 'SS',
  // 'ﬁ' -> 'FI'); checking the pre-uppercase string closes that hole.
  if (!ALLOWED_CHARS_RE.test(collapsed)) {
    return { ok: false, reason: 'illegal_character', normalized: null };
  }

  const upper = collapsed.toUpperCase();

  if (upper.length === 0) {
    return { ok: false, reason: 'empty', normalized: null };
  }

  if (upper.length > MAX_NAME_LENGTH) {
    return { ok: false, reason: 'too_long', normalized: null };
  }

  return { ok: true, reason: null, normalized: upper };
}
return { VERSION, MAX_NAME_LENGTH, NAME_CHANGE_NOTICE, validateName };
})();

// --------------------------------------------------------------------------
// lib/kit-storage/kit-storage.js
// --------------------------------------------------------------------------
const KitStorage = (function () {
// kit-storage — client module. Plain ES module, no build step, no dependencies.
// Contract: docs/kit-storage-client-api.md. Implementation contract:
// docs/kit-storage-spec.md. Local only — no network, no DOM beyond
// window.localStorage, no knowledge of games, profiles or achievements.
//
// Governing rule, spec §2.1: environmental failure (blocked storage, quota,
// corrupt bytes, an unreadable version) is a RETURN VALUE. Programmer error
// (an undeclared key, an illegal identifier, an unserializable value) is an
// EXCEPTION, thrown at the call site.

const VERSION = '0.1.0';

// --- Identifiers (spec §3.2) -------------------------------------------------
//
// '.' is the keyspace segment separator (§3.1) and is therefore absent from
// every charset below. It is also rejected explicitly, ahead of the pattern
// test, so the error message names the actual problem.
//
// ⛔ The 3-character minimum on gameId is load-bearing, not cosmetic: it makes
// 'lb' an impossible gameId, so kit-leaderboard's coinless.lb.<gameId>.v1
// queue key can never collide with a store's namespace. §3.3, §13.

const GAME_ID_RE = /^[a-z0-9][a-z0-9-]{2,31}$/;   // 3–32 chars
const SCOPE_ID_RE = /^[a-z0-9][a-z0-9_-]{0,63}$/; // 1–64 chars
const KEY_RE = /^[a-z0-9][a-z0-9_-]{0,63}$/;      // 1–64 chars

const ROOT_PREFIX = 'coinless.';
const PROBE_KEY = 'coinless.__probe';

function describe(value) {
  if (typeof value === 'string') return JSON.stringify(value);
  if (typeof value === 'bigint') return `${value}n`;
  if (value === null || value === undefined) return String(value);
  if (typeof value === 'object') return Object.prototype.toString.call(value);
  return String(value);
}

function checkIdentifier(value, kind, pattern, rule) {
  if (typeof value !== 'string') {
    throw new TypeError(`kit-storage: ${kind} must be a string, got ${describe(value)}`);
  }
  if (value.includes('.')) {
    throw new TypeError(
      `kit-storage: ${kind} may not contain '.' — it is the keyspace segment ` +
      `separator (got ${describe(value)})`
    );
  }
  if (!pattern.test(value)) {
    throw new TypeError(`kit-storage: invalid ${kind} ${describe(value)} — must be ${rule}`);
  }
  return value;
}

const checkGameId = (v) =>
  checkIdentifier(v, 'gameId', GAME_ID_RE, "3–32 chars of [a-z0-9-], starting alphanumeric");
const checkScopeId = (v) =>
  checkIdentifier(v, 'scopeId', SCOPE_ID_RE, "1–64 chars of [a-z0-9_-], starting alphanumeric");
const checkKey = (v) =>
  checkIdentifier(v, 'key', KEY_RE, "1–64 chars of [a-z0-9_-], starting alphanumeric");

// --- Availability probe (spec §5.1) -----------------------------------------
//
// The try wraps the property READ of window.localStorage, not just setItem —
// in a sandboxed iframe without allow-same-origin the access itself throws,
// which is the real itch.io / Newgrounds failure mode.
//
// Probed once, at create(). Never re-probed: `available` means "storage exists
// and accepts writes", not "storage has room", so a later quota failure does
// not flip it to false.

function probeLocalStorage() {
  try {
    const ls = window.localStorage;
    ls.setItem(PROBE_KEY, '1');
    ls.removeItem(PROBE_KEY);
    return { ls, error: null };
  } catch (error) {
    return { ls: null, error };
  }
}

// --- Declaration table (spec §7.1) ------------------------------------------
//
// Store-wide, shared by every scope: a per-profile key is the same key in
// every profile, so it is declared once. Version travels with the key, never
// with the call site.

function checkDeclaration(key, spec) {
  if (spec === null || typeof spec !== 'object' || Array.isArray(spec)) {
    throw new TypeError(
      `kit-storage: declaration for key ${describe(key)} must be an object ` +
      `like { version: 1 }, got ${describe(spec)}`
    );
  }
  const { version, migrate } = spec;
  if (!Number.isInteger(version) || version < 1) {
    throw new TypeError(
      `kit-storage: key ${describe(key)} needs an integer version >= 1, got ${describe(version)}`
    );
  }
  if (migrate !== undefined && typeof migrate !== 'function') {
    throw new TypeError(
      `kit-storage: migrate for key ${describe(key)} must be a function, got ${describe(migrate)}`
    );
  }
  return { version, migrate: migrate ?? null };
}

function declareKey(ctx, key, spec) {
  checkKey(key);
  const next = checkDeclaration(key, spec);
  const existing = ctx.declarations.get(key);

  if (existing) {
    // Idempotent only when the spec is identical — same version AND the same
    // function reference. Two modules disagreeing about one key's version is a
    // bug that must not resolve silently (§7.1).
    if (existing.version === next.version && existing.migrate === next.migrate) return;
    throw new Error(
      `kit-storage: conflicting declaration for key ${describe(key)} — ` +
      `already declared version ${existing.version}` +
      `${existing.migrate ? ' with a migrate function' : ' with no migrate function'}, ` +
      `redeclared as version ${next.version}` +
      `${next.migrate ? ' with a migrate function' : ' with no migrate function'}`
    );
  }

  ctx.declarations.set(key, next);
}

// Read/write access to an undeclared key throws. This is the typo guard: it is
// what turns store.get('profile') — missing an 's' — into an immediate error
// instead of a silently empty result found a month later. ⛔ §13: it must not
// default to version 1 instead.
function requireDeclared(ctx, key, method) {
  checkKey(key);
  const declaration = ctx.declarations.get(key);
  if (!declaration) {
    const known = [...ctx.declarations.keys()].sort();
    throw new Error(
      `kit-storage: ${method}(${describe(key)}) on an undeclared key. ` +
      `Declare it at create({ keys }) or with store.declare(). ` +
      `Declared keys: ${known.length ? known.join(', ') : '(none)'}`
    );
  }
  return declaration;
}

// --- Events (spec §11) ------------------------------------------------------
//
// Telemetry and debug overlays only — no module behavior depends on any of
// these being handled, and a handler that throws must never break the caller.

function makeEmitter(onEvent) {
  if (onEvent === undefined || onEvent === null) return () => {};
  if (typeof onEvent !== 'function') {
    throw new TypeError(`kit-storage: onEvent must be a function, got ${describe(onEvent)}`);
  }
  return (name, detail) => {
    try {
      onEvent(name, detail);
    } catch {
      /* a broken handler is the caller's problem, never ours */
    }
  };
}

// --- Envelope (spec §4) -----------------------------------------------------
//
// {"v":<int >= 1>,"d":<the value>}. Nothing else lives in the envelope.

function encodeEnvelope(key, version, value) {
  if (value === undefined) {
    throw new TypeError(
      `kit-storage: set(${describe(key)}, undefined) — undefined is not storable, use remove()`
    );
  }
  // The VALUE is serialized on its own, then spliced into the envelope. Doing
  // it the other way round — JSON.stringify({v, d: value}) — hides the failure:
  // a function or a symbol makes the whole `d` property vanish and yields a
  // valid-looking `{"v":1}`, which then reads back as corruption on the next
  // load instead of throwing at the call site where the bug is. `version` is a
  // validated integer and `json` is valid JSON, so the splice is safe.
  let json;
  try {
    json = JSON.stringify(value);
  } catch (error) {
    throw new TypeError(
      `kit-storage: value for key ${describe(key)} is not JSON-representable ` +
      `(${error && error.message ? error.message : error})`
    );
  }
  if (json === undefined) {
    throw new TypeError(
      `kit-storage: value for key ${describe(key)} is not JSON-representable ` +
      `(${describe(value)} serializes to nothing)`
    );
  }
  return `{"v":${version},"d":${json}}`;
}

// A parsed value is an envelope only if it is a plain object carrying an
// integer v >= 1 and a d property that is PRESENT — d may legitimately be
// null, so presence is tested with `in`, never truthiness.
function isEnvelope(parsed) {
  return (
    parsed !== null &&
    typeof parsed === 'object' &&
    !Array.isArray(parsed) &&
    Number.isInteger(parsed.v) &&
    parsed.v >= 1 &&
    'd' in parsed
  );
}

// --- Storage plumbing -------------------------------------------------------

function readItem(ctx, storageKey) {
  if (!ctx.ls) return null;
  try {
    return ctx.ls.getItem(storageKey);
  } catch {
    return null;
  }
}

// Low-level write, one level below the memory shim. `error` distinguishes WHY
// it failed: null means ctx.ls was simply absent (storage unavailable), a
// caught exception means setItem itself threw (quota, most likely) —
// shimmedWrite uses that distinction to decide what to emit (§5.2, §8).
function tryWriteItem(ctx, storageKey, json) {
  if (!ctx.ls) return { ok: false, error: null };
  try {
    ctx.ls.setItem(storageKey, json);
    return { ok: true, error: null };
  } catch (error) {
    return { ok: false, error };
  }
}

function removeItem(ctx, storageKey) {
  if (!ctx.ls) return true;
  try {
    ctx.ls.removeItem(storageKey);
    return true;
  } catch {
    return false;
  }
}

// Snapshot before mutating — removing while walking ls.key(i) reindexes.
function storageKeys(ctx) {
  if (!ctx.ls) return [];
  try {
    const out = [];
    for (let i = 0; i < ctx.ls.length; i += 1) {
      const k = ctx.ls.key(i);
      if (typeof k === 'string') out.push(k);
    }
    return out;
  } catch {
    return [];
  }
}

// --- The read algorithm (spec §7.3) ----------------------------------------
//
// Seven numbered steps, written out one for one. The ONLY step that writes is
// step 7's SUCCESSFUL forward migration. Steps 3, 5, 6 and step 7's failure
// branches all return the fallback and leave the stored bytes exactly as they
// were, because §2.4 governs: a build that cannot read something is not
// evidence that the something is worthless.

// The memory shim (§5.2): a write that doesn't reach durable storage is kept
// in ctx.memory for the rest of the page session instead. A successful write
// clears any stale entry for the same key first, so a durable value is never
// shadowed by an in-memory copy left over from an earlier failure. Shared by
// writeValue (managed keys) and raw.set() — §14 step 7 says raw gets "the
// same shim rules". `shimValue` is what get() should hand back from memory:
// the decoded value for a managed key, the bare string for raw — never the
// encoded bytes actually handed to tryWriteItem. `eventKey` is what events
// name: the logical key for a managed write, the raw key for raw.
function shimmedWrite(ctx, storageKey, encoded, shimValue, eventKey) {
  const { ok, error } = tryWriteItem(ctx, storageKey, encoded);

  if (ok) {
    ctx.memory.delete(storageKey);
    return true;
  }

  ctx.memory.set(storageKey, shimValue);

  // error === null means ctx.ls was absent, not that setItem threw — that
  // case already got its one-time 'unavailable' event at create(); re-firing
  // on every write would be noise for a condition that hasn't changed. An
  // actual setItem throw is classified 'quota' per §8: browsers report a full
  // store inconsistently (QuotaExceededError, legacy
  // NS_ERROR_DOM_QUOTA_REACHED, or a numeric DOM code — 22, or legacy 1014),
  // and kit-storage cannot distinguish those from any other write failure any
  // more reliably than the browsers can, so an unrecognized throw is treated
  // as quota too — the response (memory shim, `false`, an event) is identical
  // either way.
  if (error !== null) {
    ctx.emit('quota', { key: eventKey, bytes: (storageKey.length + encoded.length) * 2 });
  }

  return false;
}

function writeValue(ctx, prefix, key, version, value) {
  const storageKey = prefix + key;
  const json = encodeEnvelope(key, version, value);
  return shimmedWrite(ctx, storageKey, json, value, key);
}

function readValue(ctx, prefix, key, declaration, fallback) {
  const declared = declaration.version;
  const storageKey = prefix + key;

  // STEP 1 — the memory shim holds this key → return that value. Done.
  // Any value that failed to reach durable storage is retained here for the
  // rest of the page session (§5.2), and it takes precedence over whatever
  // storage still holds — there is no read cache, but the shim is checked
  // before every other step, every call.
  if (ctx.memory.has(storageKey)) return ctx.memory.get(storageKey);

  // STEP 2 — storage unavailable, or no stored value → fallback.
  // Not a corruption and not an error: nothing is emitted here.
  const raw = readItem(ctx, storageKey);
  if (raw === null) return fallback;

  // STEP 3 — unparseable, or parseable but not a {v, d} envelope → emit
  // 'corrupt', return the fallback, LEAVE THE BYTES ALONE.
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    ctx.emit('corrupt', { key, reason: 'unparseable' });
    return fallback;
  }
  if (!isEnvelope(parsed)) {
    ctx.emit('corrupt', { key, reason: 'not_an_envelope' });
    return fallback;
  }

  // STEP 4 — stored version matches the declared version → the value.
  if (parsed.v === declared) return parsed.d;

  // STEP 5 — DOWNGRADE. The stored version is NEWER than this build declares.
  //
  // ⛔ Return the fallback, emit 'downgrade', and WRITE NOTHING. This is not an
  // unfinished branch. It is a player who loaded an older build over newer data
  // — a cached itch.io build, or a rollback — and it is the only path in this
  // module capable of destroying data the running build does not understand
  // yet. It is deliberately inert. §7.3 step 5, §13. Do not "complete" it.
  if (parsed.v > declared) {
    ctx.emit('downgrade', { key, stored: parsed.v, declared });
    return fallback;
  }

  // STEP 6 — stored version is older and no migrate was declared → emit
  // 'corrupt', return the fallback, write nothing. The old bytes survive, so a
  // later build that does declare a migrate can still read them.
  if (!declaration.migrate) {
    ctx.emit('corrupt', { key, reason: 'no_migrate' });
    return fallback;
  }

  // STEP 7 — stored version is older and migrate was declared.
  //
  // migrate receives the ORIGIN version and must handle any version below the
  // declared one it cares about. There is no chaining: with two or three
  // lifetime versions per key a chain is more machinery than it is worth, and
  // harder to test. migrate must be pure and must not call back into the store.
  let migrated;
  try {
    migrated = declaration.migrate(parsed.v, parsed.d);
  } catch (error) {
    ctx.emit('error', { key, error });
    return fallback;
  }

  // Returning undefined is how migrate says "I cannot handle this version" —
  // the fallback path takes over and nothing is destroyed.
  if (migrated === undefined) {
    ctx.emit('error', {
      key,
      error: new Error(
        `kit-storage: migrate for key ${describe(key)} returned undefined for stored ` +
        `version ${parsed.v} (declared ${declared}) — falling back, bytes left alone`
      )
    });
    return fallback;
  }

  // The one and only write on any read path. Best-effort by contract: a failed
  // write-back is NOT an error and does not change what get() returns —
  // migration simply runs again on the next load, which is why migrate has to
  // be idempotent. Wrapped because encoding an unserializable migrate result
  // must not turn a read into a throw.
  try {
    writeValue(ctx, prefix, key, declared, migrated);
  } catch (error) {
    ctx.emit('error', { key, error });
  }

  ctx.emit('migrated', { key, from: parsed.v, to: declared });
  return migrated;
}

// --- Enumeration (spec §9) --------------------------------------------------
//
// Given the store's prefix P, strip it from every matching storage key:
// a remainder with no '.' is an own-level key; a remainder with a '.' belongs
// to a child scope, whose id is its first segment. The no-'.'-in-identifiers
// rule (§3.1) is what makes this unambiguous.
//
// These four operate on what is STORED, not what is declared, and never throw
// for undeclared keys — enumeration must be able to see leftovers from an
// older build (§7.1).

function underPrefix(ctx, prefix) {
  const out = [];
  for (const storageKey of storageKeys(ctx)) {
    if (!storageKey.startsWith(prefix)) continue;
    const remainder = storageKey.slice(prefix.length);
    if (remainder.length === 0) continue;
    out.push({ storageKey, remainder });
  }
  return out;
}

// Same walk, over the memory shim instead of storage — a key that has never
// reached durable storage (every set() has failed so far this session) has no
// entry for underPrefix() to find, so clear() needs this separately to reach
// it (§9: "clear matching entries from the memory shim").
function underPrefixMemory(ctx, prefix) {
  const out = [];
  for (const storageKey of ctx.memory.keys()) {
    if (!storageKey.startsWith(prefix)) continue;
    const remainder = storageKey.slice(prefix.length);
    if (remainder.length === 0) continue;
    out.push({ storageKey, remainder });
  }
  return out;
}

// --- Store construction -----------------------------------------------------
