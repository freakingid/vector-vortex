    // ⛔ THE ONE CLOCK (GDD 8, CLAUDE.md Config). All difficulty scaling derives

    // ⛔ Counts UP, in seconds of SIMULATION time — not wall clock. It advances

    // never actually elapsed, the same reasoning 05-skimmer.js's squashTime

    shotCooldown: C.SHOT_COOLDOWN,
  };
}

// ---------------------------------------------------------------------------
// THE DEPTH MODEL (GDD 3.2, 3.5; RATIONALE.md#depth-model)
// ---------------------------------------------------------------------------
//
// ⛔ Every entity position is (lane, depth). Screen coordinates are derived
// HERE and only at render time. Nothing upstream of screenPos may hold an x/y.
//
//   lane   float in LANE-CENTRE units. lane === i is the CENTRE of lane i,
//          i.e. the midpoint of the rim edge rim[i] -> rim[i+1]. That is why
//          the Skimmer clamps to [0, lanes-1] on an open well (GDD 3.5) and
//          why snap assist rounds to an integer (GDD 4.1): the integers ARE
//          the lane centres. Do not re-read lane as a vertex index — vertex
//          param is lane + 0.5, and conflating the two is a half-lane offset
//          that looks almost right on a Ring and obviously wrong on a Box.
//   depth  float in [0,1]. 0 = throat, 1 = rim.
//
// A fractional lane walks the rim POLYGON, not the chord between adjacent lane
// centres. On a sharp corner (Box, Cross, Star) the chord cuts the corner and
// the Skimmer visibly leaves the rim; walking the polygon keeps it on the wire.
//
// The Twist (figure-eight) needs no special case anywhere in here: its throat
// is the same polygon scaled toward its own centroid, so its lanes cross
// correctly and no code notices (GDD 3.3).

// Rim vertex count for a well. Closed rims are loops (lanes verts); open rims
// are strips (lanes + 1 verts). Every index walk below goes through this.
function wellVertCount(well) {
  return well.closed ? well.lanes : well.lanes + 1;
}

// The throat polygon: the rim scaled toward its centroid by throatScale, plus
// the optional throatOffset from GDD 3.3 (absent on every shipped well; it
// defaults to zero, so a well that omits it is not a special case).
//
// ⛔ Memoized on the well object. This is called for every entity every frame
// once entities exist; recomputing a centroid per call is the per-frame
// allocation the §17 perf budget forbids. Cached under a non-enumerable key so
// the well data still serializes and diffs as pure data.
//
// ⛔ The cache assumes rim data is IMMUTABLE at runtime, which it is: a well is
// a static shape and a Thorn chips a lane's LENGTH (C.THORN_CHIP, a depth
// quantity), never a rim vertex. If a future phase ever mutates well.rim, it
// must delete well._throat and well._centroid in the same breath, or the
// throat silently keeps describing the old shape.
function wellThroat(well) {
  if (well._throat) return well._throat;

  const n = wellVertCount(well);
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += well.rim[i].x; cy += well.rim[i].y; }
  cx /= n; cy /= n;

  const s = well.throatScale;
  const ox = (well.throatOffset && well.throatOffset.x) || 0;
  const oy = (well.throatOffset && well.throatOffset.y) || 0;

  const throat = new Array(n);
  for (let i = 0; i < n; i++) {
    throat[i] = {
      x: cx + (well.rim[i].x - cx) * s + ox,
      y: cy + (well.rim[i].y - cy) * s + oy,
    };
  }
  Object.defineProperty(well, "_throat", { value: throat, enumerable: false });
  Object.defineProperty(well, "_centroid", { value: { x: cx, y: cy }, enumerable: false });
  return throat;
}

// The rim centroid, in normalized rim space. Derived with the throat, so this
// forces that derivation rather than duplicating the loop.
function wellCentroid(well) {
  wellThroat(well);
  return well._centroid;
}

// ---- Lane space -----------------------------------------------------------
//
// ⛔ GDD 3.5: open wells are NOT closed wells with a clamp. Lane space is a
// different topology per well, and every helper below dispatches on it:
//
//   closed  a circle of circumference `lanes`. lane === lanes is lane 0.
//   open    a segment [0, lanes-1]. The ends are WALLS, not seams.

// Wrap a lane into [0, lanes) on a closed well. Handles any magnitude and any
// sign — a negative modulus in JS is negative, hence the double-mod.
function laneWrap(well, lane) {
  const n = well.lanes;
  return ((lane % n) + n) % n;
}

// Clamp a lane into [0, lanes-1] on an open well (GDD 3.5, the Skimmer rule).
function laneClamp(well, lane) {
  const hi = well.lanes - 1;
  return lane < 0 ? 0 : (lane > hi ? hi : lane);
}

// The one route from a raw lane value to a legal one. Dispatches on topology
// so no caller has to remember which well it is holding.
function laneNormalize(well, lane) {
  return well.closed ? laneWrap(well, lane) : laneClamp(well, lane);
}

// Shortest signed lane distance from a to b — the wrap-aware `shortDelta`
// analogue RATIONALE.md#depth-model names. On a closed well this is the short
// way round and is in [-lanes/2, lanes/2]; on an open well there is only one
// way round, so it is the plain difference.
//
// Use this for "which way do I turn", never a bare (b - a): on a Ring, lane 15
// to lane 0 is +1, not -15.
function laneDelta(well, a, b) {
  if (!well.closed) return b - a;
  const n = well.lanes;
  let d = laneWrap(well, b - a);
  if (d > n / 2) d -= n;
  return d;
}

// ⛔ THE WALL HELPER (GDD 3.5, §17 test 3). A lane hop of `delta` from `lane`,
// returning BOTH the resulting lane and the direction the hopper is now
// travelling. Enemies do not exist yet; this is built now and correctly
// because retrofitting it is where the well's two clocks desynchronize.
//
// The returned `dir` is the whole point. An enemy that stores its own hop
// direction and only asks this helper for a POSITION keeps a stale direction
// after a bounce and grinds against the wall forever, one hop in and one hop
// back. The wall and the hopper's direction are ONE piece of state: an enemy
// must write back the `dir` it gets here.
//
//   closed  wraps. dir is unchanged — there is no wall to turn at.
//   open    mirror-folds into [0, lanes-1], reflecting as many times as the
//           hop needs. dir flips once per reflection, so an even number of
//           bounces restores the original heading. This is NOT a clamp: a
//           clamped hopper parks on the end lane, a reflected one turns
//           around and comes back, which is the behaviour GDD 3.5 specifies.
//
// `dir` is passed through rather than inferred from delta's sign so a caller
// hopping by 0 keeps its heading instead of silently resetting it.
function laneHop(well, lane, delta, dir) {
  const d = (dir === undefined) ? (delta < 0 ? -1 : 1) : dir;

  if (well.closed) {
    return { lane: laneWrap(well, lane + delta), dir: d };
  }

  const max = well.lanes - 1;
  if (max <= 0) return { lane: 0, dir: d };

  const period = 2 * max;
  let m = ((lane + delta) % period + period) % period;   // [0, 2*max)
  let flipped = false;
  if (m > max) { m = period - m; flipped = true; }        // fold the far half back
  return { lane: m, dir: flipped ? -d : d };
}

// Is this lane against a wall? Always false on a closed well — a closed well
// has no walls, only a seam, and treating the seam as a wall is the mirror of
// the GDD 3.5 bug.
function laneAtWall(well, lane) {
  if (well.closed) return false;
  return lane <= 0 || lane >= well.lanes - 1;
}

// ---- Projection -----------------------------------------------------------

// depth -> the eased fraction of the way from throat to rim (GDD 3.2).
// C.PERSPECTIVE_EXP is ~0.55: below 1, so depth spends most of its range near
// the throat and the last stretch to the rim is fast. Lower = more rush.
function perspective(depth) {
  return Math.pow(depth < 0 ? 0 : (depth > 1 ? 1 : depth), C.PERSPECTIVE_EXP);
}

// Walk a polygon in LANE units and write the result into `out`.
// Lane L sits at vertex parameter L + 0.5 — see the header note.
function polyAt(poly, well, lane, out) {
  const n = well.lanes;
  const t = lane + 0.5;
  let i = Math.floor(t);
  const f = t - i;

  if (well.closed) {
    i = ((i % n) + n) % n;
    const a = poly[i], b = poly[(i + 1) % n];
    out.x = a.x + (b.x - a.x) * f;
    out.y = a.y + (b.y - a.y) * f;
  } else {
    // A legal lane is in [0, lanes-1], so t is in [0.5, lanes-0.5] and both
    // indices are already in range. An ILLEGAL lane is clamped here rather
    // than indexed: an out-of-range lane must yield a finite edge point, never
    // a read past the end of the array. Callers should have normalized first
    // (laneNormalize), so this is a backstop, not the movement rule.
    const tc = t < 0.5 ? 0.5 : (t > n - 0.5 ? n - 0.5 : t);
    i = Math.floor(tc);
    const a = poly[i], b = poly[i + 1];
    const g = tc - i;
    out.x = a.x + (b.x - a.x) * g;
    out.y = a.y + (b.y - a.y) * g;
  }
  return out;
}

// The rim point for a lane, in normalized rim space.
function rimPoint(well, lane, out) {
  return polyAt(well.rim, well, lane, out || { x: 0, y: 0 });
}

// The throat point for a lane, in normalized rim space.
function throatPoint(well, lane, out) {
  return polyAt(wellThroat(well), well, lane, out || { x: 0, y: 0 });
}

// ⛔ screenPos(well, lane, depth) — THE projection. GDD 3.2:
//
//   screenPos = lerp( throatVertex(lane), rimVertex(lane), perspective(depth) )
//
// Normalized rim space ([-1,1] about the origin) is mapped onto the fixed
// 1280x720 world by C.WELL_CX / C.WELL_CY / C.WELL_RADIUS. ⛔ Game math never
// reads window size; the canvas is letterboxed by CSS.
//
// `out` is an optional scratch point. The render path passes one per call site
// so a full frame allocates nothing — §17's perf budget forbids per-frame
// allocation in the hot path.
//
// The two module-level scratch points below make this NON-REENTRANT: screenPos
// must not be called from inside a callback screenPos itself invoked. It never
// is — this is a leaf function — but do not give it one.
const _rimP = { x: 0, y: 0 };
const _thrP = { x: 0, y: 0 };
function screenPos(well, lane, depth, out) {
  const p = out || { x: 0, y: 0 };
  const t = perspective(depth);

  rimPoint(well, lane, _rimP);
  throatPoint(well, lane, _thrP);

  const nx = _thrP.x + (_rimP.x - _thrP.x) * t;
  const ny = _thrP.y + (_rimP.y - _thrP.y) * t;

  p.x = C.WELL_CX + nx * C.WELL_RADIUS;
  p.y = C.WELL_CY + ny * C.WELL_RADIUS;
  return p;
}

// 04-input.js
// ==========================================================================
// 04-input.js — kit-input (draft). Four devices in, ONE struct out.
//
// ⛔ THIS MODULE READS NO GAME GLOBAL. Not the config object, not the mutable
// game object, not a game function — in either direction. Every tunable
// arrives through createInput()'s options and 23-main.js is what passes them
// in. That is CLAUDE.md's boundary contract ("Kit modules and extraction"),
// and it is the whole reason this file can later be copied into coinless-kit
// rather than rewritten. Backport packet: src/04-input.NOTES.md.
//
// ⛔ ONE struct (GDD 9.5):  { rotate, fire, purge, jump }
// The simulation never learns which device produced it, and call sites never
// read a raw key map. `rotate` is a LANE DELTA for this simulation step, not a
// velocity: mouse motion is inherently a delta, and turning it into a velocity
// means dividing by dt, which is how linearity (GDD 9.1) gets quietly lost.
//
// ⛔ NO ACCELERATION CURVE on the mouse (GDD 9.1). A spinner has none, and
// adding one is the single most common way to ruin this game's rim feel.
// The mouse path is one multiply, on purpose. Keep it that way.
//
// CS002 P4 adds touch and gamepad. Both go through the SAME sink and the SAME
// sample() as mouse/keyboard — one code path, not two that agree today:
//   - Touch rotation is a relative drag, accumulated into the same mouseDx-like
//     bucket mouse motion uses, just at a different sensitivity (TOUCH_SENS).
//   - The D-pad is wired as two synthetic key names ("gamepadleft" /
//     "gamepadright") fed through keyDown/keyUp, so it rides the exact
//     tap/hold state machine the keyboard uses. There is no second axis model.
//   - The left stick is genuinely different (a held analog position rather
//     than a digital press), so it gets its own accumulator, scaled by
//     GAMEPAD_SENS and gated by GAMEPAD_DEADZONE.
// The Gamepad API has no events for stick/axis motion — it must be polled —
// so `pollGamepads()` runs once at the top of every sample(), reading through
// whatever `win` attach() was given. That is still "one code path": polling
// only decides how gamepad state ENTERS the sink, same as a DOM listener does
// for mouse/keyboard.
//
// Device events arrive through the small sink API below (mouseMove / keyDown /
// keyUp / setButton). attach() is a thin DOM adapter over that sink and is the
// only place in the entire build that touches a DOM event. That split is what
// lets a headless test replay a recorded event list with no DOM at all, which
// is what makes the determinism guarantee (GDD 17.1) testable.

const INPUT_VERSION = "0.2.0";

// Default bindings, matched case-insensitively. These are NOT tunables — a
// keymap is this module's own default and a host replaces it wholesale through
// options.keys. Values are DOM `key` names, lowercased.
//
// "w" is deliberately unbound here: the game binds it as a named debug action
// (see options.actionKeys), and a key doing two jobs is a bug waiting for a
// player who rebinds.
const INPUT_KEYS_DEFAULT = {
  left:  ["arrowleft", "a"],
  right: ["arrowright", "d"],
  fire:  [" ", "z"],
  purge: ["shift", "x"],
  jump:  ["arrowup", "c"],
};

function inputNormKey(k) {
  return String(k).toLowerCase();
}

// ⛔ Numeric tunables are REQUIRED, never defaulted. A default here would be a
// second tuning surface competing with the host's config object, and the point
// of the boundary is that there is exactly one. Failing loudly at wiring time
// beats a silent 0.02 that nobody can find later.
function inputRequireNum(opts, name) {
  const v = opts[name];
  if (typeof v !== "number" || !isFinite(v)) {
    throw new Error("createInput: options." + name + " must be a finite number");
  }
  return v;
}

// Same requirement, for the two touch tunables that are booleans rather than
// numbers (TOUCH_AUTOFIRE, INPUT_MIRROR). Same reasoning as inputRequireNum.
function inputRequireBool(opts, name) {
  const v = opts[name];
  if (typeof v !== "boolean") {
    throw new Error("createInput: options." + name + " must be a boolean");
  }
  return v;
}

// Turn { action: ["key", ...] } into both directions at once: a key -> action
// lookup for events, and an action -> keys list for "is anything held?".
function inputBuildBindings(src) {
  const byKey = new Map();
  const byAction = {};
  for (const action of Object.keys(src)) {
    const raw = src[action];
    const list = Array.isArray(raw) ? raw : [raw];
    const norm = [];
    for (let i = 0; i < list.length; i++) {
      const k = inputNormKey(list[i]);
      norm.push(k);
      byKey.set(k, action);
    }
    byAction[action] = norm;
  }
  return { byKey, byAction };
}

//   createInput({
//     mouseSens, keyTapMs, keySpeedMin, keySpeedMax, keyRamp,   // required
//     touchSens, touchZoneFrac, touchAutofire, touchButtonR,    // required
//     gamepadDeadzone, gamepadSens,                             // required
//     worldW, worldH,       // required — world-space size touch buttons live in
//     inputMirror,          // required — mirrors touch buttons for left-handed play
//     pointerLockOffer,                                          // optional, default on
//     keys,        // optional binding override, shape of INPUT_KEYS_DEFAULT
//     actionKeys,  // optional { actionName: ["key", ...] } for named actions
//     onAction,    // optional (name) => void, called during sample()
//   })
function createInput(options) {
  const opts = options || {};

  const mouseSens   = inputRequireNum(opts, "mouseSens");
  const keyTapS     = inputRequireNum(opts, "keyTapMs") / 1000;
  const keySpeedMin = inputRequireNum(opts, "keySpeedMin");
  const keySpeedMax = inputRequireNum(opts, "keySpeedMax");
  const keyRamp     = inputRequireNum(opts, "keyRamp");
  const pointerLockOffer = opts.pointerLockOffer !== false;
  const onAction = typeof opts.onAction === "function" ? opts.onAction : null;

  const touchSens      = inputRequireNum(opts, "touchSens");
  const touchZoneFrac  = inputRequireNum(opts, "touchZoneFrac");
  const touchButtonR   = inputRequireNum(opts, "touchButtonR");
  const touchAutofire  = inputRequireBool(opts, "touchAutofire");
  const gamepadDeadzone = inputRequireNum(opts, "gamepadDeadzone");
  const gamepadSens     = inputRequireNum(opts, "gamepadSens");
  const worldW = inputRequireNum(opts, "worldW");
  const worldH = inputRequireNum(opts, "worldH");
  const inputMirror = inputRequireBool(opts, "inputMirror");

  const bindings = inputBuildBindings(opts.keys || INPUT_KEYS_DEFAULT);
  const actions  = inputBuildBindings(opts.actionKeys || {});

  // The D-pad rides the SAME tap/hold state machine the keyboard uses (GDD
  // 9.4) — these are not a second axis model, just two more bound "keys" that
  // happen to be pressed by pollGamepads() instead of a keydown event.
  function bindSynthetic(key, action) {
    bindings.byKey.set(key, action);
    if (!bindings.byAction[action]) bindings.byAction[action] = [];
    bindings.byAction[action].push(key);
  }
  bindSynthetic("gamepadleft", "left");
  bindSynthetic("gamepadright", "right");

  const pressed = new Set();   // normalized key names currently down
  const buttons = new Set();   // non-key sources holding a button: "fire", ...
  const queued  = [];          // named actions triggered since the last sample

  // One record per rotation direction. `emitted` is how much of a lane this
  // press has already delivered, which is what makes the tap exact.
  const axis = {
    left:  { down: false, held: 0, emitted: 0, tap: false },
    right: { down: false, held: 0, emitted: 0, tap: false },
  };

  let mouseDx = 0;         // px accumulated since the last sample
  let impulse = 0;         // signed lane units owed by taps completed since then
  let lastClientX = null;  // fallback when a mousemove carries no relative delta

  // Touch: a relative drag, exactly like mouse but at TOUCH_SENS (GDD 9.3).
  // Not a virtual stick — there is no rest position, only Δx since last move.
  const touches = new Map();   // touch id -> { kind: "drag"|"purge"|"jump", x }
  let touchDx = 0;              // world-space px accumulated since the last sample
  let touchDragCount = 0;       // active drag touches; > 0 drives TOUCH_AUTOFIRE

  // Gamepad: the stick is a held analog position, not a discrete press, so it
  // gets its own accumulator rather than routing through `axis` (GDD 9.4).
  let gamepadWin = null;         // set by attach(); polled once per sample()
  let gamepadAxisX = 0;
  let gpDpadLeftDown = false, gpDpadRightDown = false;

  const out = { rotate: 0, fire: false, purge: false, jump: false };

  const detachers = [];

  // ---- the sink: every device path ends up calling these --------------------

  // Returns whether the key is bound at all, so a DOM adapter knows whether to
  // swallow the browser's default (space scrolling the page, say).
  function keyDown(rawKey) {
    const k = inputNormKey(rawKey);
    const bound = bindings.byKey.has(k) || actions.byKey.has(k);
    // Held keys repeat. A repeat is not a new press — treating it as one would
    // restart the ramp sixty times a second and re-arm the tap forever.
    if (pressed.has(k)) return bound;
    pressed.add(k);

    const dir = axis[bindings.byKey.get(k)];
    if (dir) { dir.down = true; dir.held = 0; dir.emitted = 0; dir.tap = true; }

    const named = actions.byKey.get(k);
    if (named !== undefined) queued.push(named);

    return bound;
  }

  function keyUp(rawKey) {
    const k = inputNormKey(rawKey);
    const bound = bindings.byKey.has(k) || actions.byKey.has(k);
    if (!pressed.delete(k)) return bound;
    const name = bindings.byKey.get(k);
    // Another key bound to the same direction may still be down (arrow + WASD).
    if (axis[name] && !anyKeyHeld(name)) releaseAxis(name);
    return bound;
  }

  function mouseMove(dx) {
    if (typeof dx === "number" && isFinite(dx)) mouseDx += dx;
  }

  // A button held by something that is not a key: a mouse button now, a touch
  // button in P4. Same four action names, same struct.
  function setButton(name, down) {
    if (down) buttons.add(name); else buttons.delete(name);
  }

  // Purge (top-right) and Jump (bottom-right), radius touchButtonR, mirrored
  // to the left side when inputMirror is set (GDD 9.3).
  function touchButtonCenters() {
    const m = touchButtonR * 1.5;
    if (inputMirror) return { purge: { x: m, y: m }, jump: { x: m, y: worldH - m } };
    return { purge: { x: worldW - m, y: m }, jump: { x: worldW - m, y: worldH - m } };
  }

  function inCircle(x, y, c, r) {
    const dx = x - c.x, dy = y - c.y;
    return dx * dx + dy * dy <= r * r;
  }

  // touchStart/touchMove/touchEnd take WORLD-SPACE coordinates (the same
  // 1280x720-ish space every other entity lives in) — the DOM adapter below
  // is what converts a real touch event's client pixels into that space, so
  // this trio stays exercisable with no DOM at all, same as the rest of the
  // sink.
  function touchStart(id, x, y) {
    const c = touchButtonCenters();
    if (inCircle(x, y, c.purge, touchButtonR)) { touches.set(id, { kind: "purge" }); buttons.add("purge"); return; }
    if (inCircle(x, y, c.jump,  touchButtonR)) { touches.set(id, { kind: "jump" });  buttons.add("jump");  return; }
    if (y >= worldH * (1 - touchZoneFrac)) {
      touches.set(id, { kind: "drag", x: x });
      touchDragCount++;
    }
  }

  function touchMove(id, x, y) {
    const t = touches.get(id);
    if (!t || t.kind !== "drag") return;
    touchDx += x - t.x;
    t.x = x;
  }

  function touchEnd(id) {
    const t = touches.get(id);
    if (!t) return;
    touches.delete(id);
    if (t.kind === "purge") buttons.delete("purge");
    else if (t.kind === "jump") buttons.delete("jump");
    else touchDragCount--;
  }

  // Polled once per sample() (the Gamepad API has no motion events — a stick
  // held over at rest produces nothing to listen for). `win` is whatever
  // attach() was given; a headless test can call this directly with a plain
  // `{ navigator: { getGamepads: () => [...] } }` object.
  function pollGamepads(win) {
    if (!win || !win.navigator || typeof win.navigator.getGamepads !== "function") return;
    let pads;
    try { pads = win.navigator.getGamepads(); } catch (err) { return; }
    const gp = pads && pads[0];
    if (!gp) {
      gamepadAxisX = 0;
      if (gpDpadLeftDown)  { keyUp("gamepadleft");  gpDpadLeftDown = false; }
      if (gpDpadRightDown) { keyUp("gamepadright"); gpDpadRightDown = false; }
      return;
    }
    const ax = gp.axes && typeof gp.axes[0] === "number" && isFinite(gp.axes[0]) ? gp.axes[0] : 0;
    gamepadAxisX = ax;

    // ⛔ The D-pad reaches `left`/`right` through keyDown/keyUp — the SAME
    // tap/hold implementation the keyboard uses. This is edge detection only;
    // the state machine that turns a press into a lane delta lives in exactly
    // one place (advanceAxis/releaseAxis above).
    const left  = !!(gp.buttons && gp.buttons[14] && gp.buttons[14].pressed);
    const right = !!(gp.buttons && gp.buttons[15] && gp.buttons[15].pressed);
    if (left !== gpDpadLeftDown)   { if (left) keyDown("gamepadleft"); else keyUp("gamepadleft"); gpDpadLeftDown = left; }
    if (right !== gpDpadRightDown) { if (right) keyDown("gamepadright"); else keyUp("gamepadright"); gpDpadRightDown = right; }
  }

  // Proportional past the deadzone, scaled by gamepadSens (GDD 9.4). Returns
  // a lane delta for this step, same units as the mouse/touch/tap paths.
  function gamepadAxisDelta(x, dt) {
    if (x <= -gamepadDeadzone || x >= gamepadDeadzone) return x * gamepadSens * dt;
    return 0;
  }

  function anyKeyHeld(name) {
    const list = bindings.byAction[name];
    if (!list) return false;
    for (let i = 0; i < list.length; i++) if (pressed.has(list[i])) return true;
    return false;
  }

  function actionHeld(name) {
    return anyKeyHeld(name) || buttons.has(name);
  }

  // GDD 9.2 — a tap is EXACTLY one lane, in total. The ramp below has already
  // delivered part of that lane during the press, so release pays the balance.
  // ⛔ That means the constants must satisfy: the ramp integrated over
  // keyTapMs is at most one lane. At the shipped values it is ~0.76, so the
  // balance is positive; the clamp is there so a future retune that breaks the
  // relation degrades to "no extra nudge" rather than to a backwards jump.
  function releaseAxis(name) {
    const dir = axis[name];
    if (!dir.down) return;
    dir.down = false;
    if (dir.tap) {
      const rest = 1 - dir.emitted;
      if (rest > 0) impulse += (name === "left" ? -rest : rest);
    }
    dir.held = 0; dir.emitted = 0; dir.tap = false;
  }

  // Hold: accelerate keySpeedMin -> keySpeedMax over keyRamp (GDD 9.2). Ramping
  // from the first step rather than after the tap window is deliberate — a
  // 130 ms dead spot at the start of every hold is exactly the latency P1 says
  // must not exist.
  function advanceAxis(dir, dt) {
    if (!dir.down) return 0;
    dir.held += dt;
    if (dir.held >= keyTapS) dir.tap = false;
    const f = keyRamp > 0 ? Math.min(1, dir.held / keyRamp) : 1;
    const step = (keySpeedMin + (keySpeedMax - keySpeedMin) * f) * dt;
    dir.emitted += step;
    return step;
  }

  // ---- the one output ------------------------------------------------------

  // sample(dt, target) — writes the struct into `target` when given (the game
  // passes its own object so the mutable game object owns it) and returns it.
  // Allocates nothing.
  function sample(dt, target) {
    const s = target || out;

    pollGamepads(gamepadWin);

    let rotate = mouseDx * mouseSens;   // ⛔ linear. One multiply. No curve.
    mouseDx = 0;
    rotate += touchDx * touchSens;      // same model, different sensitivity
    touchDx = 0;

    rotate -= advanceAxis(axis.left, dt);
    rotate += advanceAxis(axis.right, dt);
    rotate += impulse;
    impulse = 0;

    rotate += gamepadAxisDelta(gamepadAxisX, dt);

    s.rotate = rotate;
    s.fire   = actionHeld("fire") || (touchAutofire && touchDragCount > 0);
    s.purge  = actionHeld("purge");
    s.jump   = actionHeld("jump");

    // Named actions are dispatched HERE, in simulation order, not at DOM-event
    // time. A recorded event list therefore replays identically (GDD 17.1),
    // and a debug action cannot land halfway through a frame.
    if (queued.length) {
      if (onAction) for (let i = 0; i < queued.length; i++) onAction(queued[i]);
      queued.length = 0;
    }
    return s;
  }

  function reset() {
    pressed.clear();
    buttons.clear();
    queued.length = 0;
    for (const name of Object.keys(axis)) {
      const dir = axis[name];
      dir.down = false; dir.held = 0; dir.emitted = 0; dir.tap = false;
    }
    mouseDx = 0;
    impulse = 0;
    lastClientX = null;
    touches.clear();
    touchDx = 0;
    touchDragCount = 0;
    gamepadAxisX = 0;
    gpDpadLeftDown = false;
    gpDpadRightDown = false;
    out.rotate = 0; out.fire = false; out.purge = false; out.jump = false;
  }

  // ---- DOM adapter ---------------------------------------------------------
  // ⛔ The only DOM-event code in the build. Everything above is reachable
  // without a document, which is what the headless suite drives.

  // Relative motion. Under Pointer Lock a mousemove carries a relative delta
  // directly; unlocked it may not, so fall back to differencing absolute
  // positions. Both are the same quantity — pixels since the last event.
  function relativeX(ev) {
    if (typeof ev.movementX === "number") { lastClientX = null; return ev.movementX; }
    const x = ev.clientX;
    if (typeof x !== "number") return 0;
    const d = lastClientX === null ? 0 : x - lastClientX;
    lastClientX = x;
    return d;
  }

  // GDD 9.1 — Pointer Lock is OFFERED on click and NEVER forced. Refusal, exit
  // by Escape, and a browser that has none are all normal: unlocked relative
  // motion still works, it just stops at the window edge.
  function offerLock(el, doc) {
    if (!pointerLockOffer) return;
    if (!el || typeof el.requestPointerLock !== "function") return;
    if (doc && doc.pointerLockElement === el) return;
    try {
      const p = el.requestPointerLock();
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (err) { /* denied — the game plays unlocked */ }
  }

  function on(target, type, fn) {
    if (!target || typeof target.addEventListener !== "function") return;
    target.addEventListener(type, fn, false);
    detachers.push(function () { target.removeEventListener(type, fn, false); });
  }

  // attach({ window, document, element }) — element is what mouse events and
  // Pointer Lock bind to (the canvas). Safe to call with any of them missing.
  // Converts a Touch's client-space pixels into the world-space coordinates
  // touchStart/touchMove expect, accounting for CSS letterboxing (the canvas
  // is fixed WORLD_W x WORLD_H internally but can be scaled on screen).
  function touchWorldPoint(el, t) {
    const rect = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    if (!rect || !rect.width || !rect.height) return { x: t.clientX, y: t.clientY };
    return {
      x: (t.clientX - rect.left) / rect.width * worldW,
      y: (t.clientY - rect.top) / rect.height * worldH,
    };
  }

  function attach(env) {
    detach();
    const e = env || {};
    const doc = e.document || null;
    const win = e.window || null;
    const el  = e.element || doc;
    gamepadWin = win;

    on(doc, "keydown", function (ev) {
      if (keyDown(ev.key) && typeof ev.preventDefault === "function") ev.preventDefault();
    });
    on(doc, "keyup", function (ev) {
      if (keyUp(ev.key) && typeof ev.preventDefault === "function") ev.preventDefault();
    });

    on(el, "mousemove", function (ev) { mouseMove(relativeX(ev)); });
    on(el, "mousedown", function (ev) {
      if (ev.button === 2) setButton("purge", true);
      else { setButton("fire", true); offerLock(el, doc); }
    });
    on(el, "contextmenu", function (ev) {
      if (typeof ev.preventDefault === "function") ev.preventDefault();
    });
    // Release on the window: a button let go outside the canvas must not stick.
    on(win || doc, "mouseup", function (ev) {
      if (ev.button === 2) setButton("purge", false); else setButton("fire", false);
    });

    // Losing focus mid-press otherwise leaves the rim spinning forever.
    on(win || doc, "blur", function () { reset(); });

    on(el, "touchstart", function (ev) {
      const list = ev.changedTouches || [];
      for (let i = 0; i < list.length; i++) {
        const p = touchWorldPoint(el, list[i]);
        touchStart(list[i].identifier, p.x, p.y);
      }
      if (typeof ev.preventDefault === "function") ev.preventDefault();
    });
    on(el, "touchmove", function (ev) {
      const list = ev.changedTouches || [];
      for (let i = 0; i < list.length; i++) {
        const p = touchWorldPoint(el, list[i]);
        touchMove(list[i].identifier, p.x, p.y);
      }
      if (typeof ev.preventDefault === "function") ev.preventDefault();
    });
    function touchEndHandler(ev) {
      const list = ev.changedTouches || [];
      for (let i = 0; i < list.length; i++) touchEnd(list[i].identifier);
    }
    on(el, "touchend", touchEndHandler);
    on(el, "touchcancel", touchEndHandler);

    return detachers.length > 0;
  }

  function detach() {
    while (detachers.length) detachers.pop()();
    lastClientX = null;
    gamepadWin = null;
  }

  return {
    VERSION: INPUT_VERSION,
    sample, reset,
    keyDown, keyUp, mouseMove, setButton,
    touchStart, touchMove, touchEnd, pollGamepads,
    attach, detach,
    isBound: function (k) {
      const n = inputNormKey(k);
      return bindings.byKey.has(n) || actions.byKey.has(n);
    },
  };
}

// ==========================================================================
// 05-skimmer.js
// ==========================================================================
// 05-skimmer.js — the Skimmer, the player's craft (GDD 4.1, 3.5, 10.2).
//
// ⛔ `lane` is a CONTINUOUS FLOAT and the simulation never quantizes it. Snap
// assist PULLS it toward a lane centre; it does not round it. The one place a
// lane becomes an integer is fire time (CS002 P3), which picks the nearest
// lane centre for the shot and leaves the Skimmer where it is.
//
// ⛔ Position is (lane, depth) and nothing else. The Skimmer's depth is 1 — it
// rides the rim — and its screen position is derived at draw time through
// screenPos(). No x/y is ever stored on this object.
//
// ⛔ Every lane arithmetic goes through 03-wells.js: laneNormalize() to land a
// move, laneDelta() to ask which way to turn. Two lane floats are NEVER
// subtracted by hand in here. On a 16-lane closed well the distance from 15.7
// to 0 is +0.3, not -15.7, and the naive subtraction is exactly what sends
// snap assist the long way round the well.
//
// ⛔ GDD 3.5 — an open well is not a closed well with a clamp. Closed wells
// wrap at the seam; open wells CLAMP at two walls, and hitting one triggers a
// WALL_SQUASH_MS squash that is ⛔ VISUAL ONLY and never writes `lane`.
//
// ⛔ Entity contract (GDD 6.5): class, update, draw, dead. Nothing sets `dead`
// yet — death is CS006's. update/draw take their well and input explicitly
// rather than reaching for the game object, the same shape 13-render-well.js
// uses; C is the only global this module reads.

// The silhouette, in LOCAL SPACE, per GDD 10.2 ("new entities define
// local-space point arrays and reuse drawPoly/glowStroke"). This is shape
// DATA, the same class of thing as WELLS' rim polygons — not a tuning surface.
// The scale IS a tunable and lives in C.SKIMMER_WIDTH.
//
//   l  lane offset in HALF-WIDTH units, so l = ±1 is ±SKIMMER_WIDTH/2 lanes
//      and the craft spans exactly SKIMMER_WIDTH lane widths at its prongs.
//   d  depth offset from the rim. ⛔ Never positive: depth is capped at 1 by
//      perspective(), so a point outside the rim would silently collapse onto
//      it and the shape would lose a vertex on every well.
//
// A swept arrowhead: two prongs sitting on the rim, a shallow notched trailing
// edge between them, and a nose reaching down the well. Deliberately not a
// claw — GDD 18, the silhouette is one of the things that has to be ours.
const SKIMMER_POLY = [
  { l: -1.00, d:  0.00 },   // left prong, on the rim
  { l: -0.42, d: -0.13 },   // left shoulder
  { l:  0.00, d: -0.04 },   // the notch, just inside the rim
  { l:  0.42, d: -0.13 },   // right shoulder
  { l:  1.00, d:  0.00 },   // right prong, on the rim
  { l:  0.00, d: -0.30 },   // the nose, deepest into the well
];

// Preallocated projection scratch — one screen point per silhouette vertex.
// ⛔ No per-frame allocation in the hot path (GDD 17, performance budget), and
// like screenPos() this makes skimmerPoints() NON-REENTRANT. It is a leaf
// call; do not give it a callback.
const _skimPts = SKIMMER_POLY.map(function () { return { x: 0, y: 0 }; });

// Project the silhouette into screen space for a given lane and squash.
//
//   squash  0..1, the VISUAL wall-squash amount. It compresses the craft
//           along the rim and stretches it down the well by the same factor —
//           it is applied HERE, at projection time, and never anywhere near
//           `lane`. GDD 3.5's "40 ms visual squash".
//
// Returns the shared scratch array. Copy out of it if you need to keep it.
function skimmerPoints(well, lane, squash) {
  const s = squash > 0 ? (squash > 1 ? 1 : squash) : 0;
  const half = C.SKIMMER_WIDTH / 2 * (1 - C.SKIMMER_SQUASH * s);
  const reach = 1 + C.SKIMMER_SQUASH * s;

  for (let i = 0; i < SKIMMER_POLY.length; i++) {
    const p = SKIMMER_POLY[i];
    // Depth 1 IS the rim (GDD 3.2) — a definition, not a tunable. Every
    // silhouette offset is measured inward from it.
    screenPos(well, lane + p.l * half, 1 + p.d * reach, _skimPts[i]);
  }
  return _skimPts;
}

class Skimmer {
  // `lane` is the starting lane centre. CS006 owns where a run actually
  // begins and where a respawn lands; 0 is a legal lane on all sixteen wells
  // and nothing depends on it this changeset.
  constructor(well, lane) {
    this.lane = laneNormalize(well, lane || 0);

    // ⛔ Counts UP toward SNAP_IDLE_MS (GDD 16.3 — no countdown timers). Held
    // at the threshold once past it so a long idle cannot grow it without
    // bound. Any rotation input resets it to zero.
    this.idleTime = 0;

    // ⛔ Counts UP toward WALL_SQUASH_MS, and starts EXPIRED. Hitting a wall
    // resets it to zero, which is what starts the squash. Visual only.
    this.squashTime = C.WALL_SQUASH_MS / 1000;

    // True on a step where snap assist actually moved the craft. ⛔ It must be
    // false on every step where input.rotate !== 0 (GDD 4.1); that is the
    // invariant test-cs002-p2.js reads.
    this.snapping = false;

    this.dead = false;
  }

  // 0..1, peaking the instant a wall is hit and decaying to nothing over
  // WALL_SQUASH_MS. ⛔ Read by draw() only.
  squashAmount() {
    const dur = C.WALL_SQUASH_MS / 1000;
    if (!(dur > 0)) return 0;
    const a = 1 - this.squashTime / dur;
    return a > 0 ? a : 0;
  }

  // ⛔ `input.rotate` is a LANE DELTA for this step, not a velocity — the
  // input module has already scaled it by dt where that matters. Do not
  // multiply it by dt again here.
  update(dt, well, input) {
    // A well change (the debug cycler now, the Dive in CS004) can leave the
    // craft on a lane the new well does not have. Normalizing first means the
    // shape swap is never a special case anywhere else.
    this.lane = laneNormalize(well, this.lane);

    // ⛔ The squash AGES FIRST, before movement. dt is 16.7 ms against a 40 ms
    // squash, so advancing the clock after an impact would eat 42% of the
    // effect on the very step that triggered it and the peak would never be
    // seen. Aging first means the impact step renders at full squash.
    const squashFor = C.WALL_SQUASH_MS / 1000;
    if (this.squashTime < squashFor) this.squashTime += dt;

    const rotate = input.rotate;
    this.snapping = false;

    if (rotate !== 0) {
      // ⛔ Snap is never active while there is rotation input (GDD 4.1). The
      // idle clock restarts here, so it cannot fire on this step either.
      this.idleTime = 0;
      this.move(well, rotate);
    } else {
      const idleAt = C.SNAP_IDLE_MS / 1000;
      if (this.idleTime < idleAt) this.idleTime += dt;
      if (this.idleTime >= idleAt) this.snapping = this.snap(well, dt);
    }
  }

  // Apply a lane delta. Closed wells wrap; open wells clamp, and a clamp that
  // actually bit starts the squash.
  move(well, delta) {
    const raw = this.lane + delta;
    this.lane = laneNormalize(well, raw);
    // ⛔ Only an open well has walls. On a closed well laneNormalize changes
    // the number at every seam crossing and that is not an impact — treating
    // the seam as a wall is the mirror image of the GDD 3.5 bug.
    if (!well.closed && raw !== this.lane) this.squashTime = 0;
  }

  // Draw toward the nearest lane centre at SNAP_STRENGTH. Returns whether it
  // moved. GDD 4.1: this is what resolves "am I in that lane?".
  snap(well, dt) {
    // The integers ARE the lane centres (03-wells.js). laneNormalize turns
    // "16" on a 16-lane closed well back into lane 0; on an open well the
    // rounded value is already inside [0, lanes-1] because `lane` is.
    const target = laneNormalize(well, Math.round(this.lane));

    // ⛔ THE SEAM TRAP. laneDelta is the short way round; (target - this.lane)
    // is the long way round three times out of four near the seam.
    const d = laneDelta(well, this.lane, target);
    const dist = d < 0 ? -d : d;
    if (dist <= C.SNAP_EPSILON) return false;   // settled — stop, do not round

    // ⛔ The step is capped at the remaining distance. That is what keeps snap
    // from overshooting a lane centre into an oscillation, and — because
    // `target` is itself a legal lane — what keeps it from ever pulling the
    // craft past the clamp at either end of an open well. Landing exactly on
    // the centre is snap arriving, not the simulation quantizing `lane`.
    const step = C.SNAP_STRENGTH * dt;
    const moved = step >= dist ? d : (d < 0 ? -step : step);
    this.lane = laneNormalize(well, this.lane + moved);
    return true;
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2). No per-entity pipeline, no
  // sprite, no texture, nothing solid. The craft draws at full alpha even in
  // the dim band (GDD 3.7) — the band dims the WELL, and a player who cannot
  // see their own craft is the failure that rule is protecting against.
  draw(ctx, well) {
    drawPoly(ctx, skimmerPoints(well, this.lane, this.squashAmount()), true);
    glowStroke(ctx, C.SKIMMER_COLOR, C.LINE_W_RIM, 1);
  }
}

// ==========================================================================
// 06-shots.js
// ==========================================================================
// 06-shots.js — player shots (GDD 4.2, 10.2, 10.3).
//
// ⛔ Position is (lane, depth), nothing else. A shot's lane is captured at fire
// time from the NEAREST LANE CENTRE — Math.round(skimmer.lane) through
// laneNormalize, exactly as Skimmer.snap() picks its own target (05-skimmer.js)
// — and never changes afterwards. Shots are lane-locked; rotating the Skimmer
// after firing leaves them exactly where they were.
//
// ⛔ Entity contract (GDD 6.5): class, constructor / update(dt) / draw() / dead.
// Killed by setting dead = true; removed by an end-of-frame .filter(), never
// spliced mid-loop.
//
// depth runs rim (1) -> throat (0) over C.SHOT_TIME (GDD 3.2's convention). A
// shot's own clock counts UP in seconds of flight time (GDD 16.3), matching
// every other timer in the build; depth is derived from it, not stepped
// directly, so retuning SHOT_TIME never touches the update loop.
//
// There is nothing to collide with yet (no Thorns wired, no enemies) — this
// phase does not add a collision pass.

class Shot {
  constructor(well, lane) {
    this.lane = laneNormalize(well, lane);
    this.t = 0;
    this.dead = false;
  }

  // 1 at the rim, 0 at the throat. Never negative — a shot that has overrun
  // SHOT_TIME is retired the same step, before depth is ever read again.
  depth() {
    const d = 1 - this.t / C.SHOT_TIME;
    return d < 0 ? 0 : d;
  }

  update(dt) {
    this.t += dt;
    if (this.depth() <= 0) this.dead = true;
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2); the actual point math lives in
  // 14-render-entities.js alongside whatever other entities land there.
  draw(ctx, well) {
    drawShot(ctx, well, this.lane, this.depth());
  }
}

// Fires (subject to cooldown and the SHOT_MAX cap) and ages every shot in
// flight, then retires whatever reached the throat this step. Called once per
// simulation tick, from 23-main.js, directly below the Skimmer's own update —
// that ordering is what lets a shot fired this step capture the Skimmer's
// POST-MOVE lane, the same "nearest lane centre" Skimmer.snap() targets.
function updateShots(state, well, dt) {
  if (state.shotCooldown < C.SHOT_COOLDOWN) state.shotCooldown += dt;

  if (state.input.fire &&
      state.shotCooldown >= C.SHOT_COOLDOWN &&
      state.shots.length < C.SHOT_MAX) {
    const lane = laneNormalize(well, Math.round(state.skimmer.lane));
    state.shots.push(new Shot(well, lane));
    state.shotCooldown = 0;
  }

  for (let i = 0; i < state.shots.length; i++) state.shots[i].update(dt);
  // ⛔ end-of-frame filter; a shot is never spliced out mid-loop (GDD 6.5).
  state.shots = state.shots.filter(s => !s.dead);
}

// 13-render-well.js
// ==========================================================================
// 13-render-well.js — the well renderer (GDD 3.6, 3.7, 10.2). Consumes the
// depth model from 03-wells.js (rimPoint/throatPoint/screenPos/wellVertCount)
// and draws lanes + rim/throat rings. No game state read here beyond what a
// caller passes in — this module is pure `(ctx, well, level, laneState) -> pixels`.
//
// ⛔ Two primitives only: drawPoly (path builder, no fill) and glowStroke (two
// strokes composited with `lighter`, wide-and-dim then thin-and-bright). GDD
// 10.2: no per-entity pipelines, no fills, no sprites, no textures.
//
// Occupancy/shot/charge lighting (laneState) is wired through drawWell now so
// callers arriving later (shots, enemies, Surger) need no renderer change —
// it does nothing until a caller ever passes a lit lane, since none exists yet.

// Build a canvas 2D path from a point array. `closed` draws the final
// rim[n-1] -> rim[0] edge; open strips omit it (GDD 3.3's loop/strip split).
function drawPoly(ctx, points, closed) {
  if (!points.length) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  if (closed) ctx.closePath();
}

// Two-pass glow stroke on an already-built path: wide+dim, then thin+bright,
// composited with `lighter`. ⛔ Caller must have called ctx.beginPath()+path
// commands (e.g. via drawPoly) immediately before this, since it re-strokes
// the CURRENT path twice rather than taking a point array itself — that keeps
// the multi-segment lane case (draw once, stroke twice) cheap.
function glowStroke(ctx, color, width, alpha) {
  const a = alpha === undefined ? 1 : alpha;
  const prevOp = ctx.globalCompositeOperation;
  const prevAlpha = ctx.globalAlpha;
  const prevWidth = ctx.lineWidth;
  const prevStyle = ctx.strokeStyle;

  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = color;

  ctx.lineWidth = width * C.GLOW_WIDE_W;
  ctx.globalAlpha = C.GLOW_WIDE_ALPHA * a;
  ctx.stroke();

  ctx.lineWidth = width;
  ctx.globalAlpha = C.GLOW_THIN_ALPHA * a;
  ctx.stroke();

  ctx.globalCompositeOperation = prevOp;
  ctx.globalAlpha = prevAlpha;
  ctx.lineWidth = prevWidth;
  ctx.strokeStyle = prevStyle;
}

// Depth-varying line weight (GDD 10.1 — vector hardware couldn't do this).
// Linear in depth: thin at the throat, thick at the rim.
function laneLineWidth(depth) {
  const d = depth < 0 ? 0 : (depth > 1 ? 1 : depth);
  return C.LINE_W_THROAT + (C.LINE_W_RIM - C.LINE_W_THROAT) * d;
}

// GDD 3.6 band colour for a level. Past 99 the shape and heat hold and colour
// comes from the seeded RNG — `rng` is a 0..1 draw the caller supplies
// (mulberry32, per GDD 16.1); the RNG itself is never owned by this module.
function wellBandColor(level, rng) {
  if (level > 99) {
    const palette = C.BAND_RNG_COLORS;
    const r = rng === undefined ? 0 : rng;
    const i = Math.min(palette.length - 1, Math.floor(r * palette.length));
    return palette[i];
  }
  for (const band of C.BAND_COLORS) {
    if (level <= band.hi) return band.color;
  }
  return C.BAND_COLORS[C.BAND_COLORS.length - 1].color;
}

// GDD 3.7 — the dim band. Levels 65-80 render at DIM_BAND_ALPHA; everything
// else is fully opaque. ⚠ SETTLED — the band and its alpha are not tuning
// targets (GDD 3.7); do not adjust either from here.
function wellBaseAlpha(level) {
  return (level >= C.DIM_BAND_LO && level <= C.DIM_BAND_HI) ? C.DIM_BAND_ALPHA : 1.0;
}

// Project a normalized-space point array (well.rim or wellThroat(well)) into
// screen space via C.WELL_CX/CY/RADIUS — the same mapping screenPos uses, but
// applied to a whole polygon at once for the rim/throat rings, which sit at a
// single depth and so need no per-point perspective easing.
function projectPoly(points) {
  const out = new Array(points.length);
  for (let i = 0; i < points.length; i++) {
    out[i] = {
      x: C.WELL_CX + points[i].x * C.WELL_RADIUS,
      y: C.WELL_CY + points[i].y * C.WELL_RADIUS,
    };
  }
  return out;
}

// Draw one well: rim ring, throat ring, and every lane's rim->throat spoke.
//
//   well       from WELLS (03-wells.js)
//   level      game.level — drives band colour (GDD 3.6) and dim band (3.7)
//   laneState  optional per-lane lighting: array indexed by lane, each entry
//              `{ occupied, shotTravel, surgeCharge }` or falsy. Any truthy
//              flag lights that lane at LANE_LIT_ALPHA regardless of the dim
//              band — GDD 3.7's "lanes light on occupancy, shot travel, and
//              Surger charge" escape hatch. No caller supplies this yet.
//   rng        0..1 draw for the past-99 palette (wellBandColor); unused
//              otherwise.
function drawWell(ctx, well, level, laneState, rng) {
  const color = wellBandColor(level, rng);
  const baseAlpha = wellBaseAlpha(level);
  const rim = projectPoly(well.rim);
  const throat = projectPoly(wellThroat(well));
  const vcount = wellVertCount(well);

  // Rim and throat rings, each a single flat-weight stroke (they sit at one
  // depth apiece, so there is no line-weight gradient to apply within them).
  drawPoly(ctx, rim, well.closed);
  glowStroke(ctx, color, C.LINE_W_RIM, baseAlpha);

  drawPoly(ctx, throat, well.closed);
  glowStroke(ctx, color, C.LINE_W_THROAT, baseAlpha);

  // Spokes: rim vertex -> throat vertex at every vertex index, one spoke per
  // index. Each spoke bounds up to two lanes (the one ending here and the one
  // starting here — GDD 3.3's lane IS the edge between two consecutive rim
  // vertices, so a spoke is shared exactly where two lanes meet). A spoke
  // lights if EITHER neighbouring lane is lit; a closed well's spoke 0 wraps
  // to lane `lanes-1` on one side, and an open well's end spokes (0 and
  // vcount-1) have only one neighbouring lane.
  for (let i = 0; i < vcount; i++) {
    const laneEndingHere = well.closed ? (i - 1 + well.lanes) % well.lanes : i - 1;
    const laneStartingHere = well.closed ? (i % well.lanes) : i;
    const lit = laneState && (
      isLaneLit(laneState[laneEndingHere]) || isLaneLit(laneState[laneStartingHere])
    );
    const alpha = lit ? Math.max(baseAlpha, C.LANE_LIT_ALPHA) : baseAlpha;

    ctx.beginPath();
    ctx.moveTo(rim[i].x, rim[i].y);
    ctx.lineTo(throat[i].x, throat[i].y);
    glowStroke(ctx, color, laneLineWidth(0.5), alpha);
  }
}

// laneState is a sparse array; an out-of-range index (open-well end spokes)
// reads undefined, which this treats as unlit.
function isLaneLit(s) {
  return !!s && (s.occupied || s.shotTravel || s.surgeCharge);
}

// ==========================================================================
// 14-render-entities.js
// ==========================================================================
// 14-render-entities.js — entity draw code, kept apart from 06-shots.js so the
// glow/particle primitives here can move into kit-fx wholesale later (CLAUDE.md
// "Modules built here, destined for the kit"). CS002 P3 adds the shot streak;
// nothing else lives here yet.
//
// ⛔ drawPoly + glowStroke only (GDD 10.2). No fill, no sprite, no texture.
//
// ⛔ Readability contract (GDD 10.3): nothing opaque below C.READABILITY_DEPTH.
// A shot's leading edge fades linearly to nothing as it nears the throat,
// rather than snapping to invisible at the boundary or staying legible into
// the zone Tempest 4000 was criticised for cluttering.

// Preallocated projection scratch — one point per end of the streak. Like
// screenPos() and skimmerPoints(), this makes drawShot() non-reentrant; it is
// a leaf call, so that is fine.
const _shotHead = { x: 0, y: 0 };
const _shotTail = { x: 0, y: 0 };

// 1 at/above READABILITY_DEPTH; below it, fades linearly to 0 at the throat.
function shotAlpha(depth) {
  if (depth >= C.READABILITY_DEPTH) return 1;
  return depth <= 0 ? 0 : depth / C.READABILITY_DEPTH;
}

// A short streak from the shot's leading edge (toward the throat) back to its
// trailing edge (toward the rim), C.SHOT_LEN deep. The trailing edge is capped
// at depth 1 — a shot fired this instant must not draw a tail past the rim.
function drawShot(ctx, well, lane, depth) {
  const tail = depth + C.SHOT_LEN > 1 ? 1 : depth + C.SHOT_LEN;
  screenPos(well, lane, depth, _shotHead);
  screenPos(well, lane, tail, _shotTail);
  drawPoly(ctx, [_shotHead, _shotTail], false);
  glowStroke(ctx, C.SKIMMER_COLOR, laneLineWidth(depth), shotAlpha(depth));
}

// ==========================================================================
// 23-main.js
// ==========================================================================
// 23-main.js — the loop and the state machine (GDD 2, 16.1).
//
// ⛔ FIXED TIMESTEP. The simulation only ever sees C.FIXED_DT. A frame's
// wall-clock dt decides how many steps run and nothing else, so behaviour does
// not change with refresh rate and a recorded input list replays exactly
// (GDD 17.1). Three guards, and each one exists because the naive loop fails
// without it:
//
//   dt clamp (C.DT_CLAMP_MAX)      a tab-switch stall is not a physics event
//   step cap (C.MAX_CATCHUP_STEPS) one slow frame cannot queue thirty updates
//   debt discard                   past the cap the surplus is DROPPED, never
//                                  banked — banking it makes the next frames
//                                  run their cap too, and that is the spiral
//                                  of death. Time dilates instead, which is
//                                  the honest failure mode.
//
// ⛔ update(dt) and draw() are separate, and update NEVER touches the canvas.
// The whole simulation has to run headless — that is what the test suite
// drives, and a single ctx call inside update takes that away.
//
// ⛔ ONE input path (GDD 9.5). Every device event in the build enters through
// 04-input.js. This file is what hands that module its tunables out of C, and
// it is the only file allowed to know both sides.

const Game = (function () {

  let canvas = null;
  let ctx = null;

  let accumulator = 0;   // s of unspent wall-clock time
  let lastMs = 0;        // timestamp of the previous frame
  let running = false;
  let rafHandle = 0;

  // Hit-stop: simulation time is frozen, rendering is not (GDD 10). Nothing
  // triggers it in CS002 — the hook exists so the death sequence (CS006) has
  // one place to call, rather than growing a second freeze mechanism later.
  let hitStopLeft = 0;

  // ⛔ Counter-based, never wall-clock — frame-budget gates in the suite read
  // these (CLAUDE.md, Test rules).
  const stats = { frames: 0, ticks: 0, lastSteps: 0, accumulator: 0 };

  // ⛔ The kit boundary: 04-input.js reads no game global, so every tunable it
  // needs is handed over here, from C. Verbose on purpose — it is the one
  // thing that makes that module extractable (CLAUDE.md, Kit modules).
  const input = createInput({
    mouseSens:        C.MOUSE_SENS,
    keyTapMs:         C.KEY_TAP_MS,
    keySpeedMin:      C.KEY_SPEED_MIN,
    keySpeedMax:      C.KEY_SPEED_MAX,
    keyRamp:          C.KEY_RAMP,
    pointerLockOffer: C.POINTER_LOCK_OFFER,
    touchSens:        C.TOUCH_SENS,
    touchZoneFrac:    C.TOUCH_ZONE_FRAC,
    touchAutofire:    C.TOUCH_AUTOFIRE,
    touchButtonR:     C.TOUCH_BUTTON_R,
    gamepadDeadzone:  C.GAMEPAD_DEADZONE,
    gamepadSens:      C.GAMEPAD_SENS,
    inputMirror:      C.INPUT_MIRROR,
    worldW:           C.WORLD_W,
    worldH:           C.WORLD_H,
    actionKeys:       { cycleWell: ["w"] },
    onAction:         runAction,
  });

  // Named debug actions, delivered by the input module in simulation order.
  //
  // ⛔ Well-cycling used to be a keydown listener of its own inside
  // 13-render-well.js, standing up a preview before there was a loop. Two
  // input paths is exactly the failure GDD 9.5 exists to prevent, and it does
  // not announce itself — it shows up as an input that works everywhere except
  // one screen. The listener is gone; this is the only route in.
  function runAction(name) {
    if (name === "cycleWell") {
      state.wellIndex = (state.wellIndex + 1) % WELLS.length;
    }
  }

  function nowMs() {
    if (typeof performance !== "undefined" && performance && performance.now) return performance.now();
    return Date.now();
  }

  // ---- simulation ----------------------------------------------------------

  // ⛔ Never touches the canvas. Runs headless, always.
  function update(dt) {
    input.sample(dt, state.input);
    state.time += dt;

    const well = WELLS[state.wellIndex];
    // Lazily minted, in ONE place. reset() writes 02-state.js's shipped
    // defaults, which put `skimmer` back to null, and 02-state.js is
    // concatenated above 05-skimmer.js so newState() cannot mint one itself.
    // Doing it here means reset(), boot and a well change all take the same
    // path instead of three that have to agree. CS006 owns start and respawn.
    if (!state.skimmer) state.skimmer = new Skimmer(well);
    state.skimmer.update(dt, well, state.input);
    updateShots(state, well, dt);
    // CS003 hangs the enemies here.
  }

  // ---- presentation --------------------------------------------------------

  function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, C.WORLD_W, C.WORLD_H);
    const well = WELLS[state.wellIndex];
    drawWell(ctx, well, state.level, null, 0);
    // Z-order: the well is the backdrop, shots travel over it, and the
    // Skimmer — always at depth 1, the rim — rides on top of everything. The
    // guards are for a draw that lands before the first update — boot, and the
    // frozen branch of a hit-stop that began on frame one.
    for (let i = 0; i < state.shots.length; i++) state.shots[i].draw(ctx, well);
    if (state.skimmer) state.skimmer.draw(ctx, well);
  }

  // ---- the frame -----------------------------------------------------------

  function frame(tMs) {
    let dt = (tMs - lastMs) / 1000;
    lastMs = tMs;
    if (!(dt > 0)) dt = 0;                       // first frame, or a clock that went back
    if (dt > C.DT_CLAMP_MAX) dt = C.DT_CLAMP_MAX;
    accumulator += dt;

    let steps = 0;
    while (accumulator >= C.FIXED_DT && steps < C.MAX_CATCHUP_STEPS) {
      accumulator -= C.FIXED_DT;
      steps++;
      if (hitStopLeft > 0) {
        // Frozen: the step is SPENT, not simulated. Draining the accumulator
        // here is what makes hit-stop cost nothing when it ends — the
        // alternative banks the whole freeze and pays it back as a lurch.
        hitStopLeft -= C.FIXED_DT;
        if (hitStopLeft < 0) hitStopLeft = 0;
        // Devices are still drained so a freeze does not dump a second of
        // accumulated mouse motion into the first live step after it.
        input.sample(C.FIXED_DT, state.input);
        continue;
      }
      update(C.FIXED_DT);
      stats.ticks++;
    }

    // ⛔ Any debt past one step is dropped. Only reachable via the step cap;
    // after a normal frame the accumulator is already below FIXED_DT.
    if (accumulator > C.FIXED_DT) accumulator = 0;

    stats.frames++;
    stats.lastSteps = steps;
    stats.accumulator = accumulator;

    draw();
  }

  function rafFrame(tMs) {
    if (!running) return;
    frame(typeof tMs === "number" ? tMs : nowMs());
    rafHandle = requestAnimationFrame(rafFrame);
  }

  // ---- lifecycle -----------------------------------------------------------

  function init(env) {
    const e = env || {};
    const doc = e.document || (typeof document !== "undefined" ? document : null);
    const win = e.window || (typeof window !== "undefined" ? window : null);
    canvas = doc && doc.getElementById ? doc.getElementById("c") : null;
    ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
    input.attach({ window: win, document: doc, element: canvas });
    return api;
  }

  function start(tMs) {
    if (running) return;
    running = true;
    lastMs = typeof tMs === "number" ? tMs : nowMs();
    accumulator = 0;
    rafHandle = requestAnimationFrame(rafFrame);
  }

  function stop() {
    running = false;
    if (rafHandle && typeof cancelAnimationFrame === "function") cancelAnimationFrame(rafHandle);
    rafHandle = 0;
  }

  // Freeze simulation time for `seconds`. Longest request wins; a shorter one
  // never cuts a freeze already running.
  function hitStop(seconds) {
    if (!(seconds > 0)) return;
    if (seconds > hitStopLeft) hitStopLeft = seconds;
  }

  // Shipped defaults, from 02-state.js's one field list. Used by the suite to
  // start every case from the same place.
  function reset() {
    Object.assign(state, newState());
    input.reset();
    accumulator = 0;
    lastMs = 0;
    hitStopLeft = 0;
    stats.frames = 0; stats.ticks = 0; stats.lastSteps = 0; stats.accumulator = 0;
  }

  const api = {
    init, start, stop, reset,
    frame, update, draw, hitStop,
    input, stats,
    get hitStopLeft() { return hitStopLeft; },
    get running() { return running; },
  };
  return api;
})();

// Boot. Guarded so the headless suite, which evaluates this file's top level
// with stubbed globals, starts a loop that never gets a frame rather than
// throwing for lack of a real canvas.
if (typeof window !== "undefined" && typeof document !== "undefined") {
  Game.init();
  Game.start();
}
