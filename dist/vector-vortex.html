// ==========================================================================
// 01-rng.js
// ==========================================================================
// 01-rng.js — the seeded random source (GDD 16.1, 17.1).
//
// ⛔ ONE SOURCE OF RANDOMNESS, AND IT IS SEEDED. Nothing in src/ may call the
// platform's built-in generator — not the spawner, not a particle, not an audio
// variation. GDD 17.1's determinism guarantee (same seed + same recorded input
// -> identical state after 10,000 ticks) is only worth something if there is no
// second, unseeded stream anywhere in the build.
//
// ⚠ The suite scans the BUILT file for the platform generator's identifier, so
// that identifier is deliberately not written anywhere in src/ — not even
// inside a comment saying not to use it, which is exactly the false positive
// that would train a future session to weaken the scan.
//
// mulberry32 is the same 32-bit generator scratchpad/_seeded-random.js installs
// over the platform one for tests. It is small, fast, has a period of 2^32, and
// passes gjrand's smallcrush — far past what a tube shooter needs, and short
// enough that the whole stream is auditable.
//
// A STREAM IS STATE. Each call mutates the closed-over counter, so two systems
// sharing one stream interleave their draws: adding a draw to the spawner
// shifts every subsequent draw everywhere. That is fine and intended — the run
// has ONE stream (state.rng, created from state.seed) for the same reason it
// has one clock. If a system ever needs draws that must NOT move when another
// system changes, it takes its own stream from its own seed; it does not get a
// private call into the platform generator.

// The generator. `seed` is coerced to uint32, so any integer (or a Date.now())
// is a legal seed and the same number always produces the same stream.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// An integer in [0, n). The ONE route from a 0..1 draw to an index, so no call
// site re-derives it and gets the half-open interval wrong.
//
// The final guard cannot fire with mulberry32 — its largest output is
// (2^32-1)/2^32, so floor(r * n) is at most n-1 — but `rng` is a parameter and
// a future stream that can return exactly 1 would otherwise hand back n, which
// reads as an out-of-range array index a long way from here.
function rngInt(rng, n) {
  if (!(n > 0)) return 0;
  const i = Math.floor(rng() * n);
  return i >= n ? n - 1 : (i < 0 ? 0 : i);
}

// One element of `arr`, uniformly. Returns undefined for an empty array rather
// than drawing — a draw spent on an impossible pick would desynchronize the
// stream between a run that hit the empty case and one that did not.
function rngPick(rng, arr) {
  if (!arr || !arr.length) return undefined;
  return arr[rngInt(rng, arr.length)];
}

// ==========================================================================
// 02-state.js
// ==========================================================================
// 02-state.js — THE one mutable game object.
//
// ⛔ There is exactly one. Every system reads and writes this object; nothing
// keeps a private copy of a field that lives here. `state` is a plain data bag
// with no methods — behaviour lives in the module that owns the field.
//
// ⛔ A field lands here when the changeset that USES it lands, never before.
// A field added "because CS003 will want it" is a field CS003 cannot see the
// reasoning for, and it reads as shipped truth to a session that finds it.
// CS002 landed the first eight; CS003 P1 added `seed` and `rng`, P2 added
// `enemies`, `spawn` and `clearHold`, P3 added `purgeUses` and `purgeLatched`,
// and P4 adds `lives` and `invulnTime`.
//
// newState() is the shipped-default shape; `state` is one of it. The two exist
// separately so a reset writes defaults from one place instead of a second,
// drifting copy of the same field list (23-main.js's Game.reset()).

function newState() {
  return {
    // ⛔ THE RUN'S SEED AND ITS ONE STREAM (GDD 16.1, 17.1; 01-rng.js).
    // Both are shipped defaults here so the headless suite and a reset() always
    // have a stream to draw from. startGame() (CS003 P2) is what mints a real
    // seed for a run; it writes `seed` FIRST and rebuilds `rng` from it, and it
    // never regenerates `rng` from anything else — `seed` staying readable
    // afterwards is what makes a run replayable.
    //
    // ⛔ `rng` is a live closure over its own counter, not a value: copying
    // `state` copies the reference, so two "copies" of state share one stream.
    // Nothing copies state today; a save/replay feature would store `seed`.
    seed: C.RNG_DEFAULT_SEED,
    rng: mulberry32(C.RNG_DEFAULT_SEED),

    // Screen / state machine (GDD 2). CS002 has one screen and no menus; the
    // enum this becomes is CS007's to define, so the value is a plain string
    // rather than a constant nothing else reads yet.
    screen: "play",

    // Which of the sixteen wells (03-wells.js) is being drawn. ⛔ GDD 3.4's
    // shapeIndex = (level-1) mod WELLS.length mapping is owned by nextWell()
    // (23-main.js, CS003 P2); the debug cycle action is the only other writer,
    // and it goes through enterWell() like every other well entry.
    wellIndex: 0,

    // ⛔ THE ONE CLOCK (GDD 8, CLAUDE.md Config). All difficulty scaling derives
    // from level. No parallel clocks. Drives band colour today (GDD 3.6).
    level: 1,

    // ⛔ Counts UP, in seconds of SIMULATION time — not wall clock. It advances
    // only inside Game.update(), so hit-stop freezes it (GDD 16.3: count-up
    // timers only; no countdown pressure anywhere in the build).
    time: 0,

    // ⛔ The device-agnostic input struct (GDD 9.5). Exactly four fields, and
    // the simulation never learns which device produced them. 04-input.js's
    // sample() writes into THIS object every step; call sites read predicates
    // off it and never touch a raw key map.
    input: { rotate: 0, fire: false, purge: false, jump: false },

    // The player's craft (05-skimmer.js, CS002 P2). Null until P2 builds it.
    // ⛔ A DEAD ONE IS STILL HERE. killSkimmer() (09-collision.js) sets its
    // `dead` flag and freezes the loop; the craft stays on screen through the
    // freeze so the player can see what killed them, and respawnSkimmer()
    // (23-main.js) replaces it on the first live step afterwards.
    skimmer: null,

    // ⛔ GDD 4.4 — the reserve, spent by killSkimmer() and by nothing else.
    // Zero is the game-over stop (screen = "gameover"), not a screen; CS007
    // owns the UI, the submission and the restart flow. The extra-life awards
    // at C.EXTRA_LIFE_FIRST / _EVERY and the C.LIVES_MAX ceiling belong to
    // addScore() in CS007 and are deliberately unread this changeset.
    lives: C.START_LIVES,

    // ⛔ Counts UP toward RESPAWN_INVULN and HOLDS there (GDD 16.3 — no
    // countdown timers anywhere in the build), and STARTS AT THE THRESHOLD,
    // already expired, exactly as shotCooldown and the Skimmer's squashTime
    // do: a fresh run must not be born invulnerable. respawnSkimmer() is the
    // one place it is armed, by writing zero.
    //
    // ⛔ It lives on `state` and not on the Skimmer because it OUTLIVES the
    // craft it protects — the timer is armed at the moment a brand new craft
    // is minted, and a field on the old one would go with it.
    invulnTime: C.RESPAWN_INVULN,

    // Player shots in flight (06-shots.js, CS002 P3). ⛔ Entities are removed
    // by an end-of-frame .filter(), never spliced mid-loop (GDD 6.5).
    shots: [],

    // ⛔ Counts UP toward SHOT_COOLDOWN (GDD 16.3 — no countdown timers) and is
    // held at the threshold once past it. Starts AT the threshold — already
    // "expired" — so the first shot of a run does not wait out a cooldown that
    // never actually elapsed, the same reasoning 05-skimmer.js's squashTime
    // opens on.
    shotCooldown: C.SHOT_COOLDOWN,

    // ⛔ ONE ARRAY FOR EVERY ENEMY (07-enemies.js, CS003 P2). Thorns, Carriers
    // and Drifters all land here; the contract's flags decide behaviour, not a
    // second array. Removal is an end-of-frame .filter(), never a splice.
    enemies: [],

    // The spawner's two numbers (08-spawner.js). ⛔ `timer` counts UP toward
    // C.SPAWN_INTERVAL and HOLDS there when a spawn is blocked, so a slot that
    // frees is used immediately rather than after a fresh interval (GDD 16.3 —
    // no countdown anywhere in the build). `remaining` is a COUNT of enemies
    // the well still owes, not a clock, so it is spent downward. Both are
    // re-armed by enterWell(); nothing else writes them.
    spawn: { timer: 0, remaining: C.SPAWN_QUOTA },

    // GDD 4.3: one Purge charge per well, recharged on entry, never
    // accumulated. ⛔ A COUNT, not a flag: use 1 clears the well, use 2 kills
    // exactly one enemy, use 3+ does nothing, and CS007's PURGE_SAVED_BONUS
    // asks whether this is still 0. enterWell() is the ONLY thing that puts it
    // back to zero; 09-collision.js's updatePurge() is the only thing that
    // raises it. (CS003 P2 landed this as the boolean `purgeReady`, which
    // could not express the weak second use.)
    purgeUses: 0,

    // ⛔ "The purge button was held LAST step." state.input.purge is a LEVEL —
    // all four devices write a held boolean (GDD 9.5) — so the rising edge is
    // detected against this, and holding the button spends exactly one charge.
    // CS003 P4 forces it true on death; 09-collision.js explains why.
    purgeLatched: false,

    // ⚠ TEMPORARY (C.WELL_CLEAR_HOLD). Counts UP while the well is clear and
    // resets whenever it is not, so a kill that lands during the hold cannot
    // leave a half-spent pause behind. CS006's Dive replaces this field, the
    // constant, and the branch in Game.update() that reads it.
    clearHold: 0,
  };
}

// ---------------------------------------------------------------------------
// THE DEPTH MODEL (GDD 3.2, 3.5; RATIONALE.md#depth-model)
// ---------------------------------------------------------------------------
//
// ⛔ Every entity position is (lane, depth). Screen coordinates are derived
// HERE and only at render time. Nothing upstream of screenPos may hold an x/y.
//
//   lane   float in LANE-CENTRE units. lane === i is the CENTRE of lane i,
//          i.e. the midpoint of the rim edge rim[i] -> rim[i+1]. That is why
//          the Skimmer clamps to [0, lanes-1] on an open well (GDD 3.5) and
//          why snap assist rounds to an integer (GDD 4.1): the integers ARE
//          the lane centres. Do not re-read lane as a vertex index — vertex
//          param is lane + 0.5, and conflating the two is a half-lane offset
//          that looks almost right on a Ring and obviously wrong on a Box.
//   depth  float in [0,1]. 0 = throat, 1 = rim.
//
// A fractional lane walks the rim POLYGON, not the chord between adjacent lane
// centres. On a sharp corner (Box, Cross, Star) the chord cuts the corner and
// the Skimmer visibly leaves the rim; walking the polygon keeps it on the wire.
//
// The Twist (figure-eight) needs no special case anywhere in here: its throat
// is the same polygon scaled toward its own centroid, so its lanes cross
// correctly and no code notices (GDD 3.3).

// Rim vertex count for a well. Closed rims are loops (lanes verts); open rims
// are strips (lanes + 1 verts). Every index walk below goes through this.
function wellVertCount(well) {
  return well.closed ? well.lanes : well.lanes + 1;
}

// The throat polygon: the rim scaled toward its centroid by throatScale, plus
// the optional throatOffset from GDD 3.3 (absent on every shipped well; it
// defaults to zero, so a well that omits it is not a special case).
//
// ⛔ Memoized on the well object. This is called for every entity every frame
// once entities exist; recomputing a centroid per call is the per-frame
// allocation the §17 perf budget forbids. Cached under a non-enumerable key so
// the well data still serializes and diffs as pure data.
//
// ⛔ The cache assumes rim data is IMMUTABLE at runtime, which it is: a well is
// a static shape and a Thorn chips a lane's LENGTH (C.THORN_CHIP, a depth
// quantity), never a rim vertex. If a future phase ever mutates well.rim, it
// must delete well._throat and well._centroid in the same breath, or the
// throat silently keeps describing the old shape.
function wellThroat(well) {
  if (well._throat) return well._throat;

  const n = wellVertCount(well);
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += well.rim[i].x; cy += well.rim[i].y; }
  cx /= n; cy /= n;

  const s = well.throatScale;
  const ox = (well.throatOffset && well.throatOffset.x) || 0;
  const oy = (well.throatOffset && well.throatOffset.y) || 0;

  const throat = new Array(n);
  for (let i = 0; i < n; i++) {
    throat[i] = {
      x: cx + (well.rim[i].x - cx) * s + ox,
      y: cy + (well.rim[i].y - cy) * s + oy,
    };
  }
  Object.defineProperty(well, "_throat", { value: throat, enumerable: false });
  Object.defineProperty(well, "_centroid", { value: { x: cx, y: cy }, enumerable: false });
  return throat;
}

// The rim centroid, in normalized rim space. Derived with the throat, so this
// forces that derivation rather than duplicating the loop.
function wellCentroid(well) {
  wellThroat(well);
  return well._centroid;
}

// ---- Lane space -----------------------------------------------------------
//
// ⛔ GDD 3.5: open wells are NOT closed wells with a clamp. Lane space is a
// different topology per well, and every helper below dispatches on it:
//
//   closed  a circle of circumference `lanes`. lane === lanes is lane 0.
//   open    a segment [0, lanes-1]. The ends are WALLS, not seams.

// Wrap a lane into [0, lanes) on a closed well. Handles any magnitude and any
// sign — a negative modulus in JS is negative, hence the double-mod.
function laneWrap(well, lane) {
  const n = well.lanes;
  return ((lane % n) + n) % n;
}

// Clamp a lane into [0, lanes-1] on an open well (GDD 3.5, the Skimmer rule).
function laneClamp(well, lane) {
  const hi = well.lanes - 1;
  return lane < 0 ? 0 : (lane > hi ? hi : lane);
}

// The one route from a raw lane value to a legal one. Dispatches on topology
// so no caller has to remember which well it is holding.
function laneNormalize(well, lane) {
  return well.closed ? laneWrap(well, lane) : laneClamp(well, lane);
}

// Shortest signed lane distance from a to b — the wrap-aware `shortDelta`
// analogue RATIONALE.md#depth-model names. On a closed well this is the short
// way round and is in [-lanes/2, lanes/2]; on an open well there is only one
// way round, so it is the plain difference.
//
// Use this for "which way do I turn", never a bare (b - a): on a Ring, lane 15
// to lane 0 is +1, not -15.
function laneDelta(well, a, b) {
  if (!well.closed) return b - a;
  const n = well.lanes;
  let d = laneWrap(well, b - a);
  if (d > n / 2) d -= n;
  return d;
}

// ⛔ THE WALL HELPER (GDD 3.5, §17 test 3). A lane hop of `delta` from `lane`,
// returning BOTH the resulting lane and the direction the hopper is now
// travelling. Enemies do not exist yet; this is built now and correctly
// because retrofitting it is where the well's two clocks desynchronize.
//
// The returned `dir` is the whole point. An enemy that stores its own hop
// direction and only asks this helper for a POSITION keeps a stale direction
// after a bounce and grinds against the wall forever, one hop in and one hop
// back. The wall and the hopper's direction are ONE piece of state: an enemy
// must write back the `dir` it gets here.
//
//   closed  wraps. dir is unchanged — there is no wall to turn at.
//   open    mirror-folds into [0, lanes-1], reflecting as many times as the
//           hop needs. dir flips once per reflection, so an even number of
//           bounces restores the original heading. This is NOT a clamp: a
//           clamped hopper parks on the end lane, a reflected one turns
//           around and comes back, which is the behaviour GDD 3.5 specifies.
//
// `dir` is passed through rather than inferred from delta's sign so a caller
// hopping by 0 keeps its heading instead of silently resetting it.
function laneHop(well, lane, delta, dir) {
  const d = (dir === undefined) ? (delta < 0 ? -1 : 1) : dir;

  if (well.closed) {
    return { lane: laneWrap(well, lane + delta), dir: d };
  }

  const max = well.lanes - 1;
  if (max <= 0) return { lane: 0, dir: d };

  const period = 2 * max;
  let m = ((lane + delta) % period + period) % period;   // [0, 2*max)
  let flipped = false;
  if (m > max) { m = period - m; flipped = true; }        // fold the far half back
  return { lane: m, dir: flipped ? -d : d };
}

// Is this lane against a wall? Always false on a closed well — a closed well
// has no walls, only a seam, and treating the seam as a wall is the mirror of
// the GDD 3.5 bug.
function laneAtWall(well, lane) {
  if (well.closed) return false;
  return lane <= 0 || lane >= well.lanes - 1;
}

// ⛔ THE SPLIT HELPER (GDD 6.2, 3.5). Where a Carrier's two children go: one
// lane either side of the parent, as a pair of LEGAL, DISTINCT lanes.
//
// It lives here, beside laneHop, because the thing that makes it non-trivial
// is GDD 3.5 and nothing about cargo: `laneNormalize` CLAMPS on an open well,
// so the naive `[lane - 1, lane + 1]` puts BOTH children of a lane-0 Carrier
// in lanes 0 and 1 — two silhouettes stacked in one lane, on the six wells
// where the player has the least room to dodge, at the exact moment they are
// being asked to read a split. That is GDD 1.1 P2 failing, and it fails on the
// six open wells only, which is how it survives a closed-well playtest.
//
//   closed  lane ± 1, wrapped. There is no wall, so nothing else to do.
//   open    lane ± 1, then the PAIR is shifted inward — never squashed —
//           until both ends are inside [0, lanes-1]. The gap between the two
//           children is therefore always exactly two lanes, at the wall as
//           much as in the middle: a parent at lane 0 of the 13-lane Vee
//           yields children at lanes 0 and 2, so one child still occupies the
//           lane the parent died in and the trap stays honest at the wall.
//
// ⛔ Shifting, not clamping, is the whole point, and it is the same distinction
// laneHop draws between a mirror-fold and a clamp. A caller that "simplifies"
// this to laneNormalize(lane ± 1) reintroduces the stack.
//
// `lane` may be fractional — the debug bench spawns in the Skimmer's
// continuous lane — and the arithmetic below carries that through unchanged.
function splitLanes(well, lane) {
  if (well.closed) {
    return [laneWrap(well, lane - 1), laneWrap(well, lane + 1)];
  }

  const max = well.lanes - 1;
  let a = lane - 1;
  let b = lane + 1;

  if (a < 0) { b -= a; a = 0; }               // shift the pair up off the wall
  if (b > max) { a -= (b - max); b = max; }   // and down off the other one

  // Only reachable on a well with fewer than three lanes, which no shipped
  // well is. The pair collapses rather than reading off the end of the strip.
  if (a < 0) a = 0;
  return [a, b];
}

// ---- Projection -----------------------------------------------------------

// depth -> the eased fraction of the way from throat to rim (GDD 3.2).
// C.PERSPECTIVE_EXP is ~0.55: below 1, so depth spends most of its range near
// the throat and the last stretch to the rim is fast. Lower = more rush.
function perspective(depth) {
  return Math.pow(depth < 0 ? 0 : (depth > 1 ? 1 : depth), C.PERSPECTIVE_EXP);
}

// The inverse of perspective(): the depth whose eased position is `p`.
//
// ⛔ This is how an entity gets a drawn extent that behaves. screenPos lerps
// LINEARLY in perspective space, so a fixed step in `p` is a fixed step in
// SCREEN distance — which means a silhouette sized in depth units is the wrong
// size everywhere except where it was tuned. Size the silhouette in perspective
// space (where the eye lives), come back through here, and hand screenPos a
// depth. 14-render-entities.js's entityPoints() is the reader.
//
// Exact inverse on [0,1]: perspective(invPerspective(p)) === p to float
// precision. Clamped at both ends, so a shape reaching past the rim lands ON
// the rim rather than producing a depth > 1 that perspective() would clamp
// anyway — the clamp lives here so the depth handed onward is always legal.
function invPerspective(p) {
  const q = p < 0 ? 0 : (p > 1 ? 1 : p);
  return Math.pow(q, 1 / C.PERSPECTIVE_EXP);
}

// Walk a polygon in LANE units and write the result into `out`.
// Lane L sits at vertex parameter L + 0.5 — see the header note.
function polyAt(poly, well, lane, out) {
  const n = well.lanes;
  const t = lane + 0.5;
  let i = Math.floor(t);
  const f = t - i;

  if (well.closed) {
    i = ((i % n) + n) % n;
    const a = poly[i], b = poly[(i + 1) % n];
    out.x = a.x + (b.x - a.x) * f;
    out.y = a.y + (b.y - a.y) * f;
  } else {
    // A legal lane is in [0, lanes-1], so t is in [0.5, lanes-0.5] and both
    // indices are already in range. An ILLEGAL lane is clamped here rather
    // than indexed: an out-of-range lane must yield a finite edge point, never
    // a read past the end of the array. Callers should have normalized first
    // (laneNormalize), so this is a backstop, not the movement rule.
    const tc = t < 0.5 ? 0.5 : (t > n - 0.5 ? n - 0.5 : t);
    i = Math.floor(tc);
    const a = poly[i], b = poly[i + 1];
    const g = tc - i;
    out.x = a.x + (b.x - a.x) * g;
    out.y = a.y + (b.y - a.y) * g;
  }
  return out;
}

// The rim point for a lane, in normalized rim space.
function rimPoint(well, lane, out) {
  return polyAt(well.rim, well, lane, out || { x: 0, y: 0 });
}

// The throat point for a lane, in normalized rim space.
function throatPoint(well, lane, out) {
  return polyAt(wellThroat(well), well, lane, out || { x: 0, y: 0 });
}

// ⛔ screenPos(well, lane, depth) — THE projection. GDD 3.2:
//
//   screenPos = lerp( throatVertex(lane), rimVertex(lane), perspective(depth) )
//
// Normalized rim space ([-1,1] about the origin) is mapped onto the fixed
// 1280x720 world by C.WELL_CX / C.WELL_CY / C.WELL_RADIUS. ⛔ Game math never
// reads window size; the canvas is letterboxed by CSS.
//
// `out` is an optional scratch point. The render path passes one per call site
// so a full frame allocates nothing — §17's perf budget forbids per-frame
// allocation in the hot path.
//
// The two module-level scratch points below make this NON-REENTRANT: screenPos
// must not be called from inside a callback screenPos itself invoked. It never
// is — this is a leaf function — but do not give it one.
const _rimP = { x: 0, y: 0 };
const _thrP = { x: 0, y: 0 };
function screenPos(well, lane, depth, out) {
  const p = out || { x: 0, y: 0 };
  const t = perspective(depth);

  rimPoint(well, lane, _rimP);
  throatPoint(well, lane, _thrP);

  const nx = _thrP.x + (_rimP.x - _thrP.x) * t;
  const ny = _thrP.y + (_rimP.y - _thrP.y) * t;

  p.x = C.WELL_CX + nx * C.WELL_RADIUS;
  p.y = C.WELL_CY + ny * C.WELL_RADIUS;
  return p;
}

// ==========================================================================
// 04-input.js
// ==========================================================================
// 04-input.js — kit-input (draft). Four devices in, ONE struct out.
//
// ⛔ THIS MODULE READS NO GAME GLOBAL. Not the config object, not the mutable
// game object, not a game function — in either direction. Every tunable
// arrives through createInput()'s options and 23-main.js is what passes them
// in. That is CLAUDE.md's boundary contract ("Kit modules and extraction"),
// and it is the whole reason this file can later be copied into coinless-kit
// rather than rewritten. Backport packet: src/04-input.NOTES.md.
//
// ⛔ ONE struct (GDD 9.5):  { rotate, fire, purge, jump }
// The simulation never learns which device produced it, and call sites never
// read a raw key map. `rotate` is a LANE DELTA for this simulation step, not a
// velocity: mouse motion is inherently a delta, and turning it into a velocity
// means dividing by dt, which is how linearity (GDD 9.1) gets quietly lost.
//
// ⛔ NO ACCELERATION CURVE on the mouse (GDD 9.1). A spinner has none, and
// adding one is the single most common way to ruin this game's rim feel.
// The mouse path is one multiply, on purpose. Keep it that way.
//
// CS002 P4 adds touch and gamepad. Both go through the SAME sink and the SAME
// sample() as mouse/keyboard — one code path, not two that agree today:
//   - Touch rotation is a relative drag, accumulated into the same mouseDx-like
//     bucket mouse motion uses, just at a different sensitivity (TOUCH_SENS).
//   - The D-pad is wired as two synthetic key names ("gamepadleft" /
//     "gamepadright") fed through keyDown/keyUp, so it rides the exact
//     tap/hold state machine the keyboard uses. There is no second axis model.
//   - The left stick is genuinely different (a held analog position rather
//     than a digital press), so it gets its own accumulator, scaled by
//     GAMEPAD_SENS and gated by GAMEPAD_DEADZONE.
// The Gamepad API has no events for stick/axis motion — it must be polled —
// so `pollGamepads()` runs once at the top of every sample(), reading through
// whatever `win` attach() was given. That is still "one code path": polling
// only decides how gamepad state ENTERS the sink, same as a DOM listener does
// for mouse/keyboard.
//
// Device events arrive through the small sink API below (mouseMove / keyDown /
// keyUp / setButton). attach() is a thin DOM adapter over that sink and is the
// only place in the entire build that touches a DOM event. That split is what
// lets a headless test replay a recorded event list with no DOM at all, which
// is what makes the determinism guarantee (GDD 17.1) testable.

const INPUT_VERSION = "0.3.0";

// Default bindings, matched case-insensitively. These are NOT tunables — a
// keymap is this module's own default and a host replaces it wholesale through
// options.keys. Values are DOM `key` names, lowercased.
//
// "w" and "r" are deliberately unbound here: the game binds them as named debug
// actions (see options.actionKeys), and a key doing two jobs is a bug waiting
// for a player who rebinds.
const INPUT_KEYS_DEFAULT = {
  left:  ["arrowleft", "a"],
  right: ["arrowright", "d"],
  fire:  [" ", "z"],
  purge: ["shift", "x"],
  jump:  ["arrowup", "c"],
};

function inputNormKey(k) {
  return String(k).toLowerCase();
}

// Default gamepad button map, standard Gamepad layout indices. NOT a tunable
// for the same reason INPUT_KEYS_DEFAULT isn't — this is the module's own
// default and a host replaces it wholesale through options.gamepadButtons.
//   0 = A, 4/5 = Left/Right Bumper, 6/7 = Left/Right Trigger.
const GAMEPAD_BUTTONS_DEFAULT = {
  fire:  [0],
  jump:  [4, 6],
  purge: [5, 7],
};

// ⛔ Numeric tunables are REQUIRED, never defaulted. A default here would be a
// second tuning surface competing with the host's config object, and the point
// of the boundary is that there is exactly one. Failing loudly at wiring time
// beats a silent 0.02 that nobody can find later.
function inputRequireNum(opts, name) {
  const v = opts[name];
  if (typeof v !== "number" || !isFinite(v)) {
    throw new Error("createInput: options." + name + " must be a finite number");
  }
  return v;
}

// Same requirement, for the two touch tunables that are booleans rather than
// numbers (TOUCH_AUTOFIRE, INPUT_MIRROR). Same reasoning as inputRequireNum.
function inputRequireBool(opts, name) {
  const v = opts[name];
  if (typeof v !== "boolean") {
    throw new Error("createInput: options." + name + " must be a boolean");
  }
  return v;
}

// Turn { action: ["key", ...] } into both directions at once: a key -> action
// lookup for events, and an action -> keys list for "is anything held?".
function inputBuildBindings(src) {
  const byKey = new Map();
  const byAction = {};
  for (const action of Object.keys(src)) {
    const raw = src[action];
    const list = Array.isArray(raw) ? raw : [raw];
    const norm = [];
    for (let i = 0; i < list.length; i++) {
      const k = inputNormKey(list[i]);
      norm.push(k);
      byKey.set(k, action);
    }
    byAction[action] = norm;
  }
  return { byKey, byAction };
}

//   createInput({
//     mouseSens, keyTapMs, keySpeedMin, keySpeedMax, keyRamp,   // required
//     touchSens, touchZoneFrac, touchAutofire, touchButtonR,    // required
//     gamepadDeadzone, gamepadSens,                             // required
//     worldW, worldH,       // required — world-space size touch buttons live in
//     inputMirror,          // required — mirrors touch buttons for left-handed play
//     pointerLockOffer,                                          // optional, default on
//     keys,        // optional binding override, shape of INPUT_KEYS_DEFAULT
//     actionKeys,  // optional { actionName: ["key", ...] } for named actions
//     onAction,    // optional (name) => void, called during sample()
//   })
function createInput(options) {
  const opts = options || {};

  const mouseSens   = inputRequireNum(opts, "mouseSens");
  const keyTapS     = inputRequireNum(opts, "keyTapMs") / 1000;
  const keySpeedMin = inputRequireNum(opts, "keySpeedMin");
  const keySpeedMax = inputRequireNum(opts, "keySpeedMax");
  const keyRamp     = inputRequireNum(opts, "keyRamp");
  const pointerLockOffer = opts.pointerLockOffer !== false;
  const onAction = typeof opts.onAction === "function" ? opts.onAction : null;

  const touchSens      = inputRequireNum(opts, "touchSens");
  const touchZoneFrac  = inputRequireNum(opts, "touchZoneFrac");
  const touchButtonR   = inputRequireNum(opts, "touchButtonR");
  const touchAutofire  = inputRequireBool(opts, "touchAutofire");
  const gamepadDeadzone = inputRequireNum(opts, "gamepadDeadzone");
  const gamepadSens     = inputRequireNum(opts, "gamepadSens");
  const worldW = inputRequireNum(opts, "worldW");
  const worldH = inputRequireNum(opts, "worldH");
  const inputMirror = inputRequireBool(opts, "inputMirror");

  const bindings = inputBuildBindings(opts.keys || INPUT_KEYS_DEFAULT);
  const actions  = inputBuildBindings(opts.actionKeys || {});

  // The D-pad rides the SAME tap/hold state machine the keyboard uses (GDD
  // 9.4) — these are not a second axis model, just two more bound "keys" that
  // happen to be pressed by pollGamepads() instead of a keydown event.
  function bindSynthetic(key, action) {
    bindings.byKey.set(key, action);
    if (!bindings.byAction[action]) bindings.byAction[action] = [];
    bindings.byAction[action].push(key);
  }
  bindSynthetic("gamepadleft", "left");
  bindSynthetic("gamepadright", "right");

  // fire/purge/jump button map — host-overridable wholesale, same pattern as
  // `keys` above.
  const gamepadButtons = opts.gamepadButtons || GAMEPAD_BUTTONS_DEFAULT;

  const pressed = new Set();   // normalized key names currently down
  const buttons = new Set();   // non-key sources holding a button: "fire", ...
  const queued  = [];          // named actions triggered since the last sample

  // One record per rotation direction. `emitted` is how much of a lane this
  // press has already delivered, which is what makes the tap exact.
  const axis = {
    left:  { down: false, held: 0, emitted: 0, tap: false },
    right: { down: false, held: 0, emitted: 0, tap: false },
  };

  let mouseDx = 0;         // px accumulated since the last sample
  let impulse = 0;         // signed lane units owed by taps completed since then
  let lastClientX = null;  // fallback when a mousemove carries no relative delta

  // Touch: a relative drag, exactly like mouse but at TOUCH_SENS (GDD 9.3).
  // Not a virtual stick — there is no rest position, only Δx since last move.
  const touches = new Map();   // touch id -> { kind: "drag"|"purge"|"jump", x }
  let touchDx = 0;              // world-space px accumulated since the last sample
  let touchDragCount = 0;       // active drag touches; > 0 drives TOUCH_AUTOFIRE

  // Gamepad: the stick is a held analog position, not a discrete press, so it
  // gets its own accumulator rather than routing through `axis` (GDD 9.4).
  let gamepadWin = null;         // set by attach(); polled once per sample()
  let gamepadAxisX = 0;
  let gpDpadLeftDown = false, gpDpadRightDown = false;
  // Tracked separately from `buttons` (mouse/touch) — a polled level-state
  // source must not blindly clear a name another device is still holding.
  const gamepadHeld = { fire: false, purge: false, jump: false };

  const out = { rotate: 0, fire: false, purge: false, jump: false };

  const detachers = [];

  // ---- the sink: every device path ends up calling these --------------------

  // Returns whether the key is bound at all, so a DOM adapter knows whether to
  // swallow the browser's default (space scrolling the page, say).
  function keyDown(rawKey) {
    const k = inputNormKey(rawKey);
    const bound = bindings.byKey.has(k) || actions.byKey.has(k);
    // Held keys repeat. A repeat is not a new press — treating it as one would
    // restart the ramp sixty times a second and re-arm the tap forever.
    if (pressed.has(k)) return bound;
    pressed.add(k);

    const dir = axis[bindings.byKey.get(k)];
    if (dir) { dir.down = true; dir.held = 0; dir.emitted = 0; dir.tap = true; }

    const named = actions.byKey.get(k);
    if (named !== undefined) queued.push(named);

    return bound;
  }

  function keyUp(rawKey) {
    const k = inputNormKey(rawKey);
    const bound = bindings.byKey.has(k) || actions.byKey.has(k);
    if (!pressed.delete(k)) return bound;
    const name = bindings.byKey.get(k);
    // Another key bound to the same direction may still be down (arrow + WASD).
    if (axis[name] && !anyKeyHeld(name)) releaseAxis(name);
    return bound;
  }

  function mouseMove(dx) {
    if (typeof dx === "number" && isFinite(dx)) mouseDx += dx;
  }

  // A button held by something that is not a key: a mouse button now, a touch
  // button in P4. Same four action names, same struct.
  function setButton(name, down) {
    if (down) buttons.add(name); else buttons.delete(name);
  }

  // Purge (top-right) and Jump (bottom-right), radius touchButtonR, mirrored
  // to the left side when inputMirror is set (GDD 9.3).
  function touchButtonCenters() {
    const m = touchButtonR * 1.5;
    if (inputMirror) return { purge: { x: m, y: m }, jump: { x: m, y: worldH - m } };
    return { purge: { x: worldW - m, y: m }, jump: { x: worldW - m, y: worldH - m } };
  }

  function inCircle(x, y, c, r) {
    const dx = x - c.x, dy = y - c.y;
    return dx * dx + dy * dy <= r * r;
  }

  // touchStart/touchMove/touchEnd take WORLD-SPACE coordinates (the same
  // 1280x720-ish space every other entity lives in) — the DOM adapter below
  // is what converts a real touch event's client pixels into that space, so
  // this trio stays exercisable with no DOM at all, same as the rest of the
  // sink.
  function touchStart(id, x, y) {
    const c = touchButtonCenters();
    if (inCircle(x, y, c.purge, touchButtonR)) { touches.set(id, { kind: "purge" }); buttons.add("purge"); return; }
    if (inCircle(x, y, c.jump,  touchButtonR)) { touches.set(id, { kind: "jump" });  buttons.add("jump");  return; }
    if (y >= worldH * (1 - touchZoneFrac)) {
      touches.set(id, { kind: "drag", x: x });
      touchDragCount++;
    }
  }

  function touchMove(id, x, y) {
    const t = touches.get(id);
    if (!t || t.kind !== "drag") return;
    touchDx += x - t.x;
    t.x = x;
  }

  function touchEnd(id) {
    const t = touches.get(id);
    if (!t) return;
    touches.delete(id);
    if (t.kind === "purge") buttons.delete("purge");
    else if (t.kind === "jump") buttons.delete("jump");
    else touchDragCount--;
  }

  // Polled once per sample() (the Gamepad API has no motion events — a stick
  // held over at rest produces nothing to listen for). `win` is whatever
  // attach() was given; a headless test can call this directly with a plain
  // `{ navigator: { getGamepads: () => [...] } }` object.
  function pollGamepads(win) {
    if (!win || !win.navigator || typeof win.navigator.getGamepads !== "function") return;
    let pads;
    try { pads = win.navigator.getGamepads(); } catch (err) { return; }
    const gp = pads && pads[0];
    if (!gp) {
      gamepadAxisX = 0;
      if (gpDpadLeftDown)  { keyUp("gamepadleft");  gpDpadLeftDown = false; }
      if (gpDpadRightDown) { keyUp("gamepadright"); gpDpadRightDown = false; }
      gamepadHeld.fire = false; gamepadHeld.purge = false; gamepadHeld.jump = false;
      return;
    }
    const ax = gp.axes && typeof gp.axes[0] === "number" && isFinite(gp.axes[0]) ? gp.axes[0] : 0;
    gamepadAxisX = ax;

    // ⛔ The D-pad reaches `left`/`right` through keyDown/keyUp — the SAME
    // tap/hold implementation the keyboard uses. This is edge detection only;
    // the state machine that turns a press into a lane delta lives in exactly
    // one place (advanceAxis/releaseAxis above).
    const left  = !!(gp.buttons && gp.buttons[14] && gp.buttons[14].pressed);
    const right = !!(gp.buttons && gp.buttons[15] && gp.buttons[15].pressed);
    if (left !== gpDpadLeftDown)   { if (left) keyDown("gamepadleft"); else keyUp("gamepadleft"); gpDpadLeftDown = left; }
    if (right !== gpDpadRightDown) { if (right) keyDown("gamepadright"); else keyUp("gamepadright"); gpDpadRightDown = right; }

    // fire/purge/jump — level state, recomputed every poll. Any bound button
    // held is enough; this is OR across a button LIST, not an edge.
    for (const name of Object.keys(gamepadHeld)) {
      const list = gamepadButtons[name] || [];
      let held = false;
      for (let i = 0; i < list.length; i++) {
        const b = gp.buttons && gp.buttons[list[i]];
        if (b && b.pressed) { held = true; break; }
      }
      gamepadHeld[name] = held;
    }
  }

  // Proportional past the deadzone, scaled by gamepadSens (GDD 9.4). Returns
  // a lane delta for this step, same units as the mouse/touch/tap paths.
  function gamepadAxisDelta(x, dt) {
    if (x <= -gamepadDeadzone || x >= gamepadDeadzone) return x * gamepadSens * dt;
    return 0;
  }

  function anyKeyHeld(name) {
    const list = bindings.byAction[name];
    if (!list) return false;
    for (let i = 0; i < list.length; i++) if (pressed.has(list[i])) return true;
    return false;
  }

  function actionHeld(name) {
    return anyKeyHeld(name) || buttons.has(name) || gamepadHeld[name] === true;
  }

  // GDD 9.2 — a tap is EXACTLY one lane, in total. The ramp below has already
  // delivered part of that lane during the press, so release pays the balance.
  // ⛔ That means the constants must satisfy: the ramp integrated over
  // keyTapMs is at most one lane. At the shipped values it is ~0.76, so the
  // balance is positive; the clamp is there so a future retune that breaks the
  // relation degrades to "no extra nudge" rather than to a backwards jump.
  function releaseAxis(name) {
    const dir = axis[name];
    if (!dir.down) return;
    dir.down = false;
    if (dir.tap) {
      const rest = 1 - dir.emitted;
      if (rest > 0) impulse += (name === "left" ? -rest : rest);
    }
    dir.held = 0; dir.emitted = 0; dir.tap = false;
  }

  // Hold: accelerate keySpeedMin -> keySpeedMax over keyRamp (GDD 9.2). Ramping
  // from the first step rather than after the tap window is deliberate — a
  // 130 ms dead spot at the start of every hold is exactly the latency P1 says
  // must not exist.
  function advanceAxis(dir, dt) {
    if (!dir.down) return 0;
    dir.held += dt;
    if (dir.held >= keyTapS) dir.tap = false;
    const f = keyRamp > 0 ? Math.min(1, dir.held / keyRamp) : 1;
    const step = (keySpeedMin + (keySpeedMax - keySpeedMin) * f) * dt;
    dir.emitted += step;
    return step;
  }

  // ---- the one output ------------------------------------------------------

  // sample(dt, target) — writes the struct into `target` when given (the game
  // passes its own object so the mutable game object owns it) and returns it.
  // Allocates nothing.
  function sample(dt, target) {
    const s = target || out;

    pollGamepads(gamepadWin);

    let rotate = mouseDx * mouseSens;   // ⛔ linear. One multiply. No curve.
    mouseDx = 0;
    rotate += touchDx * touchSens;      // same model, different sensitivity
    touchDx = 0;

    rotate -= advanceAxis(axis.left, dt);
    rotate += advanceAxis(axis.right, dt);
    rotate += impulse;
    impulse = 0;

    rotate += gamepadAxisDelta(gamepadAxisX, dt);

    s.rotate = rotate;
    s.fire   = actionHeld("fire") || (touchAutofire && touchDragCount > 0);
    s.purge  = actionHeld("purge");
    s.jump   = actionHeld("jump");

    // Named actions are dispatched HERE, in simulation order, not at DOM-event
    // time. A recorded event list therefore replays identically (GDD 17.1),
    // and a debug action cannot land halfway through a frame.
    if (queued.length) {
      if (onAction) for (let i = 0; i < queued.length; i++) onAction(queued[i]);
      queued.length = 0;
    }
    return s;
  }

  function reset() {
    pressed.clear();
    buttons.clear();
    queued.length = 0;
    for (const name of Object.keys(axis)) {
      const dir = axis[name];
      dir.down = false; dir.held = 0; dir.emitted = 0; dir.tap = false;
    }
    mouseDx = 0;
    impulse = 0;
    lastClientX = null;
    touches.clear();
    touchDx = 0;
    touchDragCount = 0;
    gamepadAxisX = 0;
    gpDpadLeftDown = false;
    gpDpadRightDown = false;
    gamepadHeld.fire = false; gamepadHeld.purge = false; gamepadHeld.jump = false;
    out.rotate = 0; out.fire = false; out.purge = false; out.jump = false;
  }

  // ---- DOM adapter ---------------------------------------------------------
  // ⛔ The only DOM-event code in the build. Everything above is reachable
  // without a document, which is what the headless suite drives.

  // Relative motion. Under Pointer Lock a mousemove carries a relative delta
  // directly; unlocked it may not, so fall back to differencing absolute
  // positions. Both are the same quantity — pixels since the last event.
  function relativeX(ev) {
    if (typeof ev.movementX === "number") { lastClientX = null; return ev.movementX; }
    const x = ev.clientX;
    if (typeof x !== "number") return 0;
    const d = lastClientX === null ? 0 : x - lastClientX;
    lastClientX = x;
    return d;
  }

  // GDD 9.1 — Pointer Lock is OFFERED on click and NEVER forced. Refusal, exit
  // by Escape, and a browser that has none are all normal: unlocked relative
  // motion still works, it just stops at the window edge.
  function offerLock(el, doc) {
    if (!pointerLockOffer) return;
    if (!el || typeof el.requestPointerLock !== "function") return;
    if (doc && doc.pointerLockElement === el) return;
    try {
      const p = el.requestPointerLock();
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (err) { /* denied — the game plays unlocked */ }
  }

  function on(target, type, fn) {
    if (!target || typeof target.addEventListener !== "function") return;
    target.addEventListener(type, fn, false);
    detachers.push(function () { target.removeEventListener(type, fn, false); });
  }

  // attach({ window, document, element }) — element is what mouse events and
  // Pointer Lock bind to (the canvas). Safe to call with any of them missing.
  // Converts a Touch's client-space pixels into the world-space coordinates
  // touchStart/touchMove expect, accounting for CSS letterboxing (the canvas
  // is fixed WORLD_W x WORLD_H internally but can be scaled on screen).
  function touchWorldPoint(el, t) {
    const rect = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    if (!rect || !rect.width || !rect.height) return { x: t.clientX, y: t.clientY };
    return {
      x: (t.clientX - rect.left) / rect.width * worldW,
      y: (t.clientY - rect.top) / rect.height * worldH,
    };
  }

  function attach(env) {
    detach();
    const e = env || {};
    const doc = e.document || null;
    const win = e.window || null;
    const el  = e.element || doc;
    gamepadWin = win;

    on(doc, "keydown", function (ev) {
      if (keyDown(ev.key) && typeof ev.preventDefault === "function") ev.preventDefault();
    });
    on(doc, "keyup", function (ev) {
      if (keyUp(ev.key) && typeof ev.preventDefault === "function") ev.preventDefault();
    });

    on(el, "mousemove", function (ev) { mouseMove(relativeX(ev)); });
    on(el, "mousedown", function (ev) {
      if (ev.button === 2) setButton("purge", true);
      else { setButton("fire", true); offerLock(el, doc); }
    });
    on(el, "contextmenu", function (ev) {
      if (typeof ev.preventDefault === "function") ev.preventDefault();
    });
    // Release on the window: a button let go outside the canvas must not stick.
    on(win || doc, "mouseup", function (ev) {
      if (ev.button === 2) setButton("purge", false); else setButton("fire", false);
    });

    // Losing focus mid-press otherwise leaves the rim spinning forever.
    on(win || doc, "blur", function () { reset(); });

    on(el, "touchstart", function (ev) {
      const list = ev.changedTouches || [];
      for (let i = 0; i < list.length; i++) {
        const p = touchWorldPoint(el, list[i]);
        touchStart(list[i].identifier, p.x, p.y);
      }
      if (typeof ev.preventDefault === "function") ev.preventDefault();
    });
    on(el, "touchmove", function (ev) {
      const list = ev.changedTouches || [];
      for (let i = 0; i < list.length; i++) {
        const p = touchWorldPoint(el, list[i]);
        touchMove(list[i].identifier, p.x, p.y);
      }
      if (typeof ev.preventDefault === "function") ev.preventDefault();
    });
    function touchEndHandler(ev) {
      const list = ev.changedTouches || [];
      for (let i = 0; i < list.length; i++) touchEnd(list[i].identifier);
    }
    on(el, "touchend", touchEndHandler);
    on(el, "touchcancel", touchEndHandler);

    return detachers.length > 0;
  }

  function detach() {
    while (detachers.length) detachers.pop()();
    lastClientX = null;
    gamepadWin = null;
  }

  return {
    VERSION: INPUT_VERSION,
    sample, reset,
    keyDown, keyUp, mouseMove, setButton,
    touchStart, touchMove, touchEnd, pollGamepads,
    attach, detach,
    isBound: function (k) {
      const n = inputNormKey(k);
      return bindings.byKey.has(n) || actions.byKey.has(n);
    },
  };
}

// ==========================================================================
// 05-skimmer.js
// ==========================================================================
// 05-skimmer.js — the Skimmer, the player's craft (GDD 4.1, 3.5, 10.2).
//
// ⛔ `lane` is a CONTINUOUS FLOAT and the simulation never quantizes it. Snap
// assist PULLS it toward a lane centre; it does not round it. The one place a
// lane becomes an integer is fire time (CS002 P3), which picks the nearest
// lane centre for the shot and leaves the Skimmer where it is.
//
// ⛔ Position is (lane, depth) and nothing else. The Skimmer's depth is 1 — it
// rides the rim — and its screen position is derived at draw time through
// screenPos(). No x/y is ever stored on this object.
//
// ⛔ Every lane arithmetic goes through 03-wells.js: laneNormalize() to land a
// move, laneDelta() to ask which way to turn. Two lane floats are NEVER
// subtracted by hand in here. On a 16-lane closed well the distance from 15.7
// to 0 is +0.3, not -15.7, and the naive subtraction is exactly what sends
// snap assist the long way round the well.
//
// ⛔ GDD 3.5 — an open well is not a closed well with a clamp. Closed wells
// wrap at the seam; open wells CLAMP at two walls, and hitting one triggers a
// WALL_SQUASH_MS squash that is ⛔ VISUAL ONLY and never writes `lane`.
//
// ⛔ Entity contract (GDD 6.5): class, update, draw, dead. `dead` is set by
// killSkimmer() (09-collision.js) and by nothing else — that is the ONE death
// route, and CS003 P4 built the sequence hanging off it: a life spent, a
// C.HIT_STOP_DEATH freeze, and a respawn on the first live step afterwards
// (respawnSkimmer, 23-main.js). ⛔ A dead craft is NOT removed the way a shot
// or an enemy is: it stays in state.skimmer through the freeze, because the
// freeze exists so the player can see what killed them. update/draw take their
// well and input explicitly rather than reaching for the game object, the same
// shape 13-render-well.js uses; C is the only global this module reads.

// The silhouette, in LOCAL SPACE, per GDD 10.2 ("new entities define
// local-space point arrays and reuse drawPoly/glowStroke"). This is shape
// DATA, the same class of thing as WELLS' rim polygons — not a tuning surface.
// The scale IS a tunable and lives in C.SKIMMER_WIDTH.
//
//   l  lane offset in HALF-WIDTH units, so l = ±1 is ±SKIMMER_WIDTH/2 lanes
//      and the craft spans exactly SKIMMER_WIDTH lane widths at its prongs.
//   d  depth offset from the rim. ⛔ Never positive: depth is capped at 1 by
//      perspective(), so a point outside the rim would silently collapse onto
//      it and the shape would lose a vertex on every well.
//
// A swept arrowhead: two prongs sitting on the rim, a shallow notched trailing
// edge between them, and a nose reaching down the well. Deliberately not a
// claw — GDD 18, the silhouette is one of the things that has to be ours.
const SKIMMER_POLY = [
  { l: -1.00, d:  0.00 },   // left prong, on the rim
  { l: -0.42, d: -0.13 },   // left shoulder
  { l:  0.00, d: -0.04 },   // the notch, just inside the rim
  { l:  0.42, d: -0.13 },   // right shoulder
  { l:  1.00, d:  0.00 },   // right prong, on the rim
  { l:  0.00, d: -0.30 },   // the nose, deepest into the well
];

// Preallocated projection scratch — one screen point per silhouette vertex.
// ⛔ No per-frame allocation in the hot path (GDD 17, performance budget), and
// like screenPos() this makes skimmerPoints() NON-REENTRANT. It is a leaf
// call; do not give it a callback.
const _skimPts = SKIMMER_POLY.map(function () { return { x: 0, y: 0 }; });

// Project the silhouette into screen space for a given lane and squash.
//
//   squash  0..1, the VISUAL wall-squash amount. It compresses the craft
//           along the rim and stretches it down the well by the same factor —
//           it is applied HERE, at projection time, and never anywhere near
//           `lane`. GDD 3.5's "40 ms visual squash".
//
// Returns the shared scratch array. Copy out of it if you need to keep it.
function skimmerPoints(well, lane, squash) {
  const s = squash > 0 ? (squash > 1 ? 1 : squash) : 0;
  const half = C.SKIMMER_WIDTH / 2 * (1 - C.SKIMMER_SQUASH * s);
  const reach = 1 + C.SKIMMER_SQUASH * s;

  for (let i = 0; i < SKIMMER_POLY.length; i++) {
    const p = SKIMMER_POLY[i];
    // Depth 1 IS the rim (GDD 3.2) — a definition, not a tunable. Every
    // silhouette offset is measured inward from it.
    screenPos(well, lane + p.l * half, 1 + p.d * reach, _skimPts[i]);
  }
  return _skimPts;
}

// Is the craft drawn on this frame? ⛔ VISUAL ONLY, and read by draw code
// alone — the invulnerability itself is state.invulnTime against
// C.RESPAWN_INVULN (02-state.js), and nothing here decides whether the player
// can die. GDD 1.1 P2: the blink is how a player is told the window is still
// open, so it must stop the instant the window closes and not a cycle later.
//
// ⛔ Takes the TIMER, not `state`. The timer lives on the game object because
// it outlives the craft it protects, and this module reads no game global — a
// number crossing the boundary is what keeps that true (CLAUDE.md, kit-fx).
//
// A square wave at C.INVULN_BLINK_HZ full cycles per second, ON for the first
// half of each cycle, so the respawn step itself draws rather than starting on
// an invisible frame.
function skimmerBlinkVisible(invulnTime) {
  if (!(invulnTime < C.RESPAWN_INVULN)) return true;   // not invulnerable: solid
  return Math.floor(invulnTime * C.INVULN_BLINK_HZ * 2) % 2 === 0;
}

class Skimmer {
  // `lane` is the starting lane centre. enterWell() mints at 0 — a legal lane
  // on all sixteen wells — and a respawn mints at the lane the previous craft
  // died in (GDD 4.4). Both go through spawnSkimmer() (23-main.js); ⛔ nothing
  // else in the build calls this constructor, so a field added to a fresh
  // craft is added in exactly one place.
  constructor(well, lane) {
    this.lane = laneNormalize(well, lane || 0);

    // ⛔ Counts UP toward SNAP_IDLE_MS (GDD 16.3 — no countdown timers). Held
    // at the threshold once past it so a long idle cannot grow it without
    // bound. Any rotation input resets it to zero.
    this.idleTime = 0;

    // ⛔ Counts UP toward WALL_SQUASH_MS, and starts EXPIRED. Hitting a wall
    // resets it to zero, which is what starts the squash. Visual only.
    this.squashTime = C.WALL_SQUASH_MS / 1000;

    // True on a step where snap assist actually moved the craft. ⛔ It must be
    // false on every step where input.rotate !== 0 (GDD 4.1); that is the
    // invariant test-cs002-p2.js reads.
    this.snapping = false;

    this.dead = false;
  }

  // 0..1, peaking the instant a wall is hit and decaying to nothing over
  // WALL_SQUASH_MS. ⛔ Read by draw() only.
  squashAmount() {
    const dur = C.WALL_SQUASH_MS / 1000;
    if (!(dur > 0)) return 0;
    const a = 1 - this.squashTime / dur;
    return a > 0 ? a : 0;
  }

  // ⛔ `input.rotate` is a LANE DELTA for this step, not a velocity — the
  // input module has already scaled it by dt where that matters. Do not
  // multiply it by dt again here.
  update(dt, well, input) {
    // A well change (the debug cycler now, the Dive in CS004) can leave the
    // craft on a lane the new well does not have. Normalizing first means the
    // shape swap is never a special case anywhere else.
    this.lane = laneNormalize(well, this.lane);

    // ⛔ The squash AGES FIRST, before movement. dt is 16.7 ms against a 40 ms
    // squash, so advancing the clock after an impact would eat 42% of the
    // effect on the very step that triggered it and the peak would never be
    // seen. Aging first means the impact step renders at full squash.
    const squashFor = C.WALL_SQUASH_MS / 1000;
    if (this.squashTime < squashFor) this.squashTime += dt;

    const rotate = input.rotate;
    this.snapping = false;

    if (rotate !== 0) {
      // ⛔ Snap is never active while there is rotation input (GDD 4.1). The
      // idle clock restarts here, so it cannot fire on this step either.
      this.idleTime = 0;
      this.move(well, rotate);
    } else {
      const idleAt = C.SNAP_IDLE_MS / 1000;
      if (this.idleTime < idleAt) this.idleTime += dt;
      if (this.idleTime >= idleAt) this.snapping = this.snap(well, dt);
    }
  }

  // Apply a lane delta. Closed wells wrap; open wells clamp, and a clamp that
  // actually bit starts the squash.
  move(well, delta) {
    const raw = this.lane + delta;
    this.lane = laneNormalize(well, raw);
    // ⛔ Only an open well has walls. On a closed well laneNormalize changes
    // the number at every seam crossing and that is not an impact — treating
    // the seam as a wall is the mirror image of the GDD 3.5 bug.
    if (!well.closed && raw !== this.lane) this.squashTime = 0;
  }

  // Draw toward the nearest lane centre at SNAP_STRENGTH. Returns whether it
  // moved. GDD 4.1: this is what resolves "am I in that lane?".
  snap(well, dt) {
    // The integers ARE the lane centres (03-wells.js). laneNormalize turns
    // "16" on a 16-lane closed well back into lane 0; on an open well the
    // rounded value is already inside [0, lanes-1] because `lane` is.
    const target = laneNormalize(well, Math.round(this.lane));

    // ⛔ THE SEAM TRAP. laneDelta is the short way round; (target - this.lane)
    // is the long way round three times out of four near the seam.
    const d = laneDelta(well, this.lane, target);
    const dist = d < 0 ? -d : d;
    if (dist <= C.SNAP_EPSILON) return false;   // settled — stop, do not round

    // ⛔ The step is capped at the remaining distance. That is what keeps snap
    // from overshooting a lane centre into an oscillation, and — because
    // `target` is itself a legal lane — what keeps it from ever pulling the
    // craft past the clamp at either end of an open well. Landing exactly on
    // the centre is snap arriving, not the simulation quantizing `lane`.
    const step = C.SNAP_STRENGTH * dt;
    const moved = step >= dist ? d : (d < 0 ? -step : step);
    this.lane = laneNormalize(well, this.lane + moved);
    return true;
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2). No per-entity pipeline, no
  // sprite, no texture, nothing solid. The craft draws at full alpha even in
  // the dim band (GDD 3.7) — the band dims the WELL, and a player who cannot
  // see their own craft is the failure that rule is protecting against.
  draw(ctx, well) {
    drawPoly(ctx, skimmerPoints(well, this.lane, this.squashAmount()), true);
    glowStroke(ctx, C.SKIMMER_COLOR, C.LINE_W_RIM, 1);
  }
}

// ==========================================================================
// 06-shots.js
// ==========================================================================
// 06-shots.js — player shots (GDD 4.2, 10.2, 10.3).
//
// ⛔ Position is (lane, depth), nothing else. A shot's lane is captured at fire
// time from the NEAREST LANE CENTRE — Math.round(skimmer.lane) through
// laneNormalize, exactly as Skimmer.snap() picks its own target (05-skimmer.js)
// — and never changes afterwards. Shots are lane-locked; rotating the Skimmer
// after firing leaves them exactly where they were.
//
// ⛔ Entity contract (GDD 6.5): class, constructor / update(dt) / draw() / dead.
// Killed by setting dead = true; removed by an end-of-frame .filter(), never
// spliced mid-loop.
//
// depth runs rim (1) -> throat (0) over C.SHOT_TIME (GDD 3.2's convention). A
// shot's own clock counts UP in seconds of flight time (GDD 16.3), matching
// every other timer in the build; depth is derived from it, not stepped
// directly, so retuning SHOT_TIME never touches the update loop.
//
// ⛔ Shots do NOT resolve their own hits. 09-collision.js owns the one collision
// pass (CS003 P3) and runs it after this update, so a shot's depth for the step
// is already final when it is tested. A shot the pass consumed is removed by
// Game.update()'s end-of-frame filter, freeing its slot against C.SHOT_MAX the
// SAME step — that is GDD 4.2's chip-away economy, ⚠ SETTLED as emergent.

class Shot {
  constructor(well, lane) {
    this.lane = laneNormalize(well, lane);
    this.t = 0;
    this.dead = false;
  }

  // 1 at the rim, 0 at the throat. Never negative — a shot that has overrun
  // SHOT_TIME is retired the same step, before depth is ever read again.
  depth() {
    const d = 1 - this.t / C.SHOT_TIME;
    return d < 0 ? 0 : d;
  }

  update(dt) {
    this.t += dt;
    if (this.depth() <= 0) this.dead = true;
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2); the actual point math lives in
  // 14-render-entities.js alongside whatever other entities land there.
  draw(ctx, well) {
    drawShot(ctx, well, this.lane, this.depth());
  }
}

// Fires (subject to cooldown and the SHOT_MAX cap) and ages every shot in
// flight, then retires whatever reached the throat this step. Called once per
// simulation tick, from 23-main.js, directly below the Skimmer's own update —
// that ordering is what lets a shot fired this step capture the Skimmer's
// POST-MOVE lane, the same "nearest lane centre" Skimmer.snap() targets.
function updateShots(state, well, dt) {
  if (state.shotCooldown < C.SHOT_COOLDOWN) state.shotCooldown += dt;

  if (state.input.fire &&
      state.shotCooldown >= C.SHOT_COOLDOWN &&
      state.shots.length < C.SHOT_MAX) {
    const lane = laneNormalize(well, Math.round(state.skimmer.lane));
    state.shots.push(new Shot(well, lane));
    state.shotCooldown = 0;
  }

  for (let i = 0; i < state.shots.length; i++) state.shots[i].update(dt);
  // ⛔ end-of-frame filter; a shot is never spliced out mid-loop (GDD 6.5).
  state.shots = state.shots.filter(s => !s.dead);
}

// ==========================================================================
// 07-enemies.js
// ==========================================================================
// 07-enemies.js — THE ENTITY CONTRACT, and the first enemy that implements it
// (GDD 6.1, 6.3, 6.5, 3.5, 4.5).
//
// ⛔ Position is (lane, depth) and nothing else (GDD 3.2). No enemy stores a
// screen coordinate; projection happens at draw time, in 14-render-entities.js.
//
// ⛔ Lifecycle (GDD 6.5): class, constructor / update(dt, well, state) /
// draw(ctx, well) / dead. Kill by setting `dead = true`; removal is an
// end-of-frame .filter() in the caller. Never spliced mid-loop.
//
// ⛔ ONE ARRAY, state.enemies (CS003 P2). Thorns, Carriers and Drifters all
// live in it; the contract FLAGS below decide behaviour, not a second array. A
// second array doubles all six wiring points CLAUDE.md lists.

// ---------------------------------------------------------------------------
// The base. ⛔ FIELDS AND SIGNATURES ONLY — no movement, no AI, no draw code.
// ---------------------------------------------------------------------------
//
// It exists for one reason: so the ninth enemy cannot silently forget a field.
// The value is the field list, not the inheritance.
//
// ⛔ THIS IS A SLOPE. The first time a climb rate or a hop timer lands in here,
// five enemies that do not climb inherit one, and the bug is invisible because
// they never read it — until one of them is given a reason to. If this class
// ever acquires behaviour, that is the signal to flatten it back to independent
// classes, not to add a second field to switch the behaviour off.
class Enemy {
  constructor(lane, depth) {
    // ⛔ (lane, depth), GDD 3.2. `lane` is in lane-CENTRE units — the integers
    // are the lane centres — and `depth` is 0 at the throat, 1 at the rim.
    this.lane = lane || 0;
    this.depth = depth || 0;

    // Set true to kill. The caller's end-of-frame filter does the removal.
    this.dead = false;

    // ⛔ Whether the Purge destroys this (GDD 4.3: "does not remove Thorns").
    // CS004's Thorn is the first `false` in the roster. The Purge reads this
    // flag and never a class name — that is what keeps its two uses one rule
    // instead of a growing list of exceptions.
    this.purgeable = true;

    // Whether this must be gone before the well counts as clear. The Thorn is
    // `false`, and that is exactly WHY a Thorn is still standing in the lane
    // during the Dive (GDD 5) — it is not an oversight in the clear check.
    this.blocksClear = true;

    // ⛔ GDD 4.5's contact rule, as a number. Contact kills the Skimmer when
    // `depth >= killDepth` and the lanes match. `null` means contact NEVER
    // kills — the Weaver is null (its projectile kills, not its body); the
    // Drifter will be 0 (lethal at any depth, GDD 4.5 item 2); the Vaulter
    // sets the rim band below. A number covers three of the five death
    // conditions and null covers the other two, which is why this is a field
    // and not a per-enemy method.
    this.killDepth = null;

    // ⛔ WHAT `depth` MEANS ON THIS ENTITY — not whether it moves.
    //
    //   false  `depth` is a POSITION: where the entity is in its lane.
    //   true   `depth` is a LENGTH: the tip of an extent rooted at the throat.
    //
    // A stationary enemy whose `depth` is still a position is `false` — the
    // flag is about the QUANTITY, not the motion. Anything that ever reads
    // `depth` as a length sets it true. CS004's Thorn is the roster's only
    // one: its `depth` is the tip of the segment it has grown, which is also
    // what lets the collision pass hit-test it with the same one line it uses
    // on everything else.
    //
    // ⛔ THE ONE READER IS respawnSkimmer() (23-main.js). GDD 4.4's rim push
    // clamps depth down to C.RESPAWN_PUSH_DEPTH, which is right for a position
    // and silently wrong for a length: it would shorten every Thorn past 0.55
    // on every player death — a free chip nobody earned, in the one place
    // nobody would look. ⚠ This does NOT narrow that clamp's band (SETTLED,
    // GDD 4.4); it says which entities the clamp is meaningful for.
    this.anchored = false;
  }

  // Movement and AI. dt is C.FIXED_DT; `well` is the current well (topology
  // included — GDD 3.5); `state` is the one game object, read for the level
  // clock and the Skimmer. Overridden by every subclass.
  update(dt, well, state) {}

  // ⛔ drawPoly + glowStroke only (GDD 10.2). Overridden by every subclass.
  draw(ctx, well) {}

  // A shot has hit this entity. The ENEMY decides what a hit does — the
  // collision pass (CS003 P3) only asks. Returns whether the shot is CONSUMED:
  // true retires the shot, false lets it fly on to whatever is behind. The
  // Vaulter dies and consumes; CS004's Thorn chips and consumes (GDD 4.2's
  // chip-away is emergent from that, not a special case in the collision pass);
  // an armoured entity returns false.
  //
  // The base returns false deliberately: a subclass that forgets to override it
  // lets shots through, which is visible, rather than eating them silently.
  onShot(shot) { return false; }
}

// ---------------------------------------------------------------------------
// The Vaulter (GDD 6.1, 6.3) — flattened X, first at L1, 150 points.
// Climbs; vaults lanes from L2; hunts at the rim. Killed by any shot or the
// Purge; kills by contact at the rim.
// ---------------------------------------------------------------------------
//
// ⛔ EVERY LANE HOP GOES THROUGH laneHop() (03-wells.js), AND THE dir IT
// RETURNS IS WRITTEN BACK. Read that helper's header before touching startHop.
// An enemy that keeps its own heading and asks the helper only for a POSITION
// holds a stale direction after a wall bounce and grinds against an open well's
// end forever, one hop out and one hop back — GDD 3.5's named bug and §17's
// third required test. The wall and the hopper's heading are ONE piece of
// state.
//
// ⛔ Nothing here reads well.closed. The topology lives entirely inside
// laneHop/laneDelta/laneNormalize, which is the only reason a Vaulter behaves
// on a Ring and on a Fan without a branch.
class Vaulter extends Enemy {
  // `dir` is the initial heading, +1 or -1, and is the spawner's to choose
  // (CS003 P2 draws it from the run's one stream). Anything non-negative,
  // undefined included, means +1.
  constructor(lane, depth, dir) {
    super(lane, depth);

    // GDD 4.5 item 1: an enemy reaching the rim in your lane kills on contact.
    // ⛔ Expressed as `1 - C.RIM_CONTACT_DEPTH`, not a second constant — the
    // band is measured DOWN from the rim, so retuning the band moves this and
    // every other rim-contact enemy together.
    this.killDepth = 1 - C.RIM_CONTACT_DEPTH;

    // ⛔ The heading, kept in step with laneHop's returned dir and never
    // inferred from a lane comparison afterwards.
    this.dir = dir < 0 ? -1 : 1;

    // ⛔ Counts UP toward the current hop interval and HOLDS there (GDD 16.3 —
    // no countdown timers anywhere in the build). Holding rather than growing
    // is what makes a rim Vaulter that has no legal hop this instant — the
    // player is already in its lane — take one the moment that changes,
    // instead of waiting out a fresh interval.
    this.hopTimer = 0;

    // The hop in flight. `hopping` is the gate; the other three describe the
    // crossing. ⛔ `lane` is CONTINUOUS through a hop (GDD 6.1: the craft is
    // hittable in both lanes it is near), so these exist to interpolate it
    // rather than to teleport at the end.
    this.hopping = false;
    this.hopTime = 0;    // counts up toward C.VAULT_HOP_TIME
    this.hopFrom = this.lane;
    this.hopDelta = 0;   // signed lane distance of this hop, already short-way
  }

  atRim() {
    return this.depth >= 1;
  }

  update(dt, well, state) {
    const wasAtRim = this.atRim();

    // ⛔ Monotonic, and it STOPS at the rim rather than passing it. Depth > 1
    // is not a legal position: perspective() clamps it, so an unclamped climb
    // would leave the craft drawn on the rim while its depth ran away and
    // every depth comparison downstream (killDepth, the readability zone, the
    // respawn push) read a number no other system could produce.
    if (this.depth < 1) {
      this.depth += C.VAULT_CLIMB * dt;
      if (this.depth > 1) this.depth = 1;
    }
    const atRim = this.atRim();

    // Arriving at the rim restarts the cadence, so the first hunt hop lands a
    // full C.VAULT_RIM_INTERVAL after arrival. Without this, whatever phase the
    // climb's 2.2 s timer happened to be in decides whether the Vaulter lunges
    // the instant it surfaces — an arrival that is sometimes fair and sometimes
    // not, for a reason the player cannot see (GDD 1.1 P2).
    if (atRim && !wasAtRim) this.hopTimer = 0;

    const interval = atRim ? C.VAULT_RIM_INTERVAL : C.VAULT_INTERVAL;
    // Advances DURING a hop too, so the period between hop STARTS is the
    // interval itself rather than interval + crossing time.
    if (this.hopTimer < interval) this.hopTimer += dt;

    if (this.hopping) {
      this.advanceHop(dt, well);
      return;
    }
    if (this.hopTimer < interval) return;

    // ⛔ THE LEVEL GATE IS ON VAULTING ONLY (GDD 6.3): level 1 Vaulters climb
    // straight up, which is how the player learns what a lane is. Rim hunting
    // is NOT gated — GDD 6.1 attaches "from L2" to vaulting, and GDD 12
    // promises a passive player dies on level 1, which a Vaulter parked
    // politely at the rim cannot deliver.
    let dir = 0;
    if (atRim) dir = this.huntDir(well, state);
    else if (state.level >= C.VAULT_FIRST_LEVEL) dir = this.dir;

    if (dir !== 0) {
      this.hopTimer = 0;
      this.startHop(well, dir);
    }
  }

  // Which way the Skimmer is, as -1 / 0 / +1. ⛔ laneDelta, never (a - b): on a
  // 16-lane Ring the way from lane 15 to lane 0 is +1, and the bare subtraction
  // sends the Vaulter fifteen lanes the wrong way round.
  //
  // 0 means "no hop this beat" — no Skimmer yet (23-main.js mints it lazily),
  // a dead one, or the Vaulter is already in the player's lane and has nowhere
  // better to be.
  huntDir(well, state) {
    const target = state.skimmer;
    if (!target || target.dead) return 0;
    const d = laneDelta(well, this.lane, target.lane);
    return d > 0 ? 1 : (d < 0 ? -1 : 0);
  }

  // ⛔ THE ONE PLACE A HOP IS RESOLVED. laneHop() answers both halves of the
  // question — where the hop lands, and which way the hopper is travelling
  // afterwards — and BOTH are written back here. On a closed well it wraps and
  // dir is unchanged; on an open well it mirror-folds at the wall and dir
  // flips, so a Vaulter that hops into an end lane turns around and comes back
  // instead of parking on it (GDD 3.5).
  startHop(well, dir) {
    const h = laneHop(well, this.lane, dir, dir);
    this.dir = h.dir;

    this.hopFrom = this.lane;
    // The crossing is interpolated along the SHORT way to the landing lane, so
    // a hop across a closed well's seam (15 -> 0) travels one lane forward and
    // not fifteen backwards. On an open well laneDelta is the plain difference,
    // and both endpoints are inside [0, lanes-1], so every point between them
    // is too — which is what keeps the soak's lane-range invariant true DURING
    // a hop and not merely at its ends. (A hop that begins exactly ON an open
    // well's fold point — a half-lane, which no spawner produces — lands where
    // it started and the Vaulter holds its lane for that beat. Harmless, and
    // the alternative is re-folding every interpolated step.)
    this.hopDelta = laneDelta(well, this.lane, h.lane);
    this.hopTime = 0;
    this.hopping = true;
  }

  // Carry the crossing forward. ⛔ `lane` moves continuously — the Vaulter is
  // hittable in both lanes it is near for the whole C.VAULT_HOP_TIME, which is
  // the window GDD 6.1's "vaults lanes" is really describing.
  advanceHop(dt, well) {
    const dur = C.VAULT_HOP_TIME;
    this.hopTime += dt;

    if (!(dur > 0) || this.hopTime >= dur) {
      // Landing is exact, never the last interpolated step: an accumulated
      // float error would leave the Vaulter a hair off a lane centre, and the
      // next hop would inherit the drift.
      this.lane = laneNormalize(well, this.hopFrom + this.hopDelta);
      this.hopTime = dur;
      this.hopping = false;
      return;
    }
    // laneNormalize keeps the in-flight lane legal on BOTH topologies, and it
    // is also what makes a well change mid-hop (enterWell, CS003 P2) land the
    // craft somewhere the new well actually has, rather than off the end of a
    // shorter one.
    this.lane = laneNormalize(well, this.hopFrom + this.hopDelta * (this.hopTime / dur));
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2); the silhouette and the projection
  // live in 14-render-entities.js, where the eight later enemies reuse them.
  draw(ctx, well) {
    drawVaulter(ctx, well, this.lane, this.depth);
  }

  // Any shot kills it (GDD 6.1), and the shot is spent — one shot, one Vaulter.
  onShot(shot) {
    this.dead = true;
    return true;
  }
}

// ---------------------------------------------------------------------------
// ⛔ THE CARGO TABLE (GDD 6.2) — a cargo name -> what a Carrier of it splits
// into.
// ---------------------------------------------------------------------------
//
// ⛔ TWO NAMESPACES THAT HAPPEN TO COINCIDE, WHICH IS WHY THIS LOOKS LIKE AN
// IDENTITY MAP AND IS NOT. The KEY is a cargo name: what the Carrier is
// carrying, what its glyph draws (CARGO_GLYPHS, 14-render-entities.js), and
// what GDD 6.2's variant table calls the row. The VALUE's `kind` is an
// ENEMY_KINDS key (08-spawner.js): what actually gets spawned. They read the
// same for every row GDD 6.2 lists, and they are not the same thing — the
// spawner's table is where a string becomes a class, and this one is where a
// cargo becomes a string.
//
// ⛔ THE SPLIT IS TABLE-DRIVEN AND STAYS THAT WAY. There is no branch on cargo
// anywhere — not in onShot, not in splitLanes, not in the draw path. GDD 6.2
// has three rows and only this one is buildable: the Drifter (L18) and the
// Surger (L23) cannot be cargo before they are enemies, and they are CS005's.
// Adding a row is: an entry here, an ENEMY_KINDS row for the carrier variant,
// and a glyph in CARGO_GLYPHS — the same three-file shape every enemy already
// has (behaviour, spawn string, silhouette). Nothing else.
//
// ⛔ GDD 6.2's "adjacent" (Vaulter cargo) and "flanking" (Surger cargo) are THE
// SAME GEOMETRY. The distinction that section draws is between the correct
// RESPONSES — move away versus hold still — which comes from what the cargo
// does after it lands, not from where it lands. splitLanes() serves all three
// rows; a second placement rule invented to justify the second word would be a
// difference the player cannot see.
const CARGO = {
  vaulter: { kind: "vaulter" },
};

// ---------------------------------------------------------------------------
// The Carrier (GDD 6.1, 6.2) — hollow diamond plus a cargo glyph, first at L3,
// 100 points. Slow, ONE LANE, never hops. Kills by contact at the rim; any
// shot kills it and it SPLITS into two of its cargo.
// ---------------------------------------------------------------------------
//
// ⛔ IT DOES NOT TOUCH laneHop, laneDelta OR laneNormalize, AND THAT IS THE
// POINT. `lane` is written exactly once, by the constructor, and is the lane it
// was spawned into for its whole life — GDD 6.1's "one lane, never hops" is an
// absence of code, not a flag, and CS004 P5's soak asserts the strong form
// (exact lane equality every tick) rather than a range or a speed bound.
class Carrier extends Enemy {
  // `cargo` is a CARGO key, handed in by the ENEMY_KINDS factory — the kind
  // string carries the variant, so the class does not need a branch.
  constructor(lane, depth, cargo) {
    super(lane, depth);

    // GDD 4.5 item 1, the same expression the Vaulter uses. ⛔ Not a second
    // constant: the band is measured DOWN from the rim, so retuning
    // C.RIM_CONTACT_DEPTH moves every rim-contact enemy together.
    this.killDepth = 1 - C.RIM_CONTACT_DEPTH;

    this.cargo = cargo;
  }

  // ⛔ Monotonic, and it STOPS at the rim rather than passing it — the same
  // rule the Vaulter's climb carries and for the same reason: depth > 1 is not
  // a legal position, and every downstream comparison (killDepth, the
  // readability zone, the respawn push) would be reading a number no other
  // system can produce.
  //
  // `well` and `state` are unused: a Carrier has no topology and no AI. The
  // signature is the contract's (GDD 6.5), not this enemy's.
  update(dt, well, state) {
    if (this.depth < 1) {
      this.depth += C.CARRIER_CLIMB * dt;
      if (this.depth > 1) this.depth = 1;
    }
  }

  draw(ctx, well) {
    drawCarrier(ctx, well, this.lane, this.depth, this.cargo);
  }

  // Any shot kills it and the shot is spent (GDD 6.1) — and then it splits.
  //
  // ⛔ BOTH CHILDREN GO THROUGH spawnEnemy(), THE ONE ENTRY POINT (GDD 6.5).
  // Four consequences, every one of them deliberate:
  //
  //   1. GDD 6.3's safe-spawn rule applies. A child landing in the Skimmer's
  //      lane above C.SAFE_SPAWN_DEPTH is LOWERED to that line, never moved
  //      sideways — which is exactly why CS003 P2 wrote that rule as a depth
  //      clamp: relocating a child would break the shape GDD 6.2 is teaching
  //      the player to read, and dropping one deeper only ever gives them more
  //      time.
  //   2. C.ENEMY_CAP applies. A Carrier killed on a full board loses its
  //      children, and that is correct: the cap is a READABILITY ceiling, not a
  //      difficulty knob, and "it is only a split" is precisely the bypass the
  //      single entry point exists to prevent.
  //   3. ⛔ Each call spends ONE RNG DRAW for the heading (08-spawner.js), so a
  //      split spends TWO and shifts every later draw in the run. The run has
  //      one stream and this is deterministic — a replay of the seed splits at
  //      the same moment and draws the same numbers afterwards. Do not "save" a
  //      draw here for a kind that ignores `dir`; that would make the stream
  //      depend on which cargo was in the well.
  //   4. ⚠ SETTLED — THIS PUSHES INTO state.enemies WHILE collideShots() IS
  //      ITERATING IT (09-collision.js). That is safe, and it is safe for three
  //      separate decisions in two files rather than by luck:
  //        - the collision loop is INDEX-BASED and re-reads `.length`, so the
  //          appended children are simply part of the array;
  //        - the `break` after onShot is UNCONDITIONAL, so this shot resolves
  //          against at most one enemy per step and cannot walk forward into
  //          the children it just created;
  //        - removal is still the end-of-frame `.filter()` in Game.update() —
  //          nothing is spliced mid-loop (GDD 6.5).
  //      ⛔ Do not "fix" this into a deferred spawn queue, and do not make that
  //      `break` conditional. Either change turns a correct three-part
  //      arrangement into a bug that only shows up on a busy board.
  //
  // The current well is read the same way spawnEnemy() itself reads it. An
