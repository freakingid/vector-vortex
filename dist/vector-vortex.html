  // on this step still pays after this returns. All this writes is the screen,
  // which stops stepping the gameplay systems, in Game.update(). The freeze below still runs — the
  // last death of a run reads exactly like the others.
  if (state.lives <= 0) {
    state.lives = 0;
    state.screen = "gameover";
    sfx("gameOver");
  }

  // ⛔ Simulation time freezes; rendering does not. Game.hitStop() is the one
  // freeze mechanism in the build (23-main.js) and the longest request wins.
  Game.hitStop(C.HIT_STOP_DEATH);
}

// ---------------------------------------------------------------------------
// The Purge (GDD 4.3)
// ---------------------------------------------------------------------------
//
// ⛔ ONE CHARGE PER WELL, re-armed by enterWell() and NEVER accumulated.
// state.purgeUses counts UP (GDD 16.3 — no countdown timers anywhere in the
// build) and is the whole rule:
//
//   1st use   every enemy with `purgeable` dies. ⛔ Non-purgeable ones are
//             untouched — GDD 4.3's "does not remove Thorns", read off the
//             entity's flag rather than a class name, which is what keeps this
//             two rules instead of a growing list of exceptions.
//   2nd use   exactly ONE enemy dies, the purgeable one nearest the rim. No
//             bonus. The weak second use is what converts the Purge from a spam
//             button into a decision.
//   3rd+      nothing.
//
// ⛔ THE SOUNDS FOLLOW THE SAME COUNT (CS009 P5): `purge` on use 1, `purgeWeak`
// on use 2 — GDD 4.3's "distinctly feeble", so the downgrade is felt — played
// on the press whether or not a victim remains, and nothing on use 3+. Every
// victim of either use also makes its kill sound, like any kill site.
//
// ⛔ BOTH USES SCORE NORMAL POINTS (GDD 7; Paul, P2s) — each victim's
// `points()`, through addScore(). C.PURGE_SAVED_BONUS reads state.purgeUses ===
// 0 at the clear edge (12-scoring.js); that is why this is a count and not the
// boolean CS003 P2 shipped.

// The second use's victim: the purgeable enemy nearest the RIM (highest depth).
//
// ⛔ THE TIE-BREAK IS PART OF THE FEATURE, not an implementation detail. GDD 4.3
// says "deterministically, so the player can predict it", so: highest depth,
// then lowest lane, then array order. The strict comparisons below are what
// give the last of those three for free — an equal candidate never displaces
// the one already held, so the earliest survivor of a full tie wins.
function purgeTarget(state) {
  let best = null;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !e.purgeable) continue;
    if (best === null) { best = e; continue; }
    if (e.depth > best.depth) { best = e; continue; }
    if (e.depth === best.depth && e.lane < best.lane) best = e;
  }
  return best;
}

// One simulation step of the Purge.
//
// ⛔ state.input.purge IS A LEVEL, NOT AN EDGE. All four devices in 04-input.js
// write a HELD boolean into the one input struct (GDD 9.5) — there is no
// "pressed this frame" anywhere in the build, and adding one to the input
// module would be a second input shape for every device to get right. So the
// edge is detected HERE: state.purgeLatched is simply "the button was held last
// step", and the charge is spent only on a false -> true transition. Holding
// the button down for a whole well spends exactly one charge.
//
// ⛔ CS003 P4 SETS state.purgeLatched ON DEATH, and this is why it can: input
// devices are still drained during hit-stop (23-main.js, deliberate — a freeze
// must not dump a second of banked mouse motion into the first live step), so a
// Purge held through a death arrives at the step after the freeze looking like
// a fresh press. Forcing the latch true makes that step read as "still held",
// and the button needs a genuine release before it fires again. Writing the
// latch as `held` every step, rather than only clearing it on release, is what
// makes that forced value survive correctly.
function updatePurge(state) {
  const held = !!state.input.purge;
  const rising = held && !state.purgeLatched;
  state.purgeLatched = held;
  if (!rising) return;

  state.purgeUses++;
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`). A CHARGE CONSUMED, which is uses
  // 1 and 2 and never 3+ — the counter above keeps rising so a HUD can tell
  // "spent" from "spent twice", and a telemetry column that followed it would
  // report a player mashing an empty button as having spent five purges.
  if (state.purgeUses <= 2) state.tally.purgesSpent++;

  // ⚠ SETTLED — THE PURGE KILLS, IT DOES NOT ASK. Both branches below set
  // `dead` directly and NEITHER calls onShot(). That is why a Purge on a well
  // of CS004 Carriers leaves it empty instead of doubling it: splitting lives
  // in Carrier.onShot (07-enemies.js), and the Purge never goes there.
  //
  // ⛔ Do not route this through onShot "for consistency". The two are not the
  // same question — a shot asks the enemy what a hit does (GDD 6.5), and the
  // Purge is GDD 4.3's panic button, which is a statement rather than a
  // question. A panic button that doubles the enemy count is not a panic
  // button. This works by OMISSION, which is exactly the kind of thing that
  // gets "unified" by a later session, so it is written down here.
  if (state.purgeUses === 1) {
    sfx("purge");
    for (let i = 0; i < state.enemies.length; i++) {
      const e = state.enemies[i];
      if (!e.dead && e.purgeable) tallyKill(state, e);
      if (!e.dead && e.purgeable) { e.dead = true; state.tally.kills++; addScore(e.points() * comboMult()); comboKill(state); dropToken(state, e); sfx("kill", e.sfxVoice); }
    }
    return;
  }

  if (state.purgeUses === 2) {
    sfx("purgeWeak");
    const victim = purgeTarget(state);
    // A second use with nothing left to kill is still SPENT. The charge is
    // consumed by the press, not by the result — otherwise a player could bank
    // the weak use by firing it into an empty well.
    // ⛔ `kills` is "the player destroyed it", by shot or by Purge, so both
    // branches of the panic button count here (02-state.js's `tally`).
    if (victim) tallyKill(state, victim);
    if (victim) { victim.dead = true; state.tally.kills++; addScore(victim.points() * comboMult()); comboKill(state); dropToken(state, victim); sfx("kill", victim.sfxVoice); }
  }
  // Third and later: nothing. The counter keeps rising so a HUD (CS008) can
  // tell "spent" from "spent twice" without a second field.
}

// ---------------------------------------------------------------------------
// The jump strike (GDD 14.2, 14.6, 7; CS013 P3, W4) — the FOURTH kill site
// ---------------------------------------------------------------------------
//
// ⛔ AN AIRBORNE CRAFT IN AN ALOFT ENTITY'S LANE KILLS IT. That is the whole
// function, and it is what makes the Jump OFFENSIVE as well as defensive
// (GDD 14.6): the Warden is killable only by a jump, because no shot, no rim
// sweep and no Purge can reach something above the well.
//
// ⛔ A LANE MATCH ON TWO FLAGS, AND NOT A COMPARISON OF TWO DEPTHS. Airborne is
// a PHASE on state.jump (05-skimmer.js) and aloft is a PHASE on the entity
// (07-enemies.js) — neither side has a number for how far off the rim it is, so
// the build still has exactly ONE two-depth comparison and it is the dive
// strike's (GDD 4.5 item 5, 11-dive.js). Giving the craft a depth to make this
// "honest" would be inventing a quantity to compare against a second one that
// does not exist either.
//
// ⛔ IT IS THE FOURTH KILL SITE AND THE FIFTH KILL LINE (GDD 7), and the line is
// the other four's rule verbatim: tally.kills, e.points() at the multiplier in
// force, comboKill(), T2's drop roll, and sfx("kill", e.sfxVoice) off the
// entity's own voice. GDD 7's "three kill sites, and no fourth" is corrected by
// it, in that section and in CLAUDE.md.
//
// ⛔ `continue`, NEVER `return` — the rim sweep's rule (above), for the rim
// sweep's reason: rotating airborne sweeps the craft through lanes, so one jump
// may take two Wardens and both are asked. Nothing here is spliced; the dead
// are removed by Game.update()'s end-of-frame filter.
//
// ⛔ NO INVULNERABILITY GUARD, exactly as the rim sweep has none: invulnerability
// suspends dying, not playing. And no `killDepth` term — this pass is not about
// what the entity does to the craft.
//
// It runs THIRD, after collideSkimmer(), and the two are mutually exclusive by
// construction: that pass returns at once while airborne and this one returns
// at once while grounded.
function jumpStrike(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;
  if (!jumpAirborne(state)) return;

  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !e.aloft) continue;
    if (!laneHit(well, e.lane, sk.lane)) continue;
    e.dead = true;
    state.tally.kills++;
    state.tally.jumpKills++;
    addScore(e.points() * comboMult()); comboKill(state); dropToken(state, e); sfx("kill", e.sfxVoice);
  }
}

// ⛔ THE ACHIEVEMENT COUNTERS A KILL MOVES BY WHAT DIED (CS015 P2, plan A2-A;
// 02-state.js's `tally`). Called on its OWN LINE beside the kill line at the
// shot site, the rim sweep and both Purge uses — never inside one: ⛔ THE FIVE
// KILL LINES ARE NOT EDITED, and test-cs012-p4.js / test-cs014-p1.js pin their
// text. The jump strike needs no call: only an aloft entity dies there, which
// is neither a Mimic nor a Carrier's child. ⛔ WRITE-ONLY — no points, no
// combo, no draw, no sound, and nothing in the simulation reads either count.
// ⛔ `instanceof`, never a kind string: the MimicShot is not a Mimic.
function tallyKill(state, e) {
  if (e instanceof Mimic) state.tally.mimicKills++;
  if (e.brood && --e.brood.left === 0) state.tally.carrierSplits++;
}

// The whole pass, in its fixed order. Called once per simulation step from
// Game.update().
//
// ⛔ THE JUMP STRIKE RUNS THIRD (CS013 P3, W4). Shots resolve first, then
// contact — which is skipped entirely while airborne — and then the one thing
// an airborne craft can do to the board.
function updateCollisions(state, well) {
  collideShots(state, well);
  collideSkimmer(state, well);
  jumpStrike(state, well);
}

// ==========================================================================
// 10-powerups.js
// ==========================================================================
// 10-powerups.js — Overdrive's tokens (GDD 14.1, 16.3; CS013 P1,
// PLANNED-FEATURES-CS013.md T1–T6). What lives here: the drop (dropToken(), the
// ONE way a token enters the well), a token's life on the board
// (updateTokens(): the rise, the age, the collection, the expiry), the two
// instant effects (Bounty, Recharge), the lasting flags a pickup sets on
// state.powers, and resetTokens(), which the well calls. The draw is
// drawToken() (14-render-entities.js).
//
// ⛔ A TOKEN IS NOT AN ENEMY, AND IT LIVES IN ITS OWN ARRAY, state.tokens (T1).
// state.shots is the precedent: a second entity array exactly because the
// enemy passes would get it wrong. MEASURED at the plan (§1.4): state.enemies
// has 19 reader sites, and a token inside it needs an answer at eight, three of
// them wrong by default — collideShots() would hit-test it and its unconditional
// `break` would let a hovering token SHIELD the rim enemies behind it;
// respawnSkimmer()'s rim push would drop a hovering token to 0.55 on every
// death; and spawnEnemy() would refuse it at ENEMY_CAP and spend a heading draw
// it has no use for. dangerInputs(), telemetryRow() and laneCrowded() would each
// count it as a threat. So: no contract field, no ENEMY_KINDS row, none of the
// 19 sites touched, and GDD 6.5's "ONE array" is still true of enemies.
//
// ⛔ GDD 14.1's TWO TABLES ARE TWO. The DROP-WEIGHT TABLE (C.TOKEN_WEIGHTS,
// read by tokenKind() below) says WHICH token a drop is; the BUDGETED-EFFECT
// LIST (C.BOUNTY_POINTS here, C.LANCE_CHIP_MULT and C.SPREAD_SHOT_MAX in
// CS013 P2) says WHAT each one does. Neither reads the other's numbers, so a
// weight is never a budget and a budget is never a weight.
//
// ⛔ ONE DRAW PER OVERDRIVE KILL, FROM THE RUN'S ONE STREAM, AND NONE IN
// CLASSIC (T2). The draw is spent whether or not anything drops — at
// C.MAX_TOKENS too — and the kind comes from the SAME draw, rescaled. So "one
// draw per Overdrive kill" is a count a test can make, as test-cs006-p5.js
// counts one per spawn, and a Classic run spends exactly what it spent before.
//
// ⛔ NOTHING IN THE DRAW PATH CALLS state.rng() (CLAUDE.md, Math and
// lifecycle). Every random value a token has was drawn here, in the simulation.

// The kind a drop is, from `v` in [0, 1): the one draw rescaled by its drop
// chance (T3). A weighted walk over C.TOKEN_WEIGHTS in its KEY ORDER — the
// order is part of the table, so a board replays.
function tokenKind(v) {
  const w = C.TOKEN_WEIGHTS;
  const keys = Object.keys(w);
  let total = 0;
  for (let i = 0; i < keys.length; i++) total += w[keys[i]];
  let x = v * total;
  for (let i = 0; i < keys.length; i++) {
    x -= w[keys[i]];
    if (x < 0) return keys[i];
  }
  return keys[keys.length - 1];
}

// Tokens on the board that have not been taken or expired.
function liveTokens(state) {
  let n = 0;
  for (let i = 0; i < state.tokens.length; i++) if (!state.tokens[i].dead) n++;
  return n;
}

// ⛔ THE ONE WAY A TOKEN ENTERS THE WELL (T1, T2, T3, T4). Called by the five
// kill lines in 09-collision.js on the false -> true `dead` edge, beside
// comboKill(): a shot, the rim sweep, both Purge uses, and CS013 P3's jump
// strike (W4), which inherited the roll with the rest of the line. ⛔ Not by
// the Dive's termination kill, which is not a kill site and rolls nothing.
//
// ⛔ A TOTAL NO-OP OUTSIDE modeHas("tokens") — no draw, no write — which is what
// keeps a Classic run bit-identical to the build before this changeset.
//
// p = C.TOKEN_DROP_CHANCE / (1 + threatCount()), read AFTER the victim is dead,
// so GDD 14.1's "drop rate falls as enemy count rises" is the board the kill
// leaves behind. A drop when the draw falls under p; the kind is that same draw
// divided by p (T3). A board already at C.MAX_TOKENS still spends the draw and
// discards the drop.
//
// Born at the victim's lane, rounded to a centre, and at its depth or the hover
// depth, whichever is nearer the throat (T4). An anchored victim's depth is a
// length, so a Thorn's token is born at its tip, where the last chip landed.
function dropToken(state, e) {
  if (!modeHas("tokens", state.mode)) return;
  const u = state.rng();
  const p = C.TOKEN_DROP_CHANCE / (1 + threatCount(state));
  if (!(u < p)) return;
  if (liveTokens(state) >= C.MAX_TOKENS) return;
  const well = WELLS[state.wellIndex];
  state.tokens.push({
    kind: tokenKind(u / p),
    // `+ 0` turns Math.round(-0.4)'s -0 into 0.
    lane: laneNormalize(well, Math.round(e.lane) + 0),
    depth: e.depth < C.TOKEN_HOVER_DEPTH ? e.depth : C.TOKEN_HOVER_DEPTH,
    age: 0,
    dead: false,
    collected: false,
  });
}

// ⛔ THE PICKUP (T6, R11). The two instant tokens act here and are done; a
// lasting one sets its flag on state.powers, which CS013 P2 gives its reader.
// ⛔ A DUPLICATE DOES NOTHING MORE (T5): a second Lance while one is on sets a
// flag that is already true. It is still collected, and still sounds.
//
//   bounty    addScore(C.BOUNTY_POINTS). ⛔ NOT MULTIPLIED AND BUILDS NOTHING —
//             CS012's O4: only kill points are multiplied, and what is
//             multiplied is exactly what builds. It can cross a milestone and
//             pay a life, as any addScore() can.
//   recharge  state.purgeUses = 0, so the Purge is at full strength and its
//             HUD glyph bright. ⚠ The "Purge unspent" clear bonus then pays
//             again: clearBonuses() reads purgeUses === 0, and a recharged
//             charge is unspent. tally.purgesSpent does not move.
function collectToken(state, t) {
  t.dead = true;
  t.collected = true;
  sfx("collect");
  switch (t.kind) {
    case "bounty":   addScore(C.BOUNTY_POINTS); break;
    case "recharge": state.purgeUses = 0; break;
    case "lance":    state.powers.lance = true; break;
    case "spread":   state.powers.spread = true; break;
    case "ward":     state.powers.ward = true; break;
  }
}

// One simulation step of every token (T4), from Game.update()'s play step:
// AFTER the collision pass and both end-of-frame filters, so a token dropped
// this step is aged this step, and BEFORE the spawner and the clear edge, so a
// Bounty or a Recharge taken on the clear step is paid before the bonuses.
//
//   rise     C.TOKEN_RISE depth per second toward C.TOKEN_HOVER_DEPTH, where
//            it holds. Its lane never moves.
//   age      counts UP from the drop (GDD 16.3: `token.age >= TOKEN_LIFE`,
//            verbatim) and it expires on the step it gets there.
//   collect  by touch: a LIVE craft within C.HIT_LANE_TOL of a token that has
//            reached the hover depth. A rising token cannot be taken. Airborne
//            counts — a pickup is not contact with a killer.
//
// ⛔ Removal is this function's own end-of-pass filter, never a splice (GDD
// 6.5), and there is none to do on an empty board — a Classic step allocates
// nothing here.
function updateTokens(state, well, dt) {
  if (state.tokens.length === 0) return;
  const sk = state.skimmer;
  const live = sk && !sk.dead;
  let gone = 0;
  for (let i = 0; i < state.tokens.length; i++) {
    const t = state.tokens[i];
    if (t.dead) { gone++; continue; }
    if (t.depth < C.TOKEN_HOVER_DEPTH) {
      t.depth += C.TOKEN_RISE * dt;
      if (t.depth > C.TOKEN_HOVER_DEPTH) t.depth = C.TOKEN_HOVER_DEPTH;
    }
    t.age += dt;
    if (t.age >= C.TOKEN_LIFE) { t.dead = true; gone++; continue; }
    if (live && t.depth >= C.TOKEN_HOVER_DEPTH && laneHit(well, t.lane, sk.lane)) {
      // ⛔ WRITE-ONLY (02-state.js's `tally`; CS015 P2): which KINDS this run
      // has taken, one bit per key of C.TOKEN_WEIGHTS in its ORDER — at the
      // pickup, never in collectToken(): the effect side names no weight.
      state.tally.tokenKindsMask |= 1 << Object.keys(C.TOKEN_WEIGHTS).indexOf(t.kind);
      collectToken(state, t);
      gone++;
    }
  }
  if (gone) state.tokens = state.tokens.filter(t => !t.dead);
}

// ⛔ THE WELL OWNS THEM (T5). enterWell() and startDive() call this, so no
// token rises through a Dive and no lasting effect crosses the throat — the
// Dive is untouched, as CS012's R4 left it untouched by the Jump. ⛔ A death
// does NOT call it: tokens stay on the board and Lance and Spread stay on,
// which is the Purge charge's rule — re-armed on entry, never on death.
function resetTokens(state) {
  state.tokens = [];
  state.powers.lance = false;
  state.powers.spread = false;
  state.powers.ward = false;
}

// ==========================================================================
// 11-dive.js
// ==========================================================================
// 11-dive.js — the Dive (GDD 5, 4.5 item 5, 2, 16.3). The beat between wells,
// and the last of GDD 4.5's five death conditions.
//
//   wellCleared()  ->  startDive()  ->  [ GRACE ]  ->  [ DESCENT ]  ->  nextWell()
//                                           |              |
//                                      rotate only    rotate; Thorn strike live
//
// ⛔ IT REPLACED CS003 P2's ONE-SECOND BETWEEN-WELLS HOLD, IT DOES NOT SIT
// BESIDE IT. That hold was this module's placeholder, and all three parts of it
// are deleted: its constant in 00-config.js, its field on `state`, and the
// branch at the foot of Game.update() that read them. ⛔ Neither name survives
// anywhere in the built file, and test-cs006-p3.js asserts that — a placeholder
// that outlives its replacement is what this file exists to prevent.
//
// ⛔ AND IT DOES NOT SIT WHERE THE HOLD SAT. The hold was a branch at the BOTTOM
// of update() that the whole gameplay pass fell through every step. The Dive
// SHORT-CIRCUITS: while state.dive.active there is no spawner, no enemy pass,
// no Purge, no collision pass and no well-clear check. Two edits in 23-main.js,
// not one — the branch near the top, and startDive() at the foot where the hold
// used to advance the level.
//
// ⛔ THE DIVE READS THE OUTGOING WELL. enterWell() clears state.enemies and
// mints a craft for the NEW well's lane count, so the dive has to run BEFORE
// it: nextWell() is called at the dive's END. A dive that ran after enterWell()
// would thread an empty new well and be a 2.6 s pause with a doppler on it.
//
// ⛔ IT SPENDS NO RNG. Nothing here calls state.rng() — not the strike, not the
// respawn-lane search, not the repeat. The run's ONE stream (01-rng.js) is
// untouched by a dive, which is what lets the two draws nextWell() spends past
// level 99 stay the only draws a well transition costs.
//
// ⛔ NO RENDERING. GDD 5's camera widen and doppler are presentation and are not
// this changeset's; the Dive is simulation only, and update() never touches the
// canvas (23-main.js).
//
// ⛔ AND SINCE CS014 P1 THIS FILE ALSO OWNS THE RING FLIGHT (GDD 14.5; RF1-RF4,
// RF6, RF9), which is OVERDRIVE'S DIVE AND NOT A SECOND ONE. There is one
// module, one beat, one strike and one termination guarantee; what the mode
// flag decides is how long the beat runs and whether there is anything in it
// to fly through. ⛔ modeHas("rings") is the whole gate and `rings: false` in
// C.MODE_FLAGS' Overdrive row is the whole cut (00-config.js).
//
// ⛔ CLASSIC IS A TOTAL NO-OP. Nothing is laid, nothing is taken, no draw is
// spent and the dive is C.DIVE_TIME long — asserted as a step-by-step hash
// against a build with layRings() and takeRings() stubbed out, the Jump's and
// the token's proof (test-cs014-p1.js).
//
// ⛔ AND IT STILL SPENDS NO RNG. The ring lattice is a function of the WELL and
// of constants — never a draw, and (R6) never the level or heat either.

// ---------------------------------------------------------------------------
// The beat fields, in one place
// ---------------------------------------------------------------------------
//
// ⛔ THE ONE WRITER OF state.dive OUTSIDE updateDive(). enterWell() calls it
// where CS003 P2's one-line hold reset used to sit, which is what makes the
// end of a dive and the `w` debug cycler agree without either knowing about the
// other: nextWell() -> enterWell() -> here.
function resetDive(state) {
  const d = state.dive;
  d.active = false;
  d.phase = "grace";
  d.timer = 0;
  d.depth = 1;
  // ⛔ EMPTIED HERE, WHICH IS WHY THE SET NEEDS NO SECOND RESET CALLER (RF1).
  // enterWell() already calls this function, so a new run, the next level, the
  // restart and the `w` debug cycler are all covered without any of them
  // knowing a ring exists. Length, not a fresh array: the bag's identity is
  // stable and nothing allocates on a path a well change takes.
  d.rings.length = 0;
}

// ---------------------------------------------------------------------------
// HOW LONG A DIVE IS (GDD 5, 14.5; RF9) — ⛔ THE WHOLE DIVE, GRACE INCLUDED
// ---------------------------------------------------------------------------
//
// ⛔ C.DIVE_TIME_OD IS READ EXACTLY AS C.DIVE_TIME IS, and that is the rule
// rather than a coincidence: C.DIVE_GRACE is a slice off the FRONT of whichever
// one is in force, so there is one place the beats are derived and retuning
// either length moves them together. The descent is 2.25 s in Classic and
// 3.65 s under the flag.
//
// ⛔ GATED ON modeHas("rings") AND NOT ON state.mode (RF6). The cut has to take
// the length with it: with `rings: false` in the Overdrive row an Overdrive
// dive is C.DIVE_TIME long again, which is exactly the behaviour four closed
// soak files assert today. A test on state.mode would leave a 4 s dive with
// nothing in it.
//
// ⛔ THIS IS C.DIVE_TIME_OD's FIRST AND ONLY READER (plan §11).
function diveTime() {
  return modeHas("rings") ? C.DIVE_TIME_OD : C.DIVE_TIME;
}

// ---------------------------------------------------------------------------
// ⛔ THE RING SET'S ONE WAY IN (GDD 14.5; RF1, RF2, RF3)
// ---------------------------------------------------------------------------
//
// Called by startDive() and by nothing else, so "a ring exists only inside a
// dive, only in a mode that has them" is structural rather than checked.
//
// ⛔ A REPEATED DIVE RE-LAYS THE SET, AND THAT IS RF3's ANSWER. A dive that
// ends in a strike restarts through startDive(), so the rings come back and can
// be earned again — GDD 5's "it repeats the dive, not the well", and
// sfx("dive")'s own rule two lines below. MEASURED at the plan (§1.3): a dive
// death is 7 in 132,956 steps, so re-earning is worth about one set per 19,000
// steps rather than an exploit.
//
// ⛔ THE DEPTHS ARE THE MIDPOINTS OF C.DIVE_RINGS_MAX EQUAL SLICES, laid in
// CROSSING order — rim first, 0.9167 down to 0.0833 at six. Every one is
// strictly below 1, so the grace beat (where d.depth holds at 1) can never
// resolve one and takeRings() needs no phase guard. That is arithmetic, not
// luck: (n - i - 0.5) / n < 1 for every i >= 0.
//
// ⛔ THE LANE WALK GOES THROUGH laneHop(), THE BUILD'S ONE WALL HELPER (GDD
// 3.5). It wraps on a closed well and MIRROR-FOLDS on an open one, and the
// `dir` it returns is written back exactly as every hopper in the roster writes
// it back — a walk that kept a stale direction would grind on the wall. ⚠ A
// fold turns the walk around, so two rings near a wall can sit close together;
// that is the fold behaving, not the lattice failing.
//
// ⛔ A FUNCTION OF THE WELL AND OF CONSTANTS, AND OF NOTHING ELSE: no draw (R3),
// no level and no heat (R6), and not the craft's lane — a set measured from
// where the player happens to be standing would make its first ring free on
// every dive.
//
// ⛔ THIS IS C.DIVE_RINGS_MAX's FIRST AND ONLY READER (plan §11).
function layRings(state, well) {
  if (!modeHas("rings", state.mode)) return;
  const rings = state.dive.rings;
  const n = C.DIVE_RINGS_MAX;
  const step = C.RING_LANE_STEP * well.lanes;
  let lane = 0, dir = 1;
  for (let i = 0; i < n; i++) {
    rings.push({ lane: lane, depth: (n - i - 0.5) / n, taken: null });
    const hop = laneHop(well, lane, step, dir);
    lane = hop.lane;
    dir = hop.dir;
  }
}

// ---------------------------------------------------------------------------
// THE TAKE PASS (GDD 14.5, 7; RF2, RF4) — ⛔ AND IT IS NOT A COLLISION
// ---------------------------------------------------------------------------
//
// 09-collision.js does not run during a dive at all, so this is not a fifth
// entry to it and there is no new kill site and no new kill line: the build
// still has FOUR sites and FIVE lines, all of them there (GDD 7).
//
// ⛔ A LANE MATCH INSIDE A DEPTH CROSSING, AND NEITHER IDEA IS NEW. The lane
// test is laneDelta() against C.RING_ARC_LANES — the same lane-distance
// function laneHit() reads against C.HIT_LANE_TOL, with the arc's own
// half-width in place of the contact tolerance, so a Ring's seam is a
// neighbourhood here too. ⛔ There is no second idea of lane-sameness and no
// second control model: the rim axis is still the only one, snap assist
// included (GDD 1.1 P1, and RF2's whole argument).
//
// ⛔ AND IT IS NOT A SECOND TWO-DEPTH COMPARISON (test-cs013-p3.js). `d.depth
// <= r.depth` compares two POSITIONS, which is ordinary arithmetic. The build's
// one two-depth comparison of the OTHER kind is the strike's, where a position
// is compared against a LENGTH — that is what GDD 6.5's `anchored` field
// records and what makes the strike singular.
//
// ⛔ EACH RING IS RESOLVED ONCE, AT THE STEP THE DESCENT REACHES IT, AND THAT
// IS "YOU STOP EARNING" (plan §8). `taken` goes null -> true or null -> false
// and never moves again, so a ring the craft was not inside is MISSED rather
// than still available lower down. A miss is the ABSENCE of a call: no penalty,
// no counter, no streak, and no bonus for a full set.
//
// ⛔ RF4's PAYOUT IS THE BOUNTY'S ROW, NOT AN ENTITY PRICE: addScore() with an
// unmultiplied literal, and nothing else. ⛔ NO comboKill(), NO dropToken(), NO
// tally.kills and NO sfx("kill") — a ring is not a kill and a Dive is not a
// kill site, so what GDD 7 says is multiplied and what builds the combo are
// both untouched (O4's rule working, not an exception to it). ⛔ addScore() is
// unchanged and stays the ONE writer and the ONE life-awarder, so a ring can
// cross an extra-life milestone and that is addScore() doing its job.
//
// ⛔ A DEAD CRAFT RESOLVES NOTHING, diveStrike()'s guard verbatim. The freeze is
// running; the next live step respawns, restarts the dive and re-lays the set.
//
// ⛔ AND SINCE CS014 P2 THE RESOLUTION IS THE SEAT FOR BOTH SOUNDS (GDD 11.8;
// RF8-A), one call on each branch of the one line that decides. ⛔ A MISS HAS
// TO SOUND: "you stop earning" is the ABSENCE of a score, so without a cue the
// only thing that tells the player is a number that did not move (GDD 1.1 P2).
// ⛔ NEITHER IS A KILL SOUND AND NEITHER TAKES A VOICE — a ring has no
// sfxVoice because a ring is not an entity, so there is no C.SFX_KILL_PITCH
// row and the build's eleven voices are unmoved.
function takeRings(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;
  const rings = state.dive.rings;
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    if (r.taken !== null) continue;
    if (state.dive.depth > r.depth) continue;
    r.taken = Math.abs(laneDelta(well, r.lane, sk.lane)) <= C.RING_ARC_LANES;
    if (r.taken) { addScore(C.RING_POINTS); state.tally.ringsTaken++; sfx("ringTake"); }
    else sfx("ringMiss");
  }
}

// ---------------------------------------------------------------------------
// Starting a dive — and ⛔ THE FILTER, which is the trap in this feature
// ---------------------------------------------------------------------------
//
// ⛔ THE DIVE IS NOT THORNS-ONLY. It is tempting to reason that a well is
// cleared before a dive, so the only thing left standing is Thorns. It is not:
// WeaverBolt ships `blocksClear = false` deliberately and with a comment
// (07-enemies.js — "a bolt in flight must not hold a cleared well open"), so
// wellCleared() returns true with a bolt travelling, and that bolt carries
// killDepth = 1 - C.RIM_CONTACT_DEPTH and is climbing toward the rim the player
// is about to leave.
//
// ⛔ SO THE BOARD IS FILTERED DOWN TO `anchored` ENTITIES, READ OFF THE CONTRACT
// FIELD AND NEVER A CLASS NAME (GDD 6.5). Today `anchored` is exactly the
// Thorn, and the rule generalises correctly rather than by coincidence:
// `anchored` means "`depth` is a LENGTH", and the Dive's hazard IS the lane
// extent. What survives a dive and what threatens it are one set, not two.
//
// ⛔ GDD 5's ⚠ SETTLED "in-flight shots are cleared at dive start" is the
// player's half of the same rule and is unchanged — a Thorn you were about to
// destroy is still there, deliberately, and the lesson is "clear thorns before
// the last enemy". Do not soften it.
//
// ⛔ `!e.dead` IS LOAD-BEARING ON THE REPEAT PATH, not belt and braces. A dive
// that ends in a strike restarts through here, and on a fully-thorned well the
// struck Thorn was killed by diveRespawn() one line earlier — without the
// deadness test it would survive the filter and be struck again forever, which
// is the exact loop the termination guarantee exists to close.
function startDive(state) {
  resetDive(state);
  state.dive.active = true;
  state.shots = [];
  state.enemies = state.enemies.filter(e => e.anchored && !e.dead);
  // ⛔ A JUMP IN FLIGHT LANDS ON THE CLEAR STEP (GDD 14.2; CS012 P5, R4). The
  // dive short-circuits the gameplay pass, so an airborne craft carried into
  // one would hold its immunity, its lift and its music high-pass for the whole
  // descent with no way to come down. Beside the shot clear for the same
  // reason: what belongs to the well being left does not cross the throat.
  // ⛔ THE DIVE THEREFORE ALWAYS STARTS GROUNDED, in either mode.
  resetJump(state);
  // ⛔ AND THE TOKENS END WITH THE WELL (GDD 14.1; CS013 T5; 10-powerups.js):
  // no token rises through a Dive, and no Lance, Spread or Ward crosses the
  // throat — so a Ward can never absorb this module's strike. Beside the jump
  // and the shots, for their reason.
  resetTokens(state);
  // ⛔ AND OVERDRIVE'S RING SET IS LAID (GDD 14.5; CS014 RF1, RF3) — layRings()
  // is its ONE way in, and it is a no-op outside modeHas("rings"). ⛔ BELOW the
  // filter and the three resets, deliberately: everything above belongs to the
  // well being LEFT, and the set belongs to the flight about to start.
  // ⛔ The well is read the way Game.update() and Game.draw() read it, off
  // state.wellIndex — the OUTGOING well, because nextWell() runs at the dive's
  // END. Taking it as a parameter would change a signature four closed files
  // call by name.
  layRings(state, WELLS[state.wellIndex]);
  // GDD 5's rising sweep. HERE, so a repeated dive plays it again (plan §7).
  sfx("dive");
}

// ---------------------------------------------------------------------------
// The strike (GDD 4.5 item 5) — ⛔ AND IT IS NOT A killDepth
// ---------------------------------------------------------------------------
//
// The Thorn's killDepth stays null forever. The two quantities are different
// kinds of number and the whole point of the `anchored` field is saying which:
//
//   an anchored entity's `depth`  a LENGTH — the extent [0, depth] rooted at
//                                 the throat
//   dive.depth                    a POSITION, running 1 -> 0
//
// So the strike is `dive.depth <= e.depth`, ⛔ THE ONLY TWO-DEPTH COMPARISON IN
// THE BUILD, which is why it lives here and not in the one collision pass
// (09-collision.js), whose header's "there is no term here for where the
// Skimmer is" has to stay literally true.
//
// A long Thorn is struck early in the descent and a short one late — thorn
// length IS the hazard, exactly as GDD 8 intends when it makes Weaver thorn
// length a difficulty axis. And because every extent is rooted at the throat,
// reaching depth 0 in a thorned lane is always a strike: "thread between the
// Thorns" means "be in a lane that has none", which is also why snap assist
// stays live (see updateDive).
//
// ⛔ laneHit(), the same lane-sameness the rest of the build uses — half a lane
// either side, via laneDelta so a Ring's seam is a neighbourhood and not a
// fifteen-lane gap (09-collision.js). There is no second idea of sameness here.
function diveHazard(state, well, lane, depth) {
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !e.anchored) continue;
    if (depth > e.depth) continue;               // above the tip: clear
    if (!laneHit(well, e.lane, lane)) continue;
    return e;
  }
  return null;
}

// Would a diver in `lane` be struck at some point in the descent? Any live
// anchored entity in the lane will do it: the extent is rooted at the throat,
// so depth 0 is inside every one of them. ⛔ Hence depth 0 here rather than a
// length threshold — a "short enough to survive" Thorn does not exist.
function diveLaneBlocked(state, well, lane) {
  return diveHazard(state, well, lane, 0) !== null;
}

// One strike test. Returns whether the craft actually died.
//
// ⛔ IT ROUTES THROUGH killSkimmer() LIKE EVERY OTHER DEATH CONDITION
// (09-collision.js), so item 5 inherits the invulnerability guard, the life,
// the purge re-latch, the freeze and the game-over stop without writing any of
// them. ⛔ And the return value is read off `sk.dead` rather than assumed:
// killSkimmer() declines while state.invulnTime is inside C.RESPAWN_INVULN, and
// an invulnerable diver must pass through the Thorn rather than destroy it for
// free — the repeat below is not a consolation prize.
function diveStrike(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return false;
  if (!diveHazard(state, well, sk.lane, state.dive.depth)) return false;
  killSkimmer(state);
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`), and behind the same `sk.dead`
  // the return value is read off: an invulnerable diver passes through the
  // Thorn, and a strike that killed nobody is not a death. GDD 4.5 item 5.
  if (sk.dead) { state.tally.thornDeaths++; sfx("diveStrike"); }
  return sk.dead;
}

// ---------------------------------------------------------------------------
// ⛔ THE DEATH LOOP GUARD. The naive respawn does not terminate.
// ---------------------------------------------------------------------------
//
// Work it through with nothing but the shipped rules: strike -> killSkimmer() ->
// hit-stop -> respawnSkimmer() puts the craft back in the lane it died in
// (GDD 4.4) -> the Thorn is still there, CORRECTLY, because the rim-push clamp
// skips `anchored` entities -> the dive repeats -> the strike is true again the
// instant C.RESPAWN_INVULN expires. A full-length Thorn burns a life every
// 1.5 s until the run ends.
//
// ⛔ THE GUARD IS THE LANE. A dive respawn lands in the nearest Thorn-free lane,
// chosen deterministically: lowest |laneDelta| from the lane it died in, ties
// toward INCREASING lane. Written as an outward walk (+1, -1, +2, -2, ...)
// rather than a scan with a comparator, because the walk IS the tie-break and
// there is nothing left to get wrong.
//
// ⛔ NO RNG. The run has ONE stream (01-rng.js) and a dive spends none of it; a
// draw here would make the well transition's cost depend on the board.
//
// ⛔ laneDelta's topology is inside laneWrap/the range test, not here: on a
// closed well the walk wraps, on an open one it skips candidates the well does
// not have rather than clamping them (which would visit the end lane twice and
// silently prefer it).
function diveRespawnLane(state, well, diedLane) {
  const n = well.lanes;
  const base = laneNormalize(well, Math.round(diedLane));
  for (let step = 0; step <= n; step++) {
    for (let s = 0; s < (step === 0 ? 1 : 2); s++) {
      const raw = base + (s === 0 ? step : -step);
      if (!well.closed && (raw < 0 || raw > n - 1)) continue;
      const lane = laneWrap(well, raw);
      if (!diveLaneBlocked(state, well, lane)) return lane;
    }
  }
  return null;
}

// The first LIVE step after a dive death — the same trigger as the gameplay
// pass's (23-main.js): the step that finds `skimmer.dead` IS the respawn step,
// never a timer started at death, which would not have advanced through the
// freeze.
//
// ⛔ AND IF EVERY LANE HOLDS A THORN, THE STRUCK THORN DIES INSTEAD. That is the
// termination guarantee, and it is ⛔ THE ONLY PATH IN THE BUILD BY WHICH A
// THORN IS DESTROYED BY SOMETHING OTHER THAN A SHOT (07-enemies.js says so at
// the class). Killing it frees the died lane, so the walk above finds it at
// step 0 on the repeat and the dive cannot cycle: every pass either lands
// somewhere safe or removes one Thorn, and there are finitely many.
//
// ⛔ Through respawnSkimmer(), the one respawn path, handed the lane rather
// than forking it: the rim push, the invulnerability arming and the ⚠ SETTLED
// anchored skip are all its and none of them are rewritten here. The push is a
// no-op on a dive board — every survivor is anchored — and that is a
// consequence of the filter, not a second rule.
//
// ⛔ The dive then repeats FROM THE GRACE BEAT and state.level does NOT advance:
// GDD 5, "repeats the dive, not the well."
function diveRespawn(state, well) {
  const diedLane = state.skimmer.lane;
  let lane = diveRespawnLane(state, well, diedLane);

  if (lane === null) {
    // ⛔ THE LANE IS RESOLVED FIRST AND THE HAZARD IS LOOKED UP AT IT. The craft
    // dies on a CONTINUOUS lane and comes back on a lane CENTRE, and at
    // C.HIT_LANE_TOL 0.5 a craft sitting exactly on a boundary matches the
    // Thorns in both neighbouring lanes — so killing "the one in the lane it
    // died on" could destroy a Thorn that was not blocking the lane it lands
    // in, and the repeat would strike again with nothing freed. Asking at the
    // landing lane makes the entity destroyed provably the one in the way.
    lane = laneNormalize(well, Math.round(diedLane));
    const struck = diveHazard(state, well, lane, 0);
    // ⛔ NO addScore() AND NO `tally.kills`, and that is a decision (plan §0,
    // CS008 P2): the termination guarantee destroying a Thorn is not the player
    // destroying it. The build's four kill sites are all in 09-collision.js.
    // ⛔ AND NO KILL SOUND (CS009 P5), for the same reason: diveStrike's sound
    // already covers the moment.
    if (struck) struck.dead = true;
  }

  respawnSkimmer(state, well, lane);
  startDive(state);
}

// ---------------------------------------------------------------------------
// One simulation step of a dive. ⛔ THE WHOLE GAMEPLAY PASS IS SHORT-CIRCUITED.
// ---------------------------------------------------------------------------
//
// Called from Game.update() below the game-over stop and above everything else,
// which returns immediately after. What that leaves running is exactly the list
// GDD 5 describes and nothing more: the respawn aftermath, the invulnerability
// clock, the craft's own rotation, the beat, and the strike.
//
// ⛔ SNAP ASSIST STAYS LIVE, and it is not an oversight. C.HIT_LANE_TOL is 0.5,
// so safety is lane-GRANULAR — "thread between the Thorns" means "be in a lane
// that has none" — and snapping to a lane centre is what makes that
// unambiguous. Snapping is aligned with the hazard rather than against it. This
// is pillar P1 and it does not get suspended for a set piece.
//
// ⛔ THE STRIKE IS TESTED BEFORE THE COMPLETION CHECK. The last step of a
// descent is at depth 0, which is inside every extent rooted at the throat, so
// testing completion first would let a player who never left a thorned lane
// walk out of it on the final step.
function updateDive(state, well, dt) {
  const d = state.dive;

  // ⛔ The death aftermath first, exactly as the gameplay pass does it, and the
  // invulnerability clock is the ELSE branch so the respawn step is not also
  // aged. Falling through afterwards is deliberate: diveRespawn() has just
  // restarted the dive at timer 0, and the step it lands on is a grace step,
  // where there is no strike test to be caught by.
  if (state.skimmer.dead) diveRespawn(state, well);
  else if (state.invulnTime < C.RESPAWN_INVULN) state.invulnTime += dt;

  state.skimmer.update(dt, well, state.input);

  // ⛔ COUNTS UP, through the WHOLE dive (GDD 16.3 — no countdown anywhere in
  // the build). diveTime() is the total — C.DIVE_TIME, or C.DIVE_TIME_OD under
  // modeHas("rings") — and C.DIVE_GRACE is a slice off its front, so the
  // descent is that total minus the grace and retuning either moves the beats
  // together. ⛔ Read ONCE per step, into `total`, so the beat and the
  // completion check below cannot disagree about which dive this is.
  d.timer += dt;

  const total = diveTime();
  if (d.timer < C.DIVE_GRACE) {
    d.phase = "grace";
    d.depth = 1;
  } else {
    d.phase = "descent";
    const span = total - C.DIVE_GRACE;
    const t = span > 0 ? (d.timer - C.DIVE_GRACE) / span : 1;
    d.depth = t >= 1 ? 0 : 1 - t;
  }

  // ⛔ OVERDRIVE'S RING FLIGHT, ABOVE THE STRIKE TEST AND ABOVE THE COMPLETION
  // CHECK, FOR THE STRIKE'S OWN REASON (CS014 RF2). The last step of a descent
  // is at depth 0, which is at or past every ring's depth — so a take pass
  // below the completion check would never resolve the deepest ring, and one
  // below the strike would silently unpay a diver who crossed a ring on the
  // step a Thorn killed them. A no-op on an empty set, which is every Classic
  // step and every grace step.
  takeRings(state, well);

  // GDD 4.5 item 5. ⛔ Descent only — the grace beat is the input opportunity a
  // full-length Thorn would otherwise never give (00-config.js at DIVE_GRACE).
  if (d.phase === "descent" && diveStrike(state, well)) return;

  // ⛔ The dive's state is put back by nextWell() -> enterWell() -> resetDive(),
  // the one path, rather than by a second write here. On the last life
  // killSkimmer() has already set screen = "gameover" and Game.update() returns
  // above this on every later step, so a dive death that ends a run stops the
  // dive too and the frozen board stays on screen.
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`), and ⚠ it is `divesCompleted`
  // rather than "divesSurvived": a diver who loses a life to a Thorn respawns
  // and finishes the dive, so this counts dives that REACHED C.DIVE_TIME. The
  // lives lost inside them are `thornDeaths`, beside it.
  // ⛔ AND `ringSetsTaken` (CS015 P2): the set in force at completion — a
  // repeated dive re-laid it — laid and every ring of it taken. Write-only.
  if (d.timer >= total) {
    state.tally.divesCompleted++;
    if (d.rings.length > 0 && d.rings.every(r => r.taken === true)) state.tally.ringSetsTaken++;
    nextWell();
  }
}

// ==========================================================================
// 12-scoring.js
// ==========================================================================
// 12-scoring.js — points, the clear bonuses and extra lives (GDD 7, 4.4). CS008 P2.
//
// ⛔ addScore() IS THE ONLY WRITER OF state.score AND THE ONLY PLACE A LIFE IS
// AWARDED. Every kill site, every bonus and every chip routes through it, so
// the milestone logic has exactly one place to live (GDD 7). A second writer is
// a score the milestones never saw.
//
// ⛔ NOTHING HERE SPENDS AN RNG DRAW, AND NOTHING IN THE SIMULATION BRANCHES ON
// state.score. The one thing scoring feeds back into the run is `lives`, through
// the milestone below — which is why a scored run and an unscored one spend the
// same draws until an awarded life outlives a game over (test-cs008-p2.js).
//
// ⛔ WHERE THE POINTS COME FROM. An enemy's worth is read off the entity through
// its fourth contract method, points() (07-enemies.js, GDD 6.5), and awarded by
// the KILL SITE on the false -> true `dead` transition. There are FOUR kill
// sites and no fifth — three until CS013 P3 added the jump strike (W4):
//
//   collideShots()     a shot kill                          (09-collision.js)
//   collideSkimmer()   the rim sweep — a shot that never had to fly (P1b)
//   updatePurge()      both uses, normal points (Paul, P2s)
//   jumpStrike()       an airborne craft in an aloft entity's lane (CS013 P3)
//
// ⛔ The Dive's termination kill awards NOTHING (11-dive.js): it is not the
// player destroying a Thorn, and it is not counted in `tally.kills` either. The
// Thorn itself scores per CHIP from inside its own onShot(), because the enemy
// decides what a hit does — its points() is 0, so its death pays nothing extra.
//
// ⛔ AND SINCE CS012 P4 THIS FILE ALSO OWNS THE COMBO (GDD 14.4), at the foot.
// ⛔ THE MULTIPLIER IS APPLIED AT THOSE KILL SITES, NOT IN addScore() — see the
// header there before changing either.

// Add `n` points, and award every extra life the new total has crossed.
//
// ⛔ `state.nextLife` IS THE NEXT MILESTONE, A FIELD, NOT A FORMULA OVER THE
// SCORE. C.EXTRA_LIFE_FIRST, then every C.EXTRA_LIFE_EVERY (Paul, P3s). The
// `while` is what makes one award that crosses two milestones pay both.
//
// ⚠ AN AWARD PAST C.LIVES_MAX IS LOST. The milestone still advances — a life
// refused at the cap is not banked for later — and since CS009 P5 it is voiced
// with `lifeLost`, GDD 4.4's "never silently swallowed". ⛔ Only on a LIVE run:
// a milestone crossed on the game-over step is not an award refused at the cap
// (the rule below), so it is silent (plan §0).
//
// ⛔ A STOPPED RUN SCORES BUT GAINS NO LIFE (Paul, 2026-09-13). A clear edge on
// the step that spent the last life (a Weaver bolt kills as a shot takes the
// well's last enemy) still pays its bonuses, because the edge runs after
// killSkimmer(). The points count toward the final score, but a milestone
// crossed there awards nothing: `lives` stays 0 on the game-over stop. An award
// EARLIER in that step, before the death, is not affected — the run had not
// stopped yet.
function addScore(n) {
  state.score += n;
  while (state.score >= state.nextLife) {
    if (state.screen !== "gameover") {
      if (state.lives < C.LIVES_MAX) { state.lives += 1; state.tally.extraLives++; sfx("extraLife"); }
      else sfx("lifeLost");
    }
    state.nextLife += C.EXTRA_LIFE_EVERY;
  }
}

// The well-clear bonuses (GDD 7), called ONCE, from Game.update()'s clear edge —
// the step wellCleared() first says yes, before startDive() (Paul, P4s).
//
// ⛔ IN THIS ORDER, AND THE ORDER IS FIXED: the level bonus, the unspent Purge,
// no death, and the Start Depth bonus (CS008 P3).
//
// ⛔ THE START DEPTH BONUS IS PAID ON CLEARING THE STARTING WELL (Paul, S2) — it
// counts toward lives, but only for a player who survives the well they chose.
// No "paid" flag: `state.level` only rises, through nextWell(), and the `w`
// debug key moves wellIndex and never the level, so `level === startDepth` is
// true on exactly one clear edge per run. Level 1 pays startBonus(1), which is
// 0. ⚠ The game-over step's clear pays it like the other three — P2's rule, a
// stopped run scores but gains no life (addScore() above).
//
// ⛔ "NO DEATH" IS state.diedThisWell, which enterWell() clears and killSkimmer()
// sets. A dive death happens AFTER this edge and is cleared by nextWell() before
// the next one, so it never voids the bonus it follows — with no special case.
function clearBonuses(state) {
  addScore(C.PTS_WELL_PER_LEVEL * state.level);
  if (state.purgeUses === 0) addScore(C.PURGE_SAVED_BONUS);
  if (!state.diedThisWell) addScore(C.PTS_NO_DEATH_WELL);
  if (state.level === state.startDepth) addScore(startBonus(state.startDepth));
}

// GDD 4.6's SkillStep bonus for starting at depth `d`. ⛔ THE FORMULA IS
// CANONICAL (Paul, S3) and GDD 4.6's table was corrected to it:
//   1 -> 0, 3 -> 2,400, 5 -> 7,400, 7 -> 14,100, 9 -> 22,300,
//   17 -> 67,600, 33 -> 204,800, 81 -> 887,200.
// A pure function of `d` — it reads no state, and spends no draw.
function startBonus(d) {
  const R = C.START_BONUS_ROUND;
  return Math.round(C.START_BONUS_SCALE * Math.pow(d - 1, C.START_BONUS_EXP) / R) * R;
}

// ---------------------------------------------------------------------------
// THE COMBO — OVERDRIVE'S (GDD 14.4; O3, O4, O5, R2, R6; CS012 P4)
// ---------------------------------------------------------------------------
//
// ⛔ THE MULTIPLIER IS APPLIED AT THE KILL SITES AND NEVER INSIDE addScore()
// (R6). `addScore(e.points() * comboMult())` — five lines in 09-collision.js.
// addScore() stays the ONE writer of state.score and the one life-awarder, and
// it is unchanged: a multiplier folded into it would silently multiply the
// clear bonuses, the Start Depth bonus and the Thorn's per-chip 5, which is
// exactly the scope O4 ruled out.
//
// ⛔ WHAT IT MULTIPLIES, AND WHAT BUILDS IT, ARE ONE RULE (O4): kill points at
// the four kill sites — a shot, the rim sweep, both Purge uses and CS013 P3's
// jump strike — and every kill there builds it. Thorn chips, the clear bonuses
// and the Start Depth bonus are NOT multiplied and do NOT build it. ⛔ The Dive's termination kill
// still pays nothing and builds nothing (GDD 5, 7).
//
// ⛔ EACH KILL SCORES AT THE CURRENT MULTIPLIER AND THEN RAISES IT. That is the
// order O3's table was measured on, and it is why the kill sites read
// `addScore(e.points() * comboMult()); comboKill(state);` in that order.
//
// ⛔ ALL FOUR ARE TOP-LEVEL AND ALL FOUR ARE NO-OPS OUTSIDE modeHas("combo"),
// so a Classic run never touches state.combo at all: `mult` stays exactly 1,
// comboMult() returns exactly 1, and `n * 1 === n` in IEEE-754 — a Classic
// session's hash is identical to one built with these calls mutated out of
// every kill site (test-cs012-p4.js).
//
// ⛔ NOTHING HERE SPENDS AN RNG DRAW OR CALLS heat(). The combo is a function
// of kills and time, not of the level — GDD 8's one clock is untouched by it,
// and test-cs007-p2.js holds heat()'s call sites exact.

// The factor a kill site multiplies by. ⛔ EXACTLY 1 in Classic, never 1.0
// computed from something.
function comboMult() {
  if (!modeHas("combo")) return 1;
  return state.combo.mult;
}

// ⛔ THE ONE comboLost SEAT (O8; GDD 11.8, 14.4: "loss has its own sound"), and
// the one place `mult` falls. Both fall paths — a lapsed window and a death —
// come through here, so the sound is once per FALL rather than once per cause,
// and a fall that would not move the multiplier (a death at ×1) is silent.
function comboDrop(state, to) {
  const c = state.combo;
  if (to >= c.mult) return;
  c.mult = to;
  sfx("comboLost");
}

// A kill at one of O4's four sites. ⛔ Called AFTER the kill has been scored.
function comboKill(state) {
  if (!modeHas("combo", state.mode)) return;
  const c = state.combo;
  // ⛔ THE WINDOW RESTARTS ON EVERY KILL (O3), which is what makes COMBO_WINDOW
  // a lapse clock rather than a gap test between two kills.
  c.since = 0;
  c.kills++;
  if (c.kills >= C.COMBO_KILLS_PER_STEP) {
    c.kills = 0;
    c.mult = Math.min(c.mult + C.COMBO_STEP, C.COMBO_MAX);
  }
  // ⛔ AFTER the raise, so `peak` is the highest multiplier the run REACHED.
  // The first kill of an Overdrive run puts it at 1, which is what separates
  // "an Overdrive run that killed nothing" from a Classic run's 0 (R7).
  if (c.mult > c.peak) c.peak = c.mult;
}

// ⛔ A DEATH IS ×1 AT ONCE, WITH THE KILL COUNT EMPTIED (O3) — not a decay.
// Seated in killSkimmer() BELOW the invulnerability guard (09-collision.js), so
// a kill the guard declined is not a combo loss either.
function comboDeath(state) {
  if (!modeHas("combo", state.mode)) return;
  const c = state.combo;
  comboDrop(state, 1);
  c.kills = 0;
  c.since = 0;
}

// One simulation step of the lapse clock, from Game.update()'s play step.
//
// ⛔ THE CLOCK HOLDS THROUGH A DIVE (O5). MEASURED in the plan (§1.3): the
// median gap from the last kill before a clear to the first kill after it is
// 4.58–4.83 s, of which the Dive is 2.6 s and the next well's first release is
// most of the rest — so a strict window would cost half a step at every well
// change. The Dive is GDD 1.1 P4's breath and nothing can be killed in one.
// The guard is HERE as well as in the caller's ordering, so the rule is the
// function's and not the call site's.
//
// ⛔ `since` COUNTS UP (GDD 16.3) and wraps at the window: a window with no
// kill costs C.COMBO_STEP, and each further window costs another, down to ×1
// (O3). ⛔ The kill count is NOT emptied by a lapse — O3 empties it on a death
// alone. The wrap is what makes the HUD's depletion ring refill for each
// further step, which is the loss the player is being shown.
function updateCombo(state, dt) {
  if (!modeHas("combo", state.mode)) return;
  if (state.dive.active) return;
  const c = state.combo;
  c.since += dt;
  while (c.since >= C.COMBO_WINDOW) {
    c.since -= C.COMBO_WINDOW;
    comboDrop(state, Math.max(1, c.mult - C.COMBO_STEP));
  }
}

// ==========================================================================
// 13-render-well.js
// ==========================================================================
// 13-render-well.js — the well renderer (GDD 3.6, 3.7, 10.2). Consumes the
// depth model from 03-wells.js (rimPoint/throatPoint/screenPos/wellVertCount)
// and draws lanes + rim/throat rings. No game state read here beyond what a
// caller passes in — this module is pure `(ctx, well, level, laneState) -> pixels`.
//
// ⛔ Two primitives only: drawPoly (path builder, no fill) and glowStroke (two
// strokes composited with `lighter`, wide-and-dim then thin-and-bright). GDD
// 10.2: no per-entity pipelines, no fills, no sprites, no textures.
//
// Occupancy/shot/charge lighting (laneState) is CONSUMED here and produced
// somewhere else: buildLaneState() (23-main.js, CS006 P4) reads state.enemies
// and state.shots and hands this function a filled array. ⛔ That producer is
// gated to the dim band, because outside levels 65-80 a lit spoke and an unlit
// one draw at the same alpha — see wellBaseAlpha() and the spoke loop below.
// `null` is still a supported argument and is what every other level passes.

// Build a canvas 2D path from a point array. `closed` draws the final
// rim[n-1] -> rim[0] edge; open strips omit it (GDD 3.3's loop/strip split).
function drawPoly(ctx, points, closed) {
  if (!points.length) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  if (closed) ctx.closePath();
}

// Two-pass glow stroke on an already-built path: wide+dim, then thin+bright,
// composited with `lighter`. ⛔ Caller must have called ctx.beginPath()+path
// commands (e.g. via drawPoly) immediately before this, since it re-strokes
// the CURRENT path twice rather than taking a point array itself — that keeps
// the multi-segment lane case (draw once, stroke twice) cheap.
function glowStroke(ctx, color, width, alpha) {
  const a = alpha === undefined ? 1 : alpha;
  const prevOp = ctx.globalCompositeOperation;
  const prevAlpha = ctx.globalAlpha;
  const prevWidth = ctx.lineWidth;
  const prevStyle = ctx.strokeStyle;

  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = color;

  ctx.lineWidth = width * C.GLOW_WIDE_W;
  ctx.globalAlpha = C.GLOW_WIDE_ALPHA * a;
  ctx.stroke();

  ctx.lineWidth = width;
  ctx.globalAlpha = C.GLOW_THIN_ALPHA * a;
  ctx.stroke();

  ctx.globalCompositeOperation = prevOp;
  ctx.globalAlpha = prevAlpha;
  ctx.lineWidth = prevWidth;
  ctx.strokeStyle = prevStyle;
}

// ⛔ THE ONE TEXT PATH IN THE BUILD (CS008 P4, T1) — the only strokeText and
// the only fillText call site, pinned by test-cs008-p4.js. A glyph is not a
// polyline, so text is the single sanctioned exception to "drawPoly +
// glowStroke only"; the glow is still GDD 10.2's two passes under `lighter`,
// wide-and-dim then bright, and never shadowBlur. `y` is the TOP of the text.
function drawText(ctx, str, x, y, size, color, align) {
  const prevOp = ctx.globalCompositeOperation;
  const prevAlpha = ctx.globalAlpha;
  const prevWidth = ctx.lineWidth;

  ctx.globalCompositeOperation = "lighter";
  ctx.font = size + "px " + C.TEXT_FONT_FAMILY;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  ctx.strokeStyle = color;
  ctx.fillStyle = color;

  ctx.lineWidth = C.GLOW_WIDE_W;
  ctx.globalAlpha = C.GLOW_WIDE_ALPHA;
  ctx.strokeText(str, x, y);

  ctx.globalAlpha = 1;
  ctx.fillText(str, x, y);

  ctx.globalCompositeOperation = prevOp;
  ctx.globalAlpha = prevAlpha;
  ctx.lineWidth = prevWidth;
}

// Depth-varying line weight (GDD 10.1 — vector hardware couldn't do this).
// Linear in depth: thin at the throat, thick at the rim.
function laneLineWidth(depth) {
  const d = depth < 0 ? 0 : (depth > 1 ? 1 : depth);
  return C.LINE_W_THROAT + (C.LINE_W_RIM - C.LINE_W_THROAT) * d;
}

// GDD 3.6 band colour for a level. Past C.BAND_RNG_LEVEL the band table has no
// row left, and colour comes from the seeded RNG — `rng` is a 0..1 draw the
// caller supplies (mulberry32, per GDD 16.1); the RNG itself is never owned by
// this module. ⛔ And the caller hands over a value it drew in the SIMULATION
// (state.bandRoll, 02-state.js), never a live stream this could call: nothing
// in the draw path may spend a draw (CLAUDE.md, Math and lifecycle;
// RATIONALE.md#draw-path-rng). Taking a number rather than a function is what
// makes that unavailable from here.
function wellBandColor(level, rng) {
  if (level > C.BAND_RNG_LEVEL) {
    const palette = C.BAND_RNG_COLORS;
    const r = rng === undefined ? 0 : rng;
    const i = Math.min(palette.length - 1, Math.floor(r * palette.length));
    return palette[i];
  }
  for (const band of C.BAND_COLORS) {
    if (level <= band.hi) return band.color;
  }
  return C.BAND_COLORS[C.BAND_COLORS.length - 1].color;
}

// GDD 3.7 — the dim band. Levels 65-80 render at DIM_BAND_ALPHA; everything
// else is fully opaque. ⚠ SETTLED — the band and its alpha are not tuning
// targets (GDD 3.7); do not adjust either from here.
function wellBaseAlpha(level) {
  return (level >= C.DIM_BAND_LO && level <= C.DIM_BAND_HI) ? C.DIM_BAND_ALPHA : 1.0;
}

// Project a normalized-space point array (well.rim or wellThroat(well)) into
// screen space via C.WELL_CX/CY/RADIUS — the same mapping screenPos uses, but
// applied to a whole polygon at once for the rim/throat rings, which sit at a
// single depth and so need no per-point perspective easing.
function projectPoly(points) {
  const out = new Array(points.length);
  for (let i = 0; i < points.length; i++) {
    out[i] = {
      x: C.WELL_CX + points[i].x * C.WELL_RADIUS,
      y: C.WELL_CY + points[i].y * C.WELL_RADIUS,
    };
  }
  return out;
}

// Draw one well: rim ring, throat ring, and every lane's rim->throat spoke.
//
//   well       from WELLS (03-wells.js)
//   level      game.level — drives band colour (GDD 3.6) and dim band (3.7)
//   laneState  optional per-lane lighting: array indexed by lane, each entry
//              `{ occupied, shotTravel, surgeCharge }` or falsy. Any truthy
//              flag lights that lane at LANE_LIT_ALPHA regardless of the dim
//              band — GDD 3.7's "lanes light on occupancy, shot travel, and
//              Surger charge" escape hatch. Supplied by buildLaneState()
//              (23-main.js) inside the dim band, and null everywhere else.
//   rng        0..1 value for the past-99 palette (wellBandColor); unused at or
//              below C.BAND_RNG_LEVEL. ⛔ A NUMBER, NOT A STREAM — the caller
//              passes state.bandRoll, which nextWell() drew during a simulation
//              step (CLAUDE.md, Math and lifecycle).
//   rimGlow    optional 0..1, the rim pulse (CS010 P4): 23-main.js's audioFrame()
//              reads it off `heart`'s onsets. Absent or 0 draws the rim as
//              before. It moves the RIM stroke's width and alpha and nothing else.
function drawWell(ctx, well, level, laneState, rng, rimGlow) {
  const color = wellBandColor(level, rng);
  const baseAlpha = wellBaseAlpha(level);
  const rim = projectPoly(well.rim);
  const throat = projectPoly(wellThroat(well));
  const vcount = wellVertCount(well);
  const pulse = rimGlow > 0 ? Math.min(rimGlow, 1) : 0;

  // Rim and throat rings, each a single flat-weight stroke (they sit at one
  // depth apiece, so there is no line-weight gradient to apply within them).
  drawPoly(ctx, rim, well.closed);
  glowStroke(ctx, color, C.LINE_W_RIM * (1 + C.RIM_PULSE_W * pulse),
             Math.min(1, baseAlpha * (1 + C.RIM_PULSE_ALPHA * pulse)));

  drawPoly(ctx, throat, well.closed);
  glowStroke(ctx, color, C.LINE_W_THROAT, baseAlpha);

  // Spokes: rim vertex -> throat vertex at every vertex index, one spoke per
  // index. Each spoke bounds up to two lanes (the one ending here and the one
  // starting here — GDD 3.3's lane IS the edge between two consecutive rim
  // vertices, so a spoke is shared exactly where two lanes meet). A spoke
  // lights if EITHER neighbouring lane is lit; a closed well's spoke 0 wraps
  // to lane `lanes-1` on one side, and an open well's end spokes (0 and
  // vcount-1) have only one neighbouring lane.
  for (let i = 0; i < vcount; i++) {
    const laneEndingHere = well.closed ? (i - 1 + well.lanes) % well.lanes : i - 1;
    const laneStartingHere = well.closed ? (i % well.lanes) : i;
    const lit = laneState && (
      isLaneLit(laneState[laneEndingHere]) || isLaneLit(laneState[laneStartingHere])
    );
    const alpha = lit ? Math.max(baseAlpha, C.LANE_LIT_ALPHA) : baseAlpha;

    ctx.beginPath();
    ctx.moveTo(rim[i].x, rim[i].y);
    ctx.lineTo(throat[i].x, throat[i].y);
    glowStroke(ctx, color, laneLineWidth(0.5), alpha);
  }
}

// An out-of-range index (an open well's end spokes read laneState[-1] and
// laneState[lanes]) must be falsy or unlit. ⛔ buildLaneState() (23-main.js) is
// PREALLOCATED to C.LANE_LIT_MAX_LANES, so `laneState[lanes]` is a real entry
// rather than undefined — which is why that producer clears every slot it owns
// and not just the current well's lanes.
function isLaneLit(s) {
  return !!s && (s.occupied || s.shotTravel || s.surgeCharge);
}

// ==========================================================================
// 14-render-entities.js
// ==========================================================================
// 14-render-entities.js — entity draw code, kept apart from 06-shots.js so the
// glow/particle primitives here can move into kit-fx wholesale later (CLAUDE.md
// "Kit modules and extraction"). CS002 P3 added the shot streak;
// CS003 P1 adds the shared entity projection helper and the Vaulter; CS004 P2
// adds the Carrier's hull and its cargo glyphs, P3 the Weaver and its bolt, and
// P4 the Thorn — which is the first entity here that is NOT a silhouette at a
// point and so does not use entityPoints() at all. CS005 P2 adds the Drifter's
// two silhouettes and P3 the Surger, which is BOTH: a silhouette at a point and
// a segment along its lane. See drawThorn() and drawSurgeLane() at the foot.
// CS008 P4 adds drawFragments(), the death fragmentation, at the very foot, and
// CS013 P1 drawToken() just above it — a token is not an enemy, but it is drawn
// the same way.
//
// ⛔ drawPoly + glowStroke only (GDD 10.2). No fill, no sprite, no texture.
//
// ⛔ Readability contract (GDD 10.3): nothing opaque below C.READABILITY_DEPTH.
// A shot's leading edge fades linearly to nothing as it nears the throat,
// rather than snapping to invisible at the boundary or staying legible into
// the throat zone. GDD 10.3 carries the reason that band is a rule at all.
//
// ⛔ GDD 18 item 1 / CLAUDE.md: the title this game is an homage to is not
// written in any file in this repo, comments included — this one used to name
// it and CS004 P5 removed it. `src/` is concatenated into the shipped artifact,
// so a comment here is a string in dist/vector-vortex.html.

// Preallocated projection scratch — one point per end of the streak. Like
// screenPos() and skimmerPoints(), this makes drawShot() non-reentrant; it is
// a leaf call, so that is fine.
const _shotHead = { x: 0, y: 0 };
const _shotTail = { x: 0, y: 0 };

// 1 at/above READABILITY_DEPTH; below it, fades linearly to 0 at the throat.
function shotAlpha(depth) {
  if (depth >= C.READABILITY_DEPTH) return 1;
  return depth <= 0 ? 0 : depth / C.READABILITY_DEPTH;
}

// A short streak from the shot's leading edge (toward the throat) back to its
// trailing edge (toward the rim), C.SHOT_LEN deep. The trailing edge is capped
// at depth 1 — a shot fired this instant must not draw a tail past the rim.
//
// ⛔ `pierce` IS A COLOUR AND NOTHING ELSE (GDD 14.1; CS013 T7, T10): a Lance
// shot is the streak the player already knows, struck in the token gold, so
// "my shots go through" is legible on the shots themselves and costs the HUD
// nothing (T10). Draw-time only — the shot's own field (06-shots.js) decides
// what a hit does, and this only decides what it looks like. ⛔ Optional, and
// omitted it is the shipped colour, which is every caller before CS013 P2.
function drawShot(ctx, well, lane, depth, pierce) {
  const tail = depth + C.SHOT_LEN > 1 ? 1 : depth + C.SHOT_LEN;
  screenPos(well, lane, depth, _shotHead);
  screenPos(well, lane, tail, _shotTail);
  drawPoly(ctx, [_shotHead, _shotTail], false);
  glowStroke(ctx, pierce ? C.TOKEN_COLOR : C.SKIMMER_COLOR, laneLineWidth(depth), shotAlpha(depth));
}

// ---------------------------------------------------------------------------
// entityPoints — the shared silhouette projection. ALL NINE ENEMIES USE THIS.
// ---------------------------------------------------------------------------
//
// A local-space point array `poly` becomes screen points for an entity sitting
// at (lane, depth). Each point is:
//
//   l   lane offset in HALF-WIDTH units. l = ±1 is ±size/2 lanes, so the
//       silhouette spans exactly `size` lane widths at its extremes.
//   d   depth offset in HALF-EXTENT units, ±1, measured in PERSPECTIVE SPACE
//       and scaled by C.ENEMY_DEPTH_SCALE. Positive is toward the rim.
//
// ⛔ THE TRAP, AND IT IS NOT OBVIOUS. perspective() is depth^0.55, and screenPos
// lerps LINEARLY in perspective space. A silhouette built with a CONSTANT depth
// offset — the way SKIMMER_POLY is, correctly, because the Skimmer never leaves
// depth 1 — therefore covers about 13% of the well's screen length at the
// throat and about 3% at the rim. An enemy drawn that way is huge when it is
// far away and shrinks as it comes at you: the exact inverse of perspective,
// and it reads as a bug in the well, not in the enemy.
//
// So the depth extent is a fraction of the entity's OWN perspective position:
// half-extent = p * C.ENEMY_DEPTH_SCALE, converted back to a depth through
// invPerspective(). Screen size then falls off with distance the same way the
// lane width already does, and one constant tunes every enemy.
//
// The whole shape is pulled inward when it would otherwise reach past the rim,
// rather than letting invPerspective's clamp collapse the outer points onto the
// rim line. A rim-hunting Vaulter is the enemy the player most needs to read at
// a glance (GDD 1.1 P2), and it sits at exactly the depth where the clamp would
// flatten it into a different silhouette.
//
// ⛔ No per-frame allocation (GDD 17, perf budget). Each poly memoizes its own
// scratch array of screen points on first use — the same non-enumerable cache
// pattern wellThroat() uses, and for the same reason. Consequences: the array
// is SHARED, so copy out of it if you need to keep it, and entityPoints is
// non-reentrant PER POLY. Draw calls are sequential leaves, so that is fine.
function entityScratch(poly) {
  if (!poly._pts) {
    const pts = new Array(poly.length);
    for (let i = 0; i < poly.length; i++) pts[i] = { x: 0, y: 0 };
    Object.defineProperty(poly, "_pts", { value: pts, enumerable: false });
  }
  return poly._pts;
}

function entityPoints(well, lane, depth, poly, size) {
  const out = entityScratch(poly);
  const half = size / 2;
  const scale = C.ENEMY_DEPTH_SCALE;

  // The largest outward reach this shape asks for, and the centre position that
  // keeps it inside the rim. At depth 1 the shape sits with its outermost
  // points ON the rim and the rest inside it — the same relationship the
  // Skimmer's prongs have with the rim, arrived at from the other direction.
  let maxD = 0;
  for (let i = 0; i < poly.length; i++) if (poly[i].d > maxD) maxD = poly[i].d;
  const pMax = 1 / (1 + maxD * scale);
  let p = perspective(depth);
  if (p > pMax) p = pMax;

  for (let i = 0; i < poly.length; i++) {
    const q = poly[i];
    // ⛔ The lane offset is NOT normalized. On an open well an end-lane entity
    // reaches past the wall, and polyAt's backstop clamps it to the end vertex
    // — the silhouette flattens against the wall instead of teleporting to the
    // far side of the well. Normalizing here would wrap it (closed) or square
    // it off half a lane early (open), and the first is GDD 3.5's bug wearing
    // a rendering hat.
    screenPos(well, lane + q.l * half, invPerspective(p * (1 + q.d * scale)), out[i]);
  }
  return out;
}

// ---------------------------------------------------------------------------
// The Vaulter's silhouette (GDD 6.1, 18).
// ---------------------------------------------------------------------------
//
// GDD 6.1's flattened X, as one CLOSED concave outline: four arms reaching out
// across the lanes, a waist pinched in at each side, and a notch top and
// bottom. Wider across the lanes than it is deep — the flattening — so it reads
// as a wingspan blocking a lane rather than as a diamond.
//
// ⛔ GDD 18 item 3: this has to be OURS. The shape the original's is remembered for is
// a bowtie — two solid triangles meeting at a point, with nothing pinched and
// no notch. The four notches are the difference, and they are load-bearing, not
// decoration. Do not "simplify" this back to six points.
//
// Shape DATA, the same class of thing as WELLS' rim polygons. The scale is the
// tunable, and it lives in C.VAULTER_SIZE.
const VAULTER_POLY = [
  { l: -1.00, d: -0.55 },   // upper-left arm tip
  { l: -0.30, d:  0.00 },   // left waist
  { l: -1.00, d:  0.55 },   // lower-left arm tip
  { l:  0.00, d:  0.26 },   // near notch
  { l:  1.00, d:  0.55 },   // lower-right arm tip
  { l:  0.30, d:  0.00 },   // right waist
  { l:  1.00, d: -0.55 },   // upper-right arm tip
  { l:  0.00, d: -0.26 },   // far notch
];

// ⛔ drawPoly + glowStroke, one closed path, no fill (GDD 10.2). Line weight
// tracks depth exactly as the well's lanes do (laneLineWidth), so the craft
// belongs to the geometry it is climbing rather than sitting on top of it.
//
// ⛔ FULL ALPHA AT EVERY DEPTH — no shotAlpha()-style fade here. GDD 10.3 is a
// rule about what may be drawn OVER the throat zone (explosions, particles,
// popups); the enemy is the approaching thing that rule protects. Fading a
// Vaulter into the throat is the readability failure, not the fix for it.
function drawVaulter(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, VAULTER_POLY, C.VAULTER_SIZE), true);
  glowStroke(ctx, C.VAULTER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Reaver's silhouette (GDD 14.6, 18; CS012 P2, O16) — the Vaulter's X with
// two swept barbs on its rim-side arms.
// ---------------------------------------------------------------------------
//
// ⛔ DERIVED FROM VAULTER_POLY, NOT COPIED. The family read ("a faster Vaulter")
// is the Vaulter's own eight points, so a retune of the X moves both. Each
// rim-side arm (the two with d > 0, which entityPoints() draws nearer the rim)
// gains a barb between its tip and the near notch: a tip swept C.REAVER_BARB_SWEEP
// inward and C.REAVER_BARB_REACH rimward of the arm tip, then a root
// C.REAVER_BARB_ROOT of the way along the arm's inner edge. Twelve points, one
// closed outline, and a different outline from the Vaulter's at a glance, which
// is the difference O16 gives the silhouette to carry: the colour is shared.
// ⚠ Provisional, like the palette.
//
// Built once at evaluation and never at draw time, so entityPoints() memoizes
// its scratch on it like every other poly.
const REAVER_POLY = (function () {
  const v = VAULTER_POLY;
  const tipL = v[2], notch = v[3], tipR = v[4];
  const barb = (tip, side) => [
    { l: tip.l - side * C.REAVER_BARB_SWEEP, d: tip.d + C.REAVER_BARB_REACH },
    { l: tip.l + (notch.l - tip.l) * C.REAVER_BARB_ROOT, d: tip.d + (notch.d - tip.d) * C.REAVER_BARB_ROOT },
  ];
  const left = barb(tipL, -1);
  const right = barb(tipR, 1);
  return [v[0], v[1], tipL, left[0], left[1], notch, right[1], right[0], tipR, v[5], v[6], v[7]];
})();

// ⛔ drawPoly + glowStroke, one closed path, no fill (GDD 10.2), at full alpha
// at every depth, exactly as drawVaulter() above.
function drawReaver(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, REAVER_POLY, C.REAVER_SIZE), true);
  glowStroke(ctx, C.REAVER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Carrier's silhouette (GDD 6.1, 6.2, 18) — a hollow diamond hull with a
// cargo glyph inside it.
// ---------------------------------------------------------------------------
//
// ⛔ THE TWO SHAPES READ AS ONE ENTITY AND ARE TWO POLYS. entityPoints()
// memoizes a scratch array PER POLY ARRAY (see its header), so a second poly
// costs one more projection loop and zero allocation. Drawing the glyph as
// extra points on the hull's own path would join them with a stroke and turn
// two shapes into one scribble.
//
// ⛔ GDD 18 item 3: ours, not the original's. GDD 6.1 names the silhouette — a hollow
// diamond — and a rhombus outline is generic geometry, so the divergence has to
// live somewhere else, and it does: the PROPORTION (this one is deep rather
// than long, which is what makes it read as a container beside the Vaulter's
// wide shallow X), the glyph, and GDD 10.1's depth-varying line weight and
// glow. If a future pass wants more separation, add it here — do not reach for
// a name or a colour from the game this is an homage to.
//
// Shape DATA, the same class of thing as WELLS' rim polygons. The lane extent
// is scaled by C.CARRIER_SIZE; the depth extent is NOT (entityPoints scales `d`
// by C.ENEMY_DEPTH_SCALE alone), so the ±0.85 below is what makes the hull
// deeper than the Vaulter's ±0.55 at the same distance.
const CARRIER_POLY = [
  { l:  0.00, d: -0.85 },   // far tip, toward the throat
  { l:  1.00, d:  0.00 },
  { l:  0.00, d:  0.85 },   // near tip, toward the rim
  { l: -1.00, d:  0.00 },
];

// ⛔ ONE GLYPH PER CARGO, keyed by the CARGO name (07-enemies.js). GDD 6.2 says
// reading the glyph fast is the skill that separates competent from good, so
// the design rule for a new row is legibility at THROAT depth, not detail at
// the rim: two or three points, one unmistakable gesture, and no feature that
// survives only at full size.
//
// ⛔ THE DESIGN RULE, WRITTEN DOWN SO THE NINTH ENEMY INHERITS IT: A GLYPH IS A
// MINIATURE OF ITS CARGO'S OWN GESTURE. The Vaulter's is a chevron, which is
// its arm; the Surger's is a zigzag with square corners, which is its bar; the
// Drifter's is a jagged scatter with no dominant axis, which is its cluster.
// That is what makes cargo-reading LEARNABLE rather than memorised — a player
// who has met the enemy has already met its glyph — and learnable is GDD 6.2's
// stated point. A new cargo takes the silhouette its entity already has and
// reduces it to the fewest points that keep the gesture.
//
// ⛔ AND THE STAKES ARE REAL, WHICH IS WHY THE TWO CONSEQUENTIAL ROWS ARE THE
// TWO THAT LOOK LEAST ALIKE. GDD 6.2's correct responses are opposite — Drifter
// cargo: shoot, MOVE AWAY; Surger cargo: shoot, HOLD STILL — so a player who
// reads the glyph wrong does the exact opposite of the right thing. The Surger
// and the Vaulter both span the full width; the Drifter is the compact tangle,
// and compact-versus-wide is the channel that carries the costly half of the
// read at the depth where the glyph is smallest.
//
// ⛔ EVERY GLYPH IS A PLAIN ARRAY OF POINTS AND EVERY GLYPH IS AN OPEN PATH.
// drawCarrier() below calls drawPoly(..., false) for all of them, with no
// per-cargo branch and no {poly, closed} row shape: a closed glyph reads as a
// second outline nested in the hull, and a reshaped table breaks the loops
// CS004 P2 and P5 wrote over it.
//
// The Vaulter's is a chevron aimed at the player — an OPEN path, so it never
// reads as a second closed outline nested in the hull, and angled rather than
// flat so it cannot be mistaken for a piece of the diamond it sits in. Its
// extents are ~42% of the hull's on both axes (0.34 / 0.80 across the lanes,
// 0.36 / 0.85 on depth), which is what keeps it visibly INSIDE the hull at
// every depth but one: at the rim, entityPoints clamps every poly so its
// outermost point lands exactly ON the rim, so the chevron's apex and the
// hull's near tip meet there. That is inherent to the clamp, it happens to
// both, and it is the depth at which the Carrier is about to kill you rather
// than the depth at which you are reading its cargo.
const CARGO_GLYPHS = {
  vaulter: [
    { l: -1.00, d: -0.36 },
    { l:  0.00, d:  0.36 },
    { l:  1.00, d: -0.36 },
  ],

  // The Drifter's cluster (DRIFTER_POLY_RIDE / _CROSS below): a scatter that
  // doubles back. ⛔ `l` goes right, then LEFT, then right, so there is no
