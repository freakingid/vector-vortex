<script>
"use strict";

// ==========================================================================
// 00-config.js
// ==========================================================================
// 00-config.js — THE tuning surface. ⛔ Every tunable in the game lives here.
//
// ⛔ Never inline a magic number anywhere else in src/. If a value might ever be
// retuned, it belongs in C. This rule outranks code elegance and is the single
// highest architectural priority in the project (CLAUDE.md, Build rules).
//
// Grouped by system, in roughly the order the GDD introduces them. Keep the
// grouping comments — they are how a future session finds the knob it wants
// without reading the whole object.

const C = {

  // ---- World / view (GDD 16.1) --------------------------------------------
  // ⛔ Fixed internal resolution. Game math NEVER reads window size; the canvas
  // is letterboxed by CSS. These must match src/shell.html's canvas attributes.
  WORLD_W:              1280,
  WORLD_H:              720,

  // ---- Loop / timestep (GDD 16.1) -----------------------------------------
  // ⛔ Fixed-timestep accumulator. FIXED_DT is the ONLY dt the simulation ever
  // sees; the frame's wall-clock dt only decides how many steps run. DT_CLAMP_MAX
  // is what stops a tab-switch stall from becoming a physics event, and
  // MAX_CATCHUP_STEPS is what stops the debt from being repaid forever (the
  // spiral of death) — past the cap the surplus is discarded, not banked.
  FIXED_DT:             1 / 60, // s per simulation step. GDD 17 drives tests here.
  DT_CLAMP_MAX:         0.25,   // s — the largest frame dt ever admitted
  MAX_CATCHUP_STEPS:    5,      // ⛔ hard bound on steps in one frame

  // ---- RNG (GDD 16.1, 17.1) -----------------------------------------------
  // ⛔ The one seeded stream's fallback seed. 02-state.js's newState() builds
  // state.rng from it so the headless suite always has a stream to drive;
  // startGame() (CS003 P2) overwrites state.seed with the run's real seed and
  // rebuilds the stream from that. The VALUE is arbitrary — what matters is
  // that it is fixed, so a reset() replays identically.
  RNG_DEFAULT_SEED:     1,

  // ---- Well geometry (GDD 3) ----------------------------------------------
  PERSPECTIVE_EXP:      0.55,   // depth -> screen easing. Lower = more rush.
  THROAT_SCALE:         0.055,  // rim polygon scaled toward centroid = throat
  DIM_BAND_ALPHA:       0.18,   // levels 65-80. NOT 0 — see GDD 3.7.
  // Where the normalized [-1,1] rim space lands on the fixed world. WELL_CY
  // sits above centre: the well leans into the upper screen so the HUD and the
  // near rim have room. WELL_RADIUS is the half-extent one rim unit maps to.
  WELL_CX:              640,
  WELL_CY:              330,
  WELL_RADIUS:          300,
  // ⛔ A GATE, NOT A TUNABLE (GDD 17 item 2, 1.1 P2). The shortest lane-CENTRE
  // spoke any well may have, in world px. A lane below this is a lane an enemy
  // climbs in almost no screen distance: stationary, then lethal, with nowhere
  // for the player to read it. A well that fails the gate is REDRAWN or given a
  // throatOffset (03-wells.js) — the constant is never lowered to admit it.
  // 60 separates the two wells CS006 P2 fixed (Flat 24 px, Stair 30 px) from
  // the tightest working one (Twist 74 px), with no well inside 20 % of it.
  MIN_LANE_SPOKE_PX:    60,

  // ---- Skimmer (GDD 4) ----------------------------------------------------
  SKIMMER_WIDTH:        0.9,    // lane widths spanned at the rim
  SKIMMER_COLOR:        "#FFFFFF",  // ⚠ not specified by the GDD — see STATUS
  SNAP_IDLE_MS:         90,     // idle time before snap assist engages
  SNAP_STRENGTH:        6.0,    // lane-units/sec pull toward lane centre
  SNAP_EPSILON:         0.01,   // lane units; inside this snap is settled, and stops
  WALL_SQUASH_MS:       40,     // open-well end bounce, visual only
  SKIMMER_SQUASH:       0.35,   // peak fraction of width lost at full squash
  SHOT_MAX:             8,      // ⛔ hard cap on shots in flight
  SHOT_TIME:            0.52,   // s, rim -> throat
  SHOT_COOLDOWN:        0.055,  // s between shots
  SHOT_LEN:             0.06,   // depth units, the trailing streak's length
  THORN_CHIP:           0.08,   // fraction of lane length removed per hit — off
                                // the TIP (07-enemies.js). See THORN_MAX below.
  PURGE_SAVED_BONUS:    500,
  START_LIVES:          3,
  LIVES_MAX:            6,
  EXTRA_LIFE_FIRST:     20000,
  EXTRA_LIFE_EVERY:     40000,
  RESPAWN_INVULN:       1.5,    // s
  RESPAWN_PUSH_DEPTH:   0.55,   // ⛔ enemies at rim pushed here on respawn
  // The respawn blink, in full on/off cycles per second. ⛔ Visual only — the
  // invulnerability itself is state.invulnTime against RESPAWN_INVULN, and the
  // blink is how the player is told it is still running (GDD 1.1 P2).
  INVULN_BLINK_HZ:      6,      // on/off cycles per second while invulnerable

  // ---- Dive (GDD 5) -------------------------------------------------------
  // ⛔ DIVE_GRACE IS A PILLAR P2 REQUIREMENT, NOT POLISH. THORN_MAX is 1.00 and
  // a full-length Thorn's tip sits AT THE RIM (see the Thorn block below) — so
  // without a beat at depth 1 before the descent starts, a dive that begins in
  // that lane is a death on step one with no input opportunity: a threat that
  // is lethal before it is legible. 0.35 s is enough to read the board and
  // start moving, and the worst case fits inside it with room — eight lanes on
  // a Ring at KEY_SPEED_MAX 14 lane/s is 0.57 s, well inside the 2.25 s
  // descent that follows.
  //
  // ⛔ Counted UP toward, like every timer in the build (GDD 16.3).
  DIVE_GRACE:           0.35,   // s at depth 1 before the descent begins
  DIVE_TIME:            2.6,    // s, Classic. ⛔ the WHOLE dive, grace included
  DIVE_TIME_OD:         4.0,    // s, Overdrive ring-flight. ⛔ hard cap.
  DIVE_RINGS_MAX:       6,      // ⛔ hard cap.

  // ---- Enemies (GDD 6) ----------------------------------------------------
  SAFE_SPAWN_DEPTH:     0.75,   // never spawn above this in the player's lane
  // ⛔ GDD 6.3's "fair difficulty is a visible fuse", as seconds. It has sat
  // here unread since CS001 and CS005 P3 is its first reader; ⛔ it stays in
  // this shared group rather than moving down to the Surger block, because
  // moving a shipped key is a diff nobody can review against a value nobody
  // changed. See the Surger block below, which names it.
  SURGE_TELEGRAPH:      0.45,   // s of visible fuse before discharge
  ENEMY_CAP:            16,     // ⛔ READABILITY constraint, not difficulty.
  // ⛔ An entity's drawn depth half-extent, as a fraction of its OWN
  // perspective position — NOT a constant depth offset. perspective() is
  // depth^0.55, so a constant offset spans ~13% of the well at the throat and
  // ~3% at the rim, and an enemy drawn that way SHRINKS as it comes at you.
  // 14-render-entities.js's entityPoints() is the one reader.
  ENEMY_DEPTH_SCALE:    0.10,

  // ---- Enemy palette (GDD 6.1, 3.6) ---------------------------------------
  // ⚠ ALL PROVISIONAL, the same standing as SKIMMER_COLOR and VAULTER_COLOR:
  // the GDD specifies no enemy palette, and the first art pass owns every one
  // of these. They are here as ONE SET, chosen together in CS004 P1, because a
  // palette picked four now and two later is a palette with a clash in it.
  //
  // ⛔ THE CONSTRAINT THEY WERE CHOSEN AGAINST: an enemy colour has to read
  // against ALL SEVEN band colours (BAND_COLORS below, GDD 3.6), because the
  // well cycles and the enemy palette does not. Hue alone cannot separate
  // eight simultaneous things — silhouette and line weight carry the load, and
  // the palette's job is narrower than "look different": stay out of the two
  // bands players actually reach, cyan (levels 1-16) and magenta (17-32), and
  // keep the Thorn visibly NOT A CREATURE.
  //
  // VAULTER_COLOR is the seventh member of this set; it sits with the Vaulter's
  // other tunables below, where CS003 P1 put it.
  CARRIER_COLOR:        "#FFB84A",  // ⚠ warm amber; the hull AND its cargo glyph
  WEAVER_COLOR:         "#B6FF4A",  // ⚠ acid green
  WEAVER_BOLT_COLOR:    "#E8FF9A",  // ⚠ a paler relative of its parent
  THORN_COLOR:          "#A98CFF",  // ⚠ cool and inert — it is not a creature
  DRIFTER_COLOR:        "#FF5AC8",  // ⚠ unread until CS005, deliberately
  SURGER_COLOR:         "#9AF0FF",  // ⚠ unread until CS005, deliberately

  // ---- Vaulter (GDD 6.1, 6.3) ---------------------------------------------
  VAULTER_SIZE:         0.70,   // lane widths spanned by the silhouette
  VAULTER_COLOR:        "#FF4A4A",  // ⚠ placeholder — same standing as SKIMMER_COLOR
  // ⛔ THE THREE HEAT-DERIVED BASES BELOW ARE LEVEL-1 VALUES AND NOTHING READS
  // THEM DIRECTLY (CS007 P2). The climb goes through climbMult(), the two
  // intervals through vaultInterval() / vaultRimInterval(); see THE HEAT CLOCK
  // at the foot of this file. VAULT_HOP_TIME is NOT one of them — H2: heat
  // scales intervals and climb rates, never a hop or crossing duration, which
  // is what keeps three closed soaks' per-tick lane bounds valid unchanged.
  VAULT_CLIMB:          0.18,   // depth/s, throat -> rim ~5.5 s. Level-1 base.
  VAULT_INTERVAL:       2.20,   // s between mid-climb hops. ⛔ level-1 base
  VAULT_INTERVAL_MIN:   1.00,   // ⛔ its floor at HEAT_FULL_LEVEL
  VAULT_HOP_TIME:       0.28,   // s to cross one lane; hittable in both meanwhile
  VAULT_RIM_INTERVAL:   0.55,   // s between rim hunt hops. ⛔ level-1 base
  // ⛔ 0.35 AND NOT LOWER, AND THE REASON IS SATURATION, NOT OVERLAPPING HOPS.
  // Vaulter.update() gates on `if (this.hopping)`, so a second hop cannot start
  // inside a first at any interval. MEASURED (PLANNED-FEATURES-CS007.md §5.1):
  // the hop rate saturates at 1 / VAULT_HOP_TIME = 3.57 hops/s, so any floor
  // below 0.28 is inert. 0.35 keeps the knob live at every level — a rim
  // Vaulter at L99 hops ~79 % of ticks and still visibly pauses, which is the
  // legibility half of GDD 1.1 P2.
  VAULT_RIM_INTERVAL_MIN: 0.35, // ⛔ its floor at HEAT_FULL_LEVEL
  VAULT_FIRST_LEVEL:    2,      // ⛔ GDD 6.3 — no mid-climb vaulting at level 1

  // ---- Carrier (GDD 6.1, 6.2) ---------------------------------------------
  // ⛔ CARRIER_SIZE and CARRIER_GLYPH_SIZE are LANE widths and nothing else.
  // entityPoints() (14-render-entities.js) scales a poly's `l` by size/2 and
  // its `d` by C.ENEMY_DEPTH_SCALE alone — a silhouette's DEPTH extent is not
  // a function of its size. So these two numbers set how wide the hull is and
  // how wide the glyph inside it is, and the two polys' own `d` values set how
  // deep each one looks. Raising CARRIER_GLYPH_SIZE past CARRIER_SIZE would
  // put the glyph outside the hull across the lanes while leaving it inside on
  // depth, which reads as a rendering bug rather than as a bigger glyph.
  CARRIER_SIZE:         0.80,   // lane widths spanned by the hull
  CARRIER_GLYPH_SIZE:   0.34,   // lane widths spanned by the cargo glyph
  CARRIER_CLIMB:        0.11,   // depth/s, throat -> rim ~9 s. GDD 6.1's "slow"

  // ---- Weaver and its bolt (GDD 6.1, 4.5) ---------------------------------
  // The cycle, and it is meant to be nameable by a player watching it: it comes
  // up, it leaves a Thorn, it spits, it goes back down. WEAVER_RETREAT is
  // deliberately FASTER than WEAVER_CLIMB so leaving reads as a beat rather
  // than as a second approach.
  //
  // ⛔ WEAVER_APEX IS THE LEVEL-1 BASE AND weaverApex() IS ITS ONE READER
  // (CS007 P2). GDD 8's one clock decides how far up a Weaver comes; the
  // Weaver's cycle reads the accessor, never this number.
  //
  // ⛔ ONE NUMBER SETS FOUR THINGS, which is why GDD 8's "Weaver thorn length"
  // and its apex are one knob and not two: layThorn() writes the Thorn's tip to
  // the Weaver's own depth, so apex IS thorn length. MEASURED at the 0.75
  // ceiling (PLANNED-FEATURES-CS007.md §5.1): the bolt's apex→rim flight is
  // 0.781 s (still 1.7x SURGE_TELEGRAPH's 0.45 s "visible fuse" benchmark), the
  // Thorn costs 10 shots, it leaves 0.25 of the lane to the player, and a dive
  // is struck 0.91 s into 2.60. ⛔ The ceiling must stay strictly below 1.00:
  // at 1.00 the tip sits at the rim, the lane is sealed against the player's
  // own shots, and the bolt is born in contact.
  //
  // ⛔ WEAVER_SIZE and WEAVER_BOLT_SIZE are LANE widths, the same as
  // CARRIER_SIZE above: entityPoints() scales a poly's `l` by size/2 and its
  // `d` by C.ENEMY_DEPTH_SCALE alone, so a silhouette's DEPTH extent is not a
  // function of its size.
  WEAVER_SIZE:          0.62,   // lane widths spanned by the spiral
  WEAVER_CLIMB:         0.22,   // depth/s on the way up
  WEAVER_RETREAT:       0.34,   // depth/s down — leaving is faster than arriving
  WEAVER_APEX:          0.55,   // depth it climbs to before turning. ⛔ level-1 base
  WEAVER_APEX_MAX:      0.75,   // ⛔ its ceiling at HEAT_FULL_LEVEL. Strictly < 1.00
  WEAVER_APEX_HOLD:     0.35,   // s held at the apex, which is when it fires
  WEAVER_BOLT_SPEED:    0.32,   // depth/s toward the rim. ~1.4 s from apex to rim
  WEAVER_BOLT_SIZE:     0.30,   // lane widths spanned by the dart

  // ---- Thorn (GDD 6.1, 4.2, 5, 8) -----------------------------------------
  // ⛔ NEITHER OF THESE IS A LANE WIDTH. A Thorn is not a silhouette at a
  // point — it is a SEGMENT ALONG the lane, so both numbers are in DEPTH units
  // and neither goes anywhere near entityPoints() (14-render-entities.js).
  //
  // ⛔ AND THE THORN'S `depth` IS ITS LENGTH, not its position (07-enemies.js's
  // `anchored`). THORN_MAX is therefore GDD 8's "clamp: lane length" — the
  // longest a Weaver may grow one — and at 1.00 a full-length Thorn's tip sits
  // at the RIM, which seals the lane: a shot fired into it is consumed the
  // instant it leaves the craft. That is the intended lane denial, and this is
  // the knob if it reads as unfair rather than as a consequence.
  //
  // THORN_CHIP (0.08, up with the Skimmer's firing block where CS001 put it)
  // is what one shot takes off the tip, so a full-length Thorn is 13 shots.
  // THORN_TIP_LEN is how much of the tip is drawn a second time, so a chip is
  // visible as it lands (GDD 1.1 P2).
  THORN_MAX:            1.00,   // ⛔ depth units of LENGTH — GDD 8's lane-length clamp
  THORN_TIP_LEN:        0.05,   // depth units of brighter tip

  // ---- Drifter (GDD 6.1, 6.3, 4.5 item 2, 3.5) ----------------------------
  // The cycle, and it is meant to be readable as an ALTERNATION rather than as
  // a speed: it settles on a lane boundary and is armoured there, it crosses
  // one lane and is shootable while it does, and it climbs the whole time.
  //
  // ⛔ DRIFT_CLIMB APPLIES IN BOTH PHASES. That is what stops an unshootable
  // entity from parking — see 07-enemies.js — and it also makes the lane SPEED
  // one number: the birth half-cross covers half a lane in half the time, so
  // every crossing moves at DT / DRIFT_CROSS_TIME lane units per step and a
  // soak's bound is derived rather than picked.
  //
  // ⛔ DRIFT_RIDE_TIME IS THE ARMOUR BUDGET. At 0.85 s riding against 0.45 s
  // crossing a Drifter is shootable about a third of the time; raising it is
  // the fastest way to make an enemy the player cannot answer, and it is the
  // knob if the Drifter reads as cheap rather than as hard.
  //
  // ⛔ DRIFTER_SIZE IS A LANE WIDTH, the same as CARRIER_SIZE and WEAVER_SIZE:
  // entityPoints() scales a poly's `l` by size/2 and its `d` by
  // C.ENEMY_DEPTH_SCALE alone. It is the CROSSING silhouette's span — the
  // riding poly reaches less far across the lanes on purpose, which is one of
  // the three channels below.
  DRIFTER_SIZE:         0.66,   // lane widths spanned by the crossing silhouette
  DRIFT_CLIMB:          0.13,   // depth/s, ⛔ in BOTH phases. throat -> rim ~7.7 s
  DRIFT_RIDE_TIME:      0.85,   // s on a boundary before a cross — ⛔ the armour budget
  DRIFT_CROSS_TIME:     0.45,   // s to cross one lane, vulnerable throughout
  DRIFT_HOME_DEPTH:     0.60,   // at or above this, a cross aims at the Skimmer

  // ⛔ THE THREE-CHANNEL READ (GDD 6.3, 12). GDD 6.3 carries a ⛔ on the
  // armoured state being visible AT A GLANCE, and GDD 12's first-Drifter prompt
  // names the visual language it expects: SOLID = ARMOURED · OPEN = VULNERABLE.
  // So the two states differ on three independent channels at once —
  // silhouette (two polys, one drawn closed and one open), stroke width, and
  // alpha — and no one of them carries the read alone.
  //
  // ⛔ THESE ARE PER-ENTITY MULTIPLIERS ON laneLineWidth(), NEVER GLOBAL GLOW
  // CONSTANTS. GLOW_WIDE_W, GLOW_WIDE_ALPHA and GLOW_THIN_ALPHA are shared with
  // the well and every other entity, and retuning one of those is an art pass
  // across the whole build. glowStroke's glow spread is width * GLOW_WIDE_W, so
  // a narrower width here is literally a harder edge.
  //
  // ⛔ THE SEPARATION IS A HEADLESS GATE, in scratchpad/test-cs005-p2.js:
  // DRIFT_CROSS_WIDTH / DRIFT_RIDE_WIDTH >= 2.0 and DRIFT_RIDE_ALPHA <= 0.7.
  // GDD 6.3's rule is an art rule and art rules rot silently; a future retune
  // that collapses the two reads into one turns the suite red instead.
  DRIFT_RIDE_WIDTH:     0.70,   // ⛔ x laneLineWidth while riding — tight, hard-edged
  DRIFT_CROSS_WIDTH:    1.60,   // ⛔ …and while crossing — bloomed open
  DRIFT_RIDE_ALPHA:     0.55,   // ⛔ the dim half of the read. Crossing is 1.0

  // ---- Surger (GDD 6.1, 6.3, 4.5 item 3) ----------------------------------
  // The cycle, and it is meant to be readable as a THREAT THAT ANNOUNCES
  // ITSELF: it climbs, the lane arms from the throat upward, and then the whole
  // lane is live for a moment. ⛔ SURGE_TELEGRAPH (0.45 s) is the fuse and it
  // lives in the shared Enemies group above, where CS001 put it — it is not
  // re-declared here.
  //
  // ⛔ SURGE_DISCHARGE MUST STAY STRICTLY BELOW RESPAWN_INVULN (1.5 s), and the
  // relationship is an INVARIANT rather than a coincidence. During the
  // discharge the Surger's killDepth is 0, so GDD 4.4's rim push — which only
  // ever LOWERS an enemy's depth, to RESPAWN_PUSH_DEPTH — cannot protect a
  // respawning player from it: 0.55 is still above 0. The invulnerability
  // window is the ONLY thing standing between a respawn and a discharge that
  // was already running, so a discharge that outlasted it would kill the player
  // on the step the blink stopped, in the lane they had no way to leave.
  // scratchpad/test-cs005-p3.js asserts it from these two constants, and
  // CS007's heat curve is exactly what would break it.
  //
  // ⛔ SURGE_INTERVAL IS THE LEVEL-1 BASE AND surgeInterval() IS ITS ONE READER
  // (CS007 P2), the same standing WEAVER_APEX has: this is a level-1 value, not
  // rule.
  //
  // ⛔ DEPTH RISES IN THE CLIMB PHASE ONLY — the Drifter's DRIFT_CLIMB is the
  // one that runs in every phase, and it says so. So the honest throat→rim time
  // is not 1 / SURGE_CLIMB: the climb owns SURGE_INTERVAL out of every
  // SURGE_INTERVAL + SURGE_TELEGRAPH + SURGE_DISCHARGE (2.60 of 3.35 s), which
  // makes it ≈ 8.6 s rather than 6.7 s. The pause IS part of the read — the bar
  // stops moving at the instant its lane starts arming.
  //
  // ⛔ SURGER_SIZE IS A LANE WIDTH, like CARRIER_SIZE, WEAVER_SIZE and
  // DRIFTER_SIZE: entityPoints() scales a poly's `l` by size/2 and its `d` by
  // C.ENEMY_DEPTH_SCALE alone.
  //
  // ⛔ SURGE_LIT_WIDTH IS A PER-ENTITY MULTIPLIER ON laneLineWidth() and never a
  // global glow constant, the same rule DRIFT_RIDE_WIDTH carries: GLOW_WIDE_W,
  // GLOW_WIDE_ALPHA and GLOW_THIN_ALPHA are shared with the well and every
  // other entity. It applies to the DISCHARGE only — the fuse creeps up at
  // plain lane weight and the live lane slams to 2.20x, which is what makes the
  // moment the fuse reaches the rim a step the player can see rather than a
  // number they have to have counted.
  SURGER_SIZE:          0.85,   // lane widths spanned by the zigzag bar
  SURGE_CLIMB:          0.15,   // depth/s, ⛔ in the CLIMB phase only. See above
  SURGE_INTERVAL:       2.60,   // s of climb between discharges. ⛔ level-1 base
  // ⛔ 1.40, AND FLOORING IT MAKES THE SURGER SLOWER TO THE RIM, NOT FASTER.
  // Depth rises in the climb phase only, so the honest throat→rim time is
  // (1 / climb) * cycle / interval and a shorter interval spends a larger share
  // of the cycle not climbing. MEASURED (PLANNED-FEATURES-CS007.md §5.1): the
  // break-even climb multiplier at a 1.40 floor is x1.164 and CLIMB_MULT_MAX is
  // 1.40, so the shipped pair leaves throat→rim at 8.59 s → 7.31 s while lethal
  // duty rises 9.0 % → 14.0 %. ⛔ The floor buys LANE DENIAL, not approach speed.
  SURGE_INTERVAL_MIN:   1.40,   // ⛔ its floor at HEAT_FULL_LEVEL
  SURGE_DISCHARGE:      0.30,   // s the whole lane is live. ⛔ must stay < RESPAWN_INVULN
  SURGE_LIT_WIDTH:      2.20,   // ⛔ x laneLineWidth for the LIVE lane (not the fuse)

  // ---- Spawner / well lifecycle (GDD 2, 6.3, 12) --------------------------
  // ⛔ SPAWN_INTERVAL is what state.spawn.timer counts UP toward, and
  // SPAWN_QUOTA is what state.spawn.remaining starts at — the quota is spent
  // downward because it is a COUNT of things, not a clock (GDD 16.3 governs
  // timers). A well is clear when the quota is spent AND nothing that blocks
  // the clear is left alive; "no enemies alive" alone is true one tick after
  // startGame() and in every gap between spawns.
  //
  // ENEMY_CONCURRENT is the difficulty knob and CS007's heat curve is what
  // will raise it. ⛔ It is read as min(ENEMY_CONCURRENT, ENEMY_CAP): ENEMY_CAP
  // above is a READABILITY ceiling and never a difficulty knob, so the two are
  // not interchangeable and the cap is not the thing to raise when a level
  // should feel busier.
  //
  // ⛔ AND THE TWO NUMBERS COUNT DIFFERENT THINGS (CS007 P1, Paul's call —
  // DECISIONS.md, "the spawner-stall call"). This comment used to say the
  // spawner reads state.enemies.length; it does not any more.
  //   ENEMY_CONCURRENT — a budget on THREATS. updateSpawner() counts entities
  //     where `blocksClear && !dead` (threatCount, 08-spawner.js) against
  //     min(ENEMY_CONCURRENT, ENEMY_CAP), so it bounds how much the player has
  //     to answer, not how much is drawn.
  //   ENEMY_CAP — a ceiling on ENTITIES. spawnEnemy() still refuses on raw
  //     state.enemies.length, Thorns and bolts included, because a Thorn is
  //     drawn and a readability ceiling counts everything on screen.
  // ⛔ Before the split both read the same count and a standing Thorn held a

// ---------------------------------------------------------------------------
// THE HEAT CLOCK (GDD 8) — ⛔ ONE CLOCK: state.level
// ---------------------------------------------------------------------------
//
// ⛔ THE ONLY FUNCTIONS IN THIS FILE, AND THEY ARE HERE BECAUSE THEY ARE THE
// TUNING SURFACE'S OTHER HALF. C above says what a value is at level 1 and what
// it is at the top; the seven accessors below say how the game walks between
// the two. Splitting them would put half of one decision in each of two files.
//
// ⛔ NO CALL SITE COMPUTES HEAT INLINE AND NO ENTITY READS A HEAT-DERIVED BASE
// CONSTANT DIRECTLY. Every derived value is exactly one function; the entity
// reads the function. That is what makes the clamp enforceable in ONE place and
// testable as a property over levels 1..200 rather than as a spot check —
// test-cs007-p2.js asserts it off the BUILT file, so a future session that
// writes a bare climb constant into an entity turns the suite red instead of
// quietly escaping the clamp. The five climb rates are the one shape that
// differs: they
// keep their own constants and are multiplied by climbMult(), because GDD 8
// says "climb speed", singular, and ONE multiplier is what keeps the respawn
// guarantee (GDD 4.4) a single arithmetic statement.
//
// ⛔ WHAT HEAT DOES NOT SCALE, AND IT IS A LIST, NOT AN OVERSIGHT (H2):
//   VAULT_HOP_TIME, DRIFT_CROSS_TIME, DRIFT_RIDE_TIME — heat scales intervals,
//     climb rates and the Weaver's apex, and NEVER a hop or crossing duration.
//     Three closed soaks derive per-tick lane bounds from those three numbers.
//   WEAVER_BOLT_SPEED, WEAVER_RETREAT — a bolt is ordnance, not a climb, and a
//     retreat is a departure. Neither is in GDD 8's list. Scaling the bolt
//     would shrink the Weaver's warning window twice over, once through the
//     apex and once through the speed, and see CLIMB_MAX_BASE above for why a
//     SLOWER bolt would breach the respawn guarantee.
//   SURGE_DISCHARGE — GDD 8 lists surge FREQUENCY, which is SURGE_INTERVAL.
//     The discharge window must stay strictly below RESPAWN_INVULN.
//   ENEMY_CAP — a readability ceiling (GDD 8), never a difficulty knob.
//   RESPAWN_PUSH_DEPTH — see CLIMB_MULT_MAX above. The guarantee is held by a
//     hard cap on the climb, so the push is a constant at every level.

// GDD 8's formula, verbatim, from the four constants above. ⛔ heat(1) === 0
// exactly, and ⛔ it NEVER PLATEAUS — GDD 17 item 7 asserts heat(n+1) > heat(n)
// over 1..200 and a hold inside here would fail it at n = HEAT_FULL_LEVEL.
function heat(level) {
  const t = level - 1;
  return C.HEAT_BASE
       + C.HEAT_RISE * (1 - Math.exp(-t / C.HEAT_KNEE))
       + C.HEAT_LINEAR * t;
}

// ⛔ FORM A — ENDPOINT INTERPOLATION (H3, Paul's call, 2026-08-31). The clamp
// values ARE the curve: every row is stated as its level-1 base and its
// HEAT_FULL_LEVEL endpoint, so no row carries a rate constant of its own and
// every row saturates together. `min(t, 1)` is the clamp, in one place.
//
// ⛔ THE LEVEL ARGUMENT IS OPTIONAL AND IT IS NOT A SECOND CLOCK. Omitted — the
// shipped call in every entity — it reads state.level, the one clock (GDD 8,
// 02-state.js). It exists so a test or a probe can evaluate the whole curve
// without driving a run to level 200.
function heatT(level) {
  const t = heat(level === undefined ? state.level : level) / heat(C.HEAT_FULL_LEVEL);
  return t > 1 ? 1 : t;
}

function heatLerp(base, clamp, level) {
  return base + (clamp - base) * heatT(level);
}

// ---- The seven derived values, one accessor each (GDD 8) -------------------

// Falls. ⚠ Almost inert on its own — MEASURED, dropping it 1.60 → 0.35 at a
// concurrency of 3 moved spawns in 60 s from 19 to 20. It works WITH the
// concurrency ladder, not against it.
function spawnInterval(level) {
  return heatLerp(C.SPAWN_INTERVAL, C.SPAWN_INTERVAL_MIN, level);
}

// Rises, and ⛔ FLOORED so the ladder is nameable: 3 at levels 1-5, 4 from 6,
// 5 from 16, 6 from 40, 7 from 70, 8 at 99. Still read as
// min(..., C.ENEMY_CAP) by spawnLimit() (08-spawner.js).
function enemyConcurrent(level) {
  return Math.floor(heatLerp(C.ENEMY_CONCURRENT, C.ENEMY_CONCURRENT_MAX, level));
}

// ⛔ ONE MULTIPLIER ON EVERY ENTITY CLIMB — VAULT_CLIMB, CARRIER_CLIMB,
// WEAVER_CLIMB, DRIFT_CLIMB, SURGE_CLIMB. The base is the identity 1: at level
// 1 every climb is exactly the number in C above, which is what makes heat(1)
// = 0's guarantee visible rather than arithmetic. ⛔ Its ceiling is the respawn
// guarantee's — see CLIMB_MULT_MAX above before touching it.
function climbMult(level) {
  return heatLerp(1, C.CLIMB_MULT_MAX, level);
}

// Both fall. The mid-climb cadence and the rim hunt are separate knobs because
// they are separate behaviours (07-enemies.js): one is how often a climbing
// Vaulter changes lane, the other is how hard it hunts once it has arrived.
function vaultInterval(level) {
  return heatLerp(C.VAULT_INTERVAL, C.VAULT_INTERVAL_MIN, level);
}

function vaultRimInterval(level) {
  return heatLerp(C.VAULT_RIM_INTERVAL, C.VAULT_RIM_INTERVAL_MIN, level);
}

// Falls — GDD 8's "surge frequency". See SURGE_INTERVAL_MIN above: this one
// buys lane denial and costs approach speed, and climbMult() pays it back.
function surgeInterval(level) {
  return heatLerp(C.SURGE_INTERVAL, C.SURGE_INTERVAL_MIN, level);
}

// Rises. ⛔ This is GDD 8's "Weaver thorn length" as well as its apex — one
// number, four consequences; see WEAVER_APEX_MAX above.
function weaverApex(level) {
  return heatLerp(C.WEAVER_APEX, C.WEAVER_APEX_MAX, level);
}

// ==========================================================================
// 01-rng.js
// ==========================================================================
// 01-rng.js — the seeded random source (GDD 16.1, 17.1).
//
// ⛔ ONE SOURCE OF RANDOMNESS, AND IT IS SEEDED. Nothing in src/ may call the
// platform's built-in generator — not the spawner, not a particle, not an audio
// variation. GDD 17.1's determinism guarantee (same seed + same recorded input
// -> identical state after 10,000 ticks) is only worth something if there is no
// second, unseeded stream anywhere in the build.
//
// ⚠ The suite scans the BUILT file for the platform generator's identifier, so
// that identifier is deliberately not written anywhere in src/ — not even
// inside a comment saying not to use it, which is exactly the false positive
// that would train a future session to weaken the scan.
//
// mulberry32 is the same 32-bit generator scratchpad/_seeded-random.js installs
// over the platform one for tests. It is small, fast, has a period of 2^32, and
// passes gjrand's smallcrush — far past what a tube shooter needs, and short
// enough that the whole stream is auditable.
//
// A STREAM IS STATE. Each call mutates the closed-over counter, so two systems
// sharing one stream interleave their draws: adding a draw to the spawner
// shifts every subsequent draw everywhere. That is fine and intended — the run
// has ONE stream (state.rng, created from state.seed) for the same reason it
// has one clock. If a system ever needs draws that must NOT move when another
// system changes, it takes its own stream from its own seed; it does not get a
// private call into the platform generator.

// The generator. `seed` is coerced to uint32, so any integer (or a Date.now())
// is a legal seed and the same number always produces the same stream.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// An integer in [0, n). The ONE route from a 0..1 draw to an index, so no call
// site re-derives it and gets the half-open interval wrong.
//
// The final guard cannot fire with mulberry32 — its largest output is
// (2^32-1)/2^32, so floor(r * n) is at most n-1 — but `rng` is a parameter and
// a future stream that can return exactly 1 would otherwise hand back n, which
// reads as an out-of-range array index a long way from here.
function rngInt(rng, n) {
  if (!(n > 0)) return 0;
  const i = Math.floor(rng() * n);
  return i >= n ? n - 1 : (i < 0 ? 0 : i);
}

// One element of `arr`, uniformly. Returns undefined for an empty array rather
// than drawing — a draw spent on an impossible pick would desynchronize the
// stream between a run that hit the empty case and one that did not.
function rngPick(rng, arr) {
  if (!arr || !arr.length) return undefined;
  return arr[rngInt(rng, arr.length)];
}

// 02-state.js
// ==========================================================================
// 02-state.js — THE one mutable game object.
//
// ⛔ There is exactly one. Every system reads and writes this object; nothing
// keeps a private copy of a field that lives here. `state` is a plain data bag
// with no methods — behaviour lives in the module that owns the field.
//
// ⛔ A field lands here when the changeset that USES it lands, never before.
// A field added "because CS003 will want it" is a field CS003 cannot see the
// reasoning for, and it reads as shipped truth to a session that finds it.
// CS002 landed the first eight; CS003 P1 added `seed` and `rng`, P2 added
// `enemies`, `spawn` and the between-wells hold, P3 added `purgeUses` and
// `purgeLatched`,
// and P4 added `lives` and `invulnTime`. CS006 P1 adds `bandRoll`, and P3 adds
// `dive` — which DELETED CS003 P2's hold field rather than joining it (GDD 5).
// CS007 P4 adds `tally`, the run's cumulative counters.
//
// newState() is the shipped-default shape; `state` is one of it. The two exist
// separately so a reset writes defaults from one place instead of a second,
// drifting copy of the same field list (23-main.js's Game.reset()).

function newState() {
  return {
    // ⛔ THE RUN'S SEED AND ITS ONE STREAM (GDD 16.1, 17.1; 01-rng.js).
    // Both are shipped defaults here so the headless suite and a reset() always

    // seed for a run; it writes `seed` FIRST and rebuilds `rng` from it, and it
    // never regenerates `rng` from anything else — `seed` staying readable
    // afterwards is what makes a run replayable.
    //
    // ⛔ `rng` is a live closure over its own counter, not a value: copying
    // `state` copies the reference, so two "copies" of state share one stream.
    // Nothing copies state today; a save/replay feature would store `seed`.

    rng: mulberry32(C.RNG_DEFAULT_SEED),

    // Screen / state machine (GDD 2). CS002 has one screen and no menus; the
    // enum this becomes is CS008's to define, so the value is a plain string
    // rather than a constant nothing else reads yet.

    // Which of the sixteen wells (03-wells.js) is being drawn. ⛔ GDD 3.4's
    // shapeIndex = (level-1) mod WELLS.length mapping is owned by nextWell()
    // (23-main.js, CS003 P2); the debug cycle action is the only other writer,
    // and it goes through enterWell() like every other well entry.
    wellIndex: 0,

    // ⛔ THE ONE CLOCK (GDD 8, CLAUDE.md Config). All difficulty scaling derives
    // from level. No parallel clocks. Drives band colour today (GDD 3.6).
    //
    // ⚠ SETTLED — IT KEEPS COUNTING PAST 99, AND GDD 3.6's "the counter holds"
    // IS NOT ABOUT THIS FIELD. What holds past 99 is the DERIVED band table —
    // there is no BAND_COLORS row above `hi: 99`, so colour comes from
    // `bandRoll` below instead — and, in CS007, the heat curve. The clock
    // itself is unbounded, and has to be: telemetry samples it and
    // C.PTS_WELL_PER_LEVEL multiplies by it, so a level that stopped rising
    // would freeze the well bonus at 9,900 for the rest of a marathon run.
    //
    // ⛔ THE HOLD BELONGS IN THE CALLER, NEVER HERE. A reader that must not
    // rise past 99 clamps its own input; nothing clamps `state.level`.
    //
    // ✅ ANSWERED, CS007 P2 — NEITHER MOVES, AND NO HOLD SHIPS. This note used
    // to say GDD 17 item 7's `heat(n+1) > heat(n)` over 1..200 and a heat curve
    // that plateaus past 99 could not both be true, and that CS007 owed the
    // choice. It owes nothing: every one of the seven heat-derived rows carries
    // its own clamp (00-config.js), so heat past a row's saturation level
    // changes no value in the build and a hold would be inert by construction.
    // `heat()` never plateaus, item 7 is literally true on the shipped formula,
    // and C.HEAT_HOLD_LEVEL was not built. ⛔ The caller rule above still
    // stands — it is what a hold would have to obey if one were ever needed.
    level: 1,

    // ⛔ GDD 3.6's past-99 band colour, DRAWN IN THE SIMULATION AND READ BY THE
    // RENDERER. Levels 1..99 have a band row apiece and ignore this field
    // entirely; past 99 `nextWell()` (23-main.js) spends one draw from the
    // run's ONE stream into it and Game.draw() hands it to drawWell().
    //
    // ⛔ IT IS A FIELD RATHER THAN A `state.rng()` AT THE CALL SITE, AND THAT
    // IS THE WHOLE POINT (CLAUDE.md, Math and lifecycle;
    // RATIONALE.md#draw-path-rng). draw() runs on a frame clock and update()
    // does not — a draw in the renderer would make the run's stream a function
    // of refresh rate, and hit-stop draws ~72 frames against zero simulation.
    //
    // The shipped default is 0, which is exactly the literal Game.draw() passed
    // before this field existed, so a run that never reaches level 100 is
    // bit-identical to the build before it.
    bandRoll: 0,

    // ⛔ Counts UP, in seconds of SIMULATION time — not wall clock. It advances
    // only inside Game.update(), so hit-stop freezes it (GDD 16.3: count-up
    // timers only; no countdown pressure anywhere in the build).
    time: 0,

    // ⛔ The device-agnostic input struct (GDD 9.5). Exactly four fields, and
    // the simulation never learns which device produced them. 04-input.js's
    // sample() writes into THIS object every step; call sites read predicates
    // off it and never touch a raw key map.
    input: { rotate: 0, fire: false, purge: false, jump: false },

    // The player's craft (05-skimmer.js, CS002 P2). Null until P2 builds it.
    // ⛔ A DEAD ONE IS STILL HERE. killSkimmer() (09-collision.js) sets its
    // `dead` flag and freezes the loop; the craft stays on screen through the
    // freeze so the player can see what killed them, and respawnSkimmer()
    // (23-main.js) replaces it on the first live step afterwards.
    skimmer: null,

    // ⛔ GDD 4.4 — the reserve, spent by killSkimmer() and by nothing else.
    // Zero is the game-over stop (screen = "gameover"), not a screen; CS008
    // owns the UI, the submission and the restart flow. The extra-life awards
    // at C.EXTRA_LIFE_FIRST / _EVERY and the C.LIVES_MAX ceiling belong to
    // addScore() in CS008 and are deliberately unread this changeset.
    lives: C.START_LIVES,

    // ⛔ Counts UP toward RESPAWN_INVULN and HOLDS there (GDD 16.3 — no
    // countdown timers anywhere in the build), and STARTS AT THE THRESHOLD,
    // already expired, exactly as shotCooldown and the Skimmer's squashTime
    // do: a fresh run must not be born invulnerable. respawnSkimmer() is the
    // one place it is armed, by writing zero.
    //
    // ⛔ It lives on `state` and not on the Skimmer because it OUTLIVES the
    // craft it protects — the timer is armed at the moment a brand new craft
    // is minted, and a field on the old one would go with it.
    invulnTime: C.RESPAWN_INVULN,

    // Player shots in flight (06-shots.js, CS002 P3). ⛔ Entities are removed
    // by an end-of-frame .filter(), never spliced mid-loop (GDD 6.5).
    shots: [],

    // ⛔ Counts UP toward SHOT_COOLDOWN (GDD 16.3 — no countdown timers) and is
    // held at the threshold once past it. Starts AT the threshold — already
    // "expired" — so the first shot of a run does not wait out a cooldown that
    // never actually elapsed, the same reasoning 05-skimmer.js's squashTime
    // opens on.
    shotCooldown: C.SHOT_COOLDOWN,

    // ⛔ ONE ARRAY FOR EVERY ENEMY (07-enemies.js, CS003 P2). Thorns, Carriers
    // and Drifters all land here; the contract's flags decide behaviour, not a
    // second array. Removal is an end-of-frame .filter(), never a splice.
    enemies: [],

    // The spawner's two numbers (08-spawner.js). ⛔ `timer` counts UP toward
    // spawnInterval() and HOLDS there when a spawn is blocked, so a slot that
    // frees is used immediately rather than after a fresh interval (GDD 16.3 —
    // no countdown anywhere in the build). `remaining` is a COUNT of enemies
    // the well still owes, not a clock, so it is spent downward. Both are
    // re-armed by enterWell(); nothing else writes them.
    spawn: { timer: 0, remaining: C.SPAWN_QUOTA },

    // GDD 4.3: one Purge charge per well, recharged on entry, never
    // accumulated. ⛔ A COUNT, not a flag: use 1 clears the well, use 2 kills
    // exactly one enemy, use 3+ does nothing, and CS008's PURGE_SAVED_BONUS

    // back to zero; 09-collision.js's updatePurge() is the only thing that
    // raises it. (CS003 P2 landed this as the boolean `purgeReady`, which
    // could not express the weak second use.)
    purgeUses: 0,

    // ⛔ "The purge button was held LAST step." state.input.purge is a LEVEL —
    // all four devices write a held boolean (GDD 9.5) — so the rising edge is
    // detected against this, and holding the button spends exactly one charge.
    // CS003 P4 forces it true on death; 09-collision.js explains why.
    purgeLatched: false,

    // ⛔ THE DIVE (GDD 5, 4.5 item 5; 11-dive.js). It replaced CS003 P2's
    // CS003 P2's hold outright — that one-second pause was the Dive's placeholder and
    // was deleted with its constant and its branch, not left beside it.
    //
    // ⛔ THE DIVE OWNS ITS OWN DEPTH, AND IT IS DELIBERATELY NOT A Skimmer
    // FIELD. A `skimmer.depth` that is 1 except for 2.6 s is a field two
    // systems can disagree about; a `state.dive.depth` that only means anything
    // while `active` is one that cannot. It is also what keeps
    // 09-collision.js's "there is no term here for where the Skimmer is"
    // LITERALLY true — collideSkimmer() does not run during a dive at all.
    // GDD 14.2's Jump is the thing that reopens that, and it is not this.
    //
    //   active  the whole gameplay pass is short-circuited while true
    //   phase   "grace" | "descent" — GDD 5's two beats
    //   timer   counts UP through the whole dive toward C.DIVE_TIME (GDD 16.3)
    //   depth   a POSITION, 1 at the rim falling to 0 at the throat. ⛔ Not the
    //           same quantity as an anchored entity's `depth`, which is a
    //           LENGTH — comparing the two is the strike test and it is the
    //           only two-depth comparison in the build (11-dive.js).
    dive: { active: false, phase: "grace", timer: 0, depth: 1 },

    // ⛔ THE RUN'S CUMULATIVE COUNTERS (GDD 15.6; 21-telemetry.js). CS007 P4.
    //
    // ⛔ WRITE-ONLY AS FAR AS THE SIMULATION IS CONCERNED. Eight numbers, each
    // incremented at the ONE place its event actually happens, and read by
    // exactly one consumer: Telemetry's row builder. ⛔ NOTHING IN THE
    // SIMULATION BRANCHES ON ONE — that is what makes CS007 P4's headline
    // assertion true, that the 10,000-tick determinism hash is identical with
    // capture ON and OFF. A future reader that wants to gate behaviour on one
    // of these has turned an instrument into a mechanic; give it its own field.
    //
    // ⛔ THEY ARE MAINTAINED WHETHER OR NOT CAPTURE IS ON, and that is
    // deliberate: capture is a session switch a player flips mid-run
    // (21-telemetry.js), and counters that only started counting at the flip

    // run. CS008's HUD and the leaderboard's registered stats read the same
    // numbers without going near telemetry.
    //
    // ⛔ HERE AND NOT INSIDE Telemetry, so newState() resets them — a run's
    // totals belong to the run, and startGame() already writes this whole
    // object. A bag inside the module would need a second reset path and would
    // drift from this one the first time a caller forgot it.
    //
    //   deaths             killSkimmer() — ⛔ NOT START_LIVES - lives, which
    //                      CS008's extra-life awards would quietly falsify
    //   wellsCleared       the wellCleared() -> startDive() edge (23-main.js)
    //   purgesSpent        a charge actually consumed: uses 1 and 2, never 3+
    //   divesCompleted     a dive that reached C.DIVE_TIME. ⚠ COMPLETED, not

    //                      respawns and finishes the dive, and a column named
    //                      for what it does not count is GDD 15.6's own trap
    //   thornDeaths        GDD 4.5 item 5 — the dive strike that actually killed

    //   kills              enemies the PLAYER destroyed — by shot or by Purge.
    //                      ⛔ Not per kind: the roster grows (GDD 6.4), and a
    //                      column per kind guarantees the column list churns,
    //                      which is exactly what GDD 15.6's rule exists to stop
    //   spawnBlockedTicks  ⛔ the stall's own signature. A step where the
    //                      spawner had quota left and its timer at the interval
    //                      and still released nothing — the release budget
    //                      (CS007 P1) or C.ENEMY_CAP
    tally: {
      deaths: 0, wellsCleared: 0, purgesSpent: 0, divesCompleted: 0,
      thornDeaths: 0, shotsFired: 0, kills: 0, spawnBlockedTicks: 0,
    },
  };
}

// ---------------------------------------------------------------------------
// THE DEPTH MODEL (GDD 3.2, 3.5; RATIONALE.md#depth-model)
// ---------------------------------------------------------------------------
//
// ⛔ Every entity position is (lane, depth). Screen coordinates are derived
// HERE and only at render time. Nothing upstream of screenPos may hold an x/y.
//
//   lane   float in LANE-CENTRE units. lane === i is the CENTRE of lane i,
//          i.e. the midpoint of the rim edge rim[i] -> rim[i+1]. That is why
//          the Skimmer clamps to [0, lanes-1] on an open well (GDD 3.5) and
//          why snap assist rounds to an integer (GDD 4.1): the integers ARE
//          the lane centres. Do not re-read lane as a vertex index — vertex
//          param is lane + 0.5, and conflating the two is a half-lane offset
//          that looks almost right on a Ring and obviously wrong on a Box.
//   depth  float in [0,1]. 0 = throat, 1 = rim.
//
// A fractional lane walks the rim POLYGON, not the chord between adjacent lane
// centres. On a sharp corner (Box, Cross, Star) the chord cuts the corner and
// the Skimmer visibly leaves the rim; walking the polygon keeps it on the wire.
//
// The Twist (figure-eight) needs no special case anywhere in here: its throat
// is the same polygon scaled toward its own centroid, so its lanes cross
// correctly and no code notices (GDD 3.3).

// Rim vertex count for a well. Closed rims are loops (lanes verts); open rims
// are strips (lanes + 1 verts). Every index walk below goes through this.
function wellVertCount(well) {
  return well.closed ? well.lanes : well.lanes + 1;
}

// The throat polygon: the rim scaled toward its centroid by throatScale, then
// TRANSLATED by the optional throatOffset (GDD 3.3 — the definition and the
// ⛔ never-write-it-at-runtime rule are in this file's header). Two of the
// sixteen wells carry one: the Flat, whose rim is a straight line so its
// centroid lies ON the rim and every spoke was collinear, and the Stair, whose
// centroid sits a tenth of a lane length from rim vertex 6.
//
// ⛔ Memoized on the well object. This is called for every entity every frame
// once entities exist; recomputing a centroid per call is the per-frame
// allocation the §17 perf budget forbids. Cached under a non-enumerable key so
// the well data still serializes and diffs as pure data.
//
// ⛔ The cache assumes rim data is IMMUTABLE at runtime, which it is: a well is
// a static shape and a Thorn chips a lane's LENGTH (C.THORN_CHIP, a depth
// quantity), never a rim vertex. If a future phase ever mutates well.rim, it
// must delete well._throat and well._centroid in the same breath, or the
// throat silently keeps describing the old shape.
function wellThroat(well) {
  if (well._throat) return well._throat;

  const n = wellVertCount(well);
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += well.rim[i].x; cy += well.rim[i].y; }
  cx /= n; cy /= n;

  const s = well.throatScale;
  const ox = (well.throatOffset && well.throatOffset.x) || 0;
  const oy = (well.throatOffset && well.throatOffset.y) || 0;

  const throat = new Array(n);
  for (let i = 0; i < n; i++) {
    throat[i] = {
      x: cx + (well.rim[i].x - cx) * s + ox,
      y: cy + (well.rim[i].y - cy) * s + oy,
    };
  }
  Object.defineProperty(well, "_throat", { value: throat, enumerable: false });
  Object.defineProperty(well, "_centroid", { value: { x: cx, y: cy }, enumerable: false });
  return throat;
}

// The rim centroid, in normalized rim space. Derived with the throat, so this
// forces that derivation rather than duplicating the loop.
function wellCentroid(well) {
  wellThroat(well);
  return well._centroid;
}

// ---- Lane space -----------------------------------------------------------
//
// ⛔ GDD 3.5: open wells are NOT closed wells with a clamp. Lane space is a
// different topology per well, and every helper below dispatches on it:
//
//   closed  a circle of circumference `lanes`. lane === lanes is lane 0.
//   open    a segment [0, lanes-1]. The ends are WALLS, not seams.

// Wrap a lane into [0, lanes) on a closed well. Handles any magnitude and any
// sign — a negative modulus in JS is negative, hence the double-mod.
function laneWrap(well, lane) {
  const n = well.lanes;
  return ((lane % n) + n) % n;
}

// Clamp a lane into [0, lanes-1] on an open well (GDD 3.5, the Skimmer rule).
function laneClamp(well, lane) {
  const hi = well.lanes - 1;
  return lane < 0 ? 0 : (lane > hi ? hi : lane);
}

// The one route from a raw lane value to a legal one. Dispatches on topology
// so no caller has to remember which well it is holding.
function laneNormalize(well, lane) {
  return well.closed ? laneWrap(well, lane) : laneClamp(well, lane);
}

// Shortest signed lane distance from a to b — the wrap-aware `shortDelta`
// analogue RATIONALE.md#depth-model names. On a closed well this is the short
// way round and is in [-lanes/2, lanes/2]; on an open well there is only one
// way round, so it is the plain difference.
//
// Use this for "which way do I turn", never a bare (b - a): on a Ring, lane 15
// to lane 0 is +1, not -15.
function laneDelta(well, a, b) {
  if (!well.closed) return b - a;
  const n = well.lanes;
  let d = laneWrap(well, b - a);
  if (d > n / 2) d -= n;
  return d;
}

// ⛔ THE WALL HELPER (GDD 3.5, §17 test 3). A lane hop of `delta` from `lane`,
// returning BOTH the resulting lane and the direction the hopper is now
// travelling.
//
// The returned `dir` is the whole point. An enemy that stores its own hop
// direction and only asks this helper for a POSITION keeps a stale direction
// after a bounce and grinds against the wall forever, one hop in and one hop
// back. The wall and the hopper's direction are ONE piece of state: an enemy
// must write back the `dir` it gets here.
//
//   closed  wraps. dir is unchanged — there is no wall to turn at.
//   open    mirror-folds into [lo, hi], reflecting as many times as the hop
//           needs. dir flips once per reflection, so an even number of
//           bounces restores the original heading. This is NOT a clamp: a
//           clamped hopper parks on the end lane, a reflected one turns
//           around and comes back, which is the behaviour GDD 3.5 specifies.
//
// `dir` is passed through rather than inferred from delta's sign so a caller
// hopping by 0 keeps its heading instead of silently resetting it.
//
// ⛔ `lo`/`hi` ARE THE FOLD BOUNDS, AND THEY ARE A PARAMETER BECAUSE TWO
// LATTICES EXIST (GDD 3.5, the boundary lattice). They default to `0` and
// `well.lanes - 1` — the extreme legal positions of a lane-CENTRE entity, so
// every existing caller is untouched and the Vaulter's behaviour is unchanged
// by construction. A boundary-RIDER's extreme legal positions are `0.5` and
// `well.lanes - 1.5` (laneBoundaryLo/Hi below), and folding it about the
// centre bounds makes a cross from `0.5` land back on `0.5` — a whole
// vulnerable crossing window in which the entity announces itself as
// shootable and then does not move.
//
// ⛔ Two entities want different fold BOUNDS, not a second helper. There is
// exactly one mirror-fold in this build and it is here
// (RATIONALE.md#depth-model). If a third lattice ever appears, that is the
// moment to extract a `laneFold` and make this a wrapper — not before.
//
// ⚠ On a closed well `lo`/`hi` are inert: it wraps, and there is nothing to
// fold about. A caller may pass them unconditionally.
function laneHop(well, lane, delta, dir, lo, hi) {
  const d = (dir === undefined) ? (delta < 0 ? -1 : 1) : dir;

  if (well.closed) {
    return { lane: laneWrap(well, lane + delta), dir: d };
  }

  const a = (lo === undefined) ? 0 : lo;
  const b = (hi === undefined) ? well.lanes - 1 : hi;
  const span = b - a;
  if (span <= 0) return { lane: a, dir: d };

  const period = 2 * span;
  let m = ((lane + delta - a) % period + period) % period;   // [0, 2*span)
  let flipped = false;
  if (m > span) { m = period - m; flipped = true; }           // fold the far half back
  return { lane: a + m, dir: flipped ? -d : d };
}

// ---- The boundary lattice (GDD 3.5) ---------------------------------------
//
// A lane BOUNDARY is the half-integer between two lane centres: lane `k + 0.5`
// is the edge shared by lanes k and k+1. Vertex parameter is lane + 0.5, so a
// boundary sits exactly on rim vertex k+1 — it is drawn, not interpolated.
//
// ⛔ AN OPEN WELL'S TWO OUTERMOST BOUNDARIES DO NOT EXIST, and the reason is
// not only that laneClamp would refuse them. `polyAt` clamps an open well's
// vertex parameter to [0.5, n - 0.5], which is lane [0, n-1] — so lane `-0.5`
// and lane `n - 0.5` project to the SAME POINTS as the lane CENTRES `0` and
// `n - 1`. The walls are not drawable, let alone ridable: an entity placed
// there would be a second silhouette exactly on top of a first.
//
// So an open well's ridable boundaries are exactly its INTERIOR rim vertices —
// vertices 1 … lanes-1 of a strip that has lanes+1 of them — which is
// `lanes - 1` of them, at lane 0.5 … lanes-1.5. Count it on the 13-lane Vee
// and it is TWELVE, not the fourteen its rim vertex count suggests.
//
// A closed well has no walls, so all `lanes` boundaries are legal and
// drawable: lane `lanes - 0.5` resolves to rim vertex 0, reached the long way
// round the seam.
//
// ⛔ Numbers, not an object. These are read on a per-frame path and `{lo, hi}`
// would allocate every call, which §17's perf budget forbids. laneBoundaryLo
// takes a `well` it does not read, so the pair has one signature and a caller
// never has to remember which half is topology-dependent.
function laneBoundaryLo(well) {
  return 0.5;
}

function laneBoundaryHi(well) {
  return well.closed ? well.lanes - 0.5 : well.lanes - 1.5;
}

// ⛔ THE BIRTH HELPER (GDD 3.5, 6.1). A boundary-riding entity is spawned at an
// integer lane CENTRE — `spawnEnemy()` is a function of (kind, lane, depth) and
// knows nothing about any entity's lattice — and crosses onto the lattice on
// its first update. This answers where that half-cross lands and which heading
// the entity keeps: { lane, dir }.
//
//   closed  the wrapped half-step. There is no wall, so dir never changes and
//           lane 0 heading down gives `lanes - 0.5`, a legal boundary.
//   open    the half-step, and if it leaves [lo, hi] the heading REVERSES ONCE
//           and the other side is taken.
//
// ⛔ One reversal always suffices. From an integer lane centre only two births
// in a whole well can fail — lane 0 heading down and lane `lanes-1` heading up
// — and a strip of three lanes or more has a legal boundary on the other side
// of both. Every shipped well has at least eleven lanes. Proven by exhaustion
// in scratchpad/test-cs005-p1.js rather than asserted here.
//
// ⛔ THIS DOES NOT GO THROUGH laneHop, and that is not a duplication. laneHop
// folds; folding an OFF-LATTICE start about the lattice bounds overshoots —
// laneHop(Vee, 0, -0.5, -1, 0.5, 11.5) returns lane 1.5, a lane and a half in
// one cross time, which a soak reads as a teleport. A half-step that reverses
// is a different question from a hop that reflects.
//
// ⛔ This helper is where `well.closed` is read, so an entity riding the
// lattice never learns the topology — the same property the Vaulter's header
// claims, and the only reason it behaves on a Ring and on a Fan without a
// branch.
//
// `lane` is expected to be a legal lane centre. It carries a fractional lane
// through unchanged (the debug bench spawns in the Skimmer's continuous lane):
// the result is still legal and still within half a lane, but it is only ON
// the lattice when the input was an integer.
function boundaryFrom(well, lane, dir) {
  const d = dir < 0 ? -1 : 1;

  if (well.closed) return { lane: laneWrap(well, lane + d * 0.5), dir: d };

  const lo = laneBoundaryLo(well);
  const hi = laneBoundaryHi(well);
  const first = lane + d * 0.5;
  if (first >= lo && first <= hi) return { lane: first, dir: d };
  return { lane: lane - d * 0.5, dir: -d };
}

// Is this lane against a wall? Always false on a closed well — a closed well
// has no walls, only a seam, and treating the seam as a wall is the mirror of
// the GDD 3.5 bug.
function laneAtWall(well, lane) {
  if (well.closed) return false;
  return lane <= 0 || lane >= well.lanes - 1;
}

// ⛔ THE SPLIT HELPER (GDD 6.2, 3.5). Where a Carrier's two children go: one
// lane either side of the parent, as a pair of LEGAL, DISTINCT lanes.
//
// It lives here, beside laneHop, because the thing that makes it non-trivial
// is GDD 3.5 and nothing about cargo: `laneNormalize` CLAMPS on an open well,
// so the naive `[lane - 1, lane + 1]` puts BOTH children of a lane-0 Carrier
// in lanes 0 and 1 — two silhouettes stacked in one lane, on the six wells
// where the player has the least room to dodge, at the exact moment they are
// being asked to read a split. That is GDD 1.1 P2 failing, and it fails on the
// six open wells only, which is how it survives a closed-well playtest.
//
//   closed  lane ± 1, wrapped. There is no wall, so nothing else to do.
//   open    lane ± 1, then the PAIR is shifted inward — never squashed —
//           until both ends are inside [0, lanes-1]. The gap between the two
//           children is therefore always exactly two lanes, at the wall as
//           much as in the middle: a parent at lane 0 of the 13-lane Vee
//           yields children at lanes 0 and 2, so one child still occupies the
//           lane the parent died in and the trap stays honest at the wall.
//
// ⛔ Shifting, not clamping, is the whole point, and it is the same distinction
// laneHop draws between a mirror-fold and a clamp. A caller that "simplifies"
// this to laneNormalize(lane ± 1) reintroduces the stack.
//
// `lane` may be fractional — the debug bench spawns in the Skimmer's
// continuous lane — and the arithmetic below carries that through unchanged.
function splitLanes(well, lane) {
  if (well.closed) {
    return [laneWrap(well, lane - 1), laneWrap(well, lane + 1)];
  }

  const max = well.lanes - 1;
  let a = lane - 1;
  let b = lane + 1;

  if (a < 0) { b -= a; a = 0; }               // shift the pair up off the wall
  if (b > max) { a -= (b - max); b = max; }   // and down off the other one

  // Only reachable on a well with fewer than three lanes, which no shipped
  // well is. The pair collapses rather than reading off the end of the strip.
  if (a < 0) a = 0;
  return [a, b];
}

// ---- Projection -----------------------------------------------------------

// depth -> the eased fraction of the way from throat to rim (GDD 3.2).
// C.PERSPECTIVE_EXP is ~0.55: below 1, so depth spends most of its range near
// the throat and the last stretch to the rim is fast. Lower = more rush.
function perspective(depth) {
  return Math.pow(depth < 0 ? 0 : (depth > 1 ? 1 : depth), C.PERSPECTIVE_EXP);
}

// The inverse of perspective(): the depth whose eased position is `p`.
//
// ⛔ This is how an entity gets a drawn extent that behaves. screenPos lerps
// LINEARLY in perspective space, so a fixed step in `p` is a fixed step in
// SCREEN distance — which means a silhouette sized in depth units is the wrong
// size everywhere except where it was tuned. Size the silhouette in perspective
// space (where the eye lives), come back through here, and hand screenPos a
// depth. 14-render-entities.js's entityPoints() is the reader.
//
// Exact inverse on [0,1]: perspective(invPerspective(p)) === p to float
// precision. Clamped at both ends, so a shape reaching past the rim lands ON
// the rim rather than producing a depth > 1 that perspective() would clamp
// anyway — the clamp lives here so the depth handed onward is always legal.
function invPerspective(p) {
  const q = p < 0 ? 0 : (p > 1 ? 1 : p);
  return Math.pow(q, 1 / C.PERSPECTIVE_EXP);
}

// Walk a polygon in LANE units and write the result into `out`.
// Lane L sits at vertex parameter L + 0.5 — see the header note.
function polyAt(poly, well, lane, out) {
  const n = well.lanes;
  const t = lane + 0.5;
  let i = Math.floor(t);
  const f = t - i;

  if (well.closed) {
    i = ((i % n) + n) % n;
    const a = poly[i], b = poly[(i + 1) % n];
    out.x = a.x + (b.x - a.x) * f;
    out.y = a.y + (b.y - a.y) * f;
  } else {
    // A legal lane is in [0, lanes-1], so t is in [0.5, lanes-0.5] and both
    // indices are already in range. An ILLEGAL lane is clamped here rather
    // than indexed: an out-of-range lane must yield a finite edge point, never
    // a read past the end of the array. Callers should have normalized first
    // (laneNormalize), so this is a backstop, not the movement rule.
    const tc = t < 0.5 ? 0.5 : (t > n - 0.5 ? n - 0.5 : t);
    i = Math.floor(tc);
    const a = poly[i], b = poly[i + 1];
    const g = tc - i;
    out.x = a.x + (b.x - a.x) * g;
    out.y = a.y + (b.y - a.y) * g;
  }
  return out;
}

// The rim point for a lane, in normalized rim space.
function rimPoint(well, lane, out) {
  return polyAt(well.rim, well, lane, out || { x: 0, y: 0 });
}

// The throat point for a lane, in normalized rim space.
function throatPoint(well, lane, out) {
  return polyAt(wellThroat(well), well, lane, out || { x: 0, y: 0 });
}

// ⛔ screenPos(well, lane, depth) — THE projection. GDD 3.2:
//
//   screenPos = lerp( throatVertex(lane), rimVertex(lane), perspective(depth) )
//
// Normalized rim space ([-1,1] about the origin) is mapped onto the fixed
// 1280x720 world by C.WELL_CX / C.WELL_CY / C.WELL_RADIUS. ⛔ Game math never
// reads window size; the canvas is letterboxed by CSS.
//
// `out` is an optional scratch point. The render path passes one per call site
// so a full frame allocates nothing — §17's perf budget forbids per-frame
// allocation in the hot path.
//
// The two module-level scratch points below make this NON-REENTRANT: screenPos
// must not be called from inside a callback screenPos itself invoked. It never
// is — this is a leaf function — but do not give it one.
const _rimP = { x: 0, y: 0 };
const _thrP = { x: 0, y: 0 };
function screenPos(well, lane, depth, out) {
  const p = out || { x: 0, y: 0 };
  const t = perspective(depth);

  rimPoint(well, lane, _rimP);
  throatPoint(well, lane, _thrP);

  const nx = _thrP.x + (_rimP.x - _thrP.x) * t;
  const ny = _thrP.y + (_rimP.y - _thrP.y) * t;

  p.x = C.WELL_CX + nx * C.WELL_RADIUS;
  p.y = C.WELL_CY + ny * C.WELL_RADIUS;
  return p;
}

// 04-input.js
// ==========================================================================
// 04-input.js — kit-input (draft). Four devices in, ONE struct out.
//
// ⛔ THIS MODULE READS NO GAME GLOBAL. Not the config object, not the mutable
// game object, not a game function — in either direction. Every tunable
// arrives through createInput()'s options and 23-main.js is what passes them
// in. That is CLAUDE.md's boundary contract ("Kit modules and extraction"),
// and it is the whole reason this file can later be copied into coinless-kit
// rather than rewritten. Backport packet: src/04-input.NOTES.md.
//
// ⛔ ONE struct (GDD 9.5):  { rotate, fire, purge, jump }
// The simulation never learns which device produced it, and call sites never
// read a raw key map. `rotate` is a LANE DELTA for this simulation step, not a
// velocity: mouse motion is inherently a delta, and turning it into a velocity
// means dividing by dt, which is how linearity (GDD 9.1) gets quietly lost.
//
// ⛔ NO ACCELERATION CURVE on the mouse (GDD 9.1). A spinner has none, and
// adding one is the single most common way to ruin this game's rim feel.
// The mouse path is one multiply, on purpose. Keep it that way.
//
// CS002 P4 adds touch and gamepad. Both go through the SAME sink and the SAME
// sample() as mouse/keyboard — one code path, not two that agree today:
//   - Touch rotation is a relative drag, accumulated into the same mouseDx-like
//     bucket mouse motion uses, just at a different sensitivity (TOUCH_SENS).
//   - The D-pad is wired as two synthetic key names ("gamepadleft" /
//     "gamepadright") fed through keyDown/keyUp, so it rides the exact
//     tap/hold state machine the keyboard uses. There is no second axis model.
//   - The left stick is genuinely different (a held analog position rather
//     than a digital press), so it gets its own accumulator, scaled by
//     GAMEPAD_SENS and gated by GAMEPAD_DEADZONE.
// The Gamepad API has no events for stick/axis motion — it must be polled —
// so `pollGamepads()` runs once at the top of every sample(), reading through
// whatever `win` attach() was given. That is still "one code path": polling
// only decides how gamepad state ENTERS the sink, same as a DOM listener does
// for mouse/keyboard.
//
// Device events arrive through the small sink API below (mouseMove / keyDown /
// keyUp / setButton). attach() is a thin DOM adapter over that sink and is the
// only place in the entire build that touches a DOM event. That split is what
// lets a headless test replay a recorded event list with no DOM at all, which
// is what makes the determinism guarantee (GDD 17.1) testable.

const INPUT_VERSION = "0.3.0";

// Default bindings, matched case-insensitively. These are NOT tunables — a
// keymap is this module's own default and a host replaces it wholesale through
// options.keys. Values are DOM `key` names, lowercased.
//
// "w" and "r" are deliberately unbound here: the game binds them as named debug
// actions (see options.actionKeys), and a key doing two jobs is a bug waiting
// for a player who rebinds.
const INPUT_KEYS_DEFAULT = {
  left:  ["arrowleft", "a"],
  right: ["arrowright", "d"],
  fire:  [" ", "z"],
  purge: ["shift", "x"],
  jump:  ["arrowup", "c"],
};

function inputNormKey(k) {
  return String(k).toLowerCase();
}

// Default gamepad button map, standard Gamepad layout indices. NOT a tunable
// for the same reason INPUT_KEYS_DEFAULT isn't — this is the module's own
// default and a host replaces it wholesale through options.gamepadButtons.
//   0 = A, 4/5 = Left/Right Bumper, 6/7 = Left/Right Trigger.
const GAMEPAD_BUTTONS_DEFAULT = {
  fire:  [0],
  jump:  [4, 6],
  purge: [5, 7],
};

// ⛔ Numeric tunables are REQUIRED, never defaulted. A default here would be a
// second tuning surface competing with the host's config object, and the point
// of the boundary is that there is exactly one. Failing loudly at wiring time
// beats a silent 0.02 that nobody can find later.
function inputRequireNum(opts, name) {
  const v = opts[name];
  if (typeof v !== "number" || !isFinite(v)) {
    throw new Error("createInput: options." + name + " must be a finite number");
  }
  return v;
}

// Same requirement, for the two touch tunables that are booleans rather than
// numbers (TOUCH_AUTOFIRE, INPUT_MIRROR). Same reasoning as inputRequireNum.
function inputRequireBool(opts, name) {
  const v = opts[name];
  if (typeof v !== "boolean") {
    throw new Error("createInput: options." + name + " must be a boolean");
  }
  return v;
}

// Turn { action: ["key", ...] } into both directions at once: a key -> action
// lookup for events, and an action -> keys list for "is anything held?".
function inputBuildBindings(src) {
  const byKey = new Map();
  const byAction = {};
  for (const action of Object.keys(src)) {
    const raw = src[action];
    const list = Array.isArray(raw) ? raw : [raw];
    const norm = [];
    for (let i = 0; i < list.length; i++) {
      const k = inputNormKey(list[i]);
      norm.push(k);
      byKey.set(k, action);
    }
    byAction[action] = norm;
  }
  return { byKey, byAction };
}

//   createInput({
//     mouseSens, keyTapMs, keySpeedMin, keySpeedMax, keyRamp,   // required
//     touchSens, touchZoneFrac, touchAutofire, touchButtonR,    // required
//     gamepadDeadzone, gamepadSens,                             // required
//     worldW, worldH,       // required — world-space size touch buttons live in
//     inputMirror,          // required — mirrors touch buttons for left-handed play
//     pointerLockOffer,                                          // optional, default on
//     keys,        // optional binding override, shape of INPUT_KEYS_DEFAULT
//     actionKeys,  // optional { actionName: ["key", ...] } for named actions
//     onAction,    // optional (name) => void, called during sample()
//   })
function createInput(options) {
  const opts = options || {};

  const mouseSens   = inputRequireNum(opts, "mouseSens");
  const keyTapS     = inputRequireNum(opts, "keyTapMs") / 1000;
  const keySpeedMin = inputRequireNum(opts, "keySpeedMin");
  const keySpeedMax = inputRequireNum(opts, "keySpeedMax");
  const keyRamp     = inputRequireNum(opts, "keyRamp");
  const pointerLockOffer = opts.pointerLockOffer !== false;
  const onAction = typeof opts.onAction === "function" ? opts.onAction : null;

  const touchSens      = inputRequireNum(opts, "touchSens");
  const touchZoneFrac  = inputRequireNum(opts, "touchZoneFrac");
  const touchButtonR   = inputRequireNum(opts, "touchButtonR");
  const touchAutofire  = inputRequireBool(opts, "touchAutofire");
  const gamepadDeadzone = inputRequireNum(opts, "gamepadDeadzone");
  const gamepadSens     = inputRequireNum(opts, "gamepadSens");
  const worldW = inputRequireNum(opts, "worldW");
  const worldH = inputRequireNum(opts, "worldH");
  const inputMirror = inputRequireBool(opts, "inputMirror");

  const bindings = inputBuildBindings(opts.keys || INPUT_KEYS_DEFAULT);
  const actions  = inputBuildBindings(opts.actionKeys || {});

  // The D-pad rides the SAME tap/hold state machine the keyboard uses (GDD
  // 9.4) — these are not a second axis model, just two more bound "keys" that
  // happen to be pressed by pollGamepads() instead of a keydown event.
  function bindSynthetic(key, action) {
    bindings.byKey.set(key, action);
    if (!bindings.byAction[action]) bindings.byAction[action] = [];
    bindings.byAction[action].push(key);
  }
  bindSynthetic("gamepadleft", "left");
  bindSynthetic("gamepadright", "right");

  // fire/purge/jump button map — host-overridable wholesale, same pattern as
  // `keys` above.
  const gamepadButtons = opts.gamepadButtons || GAMEPAD_BUTTONS_DEFAULT;

  const pressed = new Set();   // normalized key names currently down
  const buttons = new Set();   // non-key sources holding a button: "fire", ...
  const queued  = [];          // named actions triggered since the last sample

  // One record per rotation direction. `emitted` is how much of a lane this
  // press has already delivered, which is what makes the tap exact.
  const axis = {
    left:  { down: false, held: 0, emitted: 0, tap: false },
    right: { down: false, held: 0, emitted: 0, tap: false },
  };

  let mouseDx = 0;         // px accumulated since the last sample
  let impulse = 0;         // signed lane units owed by taps completed since then
  let lastClientX = null;  // fallback when a mousemove carries no relative delta

  // Touch: a relative drag, exactly like mouse but at TOUCH_SENS (GDD 9.3).
  // Not a virtual stick — there is no rest position, only Δx since last move.
  const touches = new Map();   // touch id -> { kind: "drag"|"purge"|"jump", x }
  let touchDx = 0;              // world-space px accumulated since the last sample
  let touchDragCount = 0;       // active drag touches; > 0 drives TOUCH_AUTOFIRE

  // Gamepad: the stick is a held analog position, not a discrete press, so it
  // gets its own accumulator rather than routing through `axis` (GDD 9.4).
  let gamepadWin = null;         // set by attach(); polled once per sample()
  let gamepadAxisX = 0;
  let gpDpadLeftDown = false, gpDpadRightDown = false;
  // Tracked separately from `buttons` (mouse/touch) — a polled level-state
  // source must not blindly clear a name another device is still holding.
  const gamepadHeld = { fire: false, purge: false, jump: false };

  const out = { rotate: 0, fire: false, purge: false, jump: false };

  const detachers = [];

  // ---- the sink: every device path ends up calling these --------------------

  // Returns whether the key is bound at all, so a DOM adapter knows whether to
  // swallow the browser's default (space scrolling the page, say).
  function keyDown(rawKey) {
    const k = inputNormKey(rawKey);
    const bound = bindings.byKey.has(k) || actions.byKey.has(k);
    // Held keys repeat. A repeat is not a new press — treating it as one would
    // restart the ramp sixty times a second and re-arm the tap forever.
    if (pressed.has(k)) return bound;
    pressed.add(k);

    const dir = axis[bindings.byKey.get(k)];
    if (dir) { dir.down = true; dir.held = 0; dir.emitted = 0; dir.tap = true; }

    const named = actions.byKey.get(k);
    if (named !== undefined) queued.push(named);

    return bound;
  }

  function keyUp(rawKey) {
    const k = inputNormKey(rawKey);
    const bound = bindings.byKey.has(k) || actions.byKey.has(k);
    if (!pressed.delete(k)) return bound;
    const name = bindings.byKey.get(k);
    // Another key bound to the same direction may still be down (arrow + WASD).
    if (axis[name] && !anyKeyHeld(name)) releaseAxis(name);
    return bound;
  }

  function mouseMove(dx) {
    if (typeof dx === "number" && isFinite(dx)) mouseDx += dx;
  }

  // A button held by something that is not a key: a mouse button now, a touch
  // button in P4. Same four action names, same struct.
  function setButton(name, down) {
    if (down) buttons.add(name); else buttons.delete(name);
  }

  // Purge (top-right) and Jump (bottom-right), radius touchButtonR, mirrored
  // to the left side when inputMirror is set (GDD 9.3).
  function touchButtonCenters() {
    const m = touchButtonR * 1.5;
    if (inputMirror) return { purge: { x: m, y: m }, jump: { x: m, y: worldH - m } };
    return { purge: { x: worldW - m, y: m }, jump: { x: worldW - m, y: worldH - m } };
  }

  function inCircle(x, y, c, r) {
    const dx = x - c.x, dy = y - c.y;
    return dx * dx + dy * dy <= r * r;
  }

  // touchStart/touchMove/touchEnd take WORLD-SPACE coordinates (the same
  // 1280x720-ish space every other entity lives in) — the DOM adapter below
  // is what converts a real touch event's client pixels into that space, so
  // this trio stays exercisable with no DOM at all, same as the rest of the
  // sink.
  function touchStart(id, x, y) {
    const c = touchButtonCenters();
    if (inCircle(x, y, c.purge, touchButtonR)) { touches.set(id, { kind: "purge" }); buttons.add("purge"); return; }
    if (inCircle(x, y, c.jump,  touchButtonR)) { touches.set(id, { kind: "jump" });  buttons.add("jump");  return; }
    if (y >= worldH * (1 - touchZoneFrac)) {
      touches.set(id, { kind: "drag", x: x });
      touchDragCount++;
    }
  }

  function touchMove(id, x, y) {
    const t = touches.get(id);
    if (!t || t.kind !== "drag") return;
    touchDx += x - t.x;
    t.x = x;
  }

  function touchEnd(id) {
    const t = touches.get(id);
    if (!t) return;
    touches.delete(id);
    if (t.kind === "purge") buttons.delete("purge");
    else if (t.kind === "jump") buttons.delete("jump");
    else touchDragCount--;
  }

  // Polled once per sample() (the Gamepad API has no motion events — a stick
  // held over at rest produces nothing to listen for). `win` is whatever
  // attach() was given; a headless test can call this directly with a plain
  // `{ navigator: { getGamepads: () => [...] } }` object.
  function pollGamepads(win) {
    if (!win || !win.navigator || typeof win.navigator.getGamepads !== "function") return;
    let pads;
    try { pads = win.navigator.getGamepads(); } catch (err) { return; }
    const gp = pads && pads[0];
    if (!gp) {
      gamepadAxisX = 0;
      if (gpDpadLeftDown)  { keyUp("gamepadleft");  gpDpadLeftDown = false; }
      if (gpDpadRightDown) { keyUp("gamepadright"); gpDpadRightDown = false; }
      gamepadHeld.fire = false; gamepadHeld.purge = false; gamepadHeld.jump = false;
      return;
    }
    const ax = gp.axes && typeof gp.axes[0] === "number" && isFinite(gp.axes[0]) ? gp.axes[0] : 0;
    gamepadAxisX = ax;

    // ⛔ The D-pad reaches `left`/`right` through keyDown/keyUp — the SAME
    // tap/hold implementation the keyboard uses. This is edge detection only;
    // the state machine that turns a press into a lane delta lives in exactly
    // one place (advanceAxis/releaseAxis above).
    const left  = !!(gp.buttons && gp.buttons[14] && gp.buttons[14].pressed);
    const right = !!(gp.buttons && gp.buttons[15] && gp.buttons[15].pressed);
    if (left !== gpDpadLeftDown)   { if (left) keyDown("gamepadleft"); else keyUp("gamepadleft"); gpDpadLeftDown = left; }
    if (right !== gpDpadRightDown) { if (right) keyDown("gamepadright"); else keyUp("gamepadright"); gpDpadRightDown = right; }

    // fire/purge/jump — level state, recomputed every poll. Any bound button
    // held is enough; this is OR across a button LIST, not an edge.
    for (const name of Object.keys(gamepadHeld)) {
      const list = gamepadButtons[name] || [];
      let held = false;
      for (let i = 0; i < list.length; i++) {
        const b = gp.buttons && gp.buttons[list[i]];
        if (b && b.pressed) { held = true; break; }
      }
      gamepadHeld[name] = held;
    }
  }

  // Proportional past the deadzone, scaled by gamepadSens (GDD 9.4). Returns
  // a lane delta for this step, same units as the mouse/touch/tap paths.
  function gamepadAxisDelta(x, dt) {
    if (x <= -gamepadDeadzone || x >= gamepadDeadzone) return x * gamepadSens * dt;
    return 0;
  }

  function anyKeyHeld(name) {
    const list = bindings.byAction[name];
    if (!list) return false;
    for (let i = 0; i < list.length; i++) if (pressed.has(list[i])) return true;
    return false;
  }

  function actionHeld(name) {
    return anyKeyHeld(name) || buttons.has(name) || gamepadHeld[name] === true;
  }

  // GDD 9.2 — a tap is EXACTLY one lane, in total. The ramp below has already
  // delivered part of that lane during the press, so release pays the balance.
  // ⛔ That means the constants must satisfy: the ramp integrated over
  // keyTapMs is at most one lane. At the shipped values it is ~0.76, so the
  // balance is positive; the clamp is there so a future retune that breaks the
  // relation degrades to "no extra nudge" rather than to a backwards jump.
  function releaseAxis(name) {
    const dir = axis[name];
    if (!dir.down) return;
    dir.down = false;
    if (dir.tap) {
      const rest = 1 - dir.emitted;
      if (rest > 0) impulse += (name === "left" ? -rest : rest);
    }
    dir.held = 0; dir.emitted = 0; dir.tap = false;
  }

  // Hold: accelerate keySpeedMin -> keySpeedMax over keyRamp (GDD 9.2). Ramping
  // from the first step rather than after the tap window is deliberate — a
  // 130 ms dead spot at the start of every hold is exactly the latency P1 says
  // must not exist.
  function advanceAxis(dir, dt) {
    if (!dir.down) return 0;
    dir.held += dt;
    if (dir.held >= keyTapS) dir.tap = false;
    const f = keyRamp > 0 ? Math.min(1, dir.held / keyRamp) : 1;
    const step = (keySpeedMin + (keySpeedMax - keySpeedMin) * f) * dt;
    dir.emitted += step;
    return step;
  }

  // ---- the one output ------------------------------------------------------

  // sample(dt, target) — writes the struct into `target` when given (the game
  // passes its own object so the mutable game object owns it) and returns it.
  // Allocates nothing.
  function sample(dt, target) {
    const s = target || out;

    pollGamepads(gamepadWin);

    let rotate = mouseDx * mouseSens;   // ⛔ linear. One multiply. No curve.
