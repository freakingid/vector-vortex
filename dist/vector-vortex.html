  // dominant axis and no monotonic run — which is the whole difference from the
  // surger row, and the difference the player pays for getting wrong. It
  // crosses itself once, which is what says "cluster" rather than "line", and
  // it spans ~62% of the glyph box's width so it reads COMPACT against the two
  // full-width rows at the depth where all three are smallest.
  drifter: [
    { l: -0.62, d: -0.14 },
    { l:  0.34, d:  0.36 },
    { l: -0.16, d: -0.36 },
    { l:  0.62, d:  0.08 },
  ],

  // The Surger's bar (SURGER_POLY below), reduced to ONE square cycle. ⛔ The
  // corners are square, exactly as the silhouette's are, because that is what
  // stops the bar reading as a lightning bolt and it is the half of the gesture
  // worth keeping at glyph size. Two flat runs across the lanes joined by one
  // step: full width, so it can never be the compact drifter row, and flat,
  // so it can never be the vaulter's angled chevron.
  surger: [
    { l: -1.00, d: -0.36 },
    { l:  0.00, d: -0.36 },
    { l:  0.00, d:  0.36 },
    { l:  1.00, d:  0.36 },
  ],
};

// ⛔ drawPoly + glowStroke, no fill (GDD 10.2), and FULL ALPHA AT EVERY DEPTH
// for the same reason the Vaulter has it: GDD 10.3 governs what may be drawn
// OVER the throat zone, and the enemy is the approaching thing that rule
// protects.
//
// ⚠ The glyph is stroked in C.CARRIER_COLOR, the hull's own colour, rather than
// in the cargo's. The palette note in 00-config.js is why: hue alone cannot
// separate eight simultaneous things, so silhouette carries the read and the
// palette's job is narrower. A cargo-coloured glyph is a real option for the
// first art pass — it is one lookup — but it is an art decision and it is not
// this phase's to make.
function drawCarrier(ctx, well, lane, depth, cargo) {
  drawPoly(ctx, entityPoints(well, lane, depth, CARRIER_POLY, C.CARRIER_SIZE), true);
  glowStroke(ctx, C.CARRIER_COLOR, laneLineWidth(depth), 1);

  // An unknown cargo draws the hull and nothing else, matching the way an
  // unknown kind spawns nothing and an unknown cargo carries nothing. A
  // Carrier with no glyph is visibly wrong; a thrown exception is a black
  // screen.
  const glyph = CARGO_GLYPHS[cargo];
  if (!glyph) return;
  drawPoly(ctx, entityPoints(well, lane, depth, glyph, C.CARRIER_GLYPH_SIZE), false);
  glowStroke(ctx, C.CARRIER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Weaver's silhouette (GDD 6.1, 18) — GDD 6.1's OPEN SPIRAL.
// ---------------------------------------------------------------------------
//
// ⛔ AN OPEN PATH. drawPoly's `closed` argument is false for this one, and it is
// not a stylistic choice: a spiral that closes is a set of nested boxes, and the
// unwinding is the whole read. This is the roster's first open silhouette.
//
// ⛔ IT MUST NOT READ AS A THREAT THE WAY THE VAULTER DOES, BECAUSE IT IS NOT
// ONE. Its body never kills (07-enemies.js — killDepth is null); what the
// player is afraid of is what it LEAVES and what it FIRES. So there are no arm
// tips, no points aimed at the rim, and nothing that reads as a wingspan
// blocking a lane. A coil unwinding in place is the opposite gesture: busy,
// occupied, indifferent to you.
//
// ⛔ GDD 18 item 3: ours, not the original's. The shape that game's equivalent is
// remembered for is a rod with a wave running along it — a straight spine,
// which this deliberately has none of.
//
// A rectangular coil, four turns, wound outward from the centre. `l` reaches
// exactly ±1 at the extremes, so C.WEAVER_SIZE means what it means on every
// other silhouette: the lane widths the shape spans. The inner turns are the
// first thing lost at throat depth and that is correct — the outer sweep is
// what carries the read down there.
//
// Shape DATA, the same class of thing as WELLS' rim polygons.
const WEAVER_POLY = [
  { l:  0.00, d:  0.00 },   // the eye of the coil
  { l:  0.30, d:  0.00 },
  { l:  0.30, d:  0.34 },
  { l: -0.40, d:  0.34 },
  { l: -0.40, d: -0.44 },
  { l:  0.66, d: -0.44 },
  { l:  0.66, d:  0.70 },
  { l: -1.00, d:  0.70 },
  { l: -1.00, d: -0.90 },
  { l:  1.00, d: -0.90 },   // the loose end, trailing toward the throat
];

// ⛔ drawPoly + glowStroke, ONE OPEN path, no fill (GDD 10.2), and FULL ALPHA AT
// EVERY DEPTH for the same reason the Vaulter and the Carrier have it: GDD 10.3
// governs what may be drawn OVER the throat zone, and the enemy is the
// approaching thing that rule protects.
function drawWeaver(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, WEAVER_POLY, C.WEAVER_SIZE), false);
  glowStroke(ctx, C.WEAVER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Weaver's bolt (GDD 4.5 item 4, 18) — a small dart, aimed at the rim.
// ---------------------------------------------------------------------------
//
// ⛔ IT HAS TO READ AS AIMED, because dodging it is the only answer the player
// has (it is not shootable — 07-enemies.js). So: a tip toward the RIM, two
// barbs swept back toward the throat, and a notched tail. Closed, small, and
// deliberately unlike both of the other two shapes it will share a lane with —
// the Carrier's cargo chevron is open and has no tip, and the Weaver that fired
// this has no straight edges at all.
//
// The depth extent reaches d = 1, the largest in the roster, so entityPoints'
// rim clamp holds it a fraction further off the rim than a Vaulter at the same
// depth. That is the right way round: the tip is what the player is reading.
const WEAVER_BOLT_POLY = [
  { l:  0.00, d:  1.00 },   // tip, toward the rim
  { l:  1.00, d: -0.40 },
  { l:  0.00, d:  0.00 },   // notched tail
  { l: -1.00, d: -0.40 },
];

// ⛔ Its own colour, a paler relative of its parent's (00-config.js), so a bolt
// is legibly the Weaver's output rather than a second Weaver. ⚠ Both are
// provisional, as the whole enemy palette is.
function drawWeaverBolt(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, WEAVER_BOLT_POLY, C.WEAVER_BOLT_SIZE), true);
  glowStroke(ctx, C.WEAVER_BOLT_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Thorn (GDD 6.1, 4.2, 10.2, 10.3, 18) — a bright lane segment.
// ---------------------------------------------------------------------------
//
// ⛔ entityPoints() DOES NOT APPLY HERE, AND THAT IS NOT AN OVERSIGHT. Every
// other enemy is a silhouette AT a point: a local-space poly projected around
// one (lane, depth). A Thorn is a SEGMENT ALONG the lane, from the throat to
// its tip, and it has no local-space shape at all — it is the same class of
// drawing as a shot's streak or the well's own spokes. The pattern it reuses is
// drawShot()'s at the top of this file: preallocated scratch points, screenPos
// per end, drawPoly, glowStroke. The Surger's telegraph is the other one and it
// landed in CS005 P3 — ⛔ with its OWN scratch points, not these, because both
// can be live in the same lane in the same frame (drawSurgeLane, at the foot).
//
// ⛔ NO PER-FRAME ALLOCATION (GDD 17's perf budget). The two point PAIRS are
// preallocated as well as the points, because `drawPoly(ctx, [a, b])` allocates
// an array literal every call — cheap, and still an allocation in a per-frame
// path with up to C.ENEMY_CAP Thorns in it.
const _thornRoot = { x: 0, y: 0 };   // the throat end — always depth 0
const _thornNeck = { x: 0, y: 0 };   // C.THORN_TIP_LEN back from the tip
const _thornTip  = { x: 0, y: 0 };
const _thornBody = [_thornRoot, _thornTip];
const _thornCrown = [_thornNeck, _thornTip];

// ⛔ FULL ALPHA AT EVERY DEPTH, INCLUDING INSIDE THE THROAT ZONE. GDD 10.3 is a
// rule about what may be drawn OVER that zone — explosions, particles, score
// popups, the things that hide an approaching enemy. A Thorn is not drawn over
// the well, it IS lane geometry, and the player has to be able to see which
// lanes are thorned from the moment one starts growing. Fading it would be the
// readability failure, exactly as it would be on a Vaulter.
//
// The tip is brighter because it is drawn TWICE — glowStroke composites with
// `lighter`, so the last C.THORN_TIP_LEN of the segment accumulates both
// strokes. ⛔ That is why there is no second colour and no alpha split: a chip
// landing is a visible step of the bright band down the lane, and one constant
// controls how much band there is.
//
// Line weight follows the well's own spokes (13-render-well.js): a stroke that
// spans a range of depths takes the weight of its MIDPOINT, because a single
// stroke has one width and the lane it lies in is getting narrower. The body's
// midpoint is depth/2; the crown sits at the tip and is therefore the wider of
// the two, which is the right way round for the thing the player is aiming at.
function drawThorn(ctx, well, lane, depth) {
  const tip = depth > 1 ? 1 : (depth < 0 ? 0 : depth);
  if (tip <= 0) return;   // a Thorn with no length yet — the step a Weaver
                          // stands one up. Nothing to draw, and drawing it
                          // would be a zero-length path.

  screenPos(well, lane, 0, _thornRoot);
  screenPos(well, lane, tip, _thornTip);
  drawPoly(ctx, _thornBody, false);
  glowStroke(ctx, C.THORN_COLOR, laneLineWidth(tip / 2), 1);

  const neck = tip - C.THORN_TIP_LEN;
  screenPos(well, lane, neck < 0 ? 0 : neck, _thornNeck);
  drawPoly(ctx, _thornCrown, false);
  glowStroke(ctx, C.THORN_COLOR, laneLineWidth(tip), 1);
}

// ---------------------------------------------------------------------------
// The Drifter's TWO silhouettes (GDD 6.1, 6.3, 12, 18) — the armour, made
// visible.
// ---------------------------------------------------------------------------
//
// ⛔ GDD 6.3 CARRIES A ⛔ ON THIS BEING READABLE AT A GLANCE, and it is the one
// place in Classic where a rendering decision is the difference between a hard
// enemy and an unfair one: a player who cannot tell an armoured Drifter from a
// vulnerable one is not playing against a threat, they are being killed at
// random. GDD 12's first-Drifter prompt names the visual language the game
// promises the player: SOLID = ARMOURED · OPEN = VULNERABLE.
//
// So the two states differ on THREE INDEPENDENT CHANNELS, and no one of them
// carries the read alone:
//
//   silhouette   a compact poly drawn CLOSED, against a splayed poly drawn OPEN
//   stroke width laneLineWidth * C.DRIFT_RIDE_WIDTH against * C.DRIFT_CROSS_WIDTH
//   alpha        C.DRIFT_RIDE_ALPHA against 1
//
// ⛔ TWO POLYS, NOT ONE POLY RESTYLED. entityPoints() memoizes a scratch array
// PER POLY ARRAY (see its header), so the second one costs one projection loop
// and zero allocation — the Carrier's shipped hull-and-glyph pattern. One poly
// drawn closed and then open differs by a single edge, which is not a read at a
// glance and is exactly what the ⛔ above forbids.
//
// ⛔ NO GLOBAL GLOW CONSTANT IS TOUCHED. glowStroke's wide pass is
// `width * C.GLOW_WIDE_W`, so a narrower width here is literally a harder edge
// rather than a metaphor for one — but GLOW_WIDE_W, GLOW_WIDE_ALPHA and
// GLOW_THIN_ALPHA are shared with the well and every other entity, and retuning
// one of them is an art pass across the whole build. Both Drifter states are
// per-entity multipliers only.
//
// ⛔ THE FULL-ALPHA RULE THE OTHER FOUR ENEMIES CARRY DOES NOT APPLY HERE, and
// that is not a hole in GDD 10.3. That rule is about what may be drawn OVER the
// throat zone — explosions, particles, popups, the things that hide an
// approaching enemy — and it is why the Vaulter, the Carrier, the Weaver and
// the bolt never fade. The Drifter's alpha is not a distance fade: it is
// constant with depth and it IS the feature. ⚠ Which means C.DRIFT_RIDE_ALPHA
// is the one constant in this file that can make an enemy hard to see at the
// throat, and judging it there is a playtest ask rather than an assertion.

// ⛔ GDD 18 item 3: ours. GDD 6.1's silhouette is a "tumbling spark cluster",
// and the two shapes below are the same cluster clenched and then thrown open.
//
// RIDING is a closed, irregular five-point knot with no axis of symmetry — a
// clenched thing sitting ON the boundary line, not spanning across it. It
// reaches only ~0.66 of the lane extent the crossing shape does, so the compact
// read survives even where the line weight and alpha do not (deep in the
// throat, where every stroke is thin).
//
// ⛔ It must be unmistakable from the Vaulter's flattened X, so there is no
// four-armed radial shape here and no arm tips at all: the Vaulter is a
// symmetric wingspan blocking a lane, and this is a lump riding an edge.
//
// Shape DATA, the same class of thing as WELLS' rim polygons. The lane extent
// is scaled by C.DRIFTER_SIZE; the depth extent is not (entityPoints scales `d`
// by C.ENEMY_DEPTH_SCALE alone).
const DRIFTER_POLY_RIDE = [
  { l:  0.06, d: -0.62 },
  { l:  0.62, d: -0.10 },
  { l:  0.34, d:  0.56 },
  { l: -0.40, d:  0.50 },
  { l: -0.66, d: -0.18 },
];

// CROSSING is the same cluster coming apart: an OPEN path that zigzags out past
// both edges of the shape it was, crossing its own centre three times. Open is
// half of GDD 12's promise, and the reversals are what make it read as a
// scatter rather than as a bigger version of the knot — a closed version of
// these points would be a spiky blob and would read as the same creature.
//
// `l` reaches exactly ±1 at the extremes, so C.DRIFTER_SIZE means on this what
// it means on every other silhouette: the lane widths the shape spans.
const DRIFTER_POLY_CROSS = [
  { l: -1.00, d:  0.06 },
  { l: -0.30, d: -0.34 },
  { l: -0.46, d:  0.88 },
  { l:  0.08, d: -0.06 },
  { l:  0.52, d:  0.92 },
  { l:  0.30, d: -0.42 },
  { l:  1.00, d: -0.04 },
];

// ⛔ drawPoly + glowStroke, one path, no fill (GDD 10.2). `riding` selects all
// three channels at once and is the entity's own phase (07-enemies.js) rather
// than anything this module decides — which is why the two states can never
// drift apart from the two behaviours.
//
// ⛔ Note that `riding` IS the `closed` argument. That is not a coincidence
// being exploited: GDD 12 promises the player SOLID = ARMOURED, and armoured is
// exactly the riding phase, so the two are the same boolean and writing them as
// one is what stops a later edit changing the shape without changing the rule.
function drawDrifter(ctx, well, lane, depth, riding) {
  const poly = riding ? DRIFTER_POLY_RIDE : DRIFTER_POLY_CROSS;
  const width = laneLineWidth(depth) * (riding ? C.DRIFT_RIDE_WIDTH : C.DRIFT_CROSS_WIDTH);
  drawPoly(ctx, entityPoints(well, lane, depth, poly, C.DRIFTER_SIZE), riding);
  glowStroke(ctx, C.DRIFTER_COLOR, width, riding ? C.DRIFT_RIDE_ALPHA : 1);
}

// ---------------------------------------------------------------------------
// The Surger (GDD 6.1, 6.3, 4.5 item 3, 10.2, 10.3, 18) — a zigzag bar, and
// THE FUSE, which is the other thing in this file that is a segment ALONG a
// lane rather than a silhouette AT a point.
// ---------------------------------------------------------------------------
//
// ⛔ THE TELEGRAPH IS AN ENTITY DRAW AND NOT drawWell()'s laneState. CS006 P4
// wired that parameter — buildLaneState() (23-main.js) sets a `surgeCharge`
// flag for a charging Surger's lane — and the telegraph deliberately did NOT
// move onto it. It could not express this: isLaneLit() is a BOOLEAN over
// SPOKES, and GDD 6.3 asks for a lane that brightens throat→rim across
// C.SURGE_TELEGRAPH, which is a progressive fill. Two marks, not one: the
// spokes light, and this creeps up between them.
//
// ⛔ ITS OWN SCRATCH POINTS, NOT THE THORN'S. A Thorn and a Surger can be live
// in the same lane in the same frame, and sharing module scratch between two
// segment drawers is a trap even though both calls are sequential leaves today
// — the failure would be one of the two segments drawn at the other's length,
// intermittently, and it would read as a bug in the well.
//
// ⛔ NO PER-FRAME ALLOCATION (GDD 17's perf budget). The point PAIR is
// preallocated as well as the points, because `drawPoly(ctx, [a, b])` allocates
// an array literal every call — drawThorn()'s rule, for drawThorn()'s reason.
const _surgeRoot = { x: 0, y: 0 };   // the throat end — always depth 0
const _surgeTip  = { x: 0, y: 0 };   // the fuse's leading edge
const _surgeSeg  = [_surgeRoot, _surgeTip];

// The fuse, and then the live lane — ONE drawer, because they are one gesture.
// `tip` is 0..1 of the lane the charge has covered and `live` is whether the
// lane is discharging.
//
// ⛔ ROOTED AT THE THROAT WITH THE TIP ADVANCING TO THE RIM, never a lane that
// merely gets brighter. What the player has to see is the charge TRAVELLING UP
// THE LANE AT THEM, because the thing they are being asked to decide is whether
// to leave, and a uniform glow says nothing about how long they have.
//
// ⛔ THE WIDTH IS THE STATE CHANGE. The fuse creeps up at plain lane weight —
// it is a warning and the lane is not lethal (07-enemies.js: killDepth is
// untouched for the whole telegraph) — and the discharge slams the whole lane
// to C.SURGE_LIT_WIDTH. The fuse reaching the rim and the lane going live are
// the same instant, so the geometry says exactly when: when it gets to you, it
// is live. ⛔ A per-entity multiplier on laneLineWidth and never a global glow
// constant (00-config.js).
//
// ⛔ FULL ALPHA AT EVERY DEPTH, INCLUDING INSIDE THE THROAT ZONE. GDD 10.3 is a
// rule about what may be drawn OVER that zone — explosions, particles, score
// popups, the things that hide an approaching enemy. A telegraph is not drawn
// over the well, it IS lane geometry, and the player has to see which lane is
// arming from the moment it starts arming. ⛔ Do not apply shotAlpha() to it:
// a fuse that is invisible for its first third is not a fuse, and GDD 6.3's ⛔
// is the whole reason this entity has a warning at all.
//
// Line weight follows the well's own spokes and drawThorn's rule: a stroke that
// spans a range of depths takes the weight of its MIDPOINT, because a single
// stroke has one width and the lane it lies in is getting narrower.
function drawSurgeLane(ctx, well, lane, tip, live) {
  const t = tip > 1 ? 1 : tip;
  if (t <= 0) return;   // no charge, or the first step of a telegraph — nothing
                        // to draw, and drawing it would be a zero-length path.

  screenPos(well, lane, 0, _surgeRoot);
  screenPos(well, lane, t, _surgeTip);
  drawPoly(ctx, _surgeSeg, false);
  glowStroke(ctx, C.SURGER_COLOR, laneLineWidth(t / 2) * (live ? C.SURGE_LIT_WIDTH : 1), 1);
}

// ⛔ GDD 18 item 3: this has to be OURS. GDD 6.1 names the silhouette — a zigzag
// bar — and the shape that game's equivalent is remembered for is a jagged rod
// with a DIAGONAL wave, standing ALONG the lane it electrifies. Two deliberate
// divergences, and both are load-bearing rather than decorative: every corner
// here is SQUARE, so it reads as a crenellation and never as a lightning bolt;
// and the bar lies ACROSS the lanes, so what the player sees coming is a rung
// blocking a lane rather than a rod filling one.
//
// ⛔ It must also be unmistakable from the two silhouettes it will share a well
// with. The Vaulter is a symmetric wingspan with four ARM TIPS reaching out and
// a notch top and bottom; the Weaver is a coil winding inward with no straight
// run in it at all. This is neither: a single unbroken run of right angles,
// open at both ends, with nothing pointed anywhere on it.
//
// Two full square cycles, `l` reaching exactly ±1 at the extremes so
// C.SURGER_SIZE means what it means on every other silhouette: the lane widths
// the shape spans. The end segments are equal and both on the far side, which
// is what makes it read as a BAR with a wave in it rather than as a staircase.
//
// Shape DATA, the same class of thing as WELLS' rim polygons.
const SURGER_POLY = [
  { l: -1.00, d: -0.45 },   // the far end, toward the throat
  { l: -0.60, d: -0.45 },
  { l: -0.60, d:  0.45 },
  { l: -0.20, d:  0.45 },
  { l: -0.20, d: -0.45 },
  { l:  0.20, d: -0.45 },
  { l:  0.20, d:  0.45 },
  { l:  0.60, d:  0.45 },
  { l:  0.60, d: -0.45 },
  { l:  1.00, d: -0.45 },   // …and the near end, mirroring it
];

// ⛔ drawPoly + glowStroke, ONE OPEN path for the bar, no fill (GDD 10.2), and
// FULL ALPHA AT EVERY DEPTH for the same reason the Vaulter, the Carrier, the
// Weaver and the bolt have it: GDD 10.3 governs what may be drawn OVER the
// throat zone, and the enemy is the approaching thing that rule protects.
//
// The lane goes down FIRST so the bar sits on top of its own charge — the
// silhouette is what the player aims at, and a fuse drawn over it at
// C.SURGE_LIT_WIDTH would swallow it at exactly the moment it matters.
//
// `tip` and `live` come from the entity's own phase (07-enemies.js) rather than
// from anything this module decides, which is why the drawing and the lethality
// can never disagree.
function drawSurger(ctx, well, lane, depth, tip, live) {
  drawSurgeLane(ctx, well, lane, tip, live);
  drawPoly(ctx, entityPoints(well, lane, depth, SURGER_POLY, C.SURGER_SIZE), false);
  glowStroke(ctx, C.SURGER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Warden (GDD 6.4, 14.6, 10.2, 18; CS013 P3, W6) — a hovering silhouette
// and the beam it fires down its lane.
// ---------------------------------------------------------------------------
//
// ⛔ GDD 18 item 3: this has to be OURS, and it also has to be unmistakable
// from the six silhouettes it shares a well with. The Vaulter is a symmetric
// wingspan of four arm tips; the Reaver is that with barbs; the Carrier a
// hollow diamond; the Weaver a coil; the Surger a run of right angles; the
// Drifter a knot or a scatter. This is a broad SWEPT DELTA — two wingtips
// raked back, a notched crown toward the throat and a notched keel toward the
// rim — which reads as something hanging over the well rather than climbing
// out of it, and reads that way at a glance even at 18 px above the rim line.
//
// Shape DATA, the same class of thing as WELLS' rim polygons; C.WARDEN_SIZE is
// the tunable, and it is a LANE width like every other silhouette's.
const WARDEN_POLY = [
  { l: -1.00, d: -0.10 },   // the left wingtip, raked back
  { l: -0.45, d: -0.55 },   // the left shoulder, toward the throat
  { l:  0.00, d: -0.30 },   // the crown's notch
  { l:  0.45, d: -0.55 },   // the right shoulder
  { l:  1.00, d: -0.10 },   // the right wingtip
  { l:  0.35, d:  0.45 },   // the right heel, toward the rim
  { l:  0.00, d:  0.18 },   // the keel's notch, pointing into the well
  { l: -0.35, d:  0.45 },   // the left heel
];

// ⛔ THE BEAM'S OWN PREALLOCATED POINTS AND ITS OWN PAIR, drawSurgeLane()'s
// rule: a Warden's beam and a Surger's fuse can be live in the same lane in the
// same frame, and `drawPoly(ctx, [a, b])` would allocate an array literal every
// call (GDD 17's budget forbids per-frame allocation in the hot path).
const _wardenTop = { x: 0, y: 0 };   // the lifted Warden's own rim point
const _wardenTip = { x: 0, y: 0 };   // how far down the lane the beam has run
const _wardenBeam = [_wardenTop, _wardenTip];

// ⛔ THE BEAM RUNS DOWNWARD, FROM THE WARDEN TO THE RIM, and that is the
// opposite of the Surger's fuse for a reason the player can read: a Surger
// arms its lane from the throat UP at you, and a Warden is already above you
// and reaches DOWN. Both say the same thing — this lane is about to be lethal —
// and in both the tip ARRIVING is the instant the lane goes live (GDD 6.3's
// visible fuse).
//
// ⛔ THE WIDTH IS THE STATE CHANGE, drawSurgeLane()'s rule: the beam creeps
// down at plain lane weight while the fuse runs and slams to
// C.WARDEN_BEAM_WIDTH for the discharge. ⛔ A per-entity multiplier on
// laneLineWidth() and never a global glow constant (00-config.js).
//
// ⛔ FULL ALPHA AT EVERY DEPTH. GDD 10.3 governs what may be drawn OVER the
// throat zone, and this is neither drawn there (it lives between the rim and
// the Warden above it) nor drawn over the well — it IS the warning.
function drawWardenBeam(ctx, well, lane, tip, live) {
  const t = tip > 1 ? 1 : tip;
  if (t <= 0) return;   // the first step of a fuse: nothing to draw, and a
                        // zero-length path is not a drawing.
  // Both ends start on the lane's rim point; liftPoints() raises the FIRST of
  // the pair (n = 1) to where the Warden hovers, so `_wardenTip` is still the
  // rim and the lerp below runs the beam down toward it as the fuse fills.
  screenPos(well, lane, 1, _wardenTop);
  screenPos(well, lane, 1, _wardenTip);
  liftPoints(well, _wardenBeam, 1, C.WARDEN_LIFT);
  _wardenTip.x = _wardenTop.x + (_wardenTip.x - _wardenTop.x) * t;
  _wardenTip.y = _wardenTop.y + (_wardenTip.y - _wardenTop.y) * t;
  drawPoly(ctx, _wardenBeam, false);
  glowStroke(ctx, C.WARDEN_COLOR, laneLineWidth(1) * (live ? C.WARDEN_BEAM_WIDTH : 1), 1);
}

// ⛔ drawPoly + glowStroke, ONE CLOSED path, no fill (GDD 10.2), at full alpha
// at every depth exactly as every other enemy — GDD 10.3 protects the
// approaching thing, and this IS it.
//
// ⛔ THE LIFT IS DRAW-TIME ONLY AND IT IS liftPoints()' (05-skimmer.js), the
// same function that raises the airborne craft: a Warden ALOFT is pushed
// C.WARDEN_LIFT rim radii out from the well's screen centroid, and its `lane`
// and `depth` are untouched. With C.WARDEN_LIFT at 0 the state hash does not
// move, which is how the suite proves it (test-cs013-p3.js). A CLIMBING Warden
// is not lifted at all: it is in the well like everything else.
//
// ⛔ THE BEAM GOES DOWN FIRST so the silhouette sits on top of its own strike —
// the Warden is what the player has to read, and a beam at
// C.WARDEN_BEAM_WIDTH drawn over it would swallow it at the moment it matters.
// drawSurger()'s ordering, for drawSurger()'s reason.
//
// `aloft`, `tip` and `live` all come from the entity's own phase
// (07-enemies-overdrive.js) rather than from anything decided here, which is
// why the drawing and the lethality can never disagree.
function drawWarden(ctx, well, lane, depth, aloft, tip, live) {
  if (aloft) drawWardenBeam(ctx, well, lane, tip, live);
  const pts = entityPoints(well, lane, depth, WARDEN_POLY, C.WARDEN_SIZE);
  if (aloft) liftPoints(well, pts, WARDEN_POLY.length, C.WARDEN_LIFT);
  drawPoly(ctx, pts, true);
  glowStroke(ctx, C.WARDEN_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Mimic (GDD 6.4, 14.6, 6.3, 12, 10.2, 18; CS013 P4, MI1) — TWO POLYS AND
// THREE CHANNELS, the Drifter's.
// ---------------------------------------------------------------------------
//
// ⛔ GDD 12's PROMPT IS THE SPEC: `SOLID = ARMOURED · OPEN = VULNERABLE`. The
// Mimic's two states differ on THREE things at once, and no one of them carries
// the read alone — the Drifter's rule (GDD 6.3), for the Drifter's reason:
//
//   Channel        closed (armoured)                open ("firing", vulnerable)
//   silhouette     a compact closed shell           a splayed OPEN path
//   stroke width   x C.MIMIC_CLOSED_WIDTH (0.70)    x C.MIMIC_OPEN_WIDTH (1.60)
//   alpha          C.MIMIC_CLOSED_ALPHA (0.55)      1
//
// ⛔ TWO POLYS, NOT ONE POLY RESTYLED. entityPoints() memoizes a scratch array
// PER POLY, so the second costs one projection loop and zero allocation (the
// Carrier's hull-and-glyph pattern, the Drifter's two states). One poly drawn
// closed and then open differs by a single edge, which is not a read at a
// glance — and at 400 points this is the read the player is paid for.
//
// ⛔ NO GLOBAL GLOW CONSTANT IS TOUCHED. glowStroke's wide pass is
// `width * C.GLOW_WIDE_W`, so the narrower closed stroke is LITERALLY a harder
// edge; GLOW_WIDE_W, GLOW_WIDE_ALPHA and GLOW_THIN_ALPHA are shared with the
// well and every other entity and retuning one is an art pass across the build.
// Both states are per-entity multipliers only.
//
// ⚠ The closed alpha can make it dim in the throat zone on the way up, exactly
// as C.DRIFT_RIDE_ALPHA can. That is the same accepted trade: the alpha is a
// STATE read rather than a distance fade, and GDD 10.3 governs what is drawn
// OVER the throat, not an entity's own constant alpha.
//
// ⛔ GDD 18 item 3: ours. The closed shell is a blunt shield turned rim-ward —
// a wide leading edge and a tapered back, with a notch where the two halves
// meet, so it reads as something HELD UP rather than as a creature. Nothing
// four-armed or radial: the Vaulter owns that silhouette.
const MIMIC_POLY_CLOSED = [
  { l:  0.00, d:  0.66 },   // the notch, rim-ward
  { l:  0.52, d:  0.34 },
  { l:  0.58, d: -0.34 },
  { l:  0.00, d: -0.62 },
  { l: -0.58, d: -0.34 },
  { l: -0.52, d:  0.34 },
];

// OPEN is the same shell swung apart: an OPEN path whose two halves have
// hinged away from the centre line, leaving the middle — the thing that was
// being guarded — exposed. ⛔ `l` reaches exactly ±1, so C.MIMIC_SIZE means on
// this what it means on every other silhouette: the lane widths it spans. The
// path deliberately does NOT return, so drawPoly's `closed` argument is the
// state and the shape agrees with it.
const MIMIC_POLY_OPEN = [
  { l: -0.30, d:  0.80 },
  { l: -1.00, d:  0.30 },
  { l: -0.84, d: -0.56 },
  { l: -0.20, d: -0.10 },
  { l:  0.20, d: -0.10 },
  { l:  0.84, d: -0.56 },
  { l:  1.00, d:  0.30 },
  { l:  0.30, d:  0.80 },
];

// ⛔ drawPoly + glowStroke, one path, no fill (GDD 10.2). `open` selects all
// three channels at once and is the ENTITY's own phase
// (07-enemies-overdrive.js) rather than anything this module decides — which is
// why the two states can never drift apart from the two behaviours.
//
// ⛔ Note that `!open` IS the `closed` argument, the Drifter's identity: GDD 12
// promises SOLID = ARMOURED, armoured is exactly the closed phase, so the two
// are the same boolean and writing them as one is what stops a later edit
// changing the shape without changing the rule.
function drawMimic(ctx, well, lane, depth, open) {
  const poly = open ? MIMIC_POLY_OPEN : MIMIC_POLY_CLOSED;
  const width = laneLineWidth(depth) * (open ? C.MIMIC_OPEN_WIDTH : C.MIMIC_CLOSED_WIDTH);
  drawPoly(ctx, entityPoints(well, lane, depth, poly, C.MIMIC_SIZE), !open);
  glowStroke(ctx, C.MIMIC_COLOR, width, open ? 1 : C.MIMIC_CLOSED_ALPHA);
}

// ⛔ THE REFLECTED SHOT IS THE PLAYER'S OWN STREAK, TURNED (GDD 14.6, MI2) —
// "colour-shifted, larger". It is drawShot()'s drawing, not an enemy
// silhouette: a SEGMENT ALONG the lane rather than a shape AT a point, so
// entityPoints() does not apply, exactly as it does not to the Thorn or to the
// Surger's fuse.
//
// ⛔ ITS OWN SCRATCH POINTS, NOT drawShot()'s. A player's shot and a reflected
// one are live in the same frame by construction — the reflection is CAUSED by
// a shot — and sharing module scratch between two segment drawers is the trap
// drawSurgeLane() is written down for. The failure would be one streak drawn at
// the other's length, intermittently, reading as a bug in the well.
//
// ⛔ THE STREAK TRAILS, WHICH IS WHAT "TURNED" MEANS. A player's shot leads
// toward the throat and trails toward the rim; this one leads toward the RIM,
// so its tail runs back toward the throat and is capped at depth 0. The mark is
// the player's; the direction is the answer.
//
// ⛔ NO PER-FRAME ALLOCATION (GDD 17's perf budget). The point PAIR is
// preallocated as well as the points — drawThorn()'s rule, for its reason.
const _mimicHead = { x: 0, y: 0 };   // the leading edge, toward the rim
const _mimicTail = { x: 0, y: 0 };   // C.MIMIC_SHOT_LEN x C.SHOT_LEN behind it
const _mimicStreak = [_mimicHead, _mimicTail];

function drawMimicShot(ctx, well, lane, depth) {
  const len = C.SHOT_LEN * C.MIMIC_SHOT_LEN;
  const tail = depth - len < 0 ? 0 : depth - len;
  screenPos(well, lane, depth, _mimicHead);
  screenPos(well, lane, tail, _mimicTail);
  drawPoly(ctx, _mimicStreak, false);
  // ⛔ shotAlpha() — the shot's own fade (GDD 10.3), because this IS a shot's
  // streak. A reflection is born at C.MIMIC_APEX 0.40, above
  // C.READABILITY_DEPTH, so it is at full alpha from the step it exists.
  glowStroke(ctx, C.MIMIC_COLOR, laneLineWidth(depth) * C.MIMIC_SHOT_WIDTH, shotAlpha(depth));
}

// ---------------------------------------------------------------------------
// The tokens (GDD 14.1, 16.3; CS013 P1, T4, T10) — a glyph inside a ring.
// ---------------------------------------------------------------------------
//
// ⛔ A TOKEN IS NOT AN ENEMY (10-powerups.js), BUT IT IS DRAWN THE SAME WAY: a
// local-space poly through entityPoints() + drawPoly + glowStroke, no fill.
//
// ⛔ ONE COLOUR, C.TOKEN_COLOR (T10), a warm hue no enemy or band uses, so a
// token in a Surger's lane reads as a choice rather than a gotcha (GDD 14.1).
// Gold means YOURS. The five kinds are told apart by GLYPH, by GDD 6.2's rule
// (CARGO_GLYPHS above): a glyph is a miniature of its effect's own gesture.
//
//   lance     a long needle pointed down the lane — the shot that goes through
//   spread    a three-way fan — the lane and both neighbours
//   recharge  PURGE_GLYPH_POLY itself — the HUD's own Purge glyph
//   bounty    a cut gem — the one that is only worth something
//   ward      an arc over a craft — the shell
//
// ⛔ THE RING IS WHAT NO ENEMY HAS, and it DEPLETES over C.TOKEN_LIFE with no
// numerals and no blink (GDD 16.3). A POLYLINE of C.TOKEN_RING_SEG segments, the
// HUD rings' precedent, never an arc call. It starts on the rim side and
// shrinks back toward that start as the token ages.
//
// ⛔ FADED BELOW C.READABILITY_DEPTH with shotAlpha() (GDD 10.3): a token is
// not the approaching thing that rule protects, so it takes the shot's fade,
// not an enemy's full alpha. Most kills happen in the throat zone (plan §1.3),
// so most tokens are born faded and brighten as they rise.
//
// ⛔ NO PER-FRAME ALLOCATION. Every poly is built once and entityPoints()
// memoizes its scratch on it; the ring's partial path is one preallocated array
// of references into that scratch, the HUD rings' pattern.
//
// Shape DATA in entityPoints()' half-extent units, inside the ring's ±1. The
// scale is C.TOKEN_SIZE. ⚠ Provisional art, like the palette.
const TOKEN_RING_POLY = (function () {
  const n = C.TOKEN_RING_SEG;
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = Math.PI / 2 + 2 * Math.PI * (i / n);
    out.push({ l: Math.cos(a), d: Math.sin(a) });
  }
  return out;
})();
const _tokenRing = [];

// Each row is a list of strokes, { poly, closed }; the Ward's is two.
// `recharge` is filled on first use: PURGE_GLYPH_POLY is 15-render-hud.js's,
// concatenated after this file, so it does not exist yet at evaluation.
const TOKEN_GLYPHS = {
  lance: [{ closed: false, poly: [
    { l: -0.22, d: -0.30 }, { l:  0.00, d: -0.62 }, { l:  0.22, d: -0.30 },
    { l:  0.00, d: -0.62 }, { l:  0.00, d:  0.62 },
  ] }],
  spread: [{ closed: false, poly: [
    { l: -0.55, d: -0.45 }, { l:  0.00, d:  0.50 }, { l:  0.00, d: -0.60 },
    { l:  0.00, d:  0.50 }, { l:  0.55, d: -0.45 },
  ] }],
  recharge: null,
  bounty: [{ closed: true, poly: [
    { l: -0.55, d:  0.20 }, { l: -0.30, d:  0.50 }, { l:  0.30, d:  0.50 },
    { l:  0.55, d:  0.20 }, { l:  0.00, d: -0.55 },
  ] }],
  ward: [
    { closed: false, poly: [
      { l: -0.55, d:  0.00 }, { l: -0.39, d:  0.42 }, { l:  0.00, d:  0.60 },
      { l:  0.39, d:  0.42 }, { l:  0.55, d:  0.00 },
    ] },
    { closed: false, poly: [{ l: -0.40, d: -0.55 }, { l: 0.00, d: -0.18 }, { l: 0.40, d: -0.55 }] },
  ],
};

// A kind's strokes, or null for a kind the table does not know (the ring alone
// is drawn — visibly wrong, never a thrown exception).
function tokenGlyph(kind) {
  if (kind === "recharge" && TOKEN_GLYPHS.recharge === null) {
    // The HUD glyph's unit radius shrunk to the other glyphs' ±0.55; y is DOWN
    // on the HUD and the rim side is +d here, so it flips.
    TOKEN_GLYPHS.recharge = [{ closed: true, poly: PURGE_GLYPH_POLY.map(function (q) {
      return { l: q.x * 0.55, d: -q.y * 0.55 };
    }) }];
  }
  return Object.prototype.hasOwnProperty.call(TOKEN_GLYPHS, kind) ? TOKEN_GLYPHS[kind] : null;
}

// ⛔ drawPoly + glowStroke only, no fill (GDD 10.2), in C.TOKEN_COLOR at
// shotAlpha(depth). `age` is the token's own count-up clock; the ring shows
// what is left of C.TOKEN_LIFE.
function drawToken(ctx, well, kind, lane, depth, age) {
  const alpha = shotAlpha(depth);
  if (!(alpha > 0)) return;
  const w = laneLineWidth(depth);
  const glyph = tokenGlyph(kind);
  if (glyph) {
    for (let i = 0; i < glyph.length; i++) {
      drawPoly(ctx, entityPoints(well, lane, depth, glyph[i].poly, C.TOKEN_SIZE), glyph[i].closed);
      glowStroke(ctx, C.TOKEN_COLOR, w, alpha);
    }
  }
  const left = 1 - age / C.TOKEN_LIFE;
  if (!(left > 0)) return;
  const segs = Math.max(1, Math.round(C.TOKEN_RING_SEG * (left > 1 ? 1 : left)));
  const pts = entityPoints(well, lane, depth, TOKEN_RING_POLY, C.TOKEN_SIZE);
  _tokenRing.length = segs + 1;
  for (let i = 0; i <= segs; i++) _tokenRing[i] = pts[i];
  drawPoly(ctx, _tokenRing, false);
  glowStroke(ctx, C.TOKEN_COLOR, w, alpha);
}

// ---------------------------------------------------------------------------
// THE DIVE, DRAWN (GDD 5, 10.2, 10.3, 14.5; CS014 P2, RF7-A) — BOTH MODES
// ---------------------------------------------------------------------------
//
// Before this phase not one render file mentioned the Dive, and a run spends
// 15.71 % of its steps in one — 19.80 % under C.DIVE_TIME_OD (plan §1.3, §1.8).
// ⛔ RF7-A: the DESCENT is drawn in Classic and Overdrive alike and the RINGS on
// top of it in Overdrive, because a ring drawn against a still board does not
// read as a flight.
//
// ⛔ THE ONE IDEA IS diveDrawDepth(), AND IT IS NOT A CAMERA AND NOT A SECOND
// RENDERER (GDD 14.5's cap). It says where a thing at well-depth `depth` is
// DRAWN while the descent is at `diveDepth`, in the depth model the whole game
// already uses — no new projection, no transform, no window size, and
// 13-render-well.js is untouched, which is why drawWell() needed no new
// parameter for any of this.
//
// ⛔ AND IT IS PRESENTATION ONLY. Nothing here writes state, nothing here draws
// a random value (CLAUDE.md, Math and lifecycle), and with C.DIVE_RUNG_ALPHA
// and C.RING_ALPHA at 0 a played session hashes identically frame for frame in
// both modes — C.JUMP_LIFT-at-0's proof (test-cs014-p2.js).

// perspective() is the space screenPos lerps LINEARLY in, so a fixed step in it
// is a fixed step in SCREEN distance (03-wells.js). The drawn fraction is
// therefore just p / pc: the craft's own position IS the rim, and everything
// below it swells outward toward that rim as the descent closes on it.
//
// ⛔ IDENTITY THROUGH THE GRACE BEAT. dive.depth holds at 1 there and
// perspective(1) is 1, so a rung and a ring sit at their own depths until the
// descent starts — which is the beat GDD 5 makes the player read the board in,
// and it must not be a beat the board is also moving in.
//
// ⛔ AND IT IS EXACT AT THE RESOLUTION: a thing reaches the rim (1) precisely
// when diveDepth equals its own depth, which is the step takeRings() resolves a
// ring on (11-dive.js). What the player sees arrive is what the take pass
// scored. Clamped at 1, so something already passed is never drawn beyond the
// rim — and a pc of 0 (the descent's last step) puts everything there.
//
// ⚠ AND IT COMES OUT AS depth / diveDepth, WHICH IS WORTH KNOWING AND NOT
// WORTH WRITING. perspective() is a power law, so (d^k / dc^k)^(1/k) is d / dc
// exactly — the ratio is the same in either space. It is derived through
// perspective() and invPerspective() anyway, because the CLAIM is "a fixed step
// here is a fixed step in screen distance" (03-wells.js), which is a fact about
// the easing rather than about this arithmetic: write the ratio directly and a
// future non-power easing would silently stop meaning it.
//
// ⛔ A PURE FUNCTION OF TWO NUMBERS: no state, no well, no draw.
function diveDrawDepth(depth, diveDepth) {
  // ⛔ THE GRACE BEAT IS EXACT, not exact-to-float. pow(x, 1/k) after pow(x, k)
  // is not the identity in binary — measured 0.5 back as 0.49999999999999994 —
  // and the claim this function makes about that beat is bit-identity, not
  // closeness. It is also every frame outside a dive, where dive.depth is 1.
  if (diveDepth >= 1) return depth;
  const pc = perspective(diveDepth);
  if (!(pc > 0)) return 1;
  const p = perspective(depth) / pc;
  return p >= 1 ? 1 : invPerspective(p);
}

// ⛔ NO PER-FRAME ALLOCATION (GDD 17's perf budget). A rung is the well's own
// cross-section, so its screen points are memoized ON THE WELL — wellThroat()'s
// and entityPoints()' pattern, non-enumerable, one array per well ever. The
// array is SHARED and reused between rungs within a frame, which is fine
// because each is drawn and stroked before the next is built.
function rungScratch(well) {
  if (!well._rung) {
    const n = wellVertCount(well);
    const pts = new Array(n);
    for (let i = 0; i < n; i++) pts[i] = { x: 0, y: 0 };
    Object.defineProperty(well, "_rung", { value: pts, enumerable: false });
  }
  return well._rung;
}

// ⛔ THE DESCENT IS THE WELL TRAVELLING, AND IT IS THE WHOLE VISUAL IN CLASSIC.
// C.DIVE_RUNGS cross-sections sit at the midpoints of as many equal slices —
// layRings()' own lattice, deliberately, so the two read as one family — and
// each sweeps rim-ward past the craft, leaving at the rim on the step the
// descent reaches its own depth. ⛔ The well's own outline does NOT move: it is
// the frame the flight happens in, and a rung is the only thing in it that does.
//
// ⛔ FADED AT BOTH ENDS AND THEREFORE NEVER POPPING: shotAlpha() below
// C.READABILITY_DEPTH (GDD 10.3 — and the deepest rung is born at 0.05, well
// inside the throat zone), and (1 - d) toward the rim, so a rung fades IN out
// of the throat and OUT as it passes the craft. ⛔ One expression, no second
// fade constant, and nothing opaque in the throat zone at either end.
//
// `color` is the well's band colour, handed over the way drawWell() is handed
// state.bandRoll: this module reads no game state and draws no random value.
function drawDiveRungs(ctx, well, diveDepth, color) {
  const n = C.DIVE_RUNGS;
  const rim = well.rim, thr = wellThroat(well);
  const pts = rungScratch(well);
  for (let i = 0; i < n; i++) {
    const d = diveDrawDepth((n - i - 0.5) / n, diveDepth);
    const alpha = shotAlpha(d) * (1 - d) * C.DIVE_RUNG_ALPHA;
    if (!(alpha > 0)) continue;
    // The cross-section in normalized rim space, then C.WELL_CX/CY/RADIUS —
    // screenPos()'s own mapping, applied to a whole polygon at one depth the
    // way projectPoly() applies it to the rim and throat rings.
    const t = perspective(d);
    for (let v = 0; v < pts.length; v++) {
      const nx = thr[v].x + (rim[v].x - thr[v].x) * t;
      const ny = thr[v].y + (rim[v].y - thr[v].y) * t;
      pts[v].x = C.WELL_CX + nx * C.WELL_RADIUS;
      pts[v].y = C.WELL_CY + ny * C.WELL_RADIUS;
    }
    drawPoly(ctx, pts, well.closed);
    glowStroke(ctx, color, laneLineWidth(d), alpha);
  }
}

// ⛔ A RING IS AN ARC, AND IT IS THE ARC THE TAKE PASS READS (CS014 RF2): it
// spans 2 x C.RING_ARC_LANES about its lane, the same half-width takeRings()
// measures with laneDelta, so what is drawn is exactly what is taken and the
// player is never asked to guess where the edge was (GDD 1.1 P2).
//
// ⛔ AN OPEN PATH, and the lane offsets are NOT normalized — polyAt's backstop
// flattens an arc that reaches past an open well's wall against the end vertex,
// entityPoints()' rule and for entityPoints()' reason (a normalized offset
// would wrap it to the far side of the well, GDD 3.5's bug in a rendering hat).
//
// ⛔ FADED BELOW C.READABILITY_DEPTH with shotAlpha() (GDD 10.3): the deepest
// ring sits at 0.0833 (plan §1.7) and is in the throat zone for most of the
// flight, so it takes the token's fade and brightens as it comes.
//
// ⛔ NO PER-FRAME ALLOCATION: one preallocated arc, drawToken()'s rule.
const _ringArc = (function () {
  const out = new Array(C.RING_ARC_SEG + 1);
  for (let i = 0; i <= C.RING_ARC_SEG; i++) out[i] = { x: 0, y: 0 };
  return out;
})();

function drawRing(ctx, well, lane, depth, diveDepth) {
  const d = diveDrawDepth(depth, diveDepth);
  const alpha = shotAlpha(d) * C.RING_ALPHA;
  if (!(alpha > 0)) return;
  const n = C.RING_ARC_SEG;
  const lo = lane - C.RING_ARC_LANES, span = 2 * C.RING_ARC_LANES;
  for (let i = 0; i <= n; i++) screenPos(well, lo + span * (i / n), d, _ringArc[i]);
  drawPoly(ctx, _ringArc, false);
  glowStroke(ctx, C.RING_COLOR, laneLineWidth(d), alpha);
}

// ---------------------------------------------------------------------------
// The death fragmentation (GDD 4.4; CS008 P4, U9) — a kit-fx primitive.
// ---------------------------------------------------------------------------
//
// The craft breaks into its OWN outline segments: segment i of `points` (and
// the closing edge when `closed`) drifts outward from the points' centroid by
// C.FRAG_DRIFT × t, turns about its own midpoint by C.FRAG_SPIN × t with the
// sign alternating by index, and fades as 1 − t. `points` are SCREEN points —
// the caller projects the silhouette, this breaks it. See
// 14-render-entities.NOTES.md.
//
// ⛔ A PURE FUNCTION OF ITS ARGUMENTS. No RNG, no clock, no state: `t` is
// hit-stop progress, fragmentT() below, read in Game.draw(). The freeze is when
// it plays and update() is not running then, so a draw here could only ever be
// a draw on the frame clock (CLAUDE.md, Math and lifecycle). Identical `t` means
// identical calls, which is what test-cs008-p4.js asserts.
//
// ⛔ NO PER-FRAME ALLOCATION: one preallocated pair, the drawThorn() rule.
const _fragA = { x: 0, y: 0 };
const _fragB = { x: 0, y: 0 };
const _fragSeg = [_fragA, _fragB];

function drawFragments(ctx, points, closed, t, color) {
  const n = points.length;
  if (n < 2 || !(t < 1)) return;   // t ≥ 1 is spent; NaN draws nothing either
  const k = t > 0 ? t : 0;

  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { cx += points[i].x; cy += points[i].y; }
  cx /= n; cy /= n;

  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p = points[i], q = points[(i + 1) % n];
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    // Outward is centroid → midpoint. A midpoint ON the centroid has no
    // outward, and that segment spins in place rather than dividing by zero.
    const dx = mx - cx, dy = my - cy;
    const len = Math.sqrt(dx * dx + dy * dy);
    const ox = len > 0 ? dx / len * C.FRAG_DRIFT * k : 0;
    const oy = len > 0 ? dy / len * C.FRAG_DRIFT * k : 0;
    const a = (i % 2 === 0 ? 1 : -1) * C.FRAG_SPIN * k;
    const cos = Math.cos(a), sin = Math.sin(a);
    const hx = (p.x - mx), hy = (p.y - my);
    _fragA.x = mx + ox + hx * cos - hy * sin;
    _fragA.y = my + oy + hx * sin + hy * cos;
    _fragB.x = mx + ox - hx * cos + hy * sin;
    _fragB.y = my + oy - hx * sin - hy * cos;
    drawPoly(ctx, _fragSeg, false);
    glowStroke(ctx, color, C.FRAG_LINE_W, 1 - k);
  }
}

// Hit-stop progress, 0 on the death step's frame and 1 as the freeze ends.
// ⛔ Takes the numbers, not Game: `left` is Game.hitStopLeft and `total` the
// death freeze, so this module reads no game object. Clamped both ways — a
// headless caller that never froze has left = 0, which is t = 1, spent.
function fragmentT(left, total) {
  if (!(total > 0)) return 1;
  const t = 1 - left / total;
  return t < 0 ? 0 : (t > 1 ? 1 : t);
}

// ==========================================================================
// 15-render-hud.js
// ==========================================================================
// 15-render-hud.js — the in-play HUD (GDD 10.4; CS008 P4) and the menu model
// (GDD 10.5; CS008 P5). The menu half is kit-menu's draft (CLAUDE.md, Modules
// built here; backport packet src/15-render-hud.NOTES.md); the HUD half is
// built to the same boundary.
//
// ⛔ drawHud(ctx, view) READS NO GAME STATE. Everything it shows arrives on the
// view Game.draw() fills — score, lives, level, the level's colour, purgeUses,
// the mirror flag, the reserve icon's point array, CS012 P5's jump reading and
// P4's combo reading — and the only global it reads is C, for sizes. Nothing
// here reads `state`, WELLS or the Skimmer.
//
// ⛔ hudLayout(view) IS THE ONE PLACE A CORNER IS PLACED, and drawHud draws
// inside the rectangles it returns. test-cs008-p4.js asserts those rectangles
// clear of the throat zone on all sixteen wells (GDD 10.3) and clear of both
// touch buttons, mirrored and not (H3). A text rectangle is sized by
// C.TEXT_CHAR_W, never measureText(), so that assertion is arithmetic.
//
// ⛔ Text goes through drawText() and nothing else; icons, the Purge glyph and
// CS012 P5's jump glyph go through drawPoly + glowStroke (GDD 10.2). No fills,
// no rectangles drawn — the readiness ring is a POLYLINE, never ctx.arc.

// The Purge glyph (GDD 4.3): an eight-point burst, closed, unit radius. Shape
// DATA; the scale is C.HUD_PURGE_SIZE. ⚠ Provisional art, like the palette.
const PURGE_GLYPH_POLY = [
  { x:  0.00, y: -1.00 }, { x:  0.30, y: -0.30 },
  { x:  1.00, y:  0.00 }, { x:  0.30, y:  0.30 },
  { x:  0.00, y:  1.00 }, { x: -0.30, y:  0.30 },
  { x: -1.00, y:  0.00 }, { x: -0.30, y: -0.30 },
];

// ⛔ THE JUMP GLYPH, OVERDRIVE ONLY (GDD 10.4, 14.2; O8): a craft RAISED off a
// short rim line, which is the same picture the well shows when the player is
// airborne. Shape DATA in the glyph box's own [-1, 1] space, y DOWN; the scale
// is C.HUD_JUMP_SIZE * C.HUD_JUMP_CRAFT. ⚠ Provisional art, like the Purge
// glyph's. The craft is the reserve icon's silhouette read the same way round
// — prongs out, nose up — so the two HUD craft cannot drift apart.
const JUMP_GLYPH_POLY = [
  { x: -1.00, y:  0.10 },   // left prong
  { x: -0.42, y: -0.16 },
  { x:  0.00, y: -0.02 },   // the notch
  { x:  0.42, y: -0.16 },
  { x:  1.00, y:  0.10 },   // right prong
  { x:  0.00, y: -0.70 },   // the nose, raised
];
// The rim it has left: an OPEN two-point line under the craft.
const JUMP_RIM_POLY = [{ x: -1.00, y: 0.72 }, { x: 1.00, y: 0.72 }];

// ⛔ THE COMBO READOUT, OVERDRIVE ONLY (GDD 10.4, 14.4; O8): "×N" centre-top,
// loud, absent at ×1, inside a depletion RING that empties over
// C.COMBO_WINDOW. ⛔ The ring is an ELLIPSE rather than a circle, and that is
// arithmetic: the widest reading is C.HUD_COMBO_CHARS characters at
// C.HUD_COMBO_SIZE, 138.88 px against a 56 px em box, so a circle around it
// would be 148 px tall and could not clear the Fan well's throat zone
// (00-config.js). It is still one polyline through drawPoly + glowStroke.

// ⛔ NO PER-FRAME ALLOCATION beyond the strings themselves: the layout, its
// rectangles and both point scratches are module-level and rewritten per call.
// Like entityPoints(), that makes hudLayout() non-reentrant — copy what you keep.
const _hud = {
  score: { x: 0, y: 0, w: 0, h: 0 },
  lives: { x: 0, y: 0, w: 0, h: 0 },
  level: { x: 0, y: 0, w: 0, h: 0 },
  purge: { x: 0, y: 0, w: 0, h: 0 },
  jump: { x: 0, y: 0, w: 0, h: 0 },
  combo: { x: 0, y: 0, w: 0, h: 0 },
  lifeIcons: 0,      // reserve craft drawn: lives − 1, never below 0 (H1)
  purgeAlpha: 0,     // 1 bright, C.HUD_PURGE_DIM_ALPHA dim, 0 absent
  jumpAlpha: 0,      // 1 ready, C.HUD_PURGE_DIM_ALPHA cooling, 0 airborne or Classic
  jumpRing: 0,       // 0..1 of the readiness ring drawn — 0 when ready, 0 when absent
  comboAlpha: 0,     // 1 shown, 0 absent — Classic, and Overdrive at ×1
  comboRing: 0,      // 0..1 of the depletion ring still standing (full on a kill)
};

const _purgePts = PURGE_GLYPH_POLY.map(function () { return { x: 0, y: 0 }; });
const _jumpPts = JUMP_GLYPH_POLY.map(function () { return { x: 0, y: 0 }; });
const _jumpRimPts = JUMP_RIM_POLY.map(function () { return { x: 0, y: 0 }; });
const _ringPts = [];
const _comboRingPts = [];
const _iconPts = [];

function hudScoreText(view) { return String(view.score); }
function hudLevelText(view) { return "LEVEL " + view.level; }

// GDD 14.4's multiplier, on C.COMBO_STEP's half-step lattice: "×4", "×3.5".
// ⛔ A whole number carries NO decimal, so the widest reading is four
// characters and C.HUD_COMBO_CHARS is a constant rather than a measurement.
function hudComboText(view) {
  const m = view.combo;
  return "×" + (m % 1 === 0 ? String(m) : m.toFixed(1));
}

// O8's two conditions, and they are deliberately two: ⛔ OVERDRIVE ONLY, and
// ⛔ ABSENT AT ×1. Classic's multiplier never leaves 1, so either alone would
// hide it there — which is exactly why both are written down.
function hudComboAlpha(view) {
  if (view.mode !== "overdrive") return 0;
  return typeof view.combo === "number" && view.combo > 1 ? 1 : 0;
}
// The depletion ring: FULL on a kill, empty at the lapse (O8). 0 when the
// readout is absent, so nothing is drawn around nothing.
function hudComboRing(view) {
  if (hudComboAlpha(view) <= 0) return 0;
  const f = view.comboFill;
  if (typeof f !== "number" || !(f > 0)) return 0;
  return f > 1 ? 1 : f;
}

// GDD 4.3 through the §0 reading: purgeUses 0 bright, 1 dim (the weak second
// use is still there), 2 or more nothing.
function hudPurgeAlpha(uses) {
  if (uses <= 0) return 1;
  if (uses === 1) return C.HUD_PURGE_DIM_ALPHA;
  return 0;
}

// O8's three readings of `view.jump`, which is null in Classic and whenever no
// run has a jump: bright when ready, dim with a filling ring while cooling,
// ⛔ ABSENT while airborne — the well is already showing the player that, on
// two channels, and a fourth mark on a moment that lasts C.JUMP_TIME is noise.
// ⛔ A ring only while cooling: a full ring beside a bright glyph says nothing
// the glyph does not.
function hudJumpAlpha(jump) {
  if (!jump || jump.airborne) return 0;
  return jump.ready ? 1 : C.HUD_PURGE_DIM_ALPHA;
}
function hudJumpRing(jump) {
  if (!jump || jump.airborne || jump.ready) return 0;
  const r = jump.ring;
  return typeof r === "number" && r > 0 ? (r > 1 ? 1 : r) : 0;
}

// The deepest a reserve icon reaches, in SKIMMER_POLY `d` units (all ≤ 0).
function hudIconReach(poly) {
  let r = 0;
  for (let i = 0; i < poly.length; i++) if (-poly[i].d > r) r = -poly[i].d;
  return r;
}

function hudLayout(view) {
  const M = C.HUD_MARGIN, W = C.WORLD_W, H = C.WORLD_H;
  const inset = C.TOUCH_BUTTON_R * C.HUD_TOUCH_INSET_R;
  const left = M + (view.mirror ? inset : 0);
  const right = W - M - (view.mirror ? 0 : inset);
  const size = C.HUD_TEXT_SIZE;
  const charW = size * C.TEXT_CHAR_W;

  const s = _hud.score;
  s.w = hudScoreText(view).length * charW; s.h = size;
  s.x = left; s.y = M;

  const l = _hud.level;
  l.w = hudLevelText(view).length * charW; l.h = size;
  l.x = right - l.w; l.y = M;

  const n = view.lives > 1 ? view.lives - 1 : 0;
  const S = C.HUD_ICON_SIZE;
  const v = _hud.lives;
  v.w = n > 0 ? n * S + (n - 1) * C.HUD_ICON_GAP : 0;
  v.h = S * C.HUD_ICON_DEPTH_SCALE * hudIconReach(view.icon);
  v.x = left; v.y = H - M - v.h;
  _hud.lifeIcons = n;

  const P = C.HUD_PURGE_SIZE;
  const p = _hud.purge;
  p.w = P; p.h = P;
  p.x = right - P; p.y = H - M - P;
  _hud.purgeAlpha = hudPurgeAlpha(view.purgeUses);

  // ⛔ THE JUMP GLYPH GOES BESIDE THE PURGE GLYPH AND MOVES NOTHING (O8;
  // CS012 P5). It is placed OFF the Purge rectangle, on the same baseline, so
  // the four rectangles above are bit-identical whether or not `view.jump` is
  // there — which is the Classic HUD's guarantee, asserted in
  // test-cs012-p5.js. ⛔ The rectangle is the RING's extent, not the craft's:
  // it is what the throat-zone and touch-button assertions are made against,
  // so it has to be the whole footprint.
  const J = C.HUD_JUMP_SIZE;
  const j = _hud.jump;
  j.w = J; j.h = J;
  j.x = p.x - C.HUD_JUMP_GAP - J; j.y = H - M - J;
  _hud.jumpAlpha = hudJumpAlpha(view.jump);
  _hud.jumpRing = hudJumpRing(view.jump);

  // ⛔ THE COMBO READOUT IS CENTRE-TOP AND MOVES NOTHING (O8; CS012 P4). Like
  // the jump glyph it is placed absolutely, off no other rectangle, so the four
  // CS008 corners are bit-identical whether or not it is shown — the Classic
  // HUD's guarantee, asserted in test-cs012-p4.js.
  // ⛔ THE RECTANGLE IS THE RING'S EXTENT AT ITS WIDEST READING, not this
  // frame's text: it is what the throat-zone and touch-button assertions are
  // made against, so it has to be the whole footprint, and a constant footprint
  // is what stops the ring breathing as the multiplier crosses a whole number.
  const csize = C.HUD_COMBO_SIZE;
  const crx = C.HUD_COMBO_CHARS * csize * C.TEXT_CHAR_W / 2 + C.HUD_COMBO_PAD;
  const cry = csize / 2 + C.HUD_COMBO_PAD;
  const cb = _hud.combo;
  cb.w = crx * 2; cb.h = cry * 2;
  cb.x = W / 2 - crx; cb.y = C.HUD_COMBO_Y;
  _hud.comboAlpha = hudComboAlpha(view);
  _hud.comboRing = hudComboRing(view);

  return _hud;
}

// Called LAST from Game.draw(), so the HUD sits over the board. `view`:
//   score, lives, level, levelColor, purgeUses — the numbers shown
//   mirror  the touch buttons' side (H3), the input module's live flag since P7
//   icon    the reserve craft's local-space poly ({ l, d }, d ≤ 0 inward)
//   jump    null in Classic; otherwise { airborne, ready, ring } (O8, CS012 P5)
//   combo, comboFill, mode
//           GDD 14.4's multiplier, its window's remaining fraction, and the
//           run's mode — the readout's Overdrive gate (O8, CS012 P4)
function drawHud(ctx, view) {
  const L = hudLayout(view);
  const size = C.HUD_TEXT_SIZE;

  drawText(ctx, hudScoreText(view), L.score.x, L.score.y, size, C.HUD_COLOR, "left");
  drawText(ctx, hudLevelText(view), L.level.x + L.level.w, L.level.y, size, view.levelColor, "right");

  // Reserve craft (H1): prongs on the rectangle's bottom edge, nose up.
  const poly = view.icon;
  while (_iconPts.length < poly.length) _iconPts.push({ x: 0, y: 0 });
  _iconPts.length = poly.length;
  const S = C.HUD_ICON_SIZE;
  const base = L.lives.y + L.lives.h;
  for (let k = 0; k < L.lifeIcons; k++) {
    const cx = L.lives.x + S / 2 + k * (S + C.HUD_ICON_GAP);
    for (let i = 0; i < poly.length; i++) {
      _iconPts[i].x = cx + poly[i].l * S / 2;
      _iconPts[i].y = base + poly[i].d * S * C.HUD_ICON_DEPTH_SCALE;
    }
    drawPoly(ctx, _iconPts, true);
    glowStroke(ctx, C.HUD_COLOR, C.HUD_LINE_W, 1);
  }

  if (L.purgeAlpha > 0) {
    const r = C.HUD_PURGE_SIZE / 2;
    const cx = L.purge.x + r, cy = L.purge.y + r;
    for (let i = 0; i < PURGE_GLYPH_POLY.length; i++) {
      _purgePts[i].x = cx + PURGE_GLYPH_POLY[i].x * r;
      _purgePts[i].y = cy + PURGE_GLYPH_POLY[i].y * r;
    }
    drawPoly(ctx, _purgePts, true);
    glowStroke(ctx, C.HUD_COLOR, C.HUD_LINE_W, L.purgeAlpha);
  }

  // ⛔ THE JUMP GLYPH (O8), and ⛔ the same three rules as everything else here:
  // drawPoly + glowStroke, no fill, no rectangle. Absent at alpha 0, which is
  // Classic and airborne both — so the Classic HUD draws exactly what it drew
  // before CS012 P5.
  if (L.jumpAlpha > 0) {
    const R = C.HUD_JUMP_SIZE / 2;
    const cx = L.jump.x + R, cy = L.jump.y + R;
    const g = R * C.HUD_JUMP_CRAFT;
    for (let i = 0; i < JUMP_GLYPH_POLY.length; i++) {
      _jumpPts[i].x = cx + JUMP_GLYPH_POLY[i].x * g;
      _jumpPts[i].y = cy + JUMP_GLYPH_POLY[i].y * g;
    }
    drawPoly(ctx, _jumpPts, true);
    glowStroke(ctx, C.HUD_COLOR, C.HUD_LINE_W, L.jumpAlpha);

    for (let i = 0; i < JUMP_RIM_POLY.length; i++) {
      _jumpRimPts[i].x = cx + JUMP_RIM_POLY[i].x * g;
      _jumpRimPts[i].y = cy + JUMP_RIM_POLY[i].y * g;
    }
    drawPoly(ctx, _jumpRimPts, false);
    glowStroke(ctx, C.HUD_COLOR, C.HUD_LINE_W, L.jumpAlpha);

    // ⛔ THE RING IS A POLYLINE, NOT AN ARC (GDD 10.2 — drawPoly + glowStroke
    // is the one path, and ctx.arc would be a second). It FILLS clockwise from
    // twelve o'clock as the cooldown runs, so the moment it closes is the
    // moment the glyph goes bright. Its radius is R, which is why the layout
    // rectangle is the ring's diameter and not the craft's.
    if (L.jumpRing > 0) {
      const segs = Math.max(1, Math.round(C.HUD_JUMP_RING_SEG * L.jumpRing));
      const span = 2 * Math.PI * L.jumpRing;
      while (_ringPts.length < segs + 1) _ringPts.push({ x: 0, y: 0 });
      _ringPts.length = segs + 1;
      for (let i = 0; i <= segs; i++) {
        const a = -Math.PI / 2 + span * (i / segs);
        _ringPts[i].x = cx + Math.cos(a) * R;
        _ringPts[i].y = cy + Math.sin(a) * R;
      }
      drawPoly(ctx, _ringPts, false);
      glowStroke(ctx, C.HUD_COLOR, C.HUD_LINE_W, L.jumpAlpha);
    }
  }

  // ⛔ THE COMBO READOUT (O8), and the same three rules again: drawText() for
  // the text, drawPoly + glowStroke for the ring, no fill and no rectangle.
  // Absent at alpha 0, which is Classic and ×1 both — so the Classic HUD draws
  // exactly what it drew before CS012 P4.
  if (L.comboAlpha > 0) {
    const cx = L.combo.x + L.combo.w / 2, cy = L.combo.y + L.combo.h / 2;
    drawText(ctx, hudComboText(view), cx, cy - C.HUD_COMBO_SIZE / 2,
             C.HUD_COMBO_SIZE, C.HUD_COLOR, "center");

    // ⛔ THE RING DEPLETES ANTICLOCKWISE FROM TWELVE O'CLOCK as the window
    // runs, so the moment it closes on nothing is the moment the multiplier
    // falls. ⛔ A POLYLINE, never ctx.arc (GDD 10.2), and an ELLIPSE rather
    // than a circle — the reading is wider than it is tall.
    if (L.comboRing > 0) {
      const rx = L.combo.w / 2, ry = L.combo.h / 2;
      const segs = Math.max(1, Math.round(C.HUD_COMBO_RING_SEG * L.comboRing));
      const span = 2 * Math.PI * L.comboRing;
      while (_comboRingPts.length < segs + 1) _comboRingPts.push({ x: 0, y: 0 });
      _comboRingPts.length = segs + 1;
      for (let i = 0; i <= segs; i++) {
        const a = -Math.PI / 2 - span * (i / segs);
        _comboRingPts[i].x = cx + Math.cos(a) * rx;
        _comboRingPts[i].y = cy + Math.sin(a) * ry;
      }
      drawPoly(ctx, _comboRingPts, false);
      glowStroke(ctx, C.HUD_COLOR, C.HUD_LINE_W, L.comboAlpha);
    }
  }
}

// ---------------------------------------------------------------------------
// THE MENU MODEL — kit-menu's draft (GDD 10.5; CS008 P5)
// ---------------------------------------------------------------------------
//
// ⛔ createMenu() READS NO GAME GLOBAL — not `state`, not C, not a game
// function. Its one tunable arrives as an option, and everything else crosses
// as a parameter:
//
//   screen  DATA the host owns: { items: [{ label, detail, enabled, action }],
//           back }. `back` is an action name or null (a root screen).
//   input   the host's input snapshot for this step: { rotate, fire, purge }.
//   return  an action NAME, or null. The host decides what a name does.
//
// ⛔ FIRE AND PURGE ARE RISING EDGES, against "held last step", so a held
// button confirms once, not sixty times a second. The snapshot stays levels. Rotate ACCUMULATES, and each whole `rotateStep` moves the cursor one
// enabled row: a keyboard tap (exactly one lane) is one row, a mouse flick
// several. The cursor CLAMPS at the ends and SKIPS rows that are not enabled,
// so a disabled row can be shown and never chosen.
//
// ⛔ reset() IS THE HOST'S "THE SCREEN CHANGED". The next step after it is an
// ENTRY step: the cursor goes to the first enabled row, the accumulator
// empties, whatever is held right now is latched as already held, a queued
// back() is dropped, and the step returns null. That is what makes a press
// that began before the screen appeared — during a death freeze, or the press
// that opened it — do nothing until it is released and pressed again.

const MENU_VERSION = "0.1.0";

function createMenu(options) {
  const opts = options || {};
  const rotateStep = opts.rotateStep;
  if (typeof rotateStep !== "number" || !isFinite(rotateStep) || rotateStep <= 0) {
    throw new Error("createMenu: options.rotateStep must be a positive finite number");
  }

  let entry = true;
  let cursor = 0;
  let acc = 0;
  let prevFire = false, prevPurge = false;
  let backQueued = false;

  function firstEnabled(items) {
    for (let i = 0; i < items.length; i++) if (items[i].enabled) return i;
    return 0;
  }

  // One enabled row per unit of `n`, never past either end. ⛔ Bounded by the
  // row count, so a huge flick costs one pass over the list and no more.
  function moveBy(items, n) {
    const dir = n > 0 ? 1 : -1;
    let left = Math.min(Math.abs(n), items.length);
    while (left-- > 0) {
      let i = cursor + dir;
      while (i >= 0 && i < items.length && !items[i].enabled) i += dir;
      if (i < 0 || i >= items.length) return;
      cursor = i;
    }
  }

  function step(screen, input) {
    const items = screen.items;
    const fire = !!input.fire, purge = !!input.purge;
    if (entry) {
      entry = false;
      cursor = firstEnabled(items);
      acc = 0;
      prevFire = fire; prevPurge = purge;
      backQueued = false;
      return null;
    }

    acc += input.rotate;
    const whole = Math.trunc(acc / rotateStep);
    if (whole !== 0) { acc -= whole * rotateStep; moveBy(items, whole); }

    const fireEdge = fire && !prevFire;
    const purgeEdge = purge && !prevPurge;
    prevFire = fire; prevPurge = purge;

    if (purgeEdge || backQueued) {
      backQueued = false;
      if (screen.back) return screen.back;
    }
    if (fireEdge && items[cursor] && items[cursor].enabled) return items[cursor].action;
    return null;
  }

  return {
    VERSION: MENU_VERSION,
    step,
    reset() { entry = true; },
    // A back request from outside the snapshot — a named key action. Consumed
    // by the next step, and dropped by an entry step like any other press.
    back() { backQueued = true; },
    get cursor() { return cursor; },
  };
}

// The first row the window shows: the cursor centred where it can be, pinned
// to either end where it cannot.
function menuWindowStart(count, cursor, visible) {
  const max = count > visible ? count - visible : 0;
  const first = cursor - Math.floor(visible / 2);
  return first < 0 ? 0 : first > max ? max : first;
}

const _chevronPts = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

// A menu over whatever Game.draw() painted first. `view`:
//   title, lines  strings shown above the rows (lines may be empty)
//   items, cursor the screen's rows and the model's cursor
// ⛔ Like drawHud it reads no game state, and like drawHud it reads C for
// sizes and colours — the gap kit-menu's extraction owes an options argument
// for (src/15-render-hud.NOTES.md).
function drawMenu(ctx, view) {
  const cx = C.WORLD_W / 2;
  const size = C.MENU_TEXT_SIZE;
  const rowH = C.MENU_ROW_H;

  drawText(ctx, view.title, cx, C.MENU_TITLE_Y, C.MENU_TITLE_SIZE, C.MENU_COLOR, "center");

  let y = C.MENU_TOP_Y;
  for (let i = 0; i < view.lines.length; i++, y += rowH) {
    drawText(ctx, view.lines[i], cx, y, size, C.MENU_COLOR, "center");
  }
  if (view.lines.length) y += rowH;

  const items = view.items;
  const first = menuWindowStart(items.length, view.cursor, C.MENU_VISIBLE_ROWS);
  const last = Math.min(items.length, first + C.MENU_VISIBLE_ROWS);
  const labelX = cx - C.MENU_COL_W / 2;
  const detailX = cx + C.MENU_COL_W / 2;
  for (let i = first; i < last; i++, y += rowH) {
    const it = items[i];
    const color = !it.enabled ? C.MENU_LOCKED_COLOR
                : i === view.cursor ? C.MENU_COLOR : C.MENU_IDLE_COLOR;
    drawText(ctx, it.label, labelX, y, size, color, "left");
    if (it.detail) drawText(ctx, it.detail, detailX, y, size, color, "right");
    if (i === view.cursor) {
      const S = C.MENU_CHEVRON_SIZE;
      const tipX = labelX - C.MENU_CHEVRON_GAP, midY = y + size / 2;
      _chevronPts[0].x = tipX - S; _chevronPts[0].y = midY - S;
      _chevronPts[1].x = tipX;     _chevronPts[1].y = midY;
      _chevronPts[2].x = tipX - S; _chevronPts[2].y = midY + S;
      drawPoly(ctx, _chevronPts, false);
      glowStroke(ctx, C.MENU_COLOR, C.MENU_LINE_W, 1);
    }
  }
}

// ==========================================================================
// 16-audio-engine.js
// ==========================================================================
// 16-audio-engine.js — kit-audio (draft). The context, four buses, the music scheduler, and the SFX player.
//
// ⛔ THIS MODULE READS NO GAME GLOBAL. Not the config object, not the mutable
// game object, not a game function, in either direction. Every tunable arrives
// through the factories' options, and 19-sfx.js is what passes them in. The
// noise source is an injected function, so this file draws from no generator
// of its own. That is CLAUDE.md's boundary contract ("Kit modules and
// extraction"). Backport packet: src/16-audio-engine.NOTES.md.
//
// ⛔ NOTHING STARTS BEFORE A USER GESTURE. `engine.ctx` is null until unlock()
// runs inside one (the host calls it from kit-input's onGesture), and EVERY
// entry point below returns early while it is null. A host with no audio API
// at all (the headless suite) therefore runs every call as a no-op.
//
// ⛔ THE MUSIC SCHEDULER IS PER-FRAME LOOKAHEAD, NEVER A TIMER (GDD 11.2). Each
// update() schedules every step that starts inside the lookahead window, at an
// absolute context time. Note timing is then sample-accurate and has nothing
// to do with the frame rate.
//
// ⛔ scheduleStep NEVER CONSULTS INTENSITY, and never reads a layer's
// `audition` mark. Every layer is always scheduled; gating is a downstream
// gain node. That is what keeps a track's note timing provably fixed whatever
// a director does later.
//
// createMusic() is Orbital Overhaul's music system (commit 5abd37a), ported.
// It departs from that source in seven places, each marked DEPARTURE below.
// 1-4 are asserted by test-cs009-p1.js, 5-7 by test-cs010-p1.js:
//   1. the noise buffer is filled from the injected generator;
//   2. update() RESYNCS after a stall instead of bursting every missed note;
//   3. no comment names the browser audio API by the word the host's
//      vocabulary scan bans;
//   4. opts.layerSink, so a lab's per-layer SOLO/MUTE nodes live outside this
//      code;
//   5. (0.3.0) setIntensity() LATCHES each gate change to the next bar line
//      on the scheduler's own grid; the source ramped at currentTime;
//   6. (0.3.0) the sweep and the limiter, built once, between the track gain
//      and the duck;
//   7. (0.3.0) the dip node after the duck, and the onBeat report;
//   8. (0.4.0) the optional high-pass between the sweep and the limiter, and
//      setHighpass().
// Ported in 0.3.0: the intensity setter's gate loop and setDuck(). Each new
// group (gating, sweep, limiter, duck, highpass) is OPTIONAL: an absent group
// builds no node, and the music behaves as 0.2.0 did.
//
// createSfxPlayer() (0.2.0) is new here, not a port: one-shot and held voices
// built from recipe DATA, into the sfx bus. Its noise is injected too.

const AUDIO_VERSION = "0.4.0";

// The four buses, in build order. master goes to the output; the other three
// go to master. A bus nothing feeds yet is still built, so its volume row works.
const AUDIO_BUSES = ["master", "music", "sfx", "voice"];

// ⛔ A SECOND-ORDER BUTTERWORTH'S Q, IN dB — the units this audio API reads Q in
// for a low-pass or a high-pass. It is the flattest response with no peak at
// the cutoff, so a filter built with it is at or under unity at every
// frequency and cannot raise a host's headroom budget. The optional high-pass
// below is built at it, and is not a tunable: a peaking high-pass would be a
// different effect, not a louder one.
const AUDIO_BUTTERWORTH_Q = -3.0103;

// The high-pass's resting cutoff: 0 Hz is a pass-through, so "off" is a
// frequency and not a bypass switch — which is what lets it move by a time
// constant in both directions instead of clicking in and out of the path.
const AUDIO_HP_OFF_HZ = 0;

// ⛔ Numeric tunables are REQUIRED, never defaulted (kit-input's rule): a
// default here would be a second tuning surface competing with the host's.
function audioRequireNum(opts, owner, name) {
  const v = opts[name];
  if (typeof v !== "number" || !isFinite(v)) {
    throw new Error(owner + ": options." + name + " must be a finite number");
  }
  return v;
}

// A bus level is linear gain: 0 is silence, 1 is unity.
function audioCheckVol(where, v) {
  if (typeof v !== "number" || !isFinite(v) || v < 0) {
    throw new Error(where + " must be a finite number >= 0");
  }
  return v;
}

// The platform's context class, or null. Looked up at unlock() time, not at
// load, so a host (or a test) that installs one late is still heard.
function audioContextClass() {
  if (typeof AudioContext === "function") return AudioContext;
  if (typeof window !== "undefined" && window && typeof window.webkitAudioContext === "function") {
    return window.webkitAudioContext;
  }
  return null;
}

// createAudioEngine({ volRamp, vol: { master, music, sfx, voice } })
function createAudioEngine(options) {
  const opts = options || {};
  const volRamp = audioRequireNum(opts, "createAudioEngine", "volRamp");
  if (!opts.vol || typeof opts.vol !== "object") {
    throw new Error("createAudioEngine: options.vol must be an object");
  }
  // ⛔ HELD FROM BOOT. The levels exist before the context does, so a host
  // can set them from its settings long before the first gesture, and unlock()
  // builds each bus at the level held.
  const vol = {};
  for (let i = 0; i < AUDIO_BUSES.length; i++) {
    const bus = AUDIO_BUSES[i];
    vol[bus] = audioCheckVol("createAudioEngine: options.vol." + bus, opts.vol[bus]);
  }

  const engine = {
    VERSION: AUDIO_VERSION,
    ctx: null,
    vol,
    master: null, music: null, sfx: null, voice: null,
    unlock, setVol, now,
  };

  // Call from inside a user gesture. The first call creates the context and
  // the buses; every call resumes a suspended context. Returns whether a
  // context exists. ⛔ A context that cannot be created is the normal silent
  // path, not an error: the game plays without sound.
  function unlock() {
    if (!engine.ctx) {
      const Ctor = audioContextClass();
      if (!Ctor) return false;
      let ctx;
      try { ctx = new Ctor(); } catch (err) { return false; }
      engine.ctx = ctx;
      for (let i = 0; i < AUDIO_BUSES.length; i++) {
        const bus = AUDIO_BUSES[i];
        const g = ctx.createGain();
        g.gain.value = vol[bus];      // built before anything plays: a level, not a change
        g.connect(bus === "master" ? ctx.destination : engine.master);
        engine[bus] = g;
      }
    }
    if (engine.ctx.state === "suspended" && typeof engine.ctx.resume === "function") {
      const p = engine.ctx.resume();
      if (p && typeof p.catch === "function") p.catch(function () {});
    }
    return true;
  }

  // Set a bus level. Held always; pushed to the graph if it exists. ⛔ A RAMP
  // over volRamp, never a bare .value set: a stepped gain clicks.
  function setVol(bus, v) {
    if (AUDIO_BUSES.indexOf(bus) < 0) throw new Error("setVol: no bus named " + bus);
    vol[bus] = audioCheckVol("setVol: " + bus, v);
    if (!engine.ctx) return;
    const param = engine[bus].gain, t = engine.ctx.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(vol[bus], t + volRamp);
  }

  function now() { return engine.ctx ? engine.ctx.currentTime : 0; }

  return engine;
}

// An optional group of numbers: null when absent, and every named field
// required when present (a present group is the host saying it tunes them).
function audioGroup(opts, name, fields) {
  const g = opts[name];
  if (g === undefined) return null;
  if (!g || typeof g !== "object") throw new Error("createMusic: options." + name + " must be an object");
  for (let i = 0; i < fields.length; i++) audioRequireNum(g, "createMusic: options." + name, fields[i]);
  return g;
}

// The track loader. A track is DATA (GDD 11.3):
//   { stepDur, steps, bar, layers: [ { name, tier, type, cutoff, cutoffTo,
//     cutoffTime, q, hp, detune, drop, dropTime, noise, gain, atk, rel,
//     audition, beat, steps: [cell | null] } ] }      cell = { f, dur, g }
// A track may be null: a named silence.
// ⛔ A `tier` outside 1..4 is always an error (a threshold table has no key for
// it, so the layer would be silent forever). A tier in 1..4 needs the gating
// group, or it is a gate nobody opens or closes, and the track's `bar` (steps
// per bar, dividing `steps`), or there is no bar line to latch it to.
// `audition` is "pass", "fail" or absent. It is a mark for whoever tiers the
// track later, and the scheduler never reads it.
// `beat` is true or absent: each note of a marked layer is reported to onBeat.
function audioCheckTracks(tracks, gating) {
  if (!tracks || typeof tracks !== "object") throw new Error("createMusic: options.tracks must be an object");
  const names = Object.keys(tracks);
  for (let n = 0; n < names.length; n++) {
    const track = tracks[names[n]];
    if (track === null) continue;
    const at = "createMusic: track " + names[n];
    if (!track || typeof track !== "object") throw new Error(at + " must be an object or null");
    if (typeof track.stepDur !== "number" || !(track.stepDur > 0)) throw new Error(at + ": stepDur must be > 0");
    if (!Number.isInteger(track.steps) || track.steps < 1) throw new Error(at + ": steps must be a positive integer");
    if (!Array.isArray(track.layers)) throw new Error(at + ": layers must be an array");
    if (track.bar !== undefined && (!Number.isInteger(track.bar) || track.bar < 1 || track.steps % track.bar !== 0)) {
      throw new Error(at + ": bar must be a positive integer that divides steps");
    }
    for (let i = 0; i < track.layers.length; i++) {
      const layer = track.layers[i];
      const la = at + " layer " + i;
      if (!layer || !Array.isArray(layer.steps)) throw new Error(la + ": steps must be an array");
      if (layer.tier !== undefined) {
        if (!Number.isInteger(layer.tier) || layer.tier < 1 || layer.tier > 4) {
          throw new Error(la + ": tier must be an integer in 1..4");
        }
        if (!gating) throw new Error(la + ": a tier needs options.gating");
        if (track.bar === undefined) throw new Error(la + ": a tier needs the track's bar");
      }
      if (layer.audition !== undefined && layer.audition !== "pass" && layer.audition !== "fail") {
        throw new Error(la + ": audition must be \"pass\", \"fail\" or absent");
      }
      if (layer.beat !== undefined && layer.beat !== true) throw new Error(la + ": beat must be true or absent");
    }
  }
}

// A gain's level at time t, off the breakpoints this module scheduled on it
// ([[t, v], ...], linear between them, flat outside). ⛔ Never a param's
// `.value`: during a ramp, and on a recording fake, that is not the level now.
function audioLevelAt(points, t) {
  if (!points.length || t <= points[0][0]) return points.length ? points[0][1] : 1;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    if (t < b[0]) return b[0] === a[0] ? b[1] : a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]);
  }
  return points[points.length - 1][1];
}

function audioClamp01(f) {
  return typeof f === "number" && isFinite(f) ? Math.max(0, Math.min(1, f)) : 0;
}

// createMusic(engine, { tracks, lookahead, crossfade, fadeOut, noise, layerSink,
//                       gating, sweep, limiter, duck, onBeat })
//   tracks     { name: track | null }, checked by audioCheckTracks
//   lookahead  s — each update(), schedule every step starting inside this window
//   crossfade  s — track-to-track fade on setState()
