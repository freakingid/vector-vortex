function createStore(ctx, prefix) {
  const store = {
    get gameId() {
      return ctx.gameId;
    },
    get available() {
      return ctx.ls !== null;
    },

    declare(key, spec) {
      declareKey(ctx, key, spec);
    },

    // The fallback is returned as-is, not cloned. There is no read cache: every
    // get() re-reads storage. §7.3, step by step, lives in readValue().
    get(key, fallback) {
      const declaration = requireDeclared(ctx, key, 'get');
      return readValue(ctx, prefix, key, declaration, fallback);
    },

    // Versions are per key, never per store and never per call site — the
    // version written here comes from the declaration, so a caller cannot pass
    // 2 in one file and forget in another (§7.1).
    set(key, value) {
      const declaration = requireDeclared(ctx, key, 'set');
      return writeValue(ctx, prefix, key, declaration.version, value);
    },

    // has() reports whether BYTES are stored at this key, not whether this
    // build can read them. A corrupt or newer-version value is still data the
    // player owns (§2.4), and hiding it behind `false` would invite a caller to
    // overwrite exactly the value step 5 refuses to touch. It never emits and
    // never writes.
    has(key) {
      requireDeclared(ctx, key, 'has');
      return readItem(ctx, prefix + key) !== null;
    },

    // Clears both the durable value and any memory-shimmed one (§5.2) — a
    // failed write's in-memory copy must not outlive an explicit remove().
    remove(key) {
      requireDeclared(ctx, key, 'remove');
      const storageKey = prefix + key;
      ctx.memory.delete(storageKey);
      if (readItem(ctx, storageKey) === null) return true;
      return removeItem(ctx, storageKey);
    },

    // Same interface over a longer prefix, sharing the parent's probe result,
    // onEvent handler and declaration table (§6) — that sharing is what makes
    // one declare('achievements', ...) work across every profile scope.
    scope(id) {
      checkScopeId(id);
      return createStore(ctx, `${prefix}${id}.`);
    },

    keys() {
      return underPrefix(ctx, prefix)
        .filter((e) => !e.remainder.includes('.'))
        .map((e) => e.remainder)
        .sort();
    },

    scopes() {
      const ids = new Set();
      for (const { remainder } of underPrefix(ctx, prefix)) {
        const dot = remainder.indexOf('.');
        if (dot > 0) ids.add(remainder.slice(0, dot));
      }
      return [...ids].sort();
    },

    // Own-level-only by default is deliberate: "wipe this profile completely"
    // should require typing deep (§9). Never touches coinless.lb.*, another
    // game's namespace, or unprefixed legacy keys — it only walks its own
    // prefix. Also clears matching memory-shim entries (§9), including keys
    // that never reached storage at all — a never-durable value has nothing
    // for the storage walk to find, hence the separate underPrefixMemory pass.
    // The returned count is durable removals only, matching "removes own-level
    // keys" read literally; a memory-only entry was never "in" storage to
    // remove from it.
    clear(options) {
      const deep = Boolean(options && options.deep);
      let removed = 0;
      for (const { storageKey, remainder } of underPrefix(ctx, prefix)) {
        if (!deep && remainder.includes('.')) continue;
        ctx.memory.delete(storageKey);
        if (removeItem(ctx, storageKey)) removed += 1;
      }
      for (const { storageKey, remainder } of underPrefixMemory(ctx, prefix)) {
        if (!deep && remainder.includes('.')) continue;
        ctx.memory.delete(storageKey);
      }
      return removed;
    },

    // An estimate, and the doc says so: UTF-16, key plus value, this prefix
    // only. There is no dependable "how much room is left" API — set()
    // returning false is the real signal (§8).
    usage() {
      let bytes = 0;
      let keys = 0;
      for (const { storageKey } of underPrefix(ctx, prefix)) {
        const value = readItem(ctx, storageKey);
        if (value === null) continue;
        bytes += (storageKey.length + value.length) * 2;
        keys += 1;
      }
      return { bytes, keys };
    },

    // Unprefixed, unversioned, un-enveloped strings — the escape hatch for
    // real production keys that predate the namespace and cannot be moved
    // (afd_settings_v1, afd_achievements_v2, afd_profiles_v1). Exempt from
    // clear(), invisible to keys(), identical on a scoped store and its parent
    // because it is not scoped by definition (§3.4, §6). ⛔ §13: do not remove.
    raw: ctx.raw
  };

  return store;
}

function createRaw(ctx) {
  const checkRawKey = (key) => {
    if (typeof key !== 'string' || key.length === 0) {
      throw new TypeError(`kit-storage: raw key must be a non-empty string, got ${describe(key)}`);
    }
    return key;
  };

  return {
    // Same memory-shim precedence as the managed get() (§7.3 step 1): a raw
    // write that failed to reach storage is served from memory until reload.
    get(key) {
      const k = checkRawKey(key);
      if (ctx.memory.has(k)) return ctx.memory.get(k);
      return readItem(ctx, k);
    },
    set(key, value) {
      const k = checkRawKey(key);
      if (typeof value !== 'string') {
        throw new TypeError(
          `kit-storage: raw.set(${describe(key)}, ...) takes a string — ` +
          `raw values are unversioned and un-enveloped, got ${describe(value)}`
        );
      }
      return shimmedWrite(ctx, k, value, value, k);
    },
    // Durable bytes only, like the managed has() (§2.4) — not whether a
    // memory-shimmed value would answer get().
    has(key) {
      return readItem(ctx, checkRawKey(key)) !== null;
    },
    // Clears both the durable value and any memory-shimmed one, same as the
    // managed remove().
    remove(key) {
      const k = checkRawKey(key);
      ctx.memory.delete(k);
      if (readItem(ctx, k) === null) return true;
      return removeItem(ctx, k);
    }
  };
}

// --- create() (spec §12, §14 step 1) ----------------------------------------
//
// Two create() calls with the same gameId return independent instances over
// the same keyspace with SEPARATE declaration tables. That is a footgun, not a
// feature: create once per game and pass the instance around.

function create(config) {
  if (config === null || typeof config !== 'object' || Array.isArray(config)) {
    throw new TypeError(`kit-storage: create() needs a config object, got ${describe(config)}`);
  }

  const gameId = checkGameId(config.gameId);
  const emit = makeEmitter(config.onEvent);

  const { keys } = config;
  if (keys !== undefined && (keys === null || typeof keys !== 'object' || Array.isArray(keys))) {
    throw new TypeError(`kit-storage: create({ keys }) must be an object, got ${describe(keys)}`);
  }

  const ctx = {
    gameId,
    ls: null,
    declarations: new Map(),
    // The memory shim (§5.2), keyed by full storage key so root and every
    // scope share one map — consistent with the probe result, onEvent handler
    // and declaration table already being shared across scope() (§6).
    memory: new Map(),
    emit,
    raw: null
  };

  // Declarations are validated before the probe so a malformed config throws
  // loudly whether or not storage happens to be available.
  if (keys) {
    for (const key of Object.keys(keys)) declareKey(ctx, key, keys[key]);
  }

  const { ls, error } = probeLocalStorage();
  ctx.ls = ls;
  ctx.raw = createRaw(ctx);

  if (ls === null) emit('unavailable', { error });

  return createStore(ctx, `${ROOT_PREFIX}${gameId}.`);
}
return { VERSION, create };
})();

// --------------------------------------------------------------------------
// lib/kit-profile/kit-profile.js
// --------------------------------------------------------------------------
const KitProfile = (function () {
// kit-profile — client module. Plain ES module, no build step.
// Contract: docs/kit-profile-client-api.md. Implementation contract:
// docs/kit-profile-spec.md. Local only — no network, no DOM, no game state.
// Depends on: kit-storage (an instance is injected, never created here) and
// kit-names (all display-name rules).
//
// ⛔ THIS MODULE IS AN EXTRACTION, not a fresh design. Orbital Overhaul's
// `Profiles` object is in production and correct; spec §12 lists the twelve
// things a future session must not "fix". Several of them look like obvious
// cleanups and are not — each traces to a real bug or a real data-loss risk.
//
// Governing rule, spec §2.1: `player_id` is minted once per profile and NEVER
// regenerated. A regenerated id silently fragments a player's leaderboard
// history into two identities that can never be merged, and it fails quietly —
// it surfaces weeks later as a board listing the same person twice.

const VERSION = '0.1.1';

const { validateName, MAX_NAME_LENGTH } = KitNames;

// Re-exported, not wrapped, so KitProfile.NAME_CHANGE_NOTICE is reference-
// identical to KitNames.NAME_CHANGE_NOTICE (§8.4) — a rename UI needs one
// import, not two.
// re-exported in the return below, off KitNames: NAME_CHANGE_NOTICE

// --- Constants ---------------------------------------------------------------

// Root scope, declared at version 1 (§4.1). The old blob's internal "v": 1
// field is dropped — kit-storage's envelope carries the version now.
const ROSTER_KEY = 'profiles';
const ROSTER_VERSION = 1;

// ⛔ NOT maxProfiles. §6.3: load() must never truncate to the configured
// maximum, or a roster of 6 read by a build configured for 4 silently loses
// two. This ceiling exists only to bound corrupt input; create() enforces the
// real limit.
const ROSTER_HARD_CEILING = 32;

const DEFAULTS = {
  maxProfiles: 8,
  legacyProfileId: 'p0',
  legacyProfileName: 'PLAYER 1',
  legacyRosterKey: 'afd_profiles_v1',
  legacyProbeKeys: ['afd_settings_v1', 'afd_achievements_v2'],
  anonymousName: 'ANONYMOUS'
};

// --- Small helpers -----------------------------------------------------------

function describe(value) {
  if (typeof value === 'string') return JSON.stringify(value);
  if (value === null || value === undefined) return String(value);
  if (typeof value === 'object') return Object.prototype.toString.call(value);
  return String(value);
}

// crypto.randomUUID() is [SecureContext]-only, and an opaque origin — a
// sandboxed iframe with no allow-same-origin, the real itch.io/Newgrounds
// embed kit-storage's own blocked-storage probe models — is never a secure
// context, so randomUUID is undefined there even though crypto itself and
// getRandomValues() are not restricted. Confirmed in a real such iframe: this
// module's two id-minting call sites (ensurePlayerId, the legacy-probe mint)
// would otherwise throw uncaught the first time either ran in that embed.
// Falls back to building a v4 UUID from getRandomValues() — this changes
// nothing about ensurePlayerId's three load-bearing properties (spec §3/§12);
// it only changes what generates the string.
function mintPlayerId() {
  if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const hex = [...b].map((x) => x.toString(16).padStart(2, '0'));
  return `${hex.slice(0, 4).join('')}-${hex.slice(4, 6).join('')}-${hex.slice(6, 8).join('')}-${hex.slice(8, 10).join('')}-${hex.slice(10, 16).join('')}`;
}

// Telemetry only, and a handler that throws must never break a caller —
// §10 and §13 step 10. This is what keeps a broken game handler from leaving a
// switch half-completed.
function makeEmitter(onEvent) {
  if (onEvent === undefined || onEvent === null) return () => {};
  if (typeof onEvent !== 'function') {
    throw new TypeError(`kit-profile: onEvent must be a function, got ${describe(onEvent)}`);
  }
  return (name, detail) => {
    try {
      onEvent(name, detail);
    } catch {
      /* a broken handler is the caller's problem, never ours */
    }
  };
}

// §8.2 — the LENIENT path, production's `cleanName` carried over exactly:
// trim and cap, nothing else. ⛔ No charset check, no uppercasing, no
// whitespace collapse. Stored names are preserved as-is; a profile saved under
// older rules as `Gh0st!` loads intact, is not renamed, not normalized and
// carries no "needs fixing" flag. Strict validateName() applies to create()
// and rename() only.
function lenientName(name) {
  return typeof name === 'string' ? name.trim().slice(0, MAX_NAME_LENGTH) : '';
}

// --- The defensive roster parse (§5.1) ---------------------------------------
//
// kit-storage guarantees valid JSON at the declared version, not the right
// shape (its client API says so explicitly). Field-by-field
// known-value-else-default therefore stays here, where the shape is known.
//
// Shared deliberately: §5.2's legacy import parses the old `afd_profiles_v1`
// blob with the IDENTICAL rules, so the two must not be allowed to drift into
// two implementations.
//
// Returns { profiles, lastUsed, seq } or null if the blob isn't a roster at
// all. An empty-but-valid roster returns a result with an empty list — the
// caller decides what that means.

function parseRoster(data) {
  if (!data || typeof data !== 'object' || !Array.isArray(data.profiles)) return null;

  const list = [];
  const seen = new Set();
  for (const p of data.profiles) {
    if (list.length >= ROSTER_HARD_CEILING) break;
    if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !p.id || seen.has(p.id)) continue;
    const name = lenientName(p.name);
    if (!name) continue;
    seen.add(p.id);
    // known-value-else-default: a pre-CS033 blob simply has no playerId key,
    // which parses to undefined here and falls through to null — the exact
    // state ensurePlayerId() treats as unset. That fall-through IS the
    // backfill trigger (§3); do not "tidy" it into a required field.
    list.push({
      id: p.id,
      name,
      created: typeof p.created === 'number' ? p.created : 0,
      playerId: typeof p.playerId === 'string' && p.playerId ? p.playerId : null
    });
  }

  // ⛔ The seq floor. seq never drops BELOW what the roster already uses,
  // however the stored value was edited — max(storedSeq, max(suffix) + 1).
  // Monotonic ids are the guarantee that makes not clearing a removed
  // profile's stores safe (§4.3): a recycled id would inherit a dead
  // profile's settings and achievements.
  let seq = 0;
  for (const p of list) {
    const m = /^p(\d+)$/.exec(p.id);
    if (m) seq = Math.max(seq, Number(m[1]) + 1);
  }
  if (Number.isFinite(data.seq) && data.seq > seq) seq = Math.floor(data.seq);

  return {
    profiles: list,
    lastUsed: typeof data.lastUsed === 'string' ? data.lastUsed : '',
    seq
  };
}

// --- Roster state ------------------------------------------------------------
//
// An object literal with methods, so `this.save()` and `this.byId()` read
// exactly as they do in the production source this is extracted from. The
// public instance returned by create() is a thin façade over this — the
// documented contract is the whole exported surface.

function makeState(cfg, emit) {
  const store = cfg.storage;

  return {
    // ⛔ Defaults to the legacy id, so a build that never loads a roster keys
    // every store exactly where every pre-profile build did (§5.4).
    activeId: cfg.legacyProfileId,
    roster: [],          // [{ id, name, created, playerId }]
    lastUsed: '',        // the id to re-activate at the next boot ('' = none)
    seq: 0,              // next numeric suffix to mint — monotonic, see §4.3
    firstBoot: false,    // set ONLY on a genuinely empty install (§5.4)

    // Ids that came out of STORED data, so `minted` can report backfill
    // honestly (§10): true means a profile predating player_id just got one.
    // Not persisted, and deliberately not a field on the roster entry —
    // save() writes exactly four fields and nothing else.
    fromStore: new Set(),

    byId(id) {
      return this.roster.find((p) => p.id === id) || null;
    },

    nameOf(id) {
      const p = this.byId(id);
      return p ? p.name : '';
    },

    // Trimmed and case-insensitive (§8.1), carried from production unchanged.
    // `exceptId` lets rename() ignore the profile it is renaming. Compares
    // through the LENIENT path on both sides so a stored legacy name still
    // participates — callers pass the strictly-normalized candidate in.
    nameTaken(name, exceptId) {
      const n = lenientName(name).toLowerCase();
      if (!n) return false;
      return this.roster.some((p) => p.id !== exceptId && p.name.toLowerCase() === n);
    },

    // ------------------------------------------------------------------
    // ⛔ §3 / §12 — CARRIED VERBATIM FROM PRODUCTION. Three properties, all
    // load-bearing:
    //   1. Check-then-mint. Mints only when absent; cannot re-mint.
    //   2. Persists IMMEDIATELY, not at the next natural save, so the mint
    //      survives a crash between minting and whatever save would otherwise
    //      have come next.
    //   3. Called from every path that reaches a profile (§3.1): boot,
    //      select(), current(), player(). NOT list(), NOT create().
    // Do not restructure this into a lazy getter, a constructor-time mint, or
    // a migration pass. The only addition to production's three lines is the
    // §10 `minted` emit, which is telemetry and changes none of the three.
    // ------------------------------------------------------------------
    ensurePlayerId(id) {
      const p = this.byId(id);
      if (p && !p.playerId) {
        p.playerId = mintPlayerId();
        this.save();
        emit('minted', { id: p.id, backfill: this.fromStore.has(p.id) });
      }
      return p ? p.playerId : null;
    },

    // --- Persistence -------------------------------------------------------
    //
    // `op`/`id` default to the mint case: every one of ensurePlayerId's four
    // call sites has already moved activeId onto the profile being minted, so
    // `this.save()` — the verbatim line above — reports the right id without
    // needing an argument.
    save(op = 'save', id = this.activeId) {
      const ok = store.set(ROSTER_KEY, {
        lastUsed: this.lastUsed,
        seq: this.seq,
        // No cap here: an over-capacity roster is saved back INTACT (§6.3).
        profiles: this.roster.map((p) => ({
          id: p.id,
          name: p.name,
          created: p.created,
          playerId: p.playerId || null
        }))
      });
      if (!ok) emit('error', { op, id });
      return ok;
    },

    // Returns TRUE only when a usable, NON-EMPTY roster came back. Absent,
    // unreadable, corrupt and empty all answer false and leave the roster
    // empty — that is the single signal boot branches on (§5.1). Never throws.
    load() {
      this.roster = [];
      this.lastUsed = '';
      this.seq = 0;
      this.fromStore.clear();

      let parsed = null;
      try {
        // kit-storage already returns the fallback for absent, blocked,
        // corrupt or unreadable-version bytes, and leaves those bytes alone.
        parsed = parseRoster(store.get(ROSTER_KEY, null));
      } catch {
        parsed = null;   // create() never throws (§5)
      }
      if (!parsed) return false;

      this.roster = parsed.profiles;
      this.lastUsed = parsed.lastUsed;
      this.seq = parsed.seq;
      for (const p of this.roster) this.fromStore.add(p.id);
      return this.roster.length > 0;
    },

    // --- Boot (§5) ---------------------------------------------------------
    //
    // Runs once, synchronously, and never throws. Four outcomes, tried in the
    // order §5 sets out: a stored roster, a one-time legacy import, a
    // pre-profile install, or a genuinely empty one.
    boot() {
      this.firstBoot = false;

      // §5.1 — a usable roster is the single signal the rest of boot branches
      // on. This path READS ONLY; the only write it can produce is a backfill
      // mint below.
      if (this.load()) {
        this.activateLoaded();
        this.ensurePlayerId(this.activeId);   // backfill: this boot's profile may predate player_id
        return;
      }

      // ⛔ Everything past this point WRITES to the roster key, so the guard
      // is whether BYTES exist there — not whether load() could read them.
      // kit-storage's has() is specified for exactly this: it "reports whether
      // BYTES are stored at this key, not whether this build can read them...
      // returning false for it would invite a caller to overwrite exactly the
      // value step 5 is designed never to touch."
      //
      // The case that matters is a rollback: a cached or downgraded build
      // meets a roster written at a newer version. kit-storage read nothing
      // and wrote nothing (its §7.3 step 5). If kit-profile then treated
      // "load() said false" as "no roster key" it would import the ancient
      // afd_profiles_v1 blob straight over the newer roster, at version 1 —
      // silently destroying data this build merely failed to understand.
      // §2.4, and the same rule kit-storage lives by.
      //
      // Consequence, stated plainly: unreadable bytes leave an empty roster
      // and firstBoot true, so the game routes to the picker. Creating a
      // profile there WILL overwrite them — but that is a deliberate player
      // action, not something boot did on its own initiative.
      const rosterKeyAbsent = !store.has(ROSTER_KEY);

      // §5.2 — one-time legacy import.
      if (rosterKeyAbsent && this.importLegacyRoster()) {
        this.activateLoaded();
        this.save('legacy_import', this.activeId);
        this.ensurePlayerId(this.activeId);
        return;
      }

      // §5.3 — a returning player from before profiles existed.
      if (rosterKeyAbsent && this.probePreProfileInstall()) return;

      // §5.4 — a genuinely empty install: mint NOTHING, WRITE NOTHING, ask
      // nobody. The title screen routes off firstBoot; until then activeId is
      // the legacy id, so this build stores exactly where a pre-profile build
      // did and an untouched machine cannot tell the difference.
      this.activeId = cfg.legacyProfileId;
      this.firstBoot = true;
    },

    // Shared by §5.1 and §5.2: resolve which of a just-populated roster is
    // active. lastUsed wins if it still names someone; otherwise roster[0].
    activateLoaded() {
      this.activeId = this.byId(this.lastUsed) ? this.lastUsed : this.roster[0].id;
      this.lastUsed = this.activeId;
    },

    // §5.2 — read the pre-kit-storage roster blob and adopt it. Returns true
    // when a usable, non-empty roster came back; the caller does the write.
    //
    // ⛔ THE LEGACY KEY IS READ, NEVER DELETED AND NEVER REWRITTEN. A player
    // who rolls back to an older build still has their roster, and if the
    // write below fails (blocked storage) the next load simply imports again.
    // Nothing in this module ever calls raw.set() or raw.remove() on it.
    importLegacyRoster() {
      if (!cfg.legacyRosterKey) return false;   // a new game passes null to skip §5.2

      let parsed = null;
      try {
        const raw = store.raw.get(cfg.legacyRosterKey);
        if (raw === null) return false;
        // raw values are unversioned and un-enveloped by definition, so the
        // JSON.parse is ours to do. The old blob's own "v": 1 field is read
        // past and discarded (§4.1) — kit-storage's envelope carries the
        // version from here on, exactly as production's load() ignored it.
        // Identical defensive rules, one implementation: parseRoster.
        parsed = parseRoster(JSON.parse(raw));
      } catch {
        return false;   // an unreadable legacy blob is not usable — and not deleted
      }
      if (!parsed || parsed.profiles.length === 0) return false;

      this.roster = parsed.profiles;
      this.lastUsed = parsed.lastUsed;
      this.seq = parsed.seq;
      this.fromStore.clear();
      for (const p of this.roster) this.fromStore.add(p.id);
      return true;
    },

    // §5.3 — a machine already holding pre-profile save data gets ONE profile
    // minted over it.
    //
    // ⛔ THE PRE-PROFILE BLOBS ARE NOT COPIED, MOVED OR REWRITTEN. They are
    // only probed for existence. p0's stores ARE those keys, via scopeFor()'s
    // transparency rule (§4.2) — which is the whole reason nothing needs
    // moving.
    probePreProfileInstall() {
      let found = false;
      for (const key of cfg.legacyProbeKeys) {
        try {
          if (store.raw.has(key)) { found = true; break; }
        } catch {
          /* a probe that can't be read is not evidence of anything */
        }
      }
      if (!found) return false;

      // Minted inline rather than through ensurePlayerId, matching production:
      // this profile is being created now, so there is no check-then-mint to
      // do. backfill is false for the same reason — nothing predating
      // player_id is being backfilled here.
      const p = {
        id: cfg.legacyProfileId,
        name: cfg.legacyProfileName,
        created: Date.now(),
        playerId: mintPlayerId()
      };
      this.roster = [p];
      this.seq = 1;                  // p0 is taken; the next create() is p1 (§5.5)
      this.lastUsed = p.id;
      this.activeId = p.id;
      this.save('legacy_probe', p.id);
      emit('minted', { id: p.id, backfill: false });
      return true;                   // ⛔ firstBoot stays false — this is not an empty install
    },

    // --- Identity reads (§3.1 call sites) ----------------------------------
    current() {
      const p = this.byId(this.activeId);
      if (!p) return null;
      this.ensurePlayerId(p.id);
      return { id: p.id, name: p.name, playerId: p.playerId };
    },

    // kit-leaderboard's getPlayer() shape exactly (§9). With no current
    // profile: { playerId: null, displayName: '' } — mirroring production's
    // `p ? p.playerId : null` and nameOf() returning "".
    player() {
      const p = this.byId(this.activeId);
      if (!p) return { playerId: null, displayName: '' };
      return { playerId: this.ensurePlayerId(p.id), displayName: p.name };
    },

    // ⛔ §3.1 — list() does NOT mint and does NOT expose playerId. Roster
    // display has no need for it, and minting eight UUIDs because a player
    // opened a picker would tie identity creation to a UI event.
    list() {
      return this.roster.map((p) => ({ id: p.id, name: p.name, created: p.created }));
    },

    // --- Per-profile stores (§4.2) -----------------------------------------
    //
    // ⛔ THE LEGACY PROFILE ADDRESSES THE ROOT SCOPE DIRECTLY. That is what
    // lets p0's stores BE the pre-profile keys, unmoved — the §5.3 path mints
    // a profile over existing save data without copying a byte, and this line
    // is why that works.
    //
    // ⛔ This lives here, not in kit-storage. kit-storage has no concept of a
    // "transparent scope" and must not grow one (§4.2, §12). It sees only a
    // caller that sometimes asks for a child scope and sometimes doesn't.
    //
    // Membership is deliberately NOT checked: a removed profile's scoped data
    // must stay readable through scope(id) afterward (§4.3), and before boot
    // selection activeId is the legacy id, so scope() with no argument lands
    // on the root store — exactly where a pre-profile build would have written
    // (§5.4).
    scope(id) {
      const target = id === undefined || id === null ? this.activeId : id;
      return target === cfg.legacyProfileId ? store : store.scope(target);
    },

    // --- Roster operations (§6) --------------------------------------------
    //
    // create/rename/remove landed early, during Phase 1, because Phase 1's own
    // required tests — player_id stable across a rename, across a switch away
    // and back, and across a DIFFERENT profile being removed — cannot be
    // written without them. Verified against §6 as written in Phase 3, not
    // rewritten.

    // ⛔ Does NOT mint a player_id (§3.1). The id appears when the profile is
    // first activated, which under required boot selection (§5.4) is
    // immediately after creation anyway.
    create(name) {
      const v = validateName(name);
      if (!v.ok) return { ok: false, profile: null, reason: 'invalid_name' };
      if (this.nameTaken(v.normalized)) return { ok: false, profile: null, reason: 'name_taken' };
      if (this.roster.length >= cfg.maxProfiles) {
        return { ok: false, profile: null, reason: 'roster_full' };
      }

      // Monotonic — an id is never reused (§4.3, §12). seq starts at 0, so the
      // first create() on an empty install produces `p0`, the legacy id, whose
      // stores are the root scope (§5.5).
      const p = { id: 'p' + this.seq, name: v.normalized, created: Date.now(), playerId: null };
      this.seq++;
      this.roster.push(p);
      this.save('create', p.id);
      emit('created', { id: p.id, name: p.name });
      return { ok: true, profile: { id: p.id, name: p.name, created: p.created }, reason: null };
    },

    // §8.3 — an ORDINARY profile named cfg.anonymousName. Not a distinct
    // type, no flag, fully renameable later. nameTaken is case-insensitive, so
    // a device holds at most one profile by this name; if it's already taken,
    // this returns { ok: false, reason: 'name_taken' } and the caller should
    // select the existing one rather than retry.
    createAnonymous() {
      return this.create(cfg.anonymousName);
    },

    rename(id, name) {
      const p = this.byId(id);
      if (!p) return { ok: false, reason: 'not_found' };
      const v = validateName(name);
      if (!v.ok) return { ok: false, reason: 'invalid_name' };
      if (this.nameTaken(v.normalized, id)) return { ok: false, reason: 'name_taken' };

      const from = p.name;
      p.name = v.normalized;
      this.save('rename', id);
      emit('renamed', { id, from, to: p.name });
      return { ok: true, reason: null };
    },

    // ⛔ Refuses the LAST profile (§6.2): an empty roster after first boot is
    // the state that produces a dead title screen.
    // ⛔ The removed profile's stores are NOT cleared (§4.3), even though
    // scope.clear({ deep: true }) makes it a one-liner. Monotonic seq is the
    // guarantee that makes not-clearing safe.
    remove(id) {
      if (this.roster.length <= 1) return { ok: false, reason: 'last_profile' };
      const i = this.roster.findIndex((p) => p.id === id);
      if (i < 0) return { ok: false, reason: 'not_found' };

      this.roster.splice(i, 1);
      this.fromStore.delete(id);
      if (this.lastUsed === id) this.lastUsed = '';
      this.save('remove', id);
      emit('removed', { id });

      // §6.2 — unlike production, which left activeId naming a gone id for the
      // caller to repair in the same act, kit-profile selects a replacement
      // itself and runs the full §7 lifecycle.
      if (id === this.activeId) this.select(this.roster[0].id);
      return { ok: true, reason: null };
    },

    // --- The profile switch (§7) -------------------------------------------
    //
    // Three steps, in the required order: `beforeChange` while activeId still
    // names the OUTGOING profile, the state transition itself, then `change`
    // with activeId now the INCOMING profile. A game's beforeChange handler
    // flushes the outgoing profile; its change handler resets to shipped
    // defaults and only then loads the incoming one (§7.1) — that reset list
    // lives entirely in the game. kit-profile never imports or references
    // settings, bindings, achievements, game.stats or game.wave; it owns only
    // the two seams.
    //
    // ⛔ Do not collapse the two events into one (§7, §12). A single `change`
    // handler cannot tell which side of the switch it is on, and production's
    // activate() is correct precisely because of that ordering.
    //
    // emit() (§10) swallows a handler's exception internally, so a throwing
    // beforeChange handler cannot abort step 2 partway through — the switch
    // either completes in full or (unknown/no-op id) is never attempted.
    // activeId can never be left half-moved.
    select(id) {
      if (!this.byId(id)) return false;      // unknown id: returns false, fires nothing
      if (id === this.activeId) return true; // already current: a no-op that fires nothing

      const from = this.activeId;
      const to = id;

      // Step 1 — activeId still names the OUTGOING profile.
      emit('beforeChange', { from, to });

      // Step 2 — the switch itself, plus the roster write that makes it the
      // next boot's profile.
      this.activeId = id;
      this.lastUsed = id;
      this.save('select', id);
      this.ensurePlayerId(id);   // backfill: a profile switched TO for the first time may predate player_id

      // Step 3 — activeId now names the INCOMING profile.
      emit('change', { from, to });

      return true;
    }
  };
}

// --- create() (§11, §13 step 1) ----------------------------------------------
//
// Runs the §5 boot sequence synchronously and never throws for anything
// environmental. Missing or non-object `storage` throws — that is programmer
// error, per kit-storage §2.1. Everything else degrades to its default.

function create(config) {
  if (config === null || typeof config !== 'object' || Array.isArray(config)) {
    throw new TypeError(`kit-profile: create() needs a config object, got ${describe(config)}`);
  }

  const { storage } = config;
  if (storage === null || typeof storage !== 'object' || Array.isArray(storage)) {
    throw new TypeError(
      `kit-profile: create({ storage }) requires a kit-storage instance, got ${describe(storage)}`
    );
  }

  const str = (v, d) => (typeof v === 'string' && v.length > 0 ? v : d);
  const cfg = {
    storage,
    maxProfiles:
      Number.isInteger(config.maxProfiles) && config.maxProfiles >= 1
        ? config.maxProfiles
        : DEFAULTS.maxProfiles,
    legacyProfileId: str(config.legacyProfileId, DEFAULTS.legacyProfileId),
    // Through the lenient path (§8.2) so the name a §5.3 mint stores is
    // already what load() will read back next boot — otherwise an over-long
    // configured name would silently shorten itself between the first boot
    // and the second.
    legacyProfileName:
      lenientName(str(config.legacyProfileName, DEFAULTS.legacyProfileName)) ||
      DEFAULTS.legacyProfileName,
    // Explicitly nullable: a new game passes null to skip §5.2 entirely.
    legacyRosterKey:
      config.legacyRosterKey === null ? null : str(config.legacyRosterKey, DEFAULTS.legacyRosterKey),
    legacyProbeKeys: Array.isArray(config.legacyProbeKeys)
      ? config.legacyProbeKeys.filter((k) => typeof k === 'string' && k.length > 0)
      : DEFAULTS.legacyProbeKeys,
    anonymousName: str(config.anonymousName, DEFAULTS.anonymousName)
  };

  const emit = makeEmitter(config.onEvent);

  // §4.1. Redeclaring identically is a no-op in kit-storage, so a game that
  // already listed `profiles` in KitStorage.create({ keys }) is fine.
  storage.declare(ROSTER_KEY, { version: ROSTER_VERSION });

  const state = makeState(cfg, emit);
  state.boot();

  const instance = {
    get firstBoot() {
      return state.firstBoot;
    },
    current: () => state.current(),
    player: () => state.player(),
    list: () => state.list(),
    create: (name) => state.create(name),
    createAnonymous: () => state.createAnonymous(),
    rename: (id, name) => state.rename(id, name),
    remove: (id) => state.remove(id),
    select: (id) => state.select(id),
    scope: (id) => state.scope(id)
  };

  emit('ready', { firstBoot: state.firstBoot, count: state.roster.length });
  return instance;
}
return { VERSION, NAME_CHANGE_NOTICE: KitNames.NAME_CHANGE_NOTICE, create };
})();

// 21-telemetry.js
// ==========================================================================
// 21-telemetry.js — the tuning instrument (GDD 15.6, 17 item 11). CS007 P4.
//
// A ring buffer of rows sampled off the simulation clock, exported as CSV to
// the console. It exists to answer GDD 8.2's tuning question — where does a
// first-time player actually die, where does a competent one — against CS007's
// heat curve, which is why every heat-derived value is a column of its own. A
// log that carried only score and level would be a score log; the curve is what
// makes it an instrument.
//
// ⛔ NOTHING IS POSTED ANYWHERE. Strictly local CSV export (GDD 15.6, ⚠ SETTLED
// 2026-08-30; GDD 21 item 5). It is explicitly NOT an anti-cheat mechanism.
//
// ⛔ IT MOVES NO BASELINE, AND THAT IS THE HEADLINE CLAIM (test-cs007-p4.js).
// It spends no RNG draw, reads no state.rng, writes nothing the simulation
// reads back, and is sampled from update() on the SIMULATION clock — never from
// draw(). draw() runs on a frame clock and update() does not (CLAUDE.md, Math
// and lifecycle; RATIONALE.md#draw-path-rng), so a sample taken there would
// make a capture-on run diverge from a capture-off one — GDD 17.1's replay
// guarantee failing inside the one system built to observe it.
//
// ⛔ PERSISTED PER PROFILE SINCE CS011 P2, AND NOT FROM HERE. 22-meta.js owns
// the `telemetry` key's get and set through Profiles.scope() (CLAUDE.md, Save
// data); this file hands it snapshot() and takes restore(), and the envelope's
// declared version is GDD 15.6's read() rejection. ⛔ THERE IS NO STORAGE CALL
// IN THIS FILE AND THERE MUST NOT BE ONE (test-cs007-p4.js).
//
// ⛔ NOT ON CLAUDE.md's EXTRACTION LIST. Six modules are built kit-shaped from
// v1 and this is not one of them, so it reads `state` and `C` directly like
// every other game module. A future kit-telemetry would take a snapshot
// callback instead; do not half-shape it here in anticipation.

// ---------------------------------------------------------------------------
// ⛔ THE COLUMNS — TELEMETRY_FIELDS IS THE ONE SOURCE OF TRUTH (GDD 15.6)
// ---------------------------------------------------------------------------
//
// ⛔ It drives the CSV header AND the row shape. telemetryRow() below writes the
// same names in the same order, and GDD 17 item 11 asserts they agree in LENGTH
// AND ORDER off the built file — so adding or reordering a column means editing
// this list and that function TOGETHER, in one commit, or the suite goes red.
//
// ⛔ THREE COLUMN KINDS AND THE NAMES DO NOT TELL YOU WHICH — TELEMETRY_KINDS
// below is the table, and it is DATA rather than a comment so the exclusion
// below can be made by name:
//
//   instantaneous  the state at the sample instant. May go up or down.
//   cumulative     a run total. Rises, and resets only when a run does.
//   sawtooth       reset by an EVENT mid-run. ⛔ EXCLUDED BY NAME from any
//                  monotonicity check — a sawtooth column falling is the column
//                  working, and a check that did not know which ones they were
//                  would flag the two most useful stall columns in the file.
//
// ⛔ NO COLUMN SHIPS WITH A KNOWN-CONSTANT VALUE ANY MORE, AND THAT IS THE
// PLACEHOLDER'S WHOLE LIFE (CS012 P4, R7). Four columns took their PLACE in the
// order before their SOURCE existed, out of C.TELEMETRY_PLACEHOLDER, because a
// column added later invalidates every log recorded before it — which is the
// whole reason GDD 15.6 makes the column list a thing you edit deliberately.
// Each key was deleted by the changeset that gave that column a real source:
// CS008 P2 moved `score` to state.score, CS008 P3 moved `mode` and
// `startDepth`, and CS012 P4 moved `maxCombo` to state.combo.peak. ⛔ None of
// the four ever moved PLACE in the order, and the object itself is gone
// (00-config.js): with its last key sourced an empty bag is dead code.
//
// ⚠ CROSS-CHECKED AGAINST THE WORKER, which already registers seven statsFields
// for `vector-vortex` in coinless-kit's services/leaderboard/src/registry.js
// (measured at 79206f3). The two instruments name the same quantities; the
// Worker's keys are snake_case and these are camelCase, and the mapping is
// exact and total:
//
//   level_reached -> level      mode -> mode            start_depth -> startDepth
//   wells_cleared -> wellsCleared               purges_spent -> purgesSpent
//   max_combo -> maxCombo       deaths -> deaths
//
// ⛔ THE STORED ROWS ARE ARRAYS IN THIS ORDER (CS011 P2, plan R17). A column
// added, removed or moved BUMPS `telemetry`'s declared version in 22-meta.js's
// Store, in the same commit: kit-storage then reads an old envelope as empty,
// which is GDD 15.6's read() rejection. A stored row of the wrong length
// restores empty too, but a reorder of the same length only the bump catches.
//
// ⛔ ALL EIGHT HEAT-DERIVED VALUES ARE SAMPLED, not the six the phase prompt
// enumerated: CLAUDE.md names SEVEN accessors and heat() itself, and
// vaultInterval() / vaultRimInterval() are two of the seven. "Sample every
// heat-derived value" is the rule; the six-name list under-named it. A log
// missing two rows of the curve cannot be replotted against a retune of them,
// which is the one job this file has.
//
// ⛔ THERE IS NO PER-KIND KILL COLUMN, and that is a decision. The roster grows
// (GDD 6.4's three Overdrive enemies), so a column per kind guarantees the
// column list churns — exactly what GDD 15.6's rule exists to prevent. `kills`
// is one number: enemies the player destroyed, by shot or by Purge.
const TELEMETRY_FIELDS = [
  // ---- the run, and where it is -------------------------------------------
  "t",                  // instantaneous — simulation seconds (state.time)
  "level",              // instantaneous — ⛔ THE ONE CLOCK (GDD 8)
  "seed",               // instantaneous — constant within a run; a restart moves it
  "mode",               // instantaneous — state.mode (GDD 13; CS008 P3)
  "startDepth",         // instantaneous — state.startDepth (GDD 4.6; CS008 P3)
  // ---- the heat curve, sampled (GDD 8; 00-config.js) ----------------------
  "heat",               // instantaneous
  "spawnInterval",      // instantaneous
  "enemyConcurrent",    // instantaneous
  "climbMult",          // instantaneous
  "vaultInterval",      // instantaneous
  "vaultRimInterval",   // instantaneous
  "surgeInterval",      // instantaneous
  "weaverApex",         // instantaneous
  // ---- the board, with CS007 P1's split visible in the field ---------------
  "enemiesAlive",       // instantaneous — every entity, what C.ENEMY_CAP counts
  "threatsAlive",       // instantaneous — blocksClear, what the release budget counts
  "thornsStanding",     // instantaneous — `anchored`; the difference between the two above
  "livesLeft",          // instantaneous — GDD 8.2's targets are about where a player dies
  // ---- the two sawtooths ---------------------------------------------------
  "spawnRemaining",     // ⛔ SAWTOOTH — the well's quota, re-armed by enterWell()
  "purgeUses",          // ⛔ SAWTOOTH — one charge per well, re-armed by enterWell()
  // ---- the run's totals ----------------------------------------------------
  "score",              // cumulative — state.score, addScore()'s (CS008 P2)
  "maxCombo",           // cumulative — state.combo.peak: the run's PEAK MULTIPLIER
                        // (GDD 14.4; CS012 P4). ⛔ 0 on a Classic run
  "deaths",             // cumulative
  "wellsCleared",       // cumulative
  "purgesSpent",        // cumulative
  "divesCompleted",     // cumulative — ⚠ completed, NOT survived (02-state.js)
  "thornDeaths",        // cumulative — GDD 4.5 item 5, a subset of `deaths`
  "shotsFired",         // cumulative
  "kills",              // cumulative — by shot or by Purge
  "spawnBlockedTicks",  // cumulative — ⛔ the stall's own signature (08-spawner.js)
];

// ⛔ EVERY NAME ABOVE HAS A ROW HERE AND NOTHING ELSE DOES. test-cs007-p4.js
// asserts the two key sets are equal, so a column added without a kind — the
// easy half of the edit — turns the suite red rather than shipping a column
// nobody can classify.
const TELEMETRY_KINDS = {
  t: "instantaneous",
  level: "instantaneous",
  seed: "instantaneous",
  mode: "instantaneous",
  startDepth: "instantaneous",
  heat: "instantaneous",
  spawnInterval: "instantaneous",
  enemyConcurrent: "instantaneous",
  climbMult: "instantaneous",
  vaultInterval: "instantaneous",
  vaultRimInterval: "instantaneous",
  surgeInterval: "instantaneous",
  weaverApex: "instantaneous",
  enemiesAlive: "instantaneous",
  threatsAlive: "instantaneous",
  thornsStanding: "instantaneous",
  livesLeft: "instantaneous",
  spawnRemaining: "sawtooth",
  purgeUses: "sawtooth",
  score: "cumulative",
  maxCombo: "cumulative",
  deaths: "cumulative",
  wellsCleared: "cumulative",
  purgesSpent: "cumulative",
  divesCompleted: "cumulative",
  thornDeaths: "cumulative",
  shotsFired: "cumulative",
  kills: "cumulative",
  spawnBlockedTicks: "cumulative",
};

// ⛔ THE OTHER HALF OF TELEMETRY_FIELDS. The names, in the list's order, and
// nothing else — a reader comparing this function to the list above is doing
// exactly what GDD 17 item 11 asserts mechanically.
//
// ⛔ EVERY HEAT ACCESSOR IS PASSED THE LEVEL EXPLICITLY rather than left to
// default to state.level (00-config.js). Identical today; it says in the code
// that a row is a function of the level it records, which is what makes a
// re-plot against a retune honest.
//
// ⛔ threatCount() IS THE REAL ONE (08-spawner.js), not a copy: the whole point
// of the column is to show what the release budget saw, and a second count here
// could disagree with the spawner's the first time `blocksClear` moved.
function telemetryRow(state) {
  const lvl = state.level;
  const T = state.tally;

  // One pass for both board counts. ⛔ `anchored` is read off the entity, never
  // a class name (GDD 6.5) — it is the Thorn and nothing else, and it is what
  // makes enemiesAlive and threatsAlive differ.
  let alive = 0;
  let thorns = 0;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    alive++;
    if (e.anchored) thorns++;
  }

  return {
    t:                 state.time,
    level:             lvl,
    seed:              state.seed,
    mode:              state.mode,
    startDepth:        state.startDepth,
    heat:              heat(lvl),
    spawnInterval:     spawnInterval(lvl),
    enemyConcurrent:   enemyConcurrent(lvl),
    climbMult:         climbMult(lvl),
    vaultInterval:     vaultInterval(lvl),
    vaultRimInterval:  vaultRimInterval(lvl),
    surgeInterval:     surgeInterval(lvl),
    weaverApex:        weaverApex(lvl),
    enemiesAlive:      alive,
    threatsAlive:      threatCount(state),
    thornsStanding:    thorns,
    livesLeft:         state.lives,
    spawnRemaining:    state.spawn.remaining,
    purgeUses:         state.purgeUses,
    score:             state.score,
    maxCombo:          state.combo.peak,
    deaths:            T.deaths,
    wellsCleared:      T.wellsCleared,
    purgesSpent:       T.purgesSpent,
    divesCompleted:    T.divesCompleted,
    thornDeaths:       T.thornDeaths,
    shotsFired:        T.shotsFired,
    kills:             T.kills,
    spawnBlockedTicks: T.spawnBlockedTicks,
  };
}

// One CSV cell. Integers plain, everything else to six decimals — enough to
// replot the curve and short enough that a row is readable. ⛔ No quoting and no
// escaping, because no column can contain a comma: every one is a number except
// `mode`, which is state.mode — "classic" or "overdrive" (GDD 13).
function telemetryCell(v) {
  if (typeof v === "number") {
    if (!isFinite(v)) return String(v);
    return v === Math.floor(v) ? String(v) : v.toFixed(6);
  }
  return String(v);
}

const Telemetry = (function () {

  // ⛔ CAPTURE IS A SESSION SWITCH: OPT-IN, OFF AT EVERY LAUNCH, NEVER
  // PERSISTED (GDD 15.6). A plain module-level boolean is the whole mechanism,
  // and the absence of a load path is the guarantee — there is no storage read
  // anywhere in this file, so a launch has nothing to revive a stale "was ON
  // last session" state from. CS008's Options screen is a control surface over
  // this switch and must not become a settings store for it.
  let capturing = false;

  // The ring. ⛔ FIXED LENGTH, oldest dropped, and `wrapped` LATCHES the first
  // time a row is actually dropped — Orbital Overhaul's v4 lesson: a total read
  // off a silently wrapped buffer is wrong and nothing said so. The export
  // reports it in the header block, every time.
  let ring = new Array(C.TELEMETRY_CAP);
  let head = 0;      // where the next row goes
  let count = 0;     // rows held, <= C.TELEMETRY_CAP
  let wrapped = false;

  // The sample clock, in SIMULATION seconds. -Infinity means "due now", which
  // is the state a fresh buffer and a freshly enabled capture are both in.
  let lastAt = -Infinity;

  // ⛔ ONE ROW IN, THE RING'S ONLY WRITER. Returns the row so a caller — and
  // GDD 17 item 11's assertion — can read its key ORDER, which is the half of
  // the contract a length check cannot see.
  //
  // ⛔ UNGATED BY `capturing` ON PURPOSE. sample() is the gate; this is the
  // mechanism, and a test that had to flip a session switch to drive the row
  // builder would be testing the switch twice and the shape not at all.
  function push(state) {
    const row = telemetryRow(state);
    // The write that is about to overwrite a live row is the drop.
    if (count === C.TELEMETRY_CAP) wrapped = true;
    ring[head] = row;
    head = (head + 1) % C.TELEMETRY_CAP;
    if (count < C.TELEMETRY_CAP) count++;
    return row;
  }

  // ⛔ CALLED FROM update(), ON THE SIMULATION CLOCK, AND FROM NOWHERE ELSE
  // (23-main.js). Returns the row it took, or null.
  //
  // ⛔ THE INTERVAL IS SIMULATION SECONDS, so a slow frame, a hit-stop freeze
  // and a headless soak driving update() directly all sample identically. At
  // C.TELEMETRY_INTERVAL 0.50 s a 60 Hz run spends one row every 30 ticks.
  //
  // ⚠ A CLOCK THAT WENT BACKWARDS IS A NEW RUN. startGame() puts state.time
  // back to 0, and a `lastAt` left at the old run's time would silence the
  // instrument for as many minutes as the previous run lasted. The rows carry
  // `seed`, so the restart is legible in the file rather than hidden.
  function sample(state) {
    if (!capturing) return null;
    const t = state.time;
    if (t < lastAt) lastAt = -Infinity;
    if (t - lastAt < C.TELEMETRY_INTERVAL) return null;
    lastAt = t;
    return push(state);
  }

  // Rows oldest-first. Allocates; the export and the suite are the callers and
  // neither is in the hot path.
  function rows() {
    const out = new Array(count);
    const start = count === C.TELEMETRY_CAP ? head : 0;
    for (let i = 0; i < count; i++) out[i] = ring[(start + i) % C.TELEMETRY_CAP];
    return out;
  }

  // Drops every row and re-arms the sample clock. ⛔ It does NOT touch the
  // capture switch — clearing the buffer and turning the instrument off are two
  // different intentions and a player who means one rarely means the other.
  function clear() {
    ring = new Array(C.TELEMETRY_CAP);
    head = 0;
    count = 0;
    wrapped = false;
    lastAt = -Infinity;
    return true;
  }

  // ⛔ ENABLING DOES NOT CLEAR. A player toggling capture off across a menu and
  // back on wants one log, not two; the sample clock is re-armed so the first
  // step after the flip takes a row rather than waiting out an interval that
  // elapsed while the instrument was off. Use clear() to start a fresh file.
  function setEnabled(on) {
    const next = !!on;
    if (next !== capturing) {
      capturing = next;
      if (capturing) lastAt = -Infinity;
    }
    return capturing;
  }

  function toggle() { return setEnabled(!capturing); }
  function enabled() { return capturing; }

  // The file. ⛔ A `#` HEADER BLOCK, THEN TELEMETRY_FIELDS.join(","), THEN THE
  // ROWS — the header line is the first line that does not start with `#`, and
  // it is exactly the field list, which is what makes the list the one source
  // of truth for the column order rather than merely the intended one.
  //
  // ⛔ THE WRAP IS REPORTED, LOUDLY. `wrapped=true` means the oldest rows are
  // gone, so a total read off the first row of this file is wrong — the
  // cumulative columns start mid-run. That is the whole reason the flag latches.
  function csv() {
    const all = rows();
    const last = count > 0 ? all[count - 1] : null;
    const lines = [];
    lines.push("# vector-vortex telemetry (GDD 15.6) v" + C.GAME_VERSION);
    lines.push("# rows=" + count +
               " capacity=" + C.TELEMETRY_CAP +
               " interval=" + C.TELEMETRY_INTERVAL +
               " wrapped=" + wrapped +
               " seed=" + (last ? last.seed : "none"));
    if (wrapped) {
      lines.push("# WARNING: the ring dropped its oldest rows. The cumulative " +
                 "columns start mid-run, so a total read off row 1 is wrong.");
    }
    lines.push(TELEMETRY_FIELDS.join(","));
    for (let i = 0; i < all.length; i++) {
      const r = all[i];
      const cells = new Array(TELEMETRY_FIELDS.length);
      for (let k = 0; k < TELEMETRY_FIELDS.length; k++) {
        cells[k] = telemetryCell(r[TELEMETRY_FIELDS[k]]);
      }
      lines.push(cells.join(","));
    }
    return lines.join("\n");
  }

  // ⛔ THE EXPORT WRITES TO console.log, AND THAT IS THE WHOLE MECHANISM. It is
  // the only path that works on file://, which the built game must open and
  // play from by double-click (CLAUDE.md, Build rules). ⛔ NEVER AN <a download>
  // AND NEVER A fetch — both are the same failure, a capability the shipped
  // artifact does not have.
  //
  // ⛔ THE CLIPBOARD ATTEMPT IS AN OPTIONAL ENHANCEMENT AND ITS FAILURE IS THE
  // NORMAL PATH (EXTERNAL-FILES.md rule 1). file:// is not a secure context, so
  // navigator.clipboard is usually absent there — and writeText() REJECTS
  // asynchronously rather than throwing, so the promise is caught too. Neither
  // failure is surfaced and neither changes what the console already has.
  function exportCsv() {
    const text = csv();
    console.log(text);
    try {
      if (typeof navigator !== "undefined" && navigator &&
          navigator.clipboard && navigator.clipboard.writeText) {
        const p = navigator.clipboard.writeText(text);
        if (p && typeof p.catch === "function") p.catch(function () {});
      }
    } catch (e) { /* absence is the normal fallback path */ }
    return text;
  }

  // ⛔ THE STORED FORM (CS011 P2, plan R17): the rows oldest-first as ARRAYS in
  // TELEMETRY_FIELDS order, and the wrap latch. Arrays, not row objects: a full
  // ring is 0.89 M characters this way and 2.41 M the other (plan §1.6).
  function snapshot() {
    const all = rows();
    const out = new Array(all.length);
    for (let i = 0; i < all.length; i++) {
      const r = all[i], a = new Array(TELEMETRY_FIELDS.length);
      for (let k = 0; k < TELEMETRY_FIELDS.length; k++) a[k] = r[TELEMETRY_FIELDS[k]];
      out[i] = a;
    }
    return { rows: out, wrapped };
  }

  // Replaces the ring with a snapshot()'s rows. ⛔ ALL OR NOTHING: anything that
  // is not that shape, or ANY row whose length is not TELEMETRY_FIELDS.length,
  // leaves the ring empty — a stale column list exports as nothing rather than
  // as a column of "undefined" (GDD 15.6). Does not touch the capture switch.
  // Returns the rows held.
  function restore(data) {
    clear();
    if (data === null || typeof data !== "object" || !Array.isArray(data.rows)) return 0;
    const src = data.rows;
    for (let i = 0; i < src.length; i++) {
      if (!Array.isArray(src[i]) || src[i].length !== TELEMETRY_FIELDS.length) return 0;
    }
    const from = Math.max(0, src.length - C.TELEMETRY_CAP);
    for (let i = from; i < src.length; i++) {
      const row = {};
      for (let k = 0; k < TELEMETRY_FIELDS.length; k++) row[TELEMETRY_FIELDS[k]] = src[i][k];
      ring[head] = row;
      head = (head + 1) % C.TELEMETRY_CAP;
      count++;
    }
    wrapped = data.wrapped === true || from > 0;
    return count;
  }

  return {
    fields: TELEMETRY_FIELDS,
    kinds: TELEMETRY_KINDS,
    enabled, setEnabled, toggle,
    sample, push, rows, clear, csv, exportCsv, snapshot, restore,
    get count() { return count; },
    get wrapped() { return wrapped; },
  };
})();

// 22-meta.js — profiles, scores, leaderboard wiring (GDD 15). CS008 P3 landed
// the record Start Depth's list is built from (GDD 4.6); CS011 P1 lands the
// store and the profile.
//
// ⛔ THIS FILE IS THE GAME'S ONLY ROUTE TO STORAGE. kit-storage (inlined at
// build from lib/) owns the keyspace, and the game never builds a key string:
// `Store` declares every key, and `Profiles.scope()` is the active profile's
// store (CLAUDE.md, Save data). ⛔ The game never enumerates storage — no call to
// a store's keys(), scopes(), clear() or usage().
//
// WHAT A PROFILE KEEPS (CS011 P2): `settings` (23-main.js's CONTROLS, KEYBOARD,
// GAMEPAD and sound rows), `progress` (the Start Depth record, ⛔ v2 and PER MODE
// since CS012 P3), `telemetry` (the ring's rows) and, since CS015 P1,
// `achievements` (the unlock store, GDD 15.5). ⛔ The telemetry capture switch is
// never stored.
//
// THE RUN AND THE LOCAL TOP 10 (CS011 P3): `scores` (root), written through

//

// ---------------------------------------------------------------------------
// THE STORE AND THE PROFILE (GDD 15.1, 15.2). CS011 P1.
// ---------------------------------------------------------------------------
//
// ⛔ BOTH ARE MADE IN Meta.boot(), never at evaluation, so evaluating the script
// touches no storage. Before boot `Store` is null.
//
// ⛔ `achievements` IS DECLARED SINCE CS015 P1, v1 and per profile (GDD 15.5).
// kit-profile declares its own root `profiles` key.
let Store = null;

// The local top 10 (GDD 15.3), made in Meta.boot() over the ROOT store: one
// table on the machine, every row stamped with the profile that set it.
let Scores = null;

// The unlock store (GDD 15.5), made in Meta.boot() over the ACTIVE PROFILE's
// scope, read through callbacks so a profile switch needs no hook. CS015 P1.
let Achievements = null;

// The game's wrapper over kit-profile: the active profile and its store (P1), and
// the roster operations the PROFILE screens call (CS011 P4).
const Profiles = (function () {
  let kit = null;
  // ⛔ THE DECLARED PER-PROFILE KEYS, which a delete removes BY NAME (plan R12).
  // Never `scores` or `profiles`: those are root keys, and `p0`'s scope IS the
  // root store. ⛔ `achievements` joined at CS015 P1 — a profile's unlocks go
  // with the profile.
  const OWN_KEYS = ["settings", "progress", "telemetry", "achievements"];
  return {
    // kit-profile's rename notice and kit-names' length, for NAME (R13, R14).
    NAME_CHANGE_NOTICE: KitProfile.NAME_CHANGE_NOTICE,
    MAX_NAME_LENGTH: KitNames.MAX_NAME_LENGTH,
    attach(instance) { kit = instance; },
    // The active profile's store. ⛔ Profile `p0`'s is the ROOT store, beside
    // `scores` and `profiles` (kit-profile's scope rule).
    scope() { return kit.scope(); },
    // ⛔ THE ONE SWITCH (plan R11). kit-profile fires `beforeChange` and `change`
    // around it, and Meta's handler resets to shipped defaults BEFORE it loads.
    // A new profile is selected through it (CS011 P4), and remove() below
    // switches through it when the active profile goes.
    select(id) { return kit.select(id); },
    // { id, name, playerId } — mints the playerId if it is absent (kit-profile).
    current() { return kit.current(); },
    // { playerId, displayName } for kit-leaderboard's getPlayer (CS011 P5).
    player() { return kit.player(); },
    list() { return kit.list(); },
    // { ok, profile, reason } and { ok, reason }. Validation is kit-names', through
    // kit-profile, and nothing else (R13). Neither selects.
    create(name) { return kit.create(name); },
    rename(id, name) { return kit.rename(id, name); },
    // ⛔ DELETE (plan R12): kit-profile's remove(), THEN the profile's keys, one
    // remove(key) each. ⛔ NEVER clear(): it enumerates storage, and on `p0` it
    // takes `scores` and `profiles` with it.
    // ⚠ THE KIT GOES FIRST, the reverse of R12's wording (log/CS011.md, P4). It
    // refuses the last profile, and a refused delete must leave that profile's
    // data where it was. Removing the ACTIVE profile switches inside the kit, and
    // `beforeChange` writes the outgoing telemetry rows (P2), so the keys go
    // after that write. kit-profile's scope(id) still answers for a removed id.
    remove(id) {
      const r = kit.remove(id);
      if (r.ok) {
        const scope = kit.scope(id);
        for (const key of OWN_KEYS) scope.remove(key);
      }
      return r;
    },
  };
})();

// ---------------------------------------------------------------------------
// THE ONLINE BOARD — Leaderboard (GDD 15.4; plan R19). CS011 P5.
// ---------------------------------------------------------------------------
//
// ⛔ THE ONLY READER OF window.KitLeaderboard, and EVERY METHOD IS A NO-OP
// WITHOUT IT (CLAUDE.md, Leaderboard). The module arrives through the shell's
// ES-module bridge, which is async and fails on file:// by design, so the kit
// clients are made LAZILY, on the first call that finds the global, and a call
// before that finds nothing and does nothing. A create() that throws is not
// retried, per client. ⛔ Nothing here throws into the game: the kit's submit()
// never rejects, and its promise is still caught.
//
// ⛔ ONE CLIENT PER MODE, ONE BOARD EACH (CS012 P3, O11, R8). The Worker keeps a
// player's best row per game id and has no per-mode boards, so an Overdrive run
// posting to `vector-vortex` would compete with that player's Classic best.
// beginRun() and submit() route by state.mode; load() takes the mode SCORES is
// showing; queueLength() sums both queues (the kit keys its offline queue
// coinless.lb.<gameId>.v1, so the two never share one). ⛔ C.GAME_ID is NOT a
// board id: it is kit-storage's keyspace (boot() below).
//
// ⛔ The submit reads `state` at the run's end and writes none. Its stats are
// exactly the Worker registry's seven keys for the run's board (coinless-kit
// `services/leaderboard/src/registry.js`, the same seven for both ids): an
// unknown key flags the row (test-cs012-p3.js reads that file, never a copied
// list).
const Leaderboard = (function () {
  // ⛔ THE MODES IN C's KEY ORDER, which is the order the clients are made in:
  // Classic first (test-cs011-p5.js reads creates[0] as Classic's).
  const MODES = Object.keys(C.LEADERBOARD_GAME_IDS);
  const clients = {};
  const broken = {};
  for (const m of MODES) { clients[m] = null; broken[m] = false; }
  // ⛔ THE STALE-RESPONSE TOKEN: a board that answers after a newer load() began
  // is dropped. One token across both boards — only one load is ever shown.
  let token = 0;

  // Makes every client that is neither made nor broken, in MODES order.
  function make() {
    const kit = window.KitLeaderboard;
    if (!kit || typeof kit.create !== "function") return;
    for (const mode of MODES) {
      if (clients[mode] !== null || broken[mode]) continue;
      try {
        clients[mode] = kit.create({
          endpoint: C.LEADERBOARD_ENDPOINT,
          gameId: C.LEADERBOARD_GAME_IDS[mode],
          gameVersion: C.GAME_VERSION,
          // A callback, never a value: a switch or a rename is read at submit time.
          getPlayer: () => Profiles.player(),
        });
      } catch (e) {
        broken[mode] = true;
        clients[mode] = null;
      }
    }
  }

  // The client for one mode, or null. An unknown mode is null and never throws.
  function instance(mode) {
    if (!Object.prototype.hasOwnProperty.call(clients, mode)) return null;
    if (clients[mode] === null && !broken[mode]) make();
    return clients[mode];
  }

  // Plan R9's payload, on the run's own board. `durationS` is simulation seconds,
  // pause excluded, and an integer as the Worker demands. ⛔ `max_combo` is the
  // run's PEAK MULTIPLIER, state.combo.peak (GDD 14.4; CS012 P4, R7) — 5.5
  // rather than 11 kills, and 0 on a Classic run, which is what every Classic
  // row posted before this phase carries.
  function payload(outcome) {
    return {
      metric: state.score,
      durationS: Math.round(state.time),
      outcome,
      stats: {
        level_reached: state.level,
        mode: state.mode,
        start_depth: state.startDepth,
        wells_cleared: state.tally.wellsCleared,
        purges_spent: state.tally.purgesSpent,
        max_combo: state.combo.peak,
        deaths: state.tally.deaths,
      },
    };
  }

  return {
    // Whether the module loaded: SCORES' VIEW row exists only then. True as soon
    // as ANY board's client was made — the module is the thing being asked about.
    present() {
      make();
      return MODES.some(m => clients[m] !== null);
    },
    // Meta.runStarted(): the run id is minted at the START (the kit's
    // idempotency key), on the run's own board.
    beginRun() {
      const lb = instance(state.mode);
      if (lb === null) return;
      try { lb.beginRun(); } catch (e) { /* no run id: the Worker refuses this run's submit */ }
    },
    // Meta.runEnded(), when the run was eligible. ⛔ The run's mode picks the
    // board: an Overdrive run never reaches Classic's.
    submit(outcome) {
      const lb = instance(state.mode);
      if (lb === null) return;
      try {
        const p = lb.submit(payload(outcome));
        if (p && typeof p.catch === "function") p.catch(() => {});
      } catch (e) { /* absence of a board is the normal path */ }
    },
    // The kit's offline queue, for the title's line: ⛔ BOTH BOARDS SUMMED, so a
    // queued Overdrive row is counted. 0 without the module.
    queueLength() {
      let total = 0;
      for (const mode of MODES) {
        const lb = instance(mode);
        if (lb === null) continue;
        try {
          const n = lb.queueLength();
          if (Number.isInteger(n) && n > 0) total += n;
        } catch (e) { /* a board that cannot count queues nothing */ }
      }
      return total;
    },
    // The ONLINE view: done(board) with { entries: [...] }, or done(null) when
    // the board could not be reached. ⛔ Only the NEWEST load answers, whichever
    // mode it was for. Without the module, done is never called.
    load(mode, done) {
      const lb = instance(mode);
      const t = ++token;
      if (lb === null) return;
      const answer = b => { if (t === token) done(b); };
      let p;
      try {
        p = lb.fetchBoard({ window: "all", limit: C.LEADERBOARD_BOARD_LIMIT });
      } catch (e) { answer(null); return; }
      Promise.resolve(p).then(
        b => answer(b !== null && typeof b === "object" && Array.isArray(b.entries) ? b : null),
        () => answer(null));
    },
  };
})();

const Meta = (function () {
  let booted = false;

  // 23-main.js's three settings callbacks, handed over at boot (plan R11):
  // resetSettings() (the shipped defaults, ⛔ writing nothing), applySettings(data)
  // (each VALID field of a stored `settings`, leaving the rest as they are) and
  // settingsSnapshot() (what `settings` stores).
  let hooks = null;

  // ⛔ RESET, THEN LOAD (CLAUDE.md, Save data). applySettings() skips a missing or
  // invalid field, so a field the incoming profile never stored keeps whatever
  // the runtime holds: the reset is what makes that the shipped default rather
  // than the outgoing profile's value (test-cs011-p2.js's mutation).
  function activateSettings() {
    hooks.resetSettings();
    hooks.applySettings(Profiles.scope().get("settings", null));
  }

  // ⛔ ON EVERY CHANGE (plan R10): an adjust step that moved a value, a toggle, a
  // capture that bound, RESET TO DEFAULTS. Never from Game.reset().
  function saveSettings() {
    if (!booted) return;
    Profiles.scope().set("settings", hooks.settingsSnapshot());
  }

  // ⛔ TELEMETRY IS WRITTEN ONLY WHILE CAPTURE IS ON OR ROWS EXIST (plan R17), and
  // only at its seats: capture turned off, autoPause, before a profile switch,
  // and a run's end. ⛔ NEVER ON A TIMER AND NEVER INSIDE A PLAY STEP: a full
  // ring costs a frame to stringify (plan §1.6). The callers own that second
  // rule; this function cannot see the step.
  function saveTelemetry() {
    if (!booted) return;
    if (!Telemetry.enabled() && Telemetry.count === 0) return;
    Profiles.scope().set("telemetry", Telemetry.snapshot());
  }

  // Read when capture turns on with an empty ring, and when EXPORT finds the ring
  // empty. A stored envelope of another version, or a row of the wrong length,
  // restores empty (GDD 15.6).
  function loadTelemetry() {
    if (!booted) return;
    Telemetry.restore(Profiles.scope().get("telemetry", null));
  }

  // ---- the run (plan R6, R7, R8; CS011 P3) ----
  //
  // ⛔ NOT IN `state` (R6): startGame() rewrites it, and the record of a run has
  // to outlive exactly that. ⛔ META WRITES NO `state`, SPENDS NO DRAW AND DRAWS
  // NOTHING; it reads `state` at the run's end and, since CS015 P2, at the
  // clear edge's achievement seat, and nowhere else.
  //
  // `run` is null when no run is open, else { bench } — whether a debug bench
  // action reached it in play. `placed` is the rank the last ended run took in
  // the local table, 0 for none, kept for game over's line.
  let run = null;
  let placed = 0;

  // startGame()'s last line. ⛔ A run still open is DROPPED, unrecorded: a
  // second startGame() over a live run (the soaks' restarts) ends nothing.
  function runStarted() {
    run = { bench: false };
    placed = 0;
    Leaderboard.beginRun();
  }

  // runAction(), for a bench digit, `spawnRow` or `cycleWell` in play (R8).
  function benchUsed() {
    if (run !== null) run.bench = true;
  }

  // ⛔ THE ONE GATE (CLAUDE.md, Leaderboard): the local table's check, from P5
  // every submit, and from CS015 P2 every achievement evaluation. Extend all
  // three together or none.
  function eligible() {
    return run !== null && !run.bench;
  }

  function runOpen() { return run !== null; }

  // ---- the achievement facts and seats (CS015 P2; plan A2, A3, A4, A9) ----
  //
  // ⛔ ONE FLAT OBJECT, BUILT AT THE SEAT (A2-A): `state`'s readable facts plus
  // the run's `tally`, by name — what C.ACHIEVEMENTS' rows name as `fact`. The
  // module reads no `state`; this is where the game hands it over. ⛔ Every
  // value is the RUN's: `tally` is re-minted by startGame(). A fact a row names
  // that is not here is a SKIP in evaluate(), never a throw.
  // ⚠ The two masks go over as bit COUNTS: distinct wells seen, token kinds.
  function bitCount(n) {
    let c = 0;
    for (let v = n >>> 0; v !== 0; v >>>= 1) c += v & 1;
    return c;
  }
  function facts() {
    const t = state.tally;
    return {
      mode: state.mode,
      level: state.level, score: state.score, startDepth: state.startDepth,
      lives: state.lives, comboPeak: state.combo.peak,
      wellsCleared: t.wellsCleared, kills: t.kills, deaths: t.deaths,
      divesCompleted: t.divesCompleted, thornDeaths: t.thornDeaths,
      purgesSpent: t.purgesSpent, shotsFired: t.shotsFired,
      thornChips: t.thornChips, deathlessWells: t.deathlessWells,
      purgeSavedClears: t.purgeSavedClears, openWellsCleared: t.openWellsCleared,
      wellsSeen: bitCount(t.wellsSeenMask), extraLives: t.extraLives,
      rimSweepKills: t.rimSweepKills, jumpKills: t.jumpKills,
      mimicKills: t.mimicKills, carrierSplits: t.carrierSplits,
      ringsTaken: t.ringsTaken, ringSetsTaken: t.ringSetsTaken,
      tokenKinds: bitCount(t.tokenKindsMask),
    };
  }

  // ⛔ THE CLEAR-EDGE SEAT (A3-A), from Game.update()'s edge, after the bonuses
  // and noteCleared(). A PLAY step: evaluate() reads the store and writes it
  // ONLY when something unlocked. ⛔ THE ONE GATE (A4-A) — a bench run earns
  // nothing. ⛔ AN UNLOCK IS WORTH NOTHING (A9-A): no addScore(), no life.
  // Returns the payload (A11), which nothing posts (GDD 15.5, local-only).
  function clearEdge() {
    if (!booted || !eligible()) return null;
    return Achievements.evaluate(facts());
  }

  // R9's local row. The profile's name is the one it has NOW, stamped, so a
  // later rename or delete leaves the row as it was set.
  function scoreRow(outcome) {
    const p = Profiles.current();
    return {
      score: state.score, level: state.level, startDepth: state.startDepth,
      wells: state.tally.wellsCleared, deaths: state.tally.deaths,
      durationS: Math.round(state.time), outcome, ts: Date.now(),
      profileId: p ? p.id : null, profileName: p ? p.name : null, build: C.GAME_VERSION,
    };
  }

  // ⛔ THE RUN'S END, FROM TWO SEATS AND NO THIRD (plan R7): 'quit' at the top of
  // quitToTitle() when the screen is pause, and 'died' in frame() after the
  // steps. ⛔ NEVER FROM killSkimmer(): a clear on the step that spends the last
  // life pays after it returns (GDD 7), and a Dive death returns from update()
  // early, so only the frame knows the final score. It closes the run first, so
  // a second call records nothing; then the row, if eligible and placed; the
  // submit, if eligible (P5); the achievements, if eligible (CS015 P2); then the
  // telemetry write (P2's).
  function runEnded(outcome) {
    if (run === null) return;
    const ok = eligible();
    run = null;
    if (booted && ok && Scores.qualifies(state.mode, state.score)) {
      placed = Scores.add(state.mode, scoreRow(outcome));
    }
    // ⛔ THE SAME GATE, READ ONCE (CLAUDE.md, Leaderboard): every eligible run end
    // submits, 'died' and 'quit' (Paul's M6), placed locally or not.
    if (ok) Leaderboard.submit(outcome);
    // ⛔ THE RUN-END SEAT (CS015 P2, A3-A): `ok`, THE LOCAL, never eligible() —
    // `run` is already null here, so eligible() reads false for every run.
    if (booted && ok) Achievements.evaluate(facts());
    saveTelemetry();
  }

  // What the SCORES screen lists; [] before boot.
  function scores(mode) { return booted ? Scores.list(mode) : []; }
  function lastPlace() { return placed; }

  // kit-profile's events. `beforeChange` still names the OUTGOING profile, so its
  // rows go to that profile's store. `change` names the INCOMING one: the reset,
  // then its settings. The ring belongs to the profile that recorded it, so it
  // is emptied too, and refilled from the incoming profile while capture is on
  // (the same read a capture turned on with an empty ring makes).
  function onProfileEvent(name, detail) {
    if (name === "beforeChange") saveTelemetry();
    if (name === "change") {
      activateSettings();
      Telemetry.clear();
      if (Telemetry.enabled()) loadTelemetry();
    }
  }

  function boot(settingsHooks) {
    if (booted) return;
    booted = true;
    hooks = settingsHooks;
    Store = KitStorage.create({
      gameId: C.GAME_ID,
      keys: {
        settings:  { version: 1 },
        // ⛔ v2 IS PER MODE (CS012 P3, O12): { classic, overdrive }, so an
        // Overdrive clear never unlocks a Classic start. ⛔ A shape change bumps
        // the VERSION and supplies a migrate, never a new key name (CLAUDE.md,
        // Save data) — a rename would drop every player's record.
        progress:  { version: 2, migrate: migrateProgress },
        // ⛔ BUMP THIS WITH TELEMETRY_FIELDS (21-telemetry.js): the stored rows are
        // arrays in that order, and an envelope of another version reads empty.
        telemetry: { version: 1 },
        scores:    { version: 1 },
        // ⛔ v1, AND A NEW KEY NEEDS NO migrate (CS015 P1, A6): there is no
        // origin version to read, and 20-achievements.js loads
        // known-value-else-default per field. ⛔ A later SHAPE change bumps
        // this version and supplies one — never a new key name.
        achievements: { version: 1 },
      },
    });
    // ⛔ `modes` are state.mode's two values. Both lists are shown from CS012 P3,
    // where SCORES gained its MODE row; `overdrive` was already kept apart here.
    Scores = createScores({ store: Store, key: "scores", perMode: C.SCORES_PER_MODE,
                            modes: ["classic", "overdrive"] });
    // ⛔ THE BOUNDARY, AND createScores' SEAM (CS015 P1, A12): the definition
    // table crosses as DATA and the store as two callbacks, so
    // 20-achievements.js names no config, no game object and no global. ⛔ The
    // callbacks read Profiles.scope() AT CALL TIME and the module caches
    // nothing, so a profile switch is picked up with no hook. ⛔ `now` is the
    // injected clock: the module never reads the platform's, which is what lets
    // a test drive a week roll (plan A7, §1.5).
    Achievements = createAchievements({
      defs: C.ACHIEVEMENTS,
      load: () => Profiles.scope().get("achievements", null),
      save: value => Profiles.scope().set("achievements", value),
      now: () => Date.now(),
    });
    // ⛔ legacyRosterKey is `null`, NEVER '': kit-profile reads an empty string
    // as "use the default" and imports Orbital Overhaul's roster (plan R4).
    const kit = KitProfile.create({
      storage: Store,
      maxProfiles: C.PROFILE_MAX,
      legacyRosterKey: null,
      legacyProbeKeys: [],
      anonymousName: C.PROFILE_ANONYMOUS_NAME,
      onEvent: onProfileEvent,
    });
    Profiles.attach(kit);
    // THE SILENT FIRST LAUNCH (Paul's M2): one ANONYMOUS profile, and the title as
    // before. ⛔ createAnonymous() does not select, so select() follows it.
    // ⚠ select() of the id boot already points at is kit-profile's no-op, so the
    // playerId is minted by current() (log/CS011.md, P1).
    if (kit.firstBoot) {
      const made = kit.createAnonymous();
      if (made.ok) kit.select(made.profile.id);
      kit.current();
    }
    // The selected profile's settings, over the evaluation-time defaults.
    activateSettings();
  }

  return {
    boot, saveSettings, saveTelemetry, loadTelemetry,
    runStarted, benchUsed, eligible, runOpen, runEnded, scores, lastPlace,
    clearEdge,
  };
})();

// ---------------------------------------------------------------------------
// THE LOCAL TOP 10 — createScores() (GDD 15.3; plan R20). CS011 P3.
// ---------------------------------------------------------------------------
//
// ⛔ KIT-SHAPED FROM ITS FIRST COMMIT: the future kit-scores
// (src/22-meta.NOTES.md). It reads no `C`, no `state` and no game global.
// Everything crosses as an option: `store` (anything with get(key, fallback)
// and set(key, value), a kit-storage store here), `key` (declared by the
// caller), `perMode` (rows kept per mode) and `modes` (the mode names).
//
// One stored value, { <mode>: [row, …] }, each list best first. A row is the
// caller's object, copied; the table reads only its `score`. ⛔ A ROW PLACES
// WITH score > 0 AND A PLACE IN ITS MODE'S TOP perMode, AND A TIE GOES BELOW
// the rows already there. The stored value is read on every call and loads
// known-value-else-default: a mode that is not an array reads empty, and a row
// without a finite score > 0 is dropped. An undeclared mode throws, as an
// undeclared kit-storage key does.
function createScores(options) {
  const opts = options || {};
  const { store, key, perMode, modes } = opts;
  if (!store || typeof store.get !== "function" || typeof store.set !== "function") {
    throw new Error("createScores: options.store needs get() and set()");
  }
  if (typeof key !== "string" || key === "") throw new Error("createScores: options.key must be a non-empty string");
  if (!Number.isInteger(perMode) || perMode < 1) throw new Error("createScores: options.perMode must be a whole number >= 1");
