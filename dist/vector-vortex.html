// ALREADY EXIST (GDD 6.5). There is no extra field, and there is no branch for
// it in the collision pass. That is the return the contract was designed to pay.
//
// ⛔ THE DISCHARGE IS killDepth MUTATED TO 0, AND RESTORED ON THE WAY OUT.
// collideSkimmer() is `e.depth >= e.killDepth` plus a lane match
// (09-collision.js). With killDepth = 0 the depth test is unconditionally true,
// so the only remaining term is laneHit() — which is EXACTLY GDD 4.5 item 3,
// "being in a Surger's lane when it discharges". Game.update() runs the entity
// pass BEFORE the collision pass, so a Surger that enters the discharge on step
// n is lethal on step n; there is no one-step lag to compensate for.
//
// ⚠ NOTE THE ASYMMETRY WITH THE DRIFTER, BECAUSE IT IS THE SAME NUMBER MEANING
// TWO DIFFERENT THINGS. CS005 P2 corrected two shipped comments that predicted
// killDepth = 0 for the Drifter, and this class ships the value they predicted.
// Both are right. On the Drifter zero would be a PERMANENT property of a
// climbing enemy — lethal from the throat on its spawn step, having travelled
// nowhere, which is the unaccountable death GDD 6.3's ⛔ exists to prevent. Here
// it is a C.SURGE_DISCHARGE window the player was given a C.SURGE_TELEGRAPH
// fuse to walk out of. A permanent kill zone is not a discharge.
//
// ⛔ AND THE FUSE IS THE FAIRNESS (GDD 6.3). The lane is NEVER lethal during the
// telegraph — killDepth stays on the rim band for the whole of it. A fuse that
// kills is not a fuse, and that sentence is the whole of that section's rule.
//
// THE CYCLE, and a player watching one should be able to name it — it climbs,
// its lane arms from the throat up, the lane goes live, it climbs again:
//
//   climb      depth rises at SURGE_CLIMB. surgeTimer counts UP toward
//              surgeInterval().  killDepth = the rim band.
//   telegraph  C.SURGE_TELEGRAPH. The fuse grows throat -> rim in the lane
//              (14-render-entities.js).  ⛔ killDepth = STILL the rim band.
//   discharge  C.SURGE_DISCHARGE. ⛔ killDepth = 0; the whole lane is live.
//   climb      …
//
// ⛔ IT STARTS IN climb WITH surgeTimer = 0 AND CAN NEVER DISCHARGE ON ITS FIRST
// STEP, from any spawn depth. A Surger that arrived already discharging is the
// same unaccountable death as a Drifter with a zero killDepth, and it is also
// what keeps test-cs004-p1.js's spawnRow case green — that case drives one
// G.update(DT) over a freshly spawned row with a Surger in it.
//
// ⛔ ONE LANE, NEVER HOPS. It touches no lane helper; `lane` is written once, by
// the constructor. That is the Carrier's and the Weaver's absence of code, and
// it is what lets CS005 P5's soak give this entity the STRONG lane assertion —
// Object.is equality with its spawn lane — rather than a per-step speed bound.
//
// ⛔ THE PHASE IS THE WHOLE STATE MACHINE and the timer counts UP (GDD 16.3).
// There is no second flag saying whether the lane is live: `killDepth` is
// derived from the phase at each transition and nowhere else.
class Surger extends Enemy {
  // `dir` is ignored — a Surger never hops. The spawner still spends its draw
  // on one (08-spawner.js), which is what keeps the run's ONE stream aligned
  // regardless of which kind came out of the throat.
  constructor(lane, depth) {
    super(lane, depth);
    this.sfxVoice = "surger";   // the kill sound's pitch key (A9)

    // ⛔ THE RIM BAND, and it is the value this field spends most of its life
    // holding — the same expression the Vaulter, the Carrier, the bolt and the
    // Drifter use, so retuning C.RIM_CONTACT_DEPTH moves every rim-contact
    // entity together. The discharge REPLACES it for C.SURGE_DISCHARGE and puts
    // it back; see setPhase() below, which is the only writer.
    //
    // ⚠ SO THE SURGER KILLS BY TWO OF GDD 4.5's FIVE CONDITIONS, and it is the
    // only entity in the roster that does. Item 3 is the discharge; item 1 —
    // "an enemy reaching the rim in your lane and making contact" — is this
    // resting value, which it carries exactly as the Vaulter does. A Surger
    // that gets to the rim is dangerous for the ordinary reason as well as for
    // its own; there is nothing to add for that, which is the point of a field.
    this.killDepth = 1 - C.RIM_CONTACT_DEPTH;

    // "climb" | "telegraph" | "discharge". ⛔ Born in climb — see the header.
    this.phase = "climb";

    // ⛔ Counts UP, and it is RESET AT EVERY TRANSITION rather than compared
    // against a running total (GDD 16.3 — no countdown clocks in this build).
    // One timer for three phases is what makes "the phase decides what the
    // number means" true; a per-phase timer would be three things to keep in
    // step for no reader's benefit.
    this.surgeTimer = 0;
  }

  // ⛔ THE ONE WRITER OF BOTH `phase` AND `killDepth`, which is the only reason
  // the two can never disagree. A discharge that ended without restoring the
  // band would leave a permanently lane-lethal enemy on the board and nothing
  // downstream could tell it from a bug in the collision pass.
  setPhase(phase) {
    this.phase = phase;
    this.surgeTimer = 0;
    this.killDepth = phase === "discharge" ? 0 : 1 - C.RIM_CONTACT_DEPTH;
    if (phase === "discharge") sfx("surgeDischarge");
  }

  // How far the fuse has grown, as 0..1 of the lane, or 0 when the lane is not
  // arming. The draw path's one input (14-render-entities.js) and a phase read
  // rather than a fourth field.
  chargeTip() {
    if (this.phase === "discharge") return 1;
    if (this.phase !== "telegraph") return 0;
    const t = this.surgeTimer / C.SURGE_TELEGRAPH;
    return t > 1 ? 1 : t;
  }

  // `well` and `state` are unused: a Surger has no topology and no AI. The
  // signature is the contract's (GDD 6.5), not this entity's.
  update(dt, well, state) {
    this.surgeTimer += dt;

    if (this.phase === "climb") {
      // ⛔ Monotonic, and it STOPS AT THE KILL BAND, `1 - C.RIM_CONTACT_DEPTH`
      // — the Vaulter's rule for the Vaulter's reason (CS008 P1). ⛔ The
      // expression and NEVER `this.killDepth`: setPhase() writes that to 0 for
      // the discharge, and a climb clamped to it would park a Surger at the
      // throat.
      //
      // ⛔ AND IT RISES IN THIS PHASE ONLY. The Drifter is the entity whose
      // climb runs in every phase, and it needs that because riding is
      // unshootable and a parked unshootable entity is a concurrency squatter.
      // A Surger is shootable in all three phases, so nothing forces it, and
      // the pause is worth having: the bar stops moving at the instant its lane
      // starts arming, which is a fourth channel on GDD 6.3's fuse for free.
      const park = 1 - C.RIM_CONTACT_DEPTH;
      if (this.depth < park) {
        this.depth += C.SURGE_CLIMB * climbMult() * dt;
        if (this.depth > park) this.depth = park;
      }
      if (this.surgeTimer >= surgeInterval()) this.setPhase("telegraph");
      return;
    }

    if (this.phase === "telegraph") {
      // ⛔ NOTHING ELSE HAPPENS HERE, AND THAT IS THE FEATURE. killDepth is
      // untouched, so the lane is exactly as lethal as it was a step ago: the
      // rim band, like every other climbing enemy. The fuse is a drawing.
      if (this.surgeTimer >= C.SURGE_TELEGRAPH) this.setPhase("discharge");
      return;
    }

    // discharge — killDepth is 0 for this window and the whole lane is lethal.
    // ⛔ The restore is unconditional and it happens BEFORE the collision pass
    // of the step that ends the window, so the discharge is exactly
    // C.SURGE_DISCHARGE of lethal steps and not one more.
    if (this.surgeTimer >= C.SURGE_DISCHARGE) this.setPhase("climb");
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2). The silhouette AND the lane fuse
  // live in 14-render-entities.js; the entity hands over its phase as a single
  // 0..1 tip plus whether the lane is live, so the two states can never drift
  // apart from the two behaviours.
  draw(ctx, well) {
    drawSurger(ctx, well, this.lane, this.depth, this.chargeTip(), this.phase === "discharge");
  }

  // Any shot kills it and the shot is spent (GDD 6.1). ⛔ IN EVERY PHASE, THE
  // DISCHARGE INCLUDED: the lane being live is a threat to the player standing
  // in it, never armour for the thing making it. The answer to a Surger is to
  // shoot it, and the fuse is the window the player is given to decide whether
  // to shoot or to leave.
  onShot(shot) {
    this.dead = true;
    return true;
  }

  points() { return C.PTS_SURGER; }
}

// ==========================================================================
// 07-enemies-overdrive.js
// ==========================================================================
// 07-enemies-overdrive.js — OVERDRIVE'S ROSTER (GDD 6.4, 13, 14.6). CS012 P2
// ships the Reaver; CS013 adds the Warden and the Mimic.
//
// ⛔ THE CONTRACT IS 07-enemies.js's, AND IT IS READ THERE FIRST. The eight
// fields, the four methods, the one array, the one spawn entry point and the
// wiring points (GDD 6.5) are written down in that file's base class and are not
// repeated here. Every class below states its eight answers as plan §9 did.
//
// ⛔ WHY A SECOND FILE (Paul's O15). 07-enemies.js was 71 KB, 65 % comment, at
// CS012's plan, and the seam falls where the roster does: Classic there,
// Overdrive here. Nothing moved out of it. build.js's MANIFEST concatenates this
// module directly after that one, because the classes here extend classes
// there, and before 08-spawner.js, whose ENEMY_KINDS names them.
//
// ⛔ AN OVERDRIVE ENEMY REACHES THE BOARD ONLY THROUGH C.SPAWN_SCHEDULE_OVERDRIVE
// (08-spawner.js's eligibleKinds), so a Classic run never releases one. There
// is no bench key for any of them (O16).

// ---------------------------------------------------------------------------
// The Reaver (GDD 14.6) — "Vaulter at 1.6x that vaults toward the Skimmer".
// Overdrive L6+, 300 points. Killed by any shot or the Purge; kills by contact
// at the rim.
// ---------------------------------------------------------------------------
//
// ⛔ A PARAMETER VARIANT OF THE VAULTER, AND THAT IS WHY IT SUBCLASSES ONE (R9).
// It overrides two readers and a rate and inherits everything else: the climb,
// the park depth, the rim hunt, laneHop()'s fold at an open well's wall, onShot
// and the eight fields. ⛔ This is not the slope 07-enemies.js's base warns
// about: `Enemy` still carries no behaviour; a variant inheriting its parent's
// is what GDD 14.6 describes.
//
// ⛔ WHAT 1.6x SCALES (Paul's O1): THE HOP, NEVER THE CLIMB. The hop duration and
// both hop intervals are divided by C.REAVER_HOP_RATE. The climb is the
// Vaulter's own `C.VAULT_CLIMB * climbMult()`, because a Reaver that CLIMBED at
// 1.6x would breach GDD 4.4's respawn guarantee from level 1 (MEASURED,
// PLANNED-FEATURES-CS012.md §1.1). Heat scales the intervals through the
// Vaulter's accessors and never the hop duration (H2).
//
// ⛔ "VAULTS TOWARD THE SKIMMER" (O1's reading): every MID-CLIMB hop takes
// huntDir(), the rim hunt's direction, from its first update and with no level
// gate. It holds its lane while it is in the Skimmer's. At the rim it hunts
// exactly as a Vaulter does, at its own interval.
//
// The eight fields: (lane, depth) a position; `purgeable` true (GDD 4.3 exempts
// only the Thorn); `blocksClear` true, so it is never on the board at a clear
// and never a Dive survivor; `killDepth` the rim band `1 - C.RIM_CONTACT_DEPTH`;
// `anchored` false, so respawnSkimmer() pushes it to 0.55 and the guarantee
// holds because its climb is a Vaulter's; `sfxVoice` "reaver". It is not cargo
// (R16).
class Reaver extends Vaulter {
  constructor(lane, depth, dir) {
    super(lane, depth, dir);
    this.sfxVoice = "reaver";   // C.SFX_KILL_PITCH.reaver, from tools/sfx-lab.html
    this.hopRate = C.REAVER_HOP_RATE;
  }

  // ⛔ Toward the Skimmer at every mid-climb beat, and 0 (hold) in its lane.
  midClimbDir(well, state) {
    return this.huntDir(well, state);
  }

  // ⛔ The rate, and never heat.
  hopDuration() {
    return C.VAULT_HOP_TIME / this.hopRate;
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2), in 14-render-entities.js.
  draw(ctx, well) {
    drawReaver(ctx, well, this.lane, this.depth);
  }

  // GDD 7. The kill site pays it; the entity never scores itself.
  points() { return C.PTS_REAVER; }
}

// ---------------------------------------------------------------------------
// The Warden (GDD 6.4, 14.6, 4.5, 6.5) — "flies above the well, fires down,
// killable only by Jump". Overdrive L11+, 500 points. Killed by the JUMP and by
// nothing else; kills by discharging the rim of its own lane.
// ---------------------------------------------------------------------------
//
// ⛔ ALOFT IS A PHASE, NOT A DEPTH (W1, and it is CS012 P5's Jump rule pointed
// the other way). Its (lane, depth) is a lane and depth 1 — the rim's own
// depth, the only legal one it has — and the ninth contract field `aloft`
// (07-enemies.js) is what says it is ABOVE that rim rather than on it. The
// LIFT is draw-time only, exactly as the craft's is. ⛔ No site outside
// collideShots()'s skip and jumpStrike() knows any of this: the respawn push,
// the clear check, the danger read and the Dive all read it as an ordinary
// entity at depth 1.
//
// ⛔ THREE THINGS ARE EXPRESSED IN FIELDS THE CONTRACT ALREADY HAD, and that is
// the return GDD 6.5's contract was designed to pay:
//
//   "unshootable"        onShot() declines and never dies (W2, W4). While it
//                        CLIMBS a shot still reaches it — `aloft` is false —
//                        and flies on past it, so it shields its lane on the
//                        way up as a riding Drifter does. Aloft, the skip in
//                        collideShots() means a shot never even asks.
//   "fires down"         the discharge is `killDepth` mutated to the rim band
//                        and restored, the Surger's mechanism (GDD 6.1). Its
//                        depth IS 1, so `depth >= killDepth` is true and the
//                        only remaining term is laneHit() — GDD 4.5 item 1's
//                        comparison, paying out at a moment rather than a
//                        depth. ⛔ NO NEW COLLISION CODE for its kill.
//   "not purgeable"      GDD 4.3 reads the flag; purgeTarget() prefers the
//                        DEEPEST enemy, so a purgeable Warden sitting at depth
//                        1 would absorb every second Purge (MEASURED by
//                        reading, W4). "Only by Jump" means only by Jump.
//
// ⛔ ITS BODY NEVER KILLS ON THE WAY UP. `killDepth` is null for the whole
// climb, so it passes through the rim band harmlessly and the rim sweep never
// sees it either. The one window in which it is lethal is its own discharge,
// and the player is given WARDEN_TELEGRAPH of visible fuse — a beam creeping
// down its lane, and the Surger's charge tone — to leave or to jump.
//
// ⛔ THE FUSE AND THE STRIKE REUSE THE SURGER'S TWO SOUNDS (W6), and the fuse
// does it WITHOUT 19-sfx.js being edited: reconcileSurgeTones() is duck-typed
// on `phase === "telegraph"` plus a chargeTip(), so naming the phase and
// writing that reader IS the wiring. The meaning is the same sentence — "the
// rim of this lane is about to be lethal; leave or jump" — and so is the
// answer. ⚠ SETTLED (CLAUDE.md): the charge tone is a gameplay cue; this is a
// second entity it cues, not a change to it.
//
// The nine fields: (lane, depth) a position, depth 1 while aloft; `purgeable`
// false (W4); `blocksClear` true (W5), so a well with one standing does not
// clear and the player's answer is a jump; `killDepth` null but for the
// discharge; `anchored` false; `aloft` true from lift-off, false while
// climbing and again if pushed; `sfxVoice` "warden". It is not cargo.
class Warden extends Enemy {
  // `dir` is the initial heading, the Vaulter's convention: anything
  // non-negative, undefined included, is +1. It is only ever read through
  // laneHop() below, which writes the folded heading back (⛔ GDD 3.5).
  constructor(lane, depth, dir) {
    super(lane, depth);
    this.sfxVoice = "warden";   // C.SFX_KILL_PITCH.warden, from tools/sfx-lab.html

    // ⛔ "Killable only by Jump" — the Purge is not a Jump (W4).
    this.purgeable = false;
    // ⛔ A Warden you never answered holds the well open (W5). It then counts
    // against the concurrency ladder rather than adding pressure outside it.
    this.blocksClear = true;

    // "climb" | "hover" | "telegraph" | "discharge", written only by setPhase().
    // Born climbing, at the throat, with a zero clock: ⛔ it can never discharge
    // on its first step, from any spawn depth — the Surger's rule, for the
    // Surger's reason (GDD 6.1).
    this.phase = "climb";
    // ⛔ Counts UP and is RESET AT EVERY TRANSITION (GDD 16.3). One timer for
    // four phases is what makes "the phase decides what the number means" true.
    this.strikeTimer = 0;
    // Has it struck since this lift-off? ⛔ Cleared by setPhase("climb"), so
    // the first hover after EVERY lift-off is C.WARDEN_ARM — see hoverTime().
    this.struck = false;

    // The hunt, aloft. ⛔ The heading, kept in step with laneHop's returned dir
    // and never inferred from a lane comparison afterwards.
    this.dir = dir < 0 ? -1 : 1;
    // ⛔ Counts UP toward C.WARDEN_HOP_INTERVAL and HOLDS there, the Vaulter's
    // rule: a Warden already in the craft's lane takes its hop the moment that
    // stops being true, instead of waiting out a fresh interval.
    this.hopTimer = 0;
    this.hopping = false;
    this.hopTime = 0;     // counts up toward C.WARDEN_HOP_TIME
    this.hopFrom = this.lane;
    this.hopDelta = 0;    // signed lane distance of this hop, already short-way
  }

  // ⛔ THE ONE WRITER OF `phase`, `killDepth` AND `aloft`, which is the only
  // reason the three can never disagree — the Surger's setPhase() with the
  // ninth contract field folded into it. An unrestored band would leave a
  // permanently lane-lethal enemy hovering over the rim, and an unrestored
  // `aloft` would leave a climbing one that no shot could reach: two bugs
  // nothing downstream could tell from a bug in the collision pass.
  setPhase(phase) {
    this.phase = phase;
    this.strikeTimer = 0;
    this.aloft = phase !== "climb";
    this.killDepth = phase === "discharge" ? 1 - C.RIM_CONTACT_DEPTH : null;
    if (phase === "climb") this.struck = false;
    if (phase === "discharge") { this.struck = true; sfx("surgeDischarge"); }
  }

  // How long THIS hover lasts. ⛔ The first one after a lift-off is
  // C.WARDEN_ARM and every later one is C.WARDEN_HOVER: a Warden that arrived
  // over the rim an instant ago is not about to fire, and that beat is the one
  // the player gets to SEE it arrive (GDD 1.1 P2). ⛔ "After a LIFT-OFF", not
  // "per Warden" — a pushed one re-climbs and is armed afresh, which is the
  // slack W3's respawn arithmetic counts.
  hoverTime() {
    return this.struck ? C.WARDEN_HOVER : C.WARDEN_ARM;
  }

  // How far the fuse has run, as 0..1 of the lane, or 0 when the rim is not
  // arming. ⛔ THE SURGER'S READER, BY NAME AND BY SHAPE, because that is what
  // reconcileSurgeTones() (19-sfx.js) duck-types on: this method plus the phase
  // name "telegraph" is the whole of W6's shared charge tone. The draw path
  // reads the same number, so the sound and the beam can never disagree.
  chargeTip() {
    if (this.phase === "discharge") return 1;
    if (this.phase !== "telegraph") return 0;
    const t = this.strikeTimer / C.WARDEN_TELEGRAPH;
    return t > 1 ? 1 : t;
  }

  update(dt, well, state) {
    // ⛔ THE RESPAWN PUSH IS WHAT ENDS A LIFT-OFF, AND THE WARDEN LEARNS IT BY
    // READING ITS OWN DEPTH. respawnSkimmer() (23-main.js) clamps every
    // non-anchored entity above C.RESPAWN_PUSH_DEPTH down to it — this one
    // included, because `aloft` is a phase and not an exemption (GDD 4.4's
    // ⚠ SETTLED clamp). So a Warden below 1 is a Warden that is climbing again,
    // whatever it was doing a step ago, and setPhase() puts the whole contract
    // back: shootable-but-declining, contactless, and armed afresh.
    if (this.aloft && this.depth < 1) {
      this.landHop(well);
      this.setPhase("climb");
    }

    if (this.phase === "climb") {
      // ⛔ THROUGH THE ACCESSOR (CS007 P2, R6). climbMult()'s sixth call site,
      // and the only thing heat touches on this entity. ⛔ It does NOT stop at
      // the park depth the way a contact climber does: its killDepth is null,
      // so it passes the rim band harmlessly and keeps going to depth 1, which
      // is where it lifts off.
      this.depth += C.WARDEN_CLIMB * climbMult() * dt;
      if (this.depth >= 1) {
        this.depth = 1;
        this.setPhase("hover");
      }
      return;
    }

    this.strikeTimer += dt;

    // ⛔ IT HOLDS ITS LANE THROUGH THE FUSE AND THE STRIKE. The fuse is a
    // promise about one lane, and a Warden that drifted while it burned would
    // be a fuse for a lane it was leaving.
    if (this.phase === "telegraph") {
      if (this.strikeTimer >= C.WARDEN_TELEGRAPH) this.setPhase("discharge");
      return;
    }
    if (this.phase === "discharge") {
      // ⛔ The restore is unconditional and happens BEFORE the collision pass of
      // the step that ends the window, so the discharge is exactly
      // C.WARDEN_DISCHARGE of lethal steps and not one more.
      if (this.strikeTimer >= C.WARDEN_DISCHARGE) this.setPhase("hover");
      return;
    }

    // Hovering: it hunts along the rim, and its strike clock runs.
    if (this.hopTimer < C.WARDEN_HOP_INTERVAL) this.hopTimer += dt;
    if (this.hopping) {
      this.advanceHop(dt, well);
    } else if (this.hopTimer >= C.WARDEN_HOP_INTERVAL) {
      const dir = this.huntDir(well, state);
      if (dir !== 0) { this.hopTimer = 0; this.startHop(well, dir); }
    }

    // ⛔ A STRIKE NEVER BEGINS MID-HOP. `lane` is continuous through a crossing,
    // and at a half-integer BOTH neighbours are exactly C.HIT_LANE_TOL away —
    // so a discharge started there would cover two lanes, which is not "its own
    // lane". The clock HOLDS rather than restarting, so the strike lands on the
    // step the hop does.
    if (!this.hopping && this.strikeTimer >= this.hoverTime()) this.setPhase("telegraph");
  }

  // Which way the craft is, as -1 / 0 / +1. ⛔ laneDelta, never (a - b): the
  // Vaulter's header (07-enemies.js) carries the whole reason. 0 means no hop
  // this beat — no craft, a dead one, or it is already in the craft's lane.
  huntDir(well, state) {
    const target = state.skimmer;
    if (!target || target.dead) return 0;
    const d = laneDelta(well, this.lane, target.lane);
    return d > 0 ? 1 : (d < 0 ? -1 : 0);
  }

  // ⛔ THROUGH laneHop(), AND THE dir IT RETURNS IS WRITTEN BACK (GDD 3.5).
  // Nothing here reads well.closed: the topology lives inside laneHop /
  // laneDelta / laneNormalize, so a Warden folds at an open well's wall and
  // wraps a Ring's seam without a branch.
  //
  // ⛔ IT RIDES LANE CENTRES, so laneHop's fold bounds are its default range
  // 0 .. lanes-1 — the boundary lattice is the Drifter's and nothing here
  // touches it (CLAUDE.md, RATIONALE.md#boundary-lattice).
  startHop(well, dir) {
    const h = laneHop(well, this.lane, dir, dir);
    this.dir = h.dir;
    this.hopFrom = this.lane;
    // The short way to the landing lane, so a hop across a closed well's seam
    // travels one lane forward and not fifteen backwards.
    this.hopDelta = laneDelta(well, this.lane, h.lane);
    this.hopTime = 0;
    this.hopping = true;
  }

  // Carry the crossing forward. ⛔ `lane` moves continuously over
  // C.WARDEN_HOP_TIME, and landing is EXACT rather than the last interpolated
  // step — an accumulated float error would leave it a hair off a lane centre
  // and the next hop would inherit the drift.
  advanceHop(dt, well) {
    const dur = C.WARDEN_HOP_TIME;
    this.hopTime += dt;
    if (!(dur > 0) || this.hopTime >= dur) { this.landHop(well); return; }
    this.lane = laneNormalize(well, this.hopFrom + this.hopDelta * (this.hopTime / dur));
  }

  // Land whatever crossing is in flight, exactly, and stop. Called at the end
  // of a hop and by the respawn push, which must not leave a Warden parked
  // half-way between two lanes for the reason update() gives.
  landHop(well) {
    if (!this.hopping) return;
    this.lane = laneNormalize(well, this.hopFrom + this.hopDelta);
    this.hopTime = C.WARDEN_HOP_TIME;
    this.hopping = false;
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2), in 14-render-entities.js. The
  // entity hands over its phase as an `aloft` flag, a 0..1 fuse and whether the
  // rim is live, so the drawing and the lethality cannot drift apart.
  draw(ctx, well) {
    drawWarden(ctx, well, this.lane, this.depth, this.aloft, this.chargeTip(),
               this.phase === "discharge");
  }

  // ⛔ IT DECLINES EVERY SHOT AND NEVER DIES (W2, W4). `false` is "the shot is
  // not consumed", so a shot fired into a climbing Warden flies on and meets
  // whatever is behind it on a LATER step — the Weaver bolt's shipped answer,
  // and the base class's default spelled out rather than inherited silently,
  // because "killable only by Jump" is this line.
  //
  // ⛔ It also answers the rim sweep (CS008 P1b passes null), and the answer is
  // the same: a firing craft that touches a discharging Warden dies. Nothing
  // here reads the argument.
  onShot(shot) { return false; }

  // GDD 7. The kill site pays it; the entity never scores itself.
  points() { return C.PTS_WARDEN; }
}

// ---------------------------------------------------------------------------
// The Mimic (GDD 6.4, 14.6, 6.1, 6.3, 6.5, 12) — "reflects shots; vulnerable
// only while firing". Overdrive L16+, 400 points. ⚠ ON PROBATION.
// ---------------------------------------------------------------------------
//
// ⚠ PROBATION IS A REAL STATE AND THIS CLASS IS BUILT FOR IT (MI3; GDD 14.6,
// 19, 21 #6). "Reflected shots that kill you are a hard sell: players read
// their own bullets as safe." ⛔ ONE SCHEDULE ROW IS THE WHOLE CUT — remove
// `{ level: 16, kind: "mimic" }` from C.SPAWN_SCHEDULE_OVERDRIVE and no Mimic
// and no MimicShot can reach a board, in either mode, at any level. Nothing
// else in the build has to move for that to be true, and test-cs013-p4.js
// proves it by mutating the row out and playing an Overdrive session at L16+.
// The verdict is CS017's; the ask is in SKIPPED-PLAYTESTS.md.
//
// ⛔ REFLECT-THEN-OPEN, AND THE BUDGET IS WHY (MI1). MEASURED (plan §1.6,
// §1.7): held fire meets a Mimic FIFTEEN TIMES A SECOND, and a Mimic that
// reflected every shot would fill C.ENEMY_CAP in about a second. So a
// reflection is a ONE-SHOT answer that spends the guard:
//
//   closed   guarding. A shot is CONSUMED and sent back once, as one
//            MimicShot up its own lane, and the Mimic OPENS.
//   open     "firing", for C.MIMIC_OPEN_TIME. A shot that reaches it here
//            KILLS it and is consumed. Nothing is reflected.
//
// ⛔ AT MOST ONE REFLECTION PER OPENING, and it is structural rather than a
// counter: reflecting is the only thing that opens it, and an open Mimic
// reflects nothing. Under held fire the next shot lands about 0.1 s later
// (PREDICTED: four steps, plus up to two declined by the crossing MimicShot)
// and the window is 0.5 s, so ⛔ A MIMIC COSTS EXACTLY ONE REFLECTION.
//
// ⛔ THE OPEN/CLOSED READ IS GDD 12's PROMPT, `SOLID = ARMOURED · OPEN =
// VULNERABLE`, and it is the Drifter's three channels (GDD 6.3): two polys —
// one drawn CLOSED, one drawn OPEN — at two stroke widths and two alphas.
// ⛔ It has a headless gate for the same reason the Drifter's does: an art rule
// rots silently, so test-cs013-p4.js measures the ratio and the alpha back off
// the real glowStroke calls.
//
// The nine fields: (lane, depth) a position, climbing to C.MIMIC_APEX and
// holding; `purgeable` TRUE (the Drifter's precedent — "shots only while
// crossing; Purge anywhere": the panic button answers what the guard refuses);
// `blocksClear` true; `killDepth` ⛔ NULL AT EVERY DEPTH — its body never kills
// and it never reaches the rim, so GDD 17 item 13 is not owed (R10); `anchored`
// false; `aloft` false — it lives IN the well; `sfxVoice` "mimic". It is not
// cargo.
class Mimic extends Enemy {
  // `dir` is ignored — one lane, never hopping, and `lane` is written once,
  // here. The Carrier's, the Weaver's and the Surger's absence of code: it
  // touches no lane helper, which is why it behaves identically on a Ring and
  // on a Fan with no branch and no read of `well.closed`. ⛔ The spawner still
  // spends its draw on a `dir` (08-spawner.js) — a kind that skipped it would
  // make the run's ONE stream depend on what came out of the throat.
  constructor(lane, depth) {
    super(lane, depth);
    this.sfxVoice = "mimic";   // C.SFX_KILL_PITCH.mimic, from tools/sfx-lab.html

    // ⛔ THE PURGE ANSWERS IT IN EITHER STATE (GDD 4.3, 6.1's Drifter row).
    // `purgeable` is inherited true and that is the explicit decision, not a
    // default taken by accident: the guard refuses a SHOT, and a panic button
    // armour could refuse would not be one. updatePurge() sets `dead` directly
    // and never asks onShot(), so a purged Mimic reflects nothing (⚠ SETTLED).
    // A Mimic must be gone before the well is clear, like every other threat.

    // "closed" | "open", and one up-counting timer (GDD 16.3) — the Weaver's,
    // the Drifter's and the Surger's precedent. ⛔ Born CLOSED: a Mimic that
    // arrived already open would be a free 400 points for the shot that was
    // already in the air.
    this.phase = "closed";
    this.openTimer = 0;        // counts UP toward C.MIMIC_OPEN_TIME while open
  }

  // Is it "firing" — the one window a shot kills it in (GDD 14.6)? The draw
  // path reads this too, so the read and the rule can never drift apart.
  open() { return this.phase === "open"; }

  update(dt, well, state) {
    // ⛔ climbMult()'s SEVENTH call site (R6; GDD 8's "climb speed", singular),
    // and the only thing heat touches on this entity. ⛔ It stops at
    // C.MIMIC_APEX and NOT at the park depth: its killDepth is null, so there
    // is no band for it to park on, and the apex is bounded by MI2's
    // arithmetic (00-config.js) rather than by the rim.
    if (this.depth < C.MIMIC_APEX) {
      this.depth += C.MIMIC_CLIMB * climbMult() * dt;
      if (this.depth > C.MIMIC_APEX) this.depth = C.MIMIC_APEX;
    }

    // The window closes on its own clock. ⛔ It closes back to GUARDING rather
    // than to anything new — the cycle is two states and nothing else, so a
    // Mimic the player failed to finish costs them a second reflection.
    if (this.phase === "open") {
      this.openTimer += dt;
      if (this.openTimer >= C.MIMIC_OPEN_TIME) {
        this.phase = "closed";
        this.openTimer = 0;
      }
    }
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2), in 14-render-entities.js. It hands
  // over its own phase rather than a flag this module decides, the Drifter's
  // rule: the two states can never drift apart from the two behaviours.
  draw(ctx, well) {
    drawMimic(ctx, well, this.lane, this.depth, this.open());
  }

  // ⛔ THE WHOLE OF MI1, AND BOTH BRANCHES CONSUME THE SHOT. The collision pass
  // only asks; the enemy decides (GDD 6.5).
  //
  //   open    it dies and the shot is spent — GDD 14.6's "vulnerable only
  //           while firing", as the one line that says it.
  //   closed  the shot is spent, ONE MimicShot goes back up the lane, and the
  //           Mimic opens.
  //
  // ⛔ THROUGH spawnEnemy(), THE ONE ENTRY POINT (GDD 6.5) — the FOURTH
  // non-spawner caller, after the Carrier's split and the Weaver's two. It is
  // called from inside collideShots()'s own loop over state.enemies, which is
  // the Carrier split's ⚠ SETTLED path and is safe for the Carrier split's
  // three reasons: the loop is index-based and re-reads `.length`, the `break`
  // after onShot is unconditional, and removal is the end-of-frame filter.
  // ⛔ Do not make that break conditional to "fix" a reflection resolving
  // against a shot's own step.
  //
  // ⛔ THE SOUND ONLY FOR A SHOT THAT EXISTS — Weaver.fire()'s rule:
  // spawnEnemy() refuses at C.ENEMY_CAP, and `reflect` for nothing is a lie
  // about the lane, which on a hostile shot coming up at you is the worst
  // possible lie (GDD 1.1 P2). ⛔ THE OPENING IS UNCONDITIONAL, because the
  // shot was consumed either way: a refused reflection is a lost beat for the
  // MIMIC, never a guard the player paid for and did not get.
  onShot(shot) {
    if (this.open()) {
      this.dead = true;
      return true;
    }
    if (spawnEnemy("mimicShot", this.lane, this.depth)) sfx("reflect");
    this.phase = "open";
    this.openTimer = 0;
    return true;
  }

  // GDD 7. The kill site pays it; the entity never scores itself.
  points() { return C.PTS_MIMIC; }
}

// ---------------------------------------------------------------------------
// The MimicShot (GDD 14.6, 4.5 item 4; MI2) — the player's own shot, turned.
// ---------------------------------------------------------------------------
//
// ⛔ A PARAMETER VARIANT OF THE WEAVER'S BOLT, AND THAT IS WHY IT SUBCLASSES
// ONE (GDD 6.5, CS012 P2's rule). It overrides a speed reader and a draw and
// inherits the whole contract: the rim band `killDepth`, `blocksClear` false,
// `purgeable` true, `anchored` false, the self-termination the step after
// depth 1, the declined shot, and the base's 0 points.
//
// ⛔ IT IS AN ENEMY, IN state.enemies (GDD 6.5's one array), and NOT a reversed
// Shot in state.shots. A hostile entry in that array would need a new branch in
// collideSkimmer(), which reads state.enemies only, and would count against the
// PLAYER'S shot cap (06-shots.js). The bolt already answered this question.
//
// ⛔ "60% SPEED" IS A RATIO OF THE PLAYER'S SHOT (GDD 14.6): C.MIMIC_SHOT_RATIO
// / C.SHOT_TIME = 1.1538 depth/s. Never heat-scaled (H2), and C.MIMIC_APEX is
// bounded so every reflection gives at least C.SURGE_TELEGRAPH of flight to the
// kill band (00-config.js has the arithmetic).
//
// ⛔ NOT SHOOTABLE, and that is the bolt's ⚠ SETTLED answer inherited rather
// than re-decided: a reflected shot is DODGED, not answered. Rotating out of
// the lane is the reply, and there is no second one. It briefly shields
// whatever is behind it for the few steps of overlap, because collideShots()'s
// `break` is unconditional — the bolt's shipped behaviour, and not a bug.
//
// ⛔ NOT A DIVE SURVIVOR (GDD 6.5's seventh wiring point): `blocksClear` false
// and not `anchored` makes it the second entity that can be airborne when a
// dive starts, and startDive() filters the board down to `anchored` survivors,
// so the answer is the bolt's — no.
class MimicShot extends WeaverBolt {
  // `dir` is ignored: it travels the lane it was reflected in. The draw is
  // still spent by spawnEnemy(), the bolt's case.
  constructor(lane, depth) {
    super(lane, depth);
    this.sfxVoice = "mimicShot";   // C.SFX_KILL_PITCH.mimicShot, from tools/sfx-lab.html
  }

  // ⛔ The one override that makes it a variant (MI2). The bolt's update() is
  // inherited unedited and reads this.
  speed() { return C.MIMIC_SHOT_RATIO / C.SHOT_TIME; }

  // ⛔ "Colour-shifted, larger" (GDD 14.6): the PLAYER'S STREAK, turned — drawn
  // at C.MIMIC_SHOT_LEN x C.SHOT_LEN and C.MIMIC_SHOT_WIDTH x laneLineWidth, in
  // C.MIMIC_COLOR. That it is the player's own mark is the whole read.
  draw(ctx, well) {
    drawMimicShot(ctx, well, this.lane, this.depth);
  }

  // ⛔ points() is the bolt's 0, by inheritance and on purpose: GDD 7 has no row
  // for a reflected shot, and the only thing that destroys one is the Purge.
}

// ==========================================================================
// 08-spawner.js
// ==========================================================================
// 08-spawner.js — what releases enemies into a well, and what decides the well
// is finished (GDD 2, 6.3, 6.5, 12, 16.3).
//
// ⛔ ONE ENTRY POINT: spawnEnemy(kind, lane, depth). Every enemy that enters
// state.enemies comes through it — the interval spawner below, and CS004's
// Carrier split, which is not a spawn the player can predict but is still an
// enemy appearing in a lane. That is the whole reason this is a function
// rather than three call sites doing `state.enemies.push(new Vaulter(...))`:
// GDD 6.3's safe-spawn rule and C.ENEMY_CAP are enforced in ONE place, so a
// later enemy inherits them instead of re-implementing them (and forgetting).
//
// ⛔ EVERY DRAW COMES FROM state.rng (01-rng.js). Nothing here reaches for the
// platform generator — GDD 17.1's replay guarantee is the reason, and the
// suite scans the built file for it.
//
// ⛔ The two numbers live in state.spawn (02-state.js): `timer` counts UP
// toward spawnInterval(), `remaining` is a count spent downward. Neither is a
// countdown clock (GDD 16.3).

// The kind table. ⛔ A spawn names a kind as a STRING and this table is the one
// place a string becomes a class — CS004's Carrier split asks for "vaulter" by
// name and gets whatever this row says, so the roster grows here and nowhere
// else. `dir` is the initial heading, drawn from the run's stream by the
// caller and handed in, so an enemy that has no use for one simply ignores it.
const ENEMY_KINDS = {
  vaulter: (lane, depth, dir) => new Vaulter(lane, depth, dir),
  // ⛔ ONE ROW PER CARRIER VARIANT, not one row for "a Carrier". The cargo is
  // half of what the entity IS (GDD 6.2 — reading the glyph is the skill), so
  // it belongs in the string, exactly as the class it becomes belongs in this
  // table. `dir` is ignored by all three: a Carrier never hops, and the draw
  // for it is still spent (see spawnEnemy below).
  //
  // ⛔ THREE ROWS, ONE CLASS, NO BRANCH. The cargo is a CARGO key handed to the
  // same constructor — Carrier.onShot() and splitLanes() serve all three rows
  // and neither takes a cargo. CS005 P4 completed GDD 6.2's table by adding the
  // two rows below and nothing else; a fourth cargo is the same three lines
  // (a CARGO entry, a row here, a glyph) in three files.
  carrierVaulter: (lane, depth) => new Carrier(lane, depth, "vaulter"),
  carrierDrifter: (lane, depth) => new Carrier(lane, depth, "drifter"),
  carrierSurger:  (lane, depth) => new Carrier(lane, depth, "surger"),
  // `dir` is ignored by both of these too: a Weaver never hops and a bolt
  // travels the lane it was fired in. The draw is still spent — see spawnEnemy.
  weaver: (lane, depth) => new Weaver(lane, depth),
  // ⛔ A ROW FOR THE PROJECTILE, because the projectile is an enemy in the one
  // array like everything else (GDD 6.5). Weaver.fire() asks for it by name, so
  // the bolt inherits C.ENEMY_CAP and GDD 6.3's safe-spawn rule for free —
  // exactly as the Carrier's split does. ⚠ It is NOT a GDD 6.1 roster row, so
  // it is not counted among the enemies in scratchpad/test-registry.js.
  weaverBolt: (lane, depth) => new WeaverBolt(lane, depth),
  // ⛔ A ROW FOR THE THORN, and `depth` here is the only place in this table
  // where that argument is not a POSITION: a Thorn's depth is the TIP OF AN
  // EXTENT rooted at the throat (07-enemies.js's `anchored`). Weaver.layThorn()
  // asks for one at the Weaver's own depth, one climb step above the throat,
  // and grows it from there — which is exactly why GDD 6.3's safe-spawn
  // LOWERING below is harmless on it. ⚠ A caller that asked for a finished
  // full-length Thorn in the Skimmer's lane would not have it lowered, it would
  // have it SHORTENED; nothing does, and nothing should.
  thorn: (lane, depth) => new Thorn(lane, depth),
  // ⛔ THE FIRST ROW THAT ACTUALLY USES `dir`. Every row above either takes one
  // and ignores it or does not name it at all; the Vaulter takes one but a
  // Vaulter that never vaults (level 1, GDD 6.3) never spends it. A Drifter
  // crosses on its FIRST update, so the draw spawnEnemy() spends below is read
  // immediately — which is what makes a replay of a seed put the same Drifter
  // on the same side of the lane it was born in.
  //
  // ⛔ It is handed an integer lane CENTRE like everything else and crosses onto
  // the boundary lattice itself (07-enemies.js). This table stays a function of
  // (lane, depth, dir) and learns nothing about any entity's lattice.
  drifter: (lane, depth, dir) => new Drifter(lane, depth, dir),
  // ⛔ `dir` is ignored — a Surger never hops, and `lane` is written once by its
  // constructor. The draw spawnEnemy() spends below is STILL SPENT: a kind that
  // skipped it would make the run's one stream depend on which kind came out of
  // the throat, and GDD 17.1's replay guarantee is exactly that dependency not
  // existing. The Weaver, the bolt and the Thorn are the same case.
  surger: (lane, depth) => new Surger(lane, depth),
  // ⛔ OVERDRIVE'S FIRST ROW (CS012 P2; 07-enemies-overdrive.js). It USES `dir`
  // exactly as the Vaulter does: the heading it would keep if it ever held one.
  // A Classic run never asks for it, because only C.SPAWN_SCHEDULE_OVERDRIVE
  // names it.
  reaver: (lane, depth, dir) => new Reaver(lane, depth, dir),
  // ⛔ OVERDRIVE'S SECOND ROW (CS013 P3; 07-enemies-overdrive.js). It takes
  // `dir` like the Vaulter — the heading laneHop() folds and writes back while
  // it hunts along the rim. The row is the ONLY way one reaches a board, and
  // only C.SPAWN_SCHEDULE_OVERDRIVE names it, so a Classic run never asks.
  // ⚠ It is released at depth 0 like everything else: a Warden is a THROAT
  // arrival that climbs and then lifts off, not an entity that flies in from
  // off the well (W2).
  warden: (lane, depth, dir) => new Warden(lane, depth, dir),
  // ⛔ OVERDRIVE'S THIRD ROW (CS013 P4; 07-enemies-overdrive.js), and ⚠ THE ONE
  // LINE THAT IS THE MIMIC'S WHOLE PROBATION (MI3, GDD 14.6, 21 #6) together
  // with its schedule row. `dir` is ignored — one lane, never hopping — and the
  // draw spawnEnemy() spends on it is still spent, the Surger's case.
  mimic: (lane, depth) => new Mimic(lane, depth),
  // ⛔ A ROW FOR THE REFLECTED SHOT, AND NOT A SCHEDULE ROW — `weaverBolt`'s
  // case exactly (00-config.js). Mimic.onShot() asks for it by name, so it
  // inherits C.ENEMY_CAP and GDD 6.3's safe-spawn rule for free; a schedule row
  // for it would put a reflected shot in the throat that nobody reflected.
  // ⚠ It is NOT a GDD 6.1 roster row, so it is not counted among the enemies in
  // scratchpad/test-registry.js — two kinds behind one roster row, the bolt's.
  mimicShot: (lane, depth) => new MimicShot(lane, depth),
};

// The RELEASE BUDGET — how many THREATS may be alive at once. ⛔ The MIN of the
// two, and they are not the same kind of number: enemyConcurrent() is the
// difficulty knob and it now RISES WITH HEAT (CS007 P2, 00-config.js), while
// C.ENEMY_CAP is a readability ceiling that is never raised for difficulty.
// Reading only one of them is how a retune of the knob quietly walks past the
// ceiling. ⛔ MEASURED: the shipped ladder tops out at 8, so the cap is never
// approached and the min() is belt and braces rather than a live clamp.
function spawnLimit() {
  return Math.min(enemyConcurrent(), C.ENEMY_CAP);
}

// How many things on the board are THREATS — GDD 6.5's `blocksClear`, read off
// the entity and never off a class name, exactly as wellCleared() reads it.
//
// ⛔ THIS IS WHAT THE RELEASE BUDGET COUNTS, AND IT IS NOT WHAT C.ENEMY_CAP
// COUNTS. Paul's call, 2026-08-31 (DECISIONS.md, "the spawner-stall call"):
// the concurrency budget counts THREATS; the readability ceiling keeps counting
// ENTITIES. Before the split both questions read state.enemies.length, and a
// Thorn — permanent, unshootable-by-accident, and something the player is not
// obliged to remove (GDD 6.1) — therefore held a release slot forever. Three
// standing Thorns at a release budget of 3 shut the spawner: the quota never
// spent, the well never cleared, and nothing threatened the player either.
//
// ⛔ Three follow-ons are settled with it and are NO CHANGE: no Thorn expires
// (GDD 5's lesson — clear thorns before the last enemy — depends on it
// persisting), wellCleared() is untouched, and C.ENEMY_CAP is not raised.
function threatCount(state) {
  let n = 0;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (!e.dead && e.blocksClear) n++;
  }
  return n;
}

// Is `lane` the Skimmer's lane? ⛔ laneDelta, never (a - b): on a Ring, lane 15
// and lane 0 are neighbours (03-wells.js).
//
// The Skimmer's lane is CONTINUOUS — a player parked between two centres is
// half in each — so "its lane" is anything within one lane of it rather than
// Math.round()'s single answer. The wider reading is the safe direction to be
// wrong in: it declines a spawn the player might have been under, and the cost
// of declining is one lane redrawn.
function inSkimmerLane(well, lane, skimmer) {
  if (!skimmer || skimmer.dead) return false;
  return Math.abs(laneDelta(well, lane, skimmer.lane)) < 1;
}

// ⛔ THE ONLY WAY AN ENEMY ENTERS THE WELL. Returns the enemy, or null if the
// spawn was refused. Refusals are not errors — a caller that cares checks the
// return, and the interval spawner below spends no quota on one.
//
// It owns two rules:
//
//   ⛔ GDD 6.3 — never spawn in the Skimmer's lane above C.SAFE_SPAWN_DEPTH.
//      Enforced by LOWERING the depth to the safe line rather than by moving
//      the lane or refusing: a Carrier split has to put its two children
//      somewhere specific (GDD 6.2's "adjacent" / "flanking"), and relocating
//      them sideways would break the shape the player is being taught to read.
//      Dropping one deeper only ever gives the player more time.
//
//   ⛔ C.ENEMY_CAP — the readability ceiling, refused outright. It is not a
//      difficulty knob and this is the one place it is enforced. ⛔ It counts
//      RAW state.enemies.length, Thorns and bolts included, and CS007 P1's
//      threats split did NOT touch it: a Thorn is drawn, so a ceiling on what
//      is legible on screen counts it. threatCount() above is the other half.
function spawnEnemy(kind, lane, depth) {
  const make = ENEMY_KINDS[kind];
  if (!make) return null;
  if (state.enemies.length >= C.ENEMY_CAP) return null;

  const well = WELLS[state.wellIndex];
  const l = laneNormalize(well, lane);
  let d = depth || 0;
  if (d < 0) d = 0;
  if (d > 1) d = 1;
  if (d > C.SAFE_SPAWN_DEPTH && inSkimmerLane(well, l, state.skimmer)) {
    d = C.SAFE_SPAWN_DEPTH;
  }

  // ⛔ The heading comes from the run's ONE stream, so a replay of the seed
  // produces the same well. Drawn here rather than in the caller so every
  // spawn spends exactly one draw on it and the stream stays aligned.
  const dir = state.rng() < 0.5 ? -1 : 1;
  const e = make(l, d, dir);
  state.enemies.push(e);
  return e;
}

// GDD 8.1's INTRODUCTION SCHEDULE, read (CS007 P3). Which kinds the well may
// release at `level` — ⛔ A FUNCTION OF THE LEVEL AND THE RUN'S MODE, AND
// NOTHING ELSE. No board state, no heat, no draw: GDD 1.1 P3 is "escalation you
// can name", and a set that depended on what happened to be on screen is not
// nameable.
//
// ⛔ THE MODE (CS012 P2, Paul's O2). `mode` defaults to "classic", and only
// "overdrive" reads C.SPAWN_SCHEDULE_OVERDRIVE: its rows are merged into the
// Classic rows in ascending level, a Classic row first at an equal level, so an
// Overdrive set is still in level order and still only grows. A Classic set is
// the rows below and nothing else, element for element the pre-CS012 answer.
//
// ⛔ THE SCHEDULE ITSELF IS DATA IN C (C.SPAWN_SCHEDULE, 00-config.js), where
// the reasoning lives — the cumulative rule, why `thorn` and `weaverBolt` are
// absent, why there is no cargo weight table, and which two of GDD 8.1's rows
// were already true before CS007. This function is the whole of the mechanism:
// the rows at or below the level, in schedule order.
//
// ⛔ IT IS THE SET THAT GROWS, NOT THE MIX THAT SHIFTS. The three Carrier
// variants are three separate rows, so GDD 8's "cargo weights shift toward
// Drifter/Surger" falls out of this loop and out of the uniform pick below.
//
// The array is allocated per call and that is deliberate: the one caller is
// pickSpawnKind(), which runs once per interval spawn — of the order of once a
// second, and never in the draw path, which is where GDD 17's no-allocation
// budget applies. Returning a shared array would hand a mutable schedule to
// whatever asked for it.
function eligibleKinds(level, mode) {
  const extra = mode === "overdrive" ? C.SPAWN_SCHEDULE_OVERDRIVE : [];
  const out = [];
  let j = 0;
  for (let i = 0; i < C.SPAWN_SCHEDULE.length; i++) {
    const row = C.SPAWN_SCHEDULE[i];
    // An Overdrive row strictly below this Classic row's level goes first.
    for (; j < extra.length && extra[j].level < row.level; j++) {
      if (level >= extra[j].level) out.push(extra[j].kind);
    }
    if (level >= row.level) out.push(row.kind);
  }
  for (; j < extra.length; j++) {
    if (level >= extra[j].level) out.push(extra[j].kind);
  }
  return out;
}

// Which kind the interval spawner releases next. ⛔ ITS NAME, SIGNATURE AND
// NO-DRAW CONTRACT ARE UNCHANGED FROM CS004; only its READER moved, from the
// ⚠ TEMPORARY bench list CS007 P3 deleted to the schedule above. updateSpawner()
// below still asks a function rather than naming a kind, which is why the swap
// touched nothing else in this file.
//
// ⛔ A UNIFORM PICK OVER THE ELIGIBLE SET, AND THERE IS NO WEIGHT TABLE
// (Paul, 2026-08-31 — DECISIONS.md). See C.SPAWN_SCHEDULE for why that is a
// decision: the cargo mix shifts because the SET grows, not because anything
// here weighs it.
//
// ⛔ A ONE-ENTRY SET SPENDS NO DRAW, AND THAT IS NOT AN OPTIMISATION.
// rngPick() on a single-element array still advances the run's ONE stream
// (01-rng.js), and the stream is shared: one extra draw per spawn moves every
// spawn lane in every run, including the 10,000-tick replay GDD 17 item 1
// hashes. The game shipped without this function, so the no-choice case has to
// spend exactly what the old `spawnEnemy("vaulter", ...)` literal did — which
// is nothing. There is no genuine choice to make, so no randomness is spent
// making it. ⛔ Levels 1-2 are that case, and they are the levels every golden
// recording in the suite lives in. ⛔ In BOTH modes (CS012 P2): Overdrive's
// first row is level 6, so its levels 1-2 are one entry too.
function pickSpawnKind(state) {
  const kinds = eligibleKinds(state.level, state.mode);
  if (kinds.length < 2) return kinds[0];
  return rngPick(state.rng, kinds);
}

// A lane for the next interval spawn. Draws from state.rng and redraws up to
// C.SPAWN_LANE_TRIES times to avoid stacking a new enemy on one that is still
// in the throat zone — two silhouettes at the same lane and nearly the same
// depth read as one, which is GDD 1.1 P2 ("legible before lethal") failing at
// the moment the player has the most time to react.
//
// ⛔ BOUNDED, and it settles for the last draw rather than looping until it is
// happy. An unbounded search spends a board-dependent number of draws, and the
// run's stream is shared: the next spawn, and everything else that draws,
// would shift depending on what happened to be on screen.
//
// C.READABILITY_DEPTH is "the throat zone" as the build already defines it
// (GDD 10.3) — the band where nothing opaque is drawn because nothing down
// there can be read. Reusing it is deliberate; a second constant for the same
// band would be two numbers to keep in step.
function pickSpawnLane(state, well) {
  let lane = rngInt(state.rng, well.lanes);
  for (let i = 1; i < C.SPAWN_LANE_TRIES && laneCrowded(state, well, lane); i++) {
    lane = rngInt(state.rng, well.lanes);
  }
  return lane;
}

// Is something already sitting in this lane, down in the throat zone?
function laneCrowded(state, well, lane) {
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    if (e.depth > C.READABILITY_DEPTH) continue;
    if (Math.abs(laneDelta(well, lane, e.lane)) < 1) return true;
  }
  return false;
}

// Re-arm for a fresh well. ⛔ enterWell() (23-main.js) is the only caller —
// resetting the spawner without also clearing state.enemies leaves the
// previous well's craft in a well that may have fewer lanes.
function resetSpawner(state) {
  state.spawn.timer = 0;
  state.spawn.remaining = C.SPAWN_QUOTA;
}

// One simulation step of the spawner. Called from Game.update() AFTER the
// enemy pass and its filter, so the alive count it reads is this step's truth
// and not last step's plus whatever died a moment ago.
//
// ⛔ AND THE INTERVAL IS HEAT-DERIVED (CS007 P2) — spawnInterval(), read ONCE
// per call into a local. Reading it twice would be harmless today and would
// stop being harmless the first time anything moved the clock mid-step.
// ⚠ A FALLING INTERVAL AND A HELD TIMER INTERACT, AND IT IS THE INTENDED
// BEHAVIOUR: a timer parked at the old, longer interval is already past the new
// one when the level advances, so the first spawn of a harder well is immediate
// rather than late. That is the same "a freed slot fires at once" rule below,
// arriving from the other side.
//
// ⛔ The timer HOLDS at the interval instead of growing past it. A spawn
// blocked by the concurrency limit therefore fires the instant a slot frees,
// which is what keeps the pressure constant; a timer that reset on a blocked
// beat would make a busy well quieter exactly when it should not be, and one
// that grew without bound would dump the backlog all at once.
//
// ⛔ AND THE BLOCK COUNTS THREATS, NOT ENTITIES (CS007 P1) — threatCount()
// above, against the release budget. A slot is held by something the player
// must remove to finish the well; a Thorn is not, so a Thorn does not hold one.
// The C.ENEMY_CAP refusal inside spawnEnemy() still counts everything, so a
// well full of Thorns stops releasing at the ceiling rather than at the budget.
function updateSpawner(state, well, dt) {
  const sp = state.spawn;
  if (sp.remaining <= 0) return;

  const interval = spawnInterval();
  if (sp.timer < interval) sp.timer += dt;
  if (sp.timer < interval) return;

  // ⛔ FROM HERE DOWN THE SPAWNER WANTED TO RELEASE: quota left, timer at the
  // interval. A step that gets this far and releases nothing is a BLOCKED BEAT
  // — PLANNED-FEATURES-CS007.md 4.2's metric, and the stall's own signature in
  // a played run. ⛔ Counted for telemetry and read by nothing here (02-state.js
  // at `tally`): both refusals below already existed and neither changed.
  if (threatCount(state) >= spawnLimit()) { state.tally.spawnBlockedTicks++; return; }

  // Depth 0 is the throat — the far aperture, the only place a well releases
  // an enemy from. GDD 3.2's convention, not a magic number.
  const lane = pickSpawnLane(state, well);
  const e = spawnEnemy(pickSpawnKind(state), lane, 0);
  // Refused (the cap): the quota is not spent. ⛔ The SECOND blocked beat, and
  // it is a different cause from the one above — the budget counts THREATS and
  // the cap counts ENTITIES (CS007 P1), so a well full of Thorns blocks here
  // and not there. One column counts both; the two are told apart by reading
  // `thornsStanding` beside it.
  if (!e) { state.tally.spawnBlockedTicks++; return; }

  sp.timer = 0;
  sp.remaining--;
}

// ⛔ TWO CONDITIONS, NOT ONE (GDD 2). The quota must be spent AND nothing that
// blocks the clear may be left alive. "The array is empty" alone is true one
// tick after startGame() and in every gap between spawns, and a well that
// cleared itself before releasing anything is the bug this exists to prevent.
//
// `blocksClear` is read off the entity, never a class name: CS004's Thorn is
// the first false, and that is exactly why a Thorn is still standing in the
// lane during the Dive (GDD 5) rather than being an oversight here.
function wellCleared(state) {
  if (state.spawn.remaining > 0) return false;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (!e.dead && e.blocksClear) return false;
  }
  return true;
}

// ==========================================================================
// 09-collision.js
// ==========================================================================
// 09-collision.js — the one collision pass, and the Purge (GDD 4.2, 4.3, 4.5,
// 6.5).
//
// ⛔ COLLISION IS 1-D. A lane match plus an overlap on `depth`, and nothing
// else. No trigonometry, no screen coordinates, no distance in pixels — every
// entity's position is (lane, depth) (GDD 3.2) and the projection that turns
// that into an x/y exists only inside draw code. Writing 2-D geometry into
// entity logic is the single most common source of subtle bugs in this kind of
// game: the moment a hit test reads a projected point, the same overlap starts
// passing at the rim and failing at the throat, because perspective() is not
// linear.
//
// ⛔ ONE PASS, in a FIXED ORDER: shots against enemies, then enemies against
// the Skimmer, each iterating its array front to back. GDD 17.1's replay
// guarantee is why — the same seed and the same recorded inputs must pick the
// same target every time, and "whichever one the loop happened to reach first"
// is only deterministic if the loop order is written down.
//
// ⛔ AND SINCE CS008 P1b THE SECOND HALF CAN KILL AN ENEMY, NOT ONLY THE
// SKIMMER: the rim sweep in collideSkimmer() asks a touching rim enemy
// onShot() while fire is held. It is still this pass and this order — shots
// resolve first, so the sweep only ever meets what the shots left standing.
//
// ⛔ Called from Game.update() AFTER the entity pass and BEFORE the end-of-frame
// filters. Nothing here removes an array element; hits set `dead = true` and
// the caller's .filter() does the removal (GDD 6.5). Never splice mid-loop.
//
// ⛔ SCORING, CS008 P2: ALL OF THE BUILD'S KILL SITES ARE IN THIS FILE —
// collideShots(), the rim sweep in collideSkimmer(), both Purge uses, and —
// CS013 P3, W4 — jumpStrike(), a FOURTH site and a FIFTH line. Each awards
// `e.points()` through addScore() (12-scoring.js) on the false -> true `dead`
// transition, beside the `tally.kills` it already counted, and nowhere else.
// The Thorn's per-chip 5 is paid inside its own onShot(), not here.
//
// ⛔ AND THE KILL SOUND, CS009 P5, beside the points on the same five lines:
// `sfx("kill", e.sfxVoice)`, the pitch read off the entity's eighth contract
// field (07-enemies.js). No sound call here writes `state` or draws.
//
// ⛔ AND SINCE CS012 P4, OVERDRIVE'S COMBO, AT THOSE SAME EDGES AND NOWHERE
// ELSE (GDD 14.4; O4, R6; 12-scoring.js). Each of the five lines reads
// `addScore(e.points() * comboMult()); comboKill(state);` — the kill is scored
// at the CURRENT multiplier and then raises it. ⛔ addScore() is unchanged and
// stays the one writer: a multiplier folded into it would also multiply the
// Thorn's per-chip 5, the clear bonuses and the Start Depth bonus, which is
// the scope O4 ruled out. ⛔ Both are exactly 1 / a no-op in Classic, so a
// Classic run is bit-identical to the build before this phase.
//
// ⛔ AND SINCE CS013 P2, TWO OF OVERDRIVE'S THREE LASTING TOKENS ARE READ IN
// THIS FILE (GDD 14.1; T7, T9; 10-powerups.js). LANCE is one term on the line
// that retires a shot — a kill does not consume a pierced one — and THE WARD is
// one early return in killSkimmer(), below its invulnerability guard and above
// everything a death does. ⛔ Neither adds a branch to the pass itself, and
// both are plain reads of a flag that is only ever written in Overdrive.
//
// ⛔ AND SINCE CS013 P1, OVERDRIVE'S TOKEN DROP, AT THOSE SAME EDGES AND NOWHERE
// ELSE (GDD 14.1; T2; 10-powerups.js). `dropToken(state, e)` follows
// comboKill() on each of the five lines: EVERY kill at a kill site rolls, and
// spends exactly ONE draw from the run's stream whether or not anything drops.
// ⛔ It is a total no-op in Classic — no draw — and the Dive's termination
// kill (11-dive.js) is not a kill site and rolls nothing.

// Are two lanes the same lane, to within the contact tolerance? ⛔ laneDelta,
// never (a - b): on a 16-lane Ring the distance from lane 15.9 to lane 0 is
// +0.1, and the bare subtraction says 15.9 — a shot fired across the seam would
// miss the thing it is pointed at (03-wells.js).
function laneHit(well, a, b) {
  return Math.abs(laneDelta(well, a, b)) <= C.HIT_LANE_TOL;
}

// ---------------------------------------------------------------------------
// Shots vs enemies (GDD 4.2)
// ---------------------------------------------------------------------------
//
// ⛔ ONE SHOT RESOLVES AGAINST AT MOST ONE ENEMY PER STEP — the `break` below is
// unconditional, not conditional on consumption. A shot the enemy declines to
// consume (GDD 6.2's armour, and 07-enemies.js's base-class default) flies on
// and meets whatever is behind it on a LATER step, at a depth it has actually
// travelled to. Letting it walk the rest of the array in the same step would
// make one trigger pull kill a whole stacked lane, which is exactly the
// chip-away economy GDD 4.2 is built around inverted.
//
// The enemy decides what a hit does, not this pass: it only asks. That is what
// keeps CS004's Thorn (chip, consume) and an armoured entity (no damage, do not
// consume) out of here as special cases.
//
// ⚠ SETTLED — AN ENEMY MAY PUSH INTO state.enemies FROM INSIDE onShot, WHILE
// THIS LOOP IS ITERATING IT. CS004's Carrier does exactly that: a shot kills it
// and it splits into two children through spawnEnemy() (07-enemies.js), which
// appends to the array `j` is walking. That is safe, and it is safe because of
// three separate decisions rather than by luck:
//
//   1. the inner loop is INDEX-BASED and re-reads `.length` every iteration, so
//      an appended child is simply part of the array — nothing is invalidated,
//      no iterator is live across the push;
//   2. the `break` below is UNCONDITIONAL, so the shot that caused the split
//      stops here and cannot walk forward into the children it just created;
//   3. removal is still Game.update()'s end-of-frame `.filter()` — the dead
//      parent is skipped by `e.dead` for the rest of this step and removed
//      afterwards. Nothing is spliced mid-loop (GDD 6.5).
//
// ⛔ Do not "fix" this into a deferred spawn queue: a queue would put the
// children on the board one step late, at a depth they never occupied, and buy
// nothing. Do not make the `break` conditional either — that is item 2, and it
// is load-bearing for this as well as for the chip-away economy above.
//
// ⛔ NO TUNNELING CHECK IS NEEDED, and here is the arithmetic so a future
// session does not add one: a shot crosses C.SHOT_TIME (0.52 s) of depth in
// one step of C.FIXED_DT, i.e. 1/0.52/60 ≈ 0.032 depth units, and the hit band
// is 2 * C.HIT_DEPTH_TOL = 0.10 wide. The band is wider than the step, so a
// shot cannot step over an enemy. Retuning SHOT_TIME below ~0.3 s, or
// HIT_DEPTH_TOL below ~0.017, breaks that and would need swept-interval logic.
function collideShots(state, well) {
  for (let i = 0; i < state.shots.length; i++) {
    const shot = state.shots[i];
    if (shot.dead) continue;
    const sd = shot.depth();

    for (let j = 0; j < state.enemies.length; j++) {
      const e = state.enemies[j];
      if (e.dead) continue;
      // ⛔ ALOFT IS OUT OF REACH (GDD 14.6; CS013 P3, W1, W4; 07-enemies.js's
      // ninth contract field). A shot never meets something ABOVE the well, so
      // "killable only by Jump" costs this pass one line and no branch on a
      // class. ⛔ It is also what keeps an unshootable Warden from SHIELDING
      // the rim band of its lane: a shot is born at depth 1 and would otherwise
      // be hit-tested against it on its first two steps, decline, and stop
      // there — the Weaver bolt's shipped shielding, on an entity nothing can
      // ever remove. ⛔ `aloft`, never `depth >= 1`: the flag is the phase, and
      // a climbing Warden at depth 1 for one step is still shootable-and-
      // declining rather than out of reach.
      if (e.aloft) continue;
      // ⛔ + C.HIT_DEPTH_EPS, here and nowhere else: |1 - 0.95| is
      // 0.050000000000000044 in IEEE-754, and a rim-parked enemy must not
      // escape its fire-tick shot by 4.4e-17 (00-config.js, CS008 P1).
      if (Math.abs(sd - e.depth) > C.HIT_DEPTH_TOL + C.HIT_DEPTH_EPS) continue;
      if (!laneHit(well, shot.lane, e.lane)) continue;

      // Consumed retires the shot; the caller's filter frees its slot against
      // the cap the same step, which is what makes camping a thorned lane
      // chip rapidly (GDD 4.2, ⚠ SETTLED — emergent, not a bug to smooth out).
      //
      // ⛔ AND SINCE CS013 P2, LANCE IS THE ONE EXCEPTION, AS ONE TERM (GDD
      // 14.1; T7): a KILL does not consume a pierced shot. `pierce` is the
      // shot's own field, captured at fire time (06-shots.js), and `e.dead` is
      // read after onShot() — so a CHIP, a REFUSAL (the Weaver's bolt, a riding
      // Drifter's armour) and a decline consume or fly on exactly as the enemy
      // decided, with or without Lance. ⛔ THE `break` BELOW STAYS
      // UNCONDITIONAL: a pierced shot still resolves against at most one enemy
      // per step and meets the next on a LATER step, at a depth it has actually
      // travelled to. Letting it walk the rest of the array would make one
      // trigger pull clear a stacked lane, which is the economy above inverted.
      if (e.onShot(shot) && !(shot.pierce && e.dead)) shot.dead = true;
      // ⛔ THE KILL, read off `e.dead` rather than off the return value:
      // onShot() answers "was the shot consumed", which is a different question
      // from "did the enemy die" — a Thorn chips and lives, and a Carrier that
      // splits dies. `e.dead` was false above, so this IS the false -> true
      // transition: the telemetry count (02-state.js's `tally`) and the points
      // (12-scoring.js), and nothing here branches on either.
      if (e.dead) tallyKill(state, e);
      if (e.dead) { state.tally.kills++; addScore(e.points() * comboMult()); comboKill(state); dropToken(state, e); sfx("kill", e.sfxVoice); }
      break;
    }
  }
}

// ---------------------------------------------------------------------------
// Enemies vs the Skimmer (GDD 4.5)
// ---------------------------------------------------------------------------
//
// ⛔ `killDepth` is read off the entity, never a class name (07-enemies.js).
// null means contact NEVER kills — the Weaver, whose projectile is the threat
// and whose body is not. A number is the depth at or past which contact in the
// Skimmer's lane is lethal, and every enemy that has one holds the same rim
// band `1 - C.RIM_CONTACT_DEPTH` at rest. FOUR of the five death conditions are
// that one comparison, which is why it is a field.
//
// ⛔ AND IT IS READ FRESH EVERY STEP BECAUSE ONE ENTITY MUTATES IT. CS005 P3's
// Surger sets killDepth to 0 for its C.SURGE_DISCHARGE window and puts the rim
// band back on the way out (07-enemies.js's setPhase). With 0 the depth test
// below is unconditionally true and the only remaining term is laneHit(), which
// is GDD 4.5 item 3 — "being in a Surger's lane when it discharges" — verbatim.
// ⛔ That is the whole of item 3, and this pass has NO BRANCH for it: caching
// the value, or reading it once per well, or special-casing a class here, would
// each break a death condition that today costs zero lines.
//
// ⛔ THERE IS NO TERM HERE FOR WHERE THE SKIMMER IS, and that is what makes a
// killDepth of 0 mean something other than it looks like. The craft is always
// at depth 1, so `e.depth >= 0` is true at EVERY legal depth: a `killDepth = 0`
// enemy is lethal from the throat, on its spawn step, having travelled nowhere.
// This header predicted 0 for the Drifter until CS005 P2; GDD 4.5 item 2's "any
// depth" is about there being no safe PHASE — a Drifter kills you while it is
// armoured, so you can neither shoot it nor touch it — and the Drifter ships on
// the rim band with everything else. A PERMANENT zero is an unaccountable
// death, and GDD 6.3 names that as the most common complaint about games in
// this genre.
//
// ⛔ AND IT IS STILL TRUE AFTER THE DIVE AND AFTER THE JUMP — BOTH OF WHICH
// THIS HEADER PREDICTED WOULD END IT (CS006 P3, CS012 P5 R3). Neither gave the
// craft a depth:
//
//   the Dive   Game.update() short-circuits the whole gameplay pass while
//              state.dive.active, so this function does not run during one at
//              all. GDD 5's descent depth lives on state.dive and never on the
//              craft (02-state.js, 11-dive.js), and GDD 4.5 item 5 is a strike
//              test in that module rather than a killDepth here.
//   the Jump   airborne is a PHASE on state.jump (05-skimmer.js), and this
//              function SKIPS ITS WHOLE PASS while it holds — see the skip in
//              collideSkimmer() below. Immunity is a return, not an arithmetic
//              comparison, so there is still exactly one two-depth comparison
//              in the build and it is the dive strike's.
//
// ⛔ So `killDepth = 0` on a resting enemy stays as wrong as it was, and no
// future session should "finish" it: the one honest zero is the Surger's
// discharge window, below.
//
// ⚠ WHICH IS WHY THE SURGER'S ZERO IS RIGHT AND THE DRIFTER'S WOULD NOT BE, and
// it is the same number both times. The Surger's lasts C.SURGE_DISCHARGE and is
// preceded by C.SURGE_TELEGRAPH of visible fuse in which the lane is NOT lethal
// (GDD 6.3): the player is told, and then given time. A permanent kill zone is
// not a discharge, and a fuse that kills is not a fuse.
//
// ⛔ THE RIM SWEEP, CS008 P1b (GDD 4.5; PLANNED-FEATURES-CS008.md §1.16, §2b;
// Paul's K1-K4). With fire held, a rim enemy the Skimmer touches dies if a shot
// could kill it — asked AFTER the lane match and BEFORE killSkimmer():
//
//   1. THE FIRE GATE IS state.input.fire, the level every device writes, so
//      touch auto-fire counts. A player not holding fire still dies on contact.
//   2. THE DEPTH GATE IS THE PARK EXPRESSION, `1 - C.RIM_CONTACT_DEPTH`, and no
//      new constant. Its one job is a Surger discharging BELOW the rim, whose
//      killDepth is 0 there: GDD 4.5 item 3 stands.
//   3. ⛔ onShot(), NEVER `e.dead = true`. The enemy decides what a hit does
//      (GDD 6.5): a riding Drifter's armour refuses (item 2 stands), a Weaver
//      bolt declines (item 4 stands), and a Carrier splits through spawnEnemy()
//      exactly as a shot kill does. That is the OPPOSITE of the Purge's
//      ⚠ SETTLED omission below, for the same reason: the Purge is a statement,
//      and this is a shot that never had to fly. `null` is safe — no onShot in
//      the build reads its argument — and "consumed" is ignored, because there
//      is no shot to consume. `kills` counts it; `shotsFired` does not; and
//      it scores `e.points()` exactly as a shot kill does (CS008 P2).
//   4. ⛔ `continue`, NEVER `return`. Every enemy touching this step is asked,
//      stacked ones included, and a Carrier's children appended mid-loop are
//      reached by the index-based walk, exactly as in collideShots().
//
// It sits above killSkimmer()'s invulnerability guard, so an invulnerable craft
// that is firing still kills what it touches: invulnerability suspends dying,
// not playing.
//
// ⛔ WHY CONTACT-SIDE AND NOT SHOT-SIDE — read this before "unifying" it into
// updateShots(). It reads like a bypass of the fire economy, and every shot-
// based alternative was MEASURED short of 24/24 on a full rack (plan §1.16):
// re-arming the cooldown on a fire-lane change is 6/24, because SHOT_MAX
// refuses the re-armed shot; letting that shot ignore SHOT_MAX still leaves C10
// (a rim Vaulter hopping into a mover) at 0/24 and C13 (two Vaulters stacked)
// at 0/24; also testing contact on the FIRE lane lifts C10 only to 18/24 — at
// lane 1.257 the craft fires into lane 1 while the hopping Vaulter at 1.583 is
// 0.326 from contact and 0.583 off the shot's lane — drops C11 to 6/24, and
// leaves C13 at 0/24, because collideShots()' load-bearing `break` resolves one
// enemy per shot per step. The sweep is 24/24 on all thirteen shootable shapes
// and holds all three lethal ones (test-cs008-p1b.js).
//
// ⛔ AND SINCE CS012 P5, ONE SKIP ABOVE ALL OF IT: AIRBORNE (GDD 14.2; O6, R3).
// The whole pass is skipped while state.jump.phase is "air" — contact death
// AND the rim sweep together, because "immune to rim contact and Surger
// discharge" is not a fire-gated privilege and a craft that is off the rim is
// not touching what it flies over. It is ONE return rather than a term per
// death condition, so every contact killer in the roster inherits it at once:
// a Vaulter, a Carrier, a Weaver bolt, a riding or crossing Drifter, a Reaver
// and a Surger's discharge are each staged and mutation-checked in
// test-cs012-p5.js. ⛔ RECOVERY IS NOT COVERED — those C.JUMP_RECOVERY seconds
// are on the rim and lethal, and that is the whole cost of the jump.
function collideSkimmer(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;
  if (jumpAirborne(state)) return;

  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    if (e.killDepth === null || e.killDepth === undefined) continue;
    if (e.depth < e.killDepth) continue;
    if (!laneHit(well, e.lane, sk.lane)) continue;
    // ⛔ The rim sweep — the header above, and the four decisions in it.
    if (state.input.fire && e.depth >= 1 - C.RIM_CONTACT_DEPTH) {
      e.onShot(null);
      if (e.dead) { state.tally.rimSweepKills++; tallyKill(state, e); }
      if (e.dead) { state.tally.kills++; addScore(e.points() * comboMult()); comboKill(state); dropToken(state, e); sfx("kill", e.sfxVoice); continue; }
    }
    killSkimmer(state);
    return;   // one death per step, whatever else is touching
  }
}

// ⛔ THE ONE PLACE THE PLAYER DIES (GDD 4.4, 4.5). Every one of the five death
// conditions ends here, which is why the invulnerability guard, the life, the
// freeze and the game-over stop are written once rather than per condition.
//
// ⛔ WHAT IS NOT HERE, AND WHY. The respawn is not: Game.update() does not run
// during hit-stop, so a timer started on this line would not advance for the
// whole 1.2 s. The respawn is the first LIVE step after the freeze — the step
// that sees `skimmer.dead` — and it lives in respawnSkimmer() (23-main.js).
// GDD 4.4's rim push goes with it, for the same reason: pushing here would
// teleport the killing enemy away during the freeze the player is staring at,
// and the freeze exists to show them what happened.
//
// ⛔ No fragmentation and no score. The fragmentation is drawFragments()
// (14-render-entities.js), drawn by Game.draw() off the freeze this function
// starts, and a death costs no points. What it DOES write for scoring is
// state.diedThisWell, GDD 7's "no death" bonus (12-scoring.js).
function killSkimmer(state) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;

  // ⛔ AN INVULNERABLE SKIMMER CANNOT DIE, and the guard is HERE rather than in
  // the collision pass so the four death conditions still to come get it for
  // free: CS004 added item 4 (the Weaver's bolt), CS005 added items 2 and 3 (the
  // Drifter and the Surger, and neither cost this function a line), and CS006
  // adds item 5 with the Dive. An
  // invulnerable craft can still fire and still move: invulnerability suspends
  // dying, not playing. state.invulnTime counts UP and is armed to zero by the
  // respawn (02-state.js), so "expired" is the at-or-past-threshold case.
  if (state.invulnTime < C.RESPAWN_INVULN) return;

  // ⛔ THE WARD ABSORBS IT, AND THAT IS NOT A DEATH (GDD 14.1, 4.4, 4.5; CS013
  // T9; 10-powerups.js). BELOW the guard, deliberately and for the same reason
  // `diedThisWell`, `deaths` and the combo are: a hit the guard declined was
  // never a hit, and spending the shell on one would cost the player a free hit
  // they never used. Above everything else, because nothing below this line
  // happened — ⛔ no life, no `diedThisWell`, no `tally.deaths`, no combo loss,
  // no freeze and no stop. GDD 14.1's "one free hit".
  //
  // What it DOES buy is the respawn's window and its blink, and nothing else
  // (T9): state.invulnTime counts UP and is armed to zero here exactly as
  // respawnSkimmer() arms it, so the player has C.RESPAWN_INVULN to leave.
  // ⛔ NO RIM PUSH — nobody died, and the enemy that touched is still there;
  // C.SURGE_DISCHARGE < C.RESPAWN_INVULN already covers a discharge running
  // through the window.
  //
  // ⛔ ONE AT A TIME (T5): the flag is a boolean, so a second Ward collected
  // while shelled is collected, sounds, and changes nothing.
  // ⛔ Unconditional, like comboDeath() below — state.powers is never written
  // outside Overdrive, so this is one boolean read in Classic and no branch.
  // ⛔ A DIVE NEVER REACHES IT: startDive() calls resetTokens(), so no Ward
  // survives the clear and the Thorn strike (GDD 4.5 item 5) cannot be absorbed.
  if (state.powers.ward) {
    state.powers.ward = false;
    state.invulnTime = 0;
    sfx("wardBreak");
    return;
  }

  sk.dead = true;
  state.lives -= 1;
  // ⛔ Below the invulnerability guard, so a declined kill is not a death.
  // enterWell() is the only thing that clears it.
  state.diedThisWell = true;
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`). Counted HERE and never derived
  // as START_LIVES - lives: CS008's extra-life awards raise `lives` mid-run,
  // and the derived form would start quietly under-reporting the moment they
  // land. Below the invulnerability guard, so a declined kill is not a death.
  state.tally.deaths++;
  sfx("death");

  // ⛔ THE COMBO IS ×1 AT ONCE (GDD 14.4; O3; 12-scoring.js), and BELOW the
  // invulnerability guard for the same reason `diedThisWell` and `deaths` are:
  // a kill the guard declined is not a death, so it is not a combo loss either.
  // ⛔ Unconditional — comboDeath() is a no-op in Classic, so this function
  // stays free of a mode branch, exactly as `jump.latched` below does.
  comboDeath(state);

  // ⛔ THE BUTTON IS RE-LATCHED BY DEATH. Devices are still drained during
  // hit-stop (23-main.js — a freeze must not dump a second of banked mouse
  // motion into the first live step), so a Purge held across the freeze arrives
  // at the step after it looking like a fresh press. Forcing the latch true
  // makes that step read as "still held": the button needs a genuine release
  // before it can spend another charge. updatePurge() writes the latch as
  // `held` every step rather than only clearing it on release, which is what
  // lets this forced value behave correctly on the way out.
  state.purgeLatched = true;

  // ⛔ AND THE JUMP BUTTON WITH IT (CS012 P5; O6), for the identical reason and
  // by the identical mechanism: updateJump() writes `latched` as `held` every
  // step, so forcing it true here makes the first live step after the freeze
  // read as "still held" and the button needs a genuine release before it can
  // take off again. ⛔ Unconditional — in Classic updateJump() never runs, so
  // the field is written and never read, which costs nothing and keeps this
  // function free of a mode branch.
  state.jump.latched = true;

  // ⛔ THE STOP (GDD 4.4). Its menu is CS008 P5's (23-main.js). ⛔ The run's
  // record is NOT taken here but in frame(), after the steps (CS011 P3): a clear
