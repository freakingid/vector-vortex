  // enemy has no well reference — `well` is handed to update() and draw() and
  // deliberately not to onShot(), because what a hit DOES is not a question
  // about geometry (GDD 6.5).
  onShot(shot) {
    this.dead = true;

    const row = CARGO[this.cargo];
    if (!row) return true;   // unknown cargo carries nothing, exactly as an
                             // unknown kind spawns nothing. Never a throw.

    const well = WELLS[state.wellIndex];
    const lanes = splitLanes(well, this.lane);
    spawnEnemy(row.kind, lanes[0], this.depth);
    spawnEnemy(row.kind, lanes[1], this.depth);
    return true;
  }
}

// ---------------------------------------------------------------------------
// The Weaver (GDD 6.1, 4.5) — open spiral, first at L5, 50 points. Climbs
// partway laying a Thorn, retreats; fires down-lane. ONE LANE, never hops.
// Killed by any shot or the Purge; ⛔ ITS BODY NEVER KILLS.
// ---------------------------------------------------------------------------
//
// ⛔ killDepth = null, AND IT IS THE FIELD'S FIRST null IN THE ROSTER. GDD 4.5
// item 4 is "a Weaver's PROJECTILE", not a Weaver, so contact is harmless at
// every depth INCLUDING the rim — a Weaver sitting on top of the Skimmer is a
// nuisance and not a death. That is what the base class's null case was written
// for (GDD 6.5), and it is why the collision pass needs no branch for this
// enemy: it already skips a null killDepth.
//
// ⛔ blocksClear STAYS true. A Weaver you never shoot is an enemy you never
// answered — a well that cleared around one would let a player wait out the
// only Classic enemy that cannot hurt them directly, which is the opposite of
// the pressure GDD 2's loop is built on.
//
// ⛔ IT TOUCHES NO LANE HELPER, the same absence of code the Carrier's "never
// hops" is (GDD 6.1). `lane` is written once, by the constructor.
//
// THE CYCLE, and it should be nameable by a player watching it — it comes up,
// it leaves a thorn, it spits, it goes back down:
//
//   climb     depth rises at C.WEAVER_CLIMB toward C.WEAVER_APEX
//   hold      C.WEAVER_APEX_HOLD seconds at the apex; ⛔ EXACTLY ONE bolt
//   retreat   depth falls at C.WEAVER_RETREAT, which is FASTER, back to 0
//   climb     …
//
// ⛔ THE PHASE IS THE STATE, AND THE TIMER COUNTS UP (GDD 16.3 — there are no
// countdown clocks anywhere in this build). `fired` is a per-cycle latch and
// not a cooldown: a cooldown would fire again on a long hold and "one bolt per
// cycle" would quietly become "one bolt per C.WEAVER_APEX_HOLD".
class Weaver extends Enemy {
  // `dir` is ignored — a Weaver never hops. The spawner still spends its draw
  // on one (08-spawner.js), which is what keeps the run's ONE stream aligned
  // regardless of which kind came out of the throat.
  constructor(lane, depth) {
    super(lane, depth);

    // ⛔ Explicit, not inherited-and-forgotten. The base already defaults to
    // null, and writing it here is what makes the ONE enemy that means it
    // visibly mean it rather than looking like an override somebody missed.
    this.killDepth = null;

    // "climb" | "hold" | "retreat". ⛔ The phase is the whole state machine —
    // there is no second flag saying which way depth is moving, because two
    // fields that must agree are a bug waiting for a phase to be added.
    this.phase = "climb";
    this.holdTimer = 0;   // counts UP toward C.WEAVER_APEX_HOLD
    this.fired = false;   // ⛔ per-CYCLE latch, cleared on entering the hold

    // The Thorn this Weaver is growing (CS004 P4). ⛔ AN INSTANCE FIELD AND NOT
    // state: nothing outside this Weaver needs to know which segment is its,
    // and a Thorn outlives the Weaver that laid it. It is re-resolved through
    // thornInLane() whenever it is missing or dead, which is also how a SECOND
    // Weaver arriving in this lane adopts the first one's Thorn rather than
    // standing a second one up behind it.
    this.thorn = null;
  }

  // GDD 6.1's "climbs partway LAYING A THORN", filled in by CS004 P4. Called
  // every step of the climb phase and nowhere else, so a retreating Weaver
  // neither grows nor shortens what it left behind.
  //
  // ⛔ IT ONLY EVER GROWS. `if (tip > thorn.depth)` is not defensive
  // programming, it is the rule: the Thorn's depth is a LENGTH (07-enemies.js's
  // `anchored`), the Weaver's is a POSITION, and the cycle sends that position
  // back to the throat every time round. An unconditional `thorn.depth = tip`
  // would saw the Thorn back down to nothing on the second climb, which is not
  // laying — it is the Weaver eating its own work while the player watches.
  // It is also what makes "a Weaver killed mid-climb leaves its Thorn at the
  // length it reached" true by construction rather than by luck.
  //
  // ⛔ IT ADOPTS A LIVE THORN IN ITS LANE RATHER THAN CREATING A SECOND. Two
  // overlapping Thorns are two hit-point pools behind one silhouette: a GDD 1.1
  // P2 failure (the player cannot see how much is left) and a scoring oddity
  // (CS007 pays per chip) at once. The lookup is what makes a second Weaver
  // arriving in this lane extend the first one's segment.
  //
  // ⛔ THROUGH spawnEnemy(), the one entry point (GDD 6.5) — the third
  // non-spawner caller, after the Carrier's split and this class's own fire().
  // GDD 6.3's safe-spawn rule is harmless here, and precisely because a Weaver
  // GROWS a Thorn instead of dropping a finished one: it is created at the
  // Weaver's own depth, one climb step above the throat, where the rule has
  // nothing to do. ⚠ Worth knowing anyway, because it is reachable from the
  // debug bench, which can stage a Weaver deep in the Skimmer's lane: applied
  // to an anchored entity that rule does not lower a position, it SHORTENS a
  // length — the same trap `anchored` fixes in respawnSkimmer(). It is harmless
  // HERE only because the grow below runs on the same step and writes the tip
  // back up to the Weaver's own depth. ⛔ Do not reorder those two.
  //
  // A refusal (C.ENEMY_CAP, ⛔ counted before any RNG draw is spent, so a full
  // board costs the run's one stream nothing) simply means no Thorn this step;
  // the next climb step tries again.
  layThorn(well, state) {
    if (!this.thorn || this.thorn.dead) this.thorn = thornInLane(state, well, this.lane);
    if (!this.thorn) {
      this.thorn = spawnEnemy("thorn", this.lane, this.depth);
      if (!this.thorn) return;
    }
    // GDD 8's "clamp: lane length". The tip tracks the Weaver's own depth,
    // never past C.THORN_MAX.
    const tip = this.depth > C.THORN_MAX ? C.THORN_MAX : this.depth;
    if (tip > this.thorn.depth) this.thorn.depth = tip;
  }

  update(dt, well, state) {
    if (this.phase === "climb") {
      // ⛔ Monotonic on the way up and it STOPS at the apex. The guard is
      // `depth < APEX` rather than an unconditional clamp so a Weaver that
      // ARRIVED above the apex — the debug row stages one as deep as
      // C.SAFE_SPAWN_DEPTH, and CS006's heat curve will move the apex under
      // live entities — turns around from where it is instead of teleporting
      // down to the line. Depth never rises above where it started in that
      // case, so [0, 1] holds either way.
      if (this.depth < C.WEAVER_APEX) {
        this.depth += C.WEAVER_CLIMB * dt;
        if (this.depth > C.WEAVER_APEX) this.depth = C.WEAVER_APEX;
      }

      this.layThorn(well, state);

      if (this.depth >= C.WEAVER_APEX) {
        this.phase = "hold";
        this.holdTimer = 0;
        this.fired = false;
      }
      return;
    }

    if (this.phase === "hold") {
      // ⛔ THE FIRST STEP OF THE HOLD, ONCE. Firing on arrival rather than on
      // departure is what gives the player the whole hold to read a bolt that
      // is already travelling while its parent is still visibly at the apex —
      // GDD 1.1 P2, legible before lethal. The latch is what makes it one bolt
      // and not one per step of the hold.
      if (!this.fired) {
        this.fired = true;
        this.fire();
      }
      this.holdTimer += dt;
      if (this.holdTimer >= C.WEAVER_APEX_HOLD) this.phase = "retreat";
      return;
    }

    // retreat — faster than the climb, and it stops at the throat rather than
    // passing it. Depth < 0 is no more legal than depth > 1.
    this.depth -= C.WEAVER_RETREAT * dt;
    if (this.depth <= 0) {
      this.depth = 0;
      this.phase = "climb";
    }
  }

  // ⛔ THROUGH spawnEnemy(), THE ONE ENTRY POINT (GDD 6.5) — the second
  // non-spawner caller in the build, after the Carrier's split, and it inherits
  // the same three things for free:
  //
  //   1. C.ENEMY_CAP. A bolt refused on a full board is simply not fired, and
  //      the cycle moves on — the latch is set either way, so a blocked shot
  //      is a lost beat and never a bolt held over into the next cycle.
  //   2. ⛔ GDD 6.3's safe-spawn rule, which is reachable here: a Weaver
  //      staged above C.SAFE_SPAWN_DEPTH in the Skimmer's lane fires a bolt
  //      that is LOWERED to that line rather than starting on top of the
  //      craft. Lowering only ever gives the player more time.
  //   3. One RNG draw from the run's ONE stream, spent on a `dir` a bolt has
  //      no use for. ⛔ Deliberate: a kind that skipped the draw would make the
  //      stream depend on what was in the well, and GDD 17.1's replay
  //      guarantee is exactly that dependency not existing.
  //
  // The current well is read the way spawnEnemy() itself reads it; `well` is
  // handed to update() and this is called from inside it.
  fire() {
    spawnEnemy("weaverBolt", this.lane, this.depth);
  }

  draw(ctx, well) {
    drawWeaver(ctx, well, this.lane, this.depth);
  }

  // Any shot kills it and the shot is spent (GDD 6.1) — 50 points, when CS007
  // builds addScore(). It leaves no bolt behind: what is already in the air
  // stays in the air, and nothing new is fired.
  onShot(shot) {
    this.dead = true;
    return true;
  }
}

// ---------------------------------------------------------------------------
// The Weaver's bolt (GDD 4.5 item 4) — the projectile, and GDD 4.5's FOURTH
// DEATH CONDITION, live, with no new collision code.
// ---------------------------------------------------------------------------
//
// ⛔ IT IS CALLED WeaverBolt AND NOT Shot. `Shot` (06-shots.js) is the PLAYER'S
// and travels the other way — rim to throat, on a clock, killed by the throat.
// Confusing the two inside the collision pass is precisely the mistake that is
// invisible in review: both are lane-locked, both have a `depth`, and the two
// arrays they live in are tested against each other every step.
//
// ⛔ IT IS AN ENEMY, IN state.enemies, LIKE EVERYTHING ELSE (GDD 6.5's one
// array). The flags below are what make it behave like a projectile; a second
// array for "hostile projectiles" would double all six wiring points to save
// three field writes.
//
//   killDepth    the rim band — ⛔ `1 - C.RIM_CONTACT_DEPTH`, the same
//                expression the Vaulter and the Carrier use, so retuning the
//                band moves every rim-contact entity together.
//   blocksClear  ⛔ false. A bolt in flight must not hold a cleared well open:
//                the Weaver that fired it is already dead in that scenario, and
//                a well that waited for its last projectile would end on a
//                pause the player cannot shorten (they cannot shoot it).
//   purgeable    true. The panic button saves you from it, which is what a
//                panic button is for (GDD 4.3).
//   anchored     false, inherited. Its depth is a POSITION.
class WeaverBolt extends Enemy {
  constructor(lane, depth) {
    super(lane, depth);
    this.killDepth = 1 - C.RIM_CONTACT_DEPTH;
    this.blocksClear = false;
  }

  // ⛔ IT DIES AT depth 1 WHETHER OR NOT IT HIT ANYTHING, so bolts cannot
  // accumulate: a Weaver left alone fires one per cycle forever, and without
  // this the board fills with spent ordnance and C.ENEMY_CAP starves the
  // spawner.
  //
  // ⛔ THE DEATH IS THE STEP AFTER THE ARRIVAL, NOT THE ARRIVAL ITSELF, and the
  // ordering is why: Game.update() runs the entity pass, then the collision
  // pass, and collideSkimmer() skips anything already `dead`. Killing on the
  // step depth reaches 1 would make the rim step non-lethal. The bolt is lethal
  // from `killDepth` (0.95) upward — about nine steps at C.WEAVER_BOLT_SPEED —
  // so this is belt and braces rather than the only guard, and it is written
  // this way so the belt does not depend on the braces.
  //
  // `well` and `state` are unused: a bolt has no topology and no AI. The
  // signature is the contract's (GDD 6.5), not this entity's.
  update(dt, well, state) {
    if (this.depth >= 1) {
      this.dead = true;
      return;
    }
    this.depth += C.WEAVER_BOLT_SPEED * dt;
    if (this.depth > 1) this.depth = 1;
  }

  draw(ctx, well) {
    drawWeaverBolt(ctx, well, this.lane, this.depth);
  }

  // ⚠ SETTLED — THE BOLT IS NOT SHOOTABLE. Returning false means the shot is
  // NOT consumed and flies on to whatever is behind (GDD 6.5). Two reasons,
  // and the second is the one that matters: a shootable bolt is a free score
  // piñata, and it removes the lesson, which is that a Weaver's OUTPUT is
  // dodged rather than answered. Rotating out of the lane is the answer; there
  // is no second one.
  //
  // ⚠ A DECLINED SHOT STILL COSTS ITS RESOLUTION FOR THE FEW STEPS OF OVERLAP,
  // because collideShots()'s `break` is UNCONDITIONAL (09-collision.js) — one
  // shot resolves against at most one enemy per step, consumed or not. So a
  // bolt briefly shields whatever is behind it. That is the same mechanism
  // CS005's armoured Drifter depends on, it is ~3 steps against eight shots in
  // flight and a 0.055 s cooldown, and it is NOT a bug. Do not make that break
  // conditional to "fix" it.
  onShot(shot) {
    return false;
  }
}

// ---------------------------------------------------------------------------
// The Thorn (GDD 6.1, 4.2, 4.3, 5, 8) — a bright lane segment, first at L5,
// 5 points per chip. Static. Laid by a Weaver, killed only by shots, and its
// real consequence is the Dive.
// ---------------------------------------------------------------------------
//
// ⛔ IT IS NOT AN ENEMY IN ANY NORMAL SENSE, AND IT LIVES IN state.enemies
// ANYWAY (GDD 6.5's one array). It does not move, the Purge does not touch it,
// it does not hold a well open, and contact with it is harmless until CS006's
// Dive exists. Every one of those is a FLAG the machinery CS003 already built
// reads off the entity — so the Thorn costs the Purge, the clear check, the
// collision pass and the entity pass exactly nothing. A second array for
// "hazards" would double all six wiring points to save one boolean.
//
// ⛔ ITS `depth` IS THE TIP OF AN EXTENT ROOTED AT THE THROAT, NOT A POSITION.
// That is what `anchored = true` declares (the base class above), and it is
// load-bearing in two places pulling opposite ways:
//
//   respawnSkimmer()  SKIPS it (23-main.js). GDD 4.4's rim push clamps depth
//                     down to 0.55 on every player death; on a length that is
//                     not a push, it is a free chip nobody earned, applied
//                     silently in the one place nobody would look.
//   collideShots()    does NOT skip it (09-collision.js). Its one-line hit test
//                     is `|shotDepth - e.depth| <= HIT_DEPTH_TOL`, and that is
//                     exactly right on a Thorn BECAUSE depth is the tip: a shot
//                     stops where the Thorn starts. Move the extent to a second
//                     field and that pass grows a Thorn branch — which is the
//                     thing the contract exists to prevent.
//
// ⚠ SETTLED — GDD 4.2's RAPID CHIP-AWAY IS EMERGENT AND IS NOT A BUG. onShot
// CONSUMES the shot, and Game.update()'s end-of-frame filter frees that shot's
// slot against C.SHOT_MAX the SAME step — so camping a thorned lane chips it
// down fast. It is in the original, it is deliberate, and ⛔ it must not be
// rate-limited: no cooldown, no per-step chip cap, no invulnerability window.
// There is nothing here to add one to, and that is the point.
class Thorn extends Enemy {
  // `dir` is ignored — a Thorn has no heading and never moves. The spawner
  // still spends its draw on one (08-spawner.js), which is what keeps the
  // run's ONE stream aligned regardless of which kind came out of the throat.
  constructor(lane, depth) {
    super(lane, depth);

    // ⛔ GDD 4.3's "does not remove Thorns", as the flag the Purge already
    // reads. The roster's first false — and the reason the Purge needs no
    // special case for it, in either of its two uses.
    this.purgeable = false;

    // ⛔ GDD 5: a Thorn is still standing during the Dive. That is what this
    // flag MEANS here, not an oversight in wellCleared() — a well full of
    // Thorns and nothing else is a cleared well, and the Thorns are the thing
    // the player then has to thread between.
    this.blocksClear = false;

    // Contact never kills. ⛔ GDD 4.5 item 5 is "a Thorn DURING THE DIVE", and
    // there is no Dive — CS006 owns it, and it will not be a killDepth: the
    // Dive is its own sequence with its own rule, not a rim band.
    this.killDepth = null;

    // ⛔ THE ONLY true IN THE CLASSIC ROSTER. See the header above.
    this.anchored = true;
  }

  // ⛔ NOTHING. It is static, its lane never changes, and its length is written
  // only by the Weaver that is growing it and by onShot below. The signature is
  // the contract's (GDD 6.5), not this entity's.
  update(dt, well, state) {}

  draw(ctx, well) {
    drawThorn(ctx, well, this.lane, this.depth);
  }

  // ⛔ CHIP, THEN CONSUME. The shot stopped at the tip — that is what the
  // collision pass's one-line depth test means on an entity whose depth is its
  // tip — so it does not fly on to whatever is sheltering behind the Thorn.
  //
  // ⛔ Clamped at zero on the way out. depth < 0 is no more legal than depth > 1
  // (GDD 3.2), the entity is dead either way, and leaving a negative length in
  // the array for the rest of the step is a number no other system can produce.
  onShot(shot) {
    this.depth -= C.THORN_CHIP;
    if (this.depth <= 0) {
      this.depth = 0;
      this.dead = true;
    }
    return true;
  }
}

// The live Thorn in `lane`, or null. ⛔ laneDelta, NEVER a bare subtraction: on
// a 16-lane Ring, lane 15 and lane 0 are neighbours and `a - b` says fifteen
// (03-wells.js). C.HIT_LANE_TOL is "the same lane" as the rest of the build
// already defines it — half a lane either side — so a Thorn this finds is
// exactly a Thorn a shot fired down that lane would hit, and there is no second
// idea of sameness to keep in step.
//
// ⚠ `instanceof`, where the Purge and the clear check read a flag. That is not
// an inconsistency: those two ask what an entity DOES, and the answer belongs
// on the entity. This asks which entity a Weaver is growing, which is a question
// about identity — and inventing an eighth contract field to answer it is
// exactly the slope GDD 6.5 warns about at the base class.
function thornInLane(state, well, lane) {
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !(e instanceof Thorn)) continue;
    if (Math.abs(laneDelta(well, lane, e.lane)) <= C.HIT_LANE_TOL) return e;
  }
  return null;
}

// ==========================================================================
// 08-spawner.js
// ==========================================================================
// 08-spawner.js — what releases enemies into a well, and what decides the well
// is finished (GDD 2, 6.3, 6.5, 12, 16.3).
//
// ⛔ ONE ENTRY POINT: spawnEnemy(kind, lane, depth). Every enemy that enters
// state.enemies comes through it — the interval spawner below, and CS004's
// Carrier split, which is not a spawn the player can predict but is still an
// enemy appearing in a lane. That is the whole reason this is a function
// rather than three call sites doing `state.enemies.push(new Vaulter(...))`:
// GDD 6.3's safe-spawn rule and C.ENEMY_CAP are enforced in ONE place, so a
// later enemy inherits them instead of re-implementing them (and forgetting).
//
// ⛔ EVERY DRAW COMES FROM state.rng (01-rng.js). Nothing here reaches for the
// platform generator — GDD 17.1's replay guarantee is the reason, and the
// suite scans the built file for it.
//
// ⛔ The two numbers live in state.spawn (02-state.js): `timer` counts UP
// toward C.SPAWN_INTERVAL, `remaining` is a count spent downward. Neither is a
// countdown clock (GDD 16.3).

// The kind table. ⛔ A spawn names a kind as a STRING and this table is the one
// place a string becomes a class — CS004's Carrier split asks for "vaulter" by
// name and gets whatever this row says, so the roster grows here and nowhere
// else. `dir` is the initial heading, drawn from the run's stream by the
// caller and handed in, so an enemy that has no use for one simply ignores it.
const ENEMY_KINDS = {
  vaulter: (lane, depth, dir) => new Vaulter(lane, depth, dir),
  // ⛔ ONE ROW PER CARRIER VARIANT, not one row for "a Carrier". The cargo is
  // half of what the entity IS (GDD 6.2 — reading the glyph is the skill), so
  // it belongs in the string, exactly as the class it becomes belongs in this
  // table. CS005's two rows are carrierDrifter and carrierSurger, alongside
  // their CARGO entries (07-enemies.js). `dir` is ignored: a Carrier never
  // hops, and the draw for it is still spent (see spawnEnemy below).
  carrierVaulter: (lane, depth) => new Carrier(lane, depth, "vaulter"),
  // `dir` is ignored by both of these too: a Weaver never hops and a bolt
  // travels the lane it was fired in. The draw is still spent — see spawnEnemy.
  weaver: (lane, depth) => new Weaver(lane, depth),
  // ⛔ A ROW FOR THE PROJECTILE, because the projectile is an enemy in the one
  // array like everything else (GDD 6.5). Weaver.fire() asks for it by name, so
  // the bolt inherits C.ENEMY_CAP and GDD 6.3's safe-spawn rule for free —
  // exactly as the Carrier's split does. ⚠ It is NOT a GDD 6.1 roster row, so
  // it is not counted among the enemies in scratchpad/test-registry.js.
  weaverBolt: (lane, depth) => new WeaverBolt(lane, depth),
  // ⛔ A ROW FOR THE THORN, and `depth` here is the only place in this table
  // where that argument is not a POSITION: a Thorn's depth is the TIP OF AN
  // EXTENT rooted at the throat (07-enemies.js's `anchored`). Weaver.layThorn()
  // asks for one at the Weaver's own depth, one climb step above the throat,
  // and grows it from there — which is exactly why GDD 6.3's safe-spawn
  // LOWERING below is harmless on it. ⚠ A caller that asked for a finished
  // full-length Thorn in the Skimmer's lane would not have it lowered, it would
  // have it SHORTENED; nothing does, and nothing should.
  thorn: (lane, depth) => new Thorn(lane, depth),
};

// How many enemies may be alive at once. ⛔ The MIN of the two, and they are
// not the same kind of number: C.ENEMY_CONCURRENT is the difficulty knob
// (CS006's heat curve raises it), C.ENEMY_CAP is a readability ceiling that is
// never raised for difficulty. Reading only one of them is how a retune of the
// knob quietly walks past the ceiling.
function spawnLimit() {
  return Math.min(C.ENEMY_CONCURRENT, C.ENEMY_CAP);
}

// Is `lane` the Skimmer's lane? ⛔ laneDelta, never (a - b): on a Ring, lane 15
// and lane 0 are neighbours (03-wells.js).
//
// The Skimmer's lane is CONTINUOUS — a player parked between two centres is
// half in each — so "its lane" is anything within one lane of it rather than
// Math.round()'s single answer. The wider reading is the safe direction to be
// wrong in: it declines a spawn the player might have been under, and the cost
// of declining is one lane redrawn.
function inSkimmerLane(well, lane, skimmer) {
  if (!skimmer || skimmer.dead) return false;
  return Math.abs(laneDelta(well, lane, skimmer.lane)) < 1;
}

// ⛔ THE ONLY WAY AN ENEMY ENTERS THE WELL. Returns the enemy, or null if the
// spawn was refused. Refusals are not errors — a caller that cares checks the
// return, and the interval spawner below spends no quota on one.
//
// It owns two rules:
//
//   ⛔ GDD 6.3 — never spawn in the Skimmer's lane above C.SAFE_SPAWN_DEPTH.
//      Enforced by LOWERING the depth to the safe line rather than by moving
//      the lane or refusing: a Carrier split has to put its two children
//      somewhere specific (GDD 6.2's "adjacent" / "flanking"), and relocating
//      them sideways would break the shape the player is being taught to read.
//      Dropping one deeper only ever gives the player more time.
//
//   ⛔ C.ENEMY_CAP — the readability ceiling, refused outright. It is not a
//      difficulty knob and this is the one place it is enforced.
function spawnEnemy(kind, lane, depth) {
  const make = ENEMY_KINDS[kind];
  if (!make) return null;
  if (state.enemies.length >= C.ENEMY_CAP) return null;

  const well = WELLS[state.wellIndex];
  const l = laneNormalize(well, lane);
  let d = depth || 0;
  if (d < 0) d = 0;
  if (d > 1) d = 1;
  if (d > C.SAFE_SPAWN_DEPTH && inSkimmerLane(well, l, state.skimmer)) {
    d = C.SAFE_SPAWN_DEPTH;
  }

  // ⛔ The heading comes from the run's ONE stream, so a replay of the seed
  // produces the same well. Drawn here rather than in the caller so every
  // spawn spends exactly one draw on it and the stream stays aligned.
  const dir = state.rng() < 0.5 ? -1 : 1;
  const e = make(l, d, dir);
  state.enemies.push(e);
  return e;
}

// ⚠ TEMPORARY, with C.DEBUG_SPAWN_KINDS (00-config.js). Which kind the
// interval spawner releases next. GDD 8.1's introduction schedule is what
// decides this for real — at which point the constant and this function both
// go, and nothing else has to change, because updateSpawner() below asks a
// function rather than naming a kind.
//
// ⛔ A ONE-ENTRY LIST SPENDS NO DRAW, AND THAT IS NOT AN OPTIMISATION.
// rngPick() on a single-element array still advances the run's ONE stream
// (01-rng.js), and the stream is shared: one extra draw per spawn moves every
// spawn lane in every run, including the 10,000-tick replay GDD 17 item 1
// hashes. The game shipped without this function, so the no-choice case has to
// spend exactly what the old `spawnEnemy("vaulter", ...)` literal did — which
// is nothing. There is no genuine choice to make, so no randomness is spent
// making it.
function pickSpawnKind(state) {
  const kinds = C.DEBUG_SPAWN_KINDS;
  if (kinds.length < 2) return kinds[0];
  return rngPick(state.rng, kinds);
}

// A lane for the next interval spawn. Draws from state.rng and redraws up to
// C.SPAWN_LANE_TRIES times to avoid stacking a new enemy on one that is still
// in the throat zone — two silhouettes at the same lane and nearly the same
// depth read as one, which is GDD 1.1 P2 ("legible before lethal") failing at
// the moment the player has the most time to react.
//
// ⛔ BOUNDED, and it settles for the last draw rather than looping until it is
// happy. An unbounded search spends a board-dependent number of draws, and the
// run's stream is shared: the next spawn, and everything else that draws,
// would shift depending on what happened to be on screen.
//
// C.READABILITY_DEPTH is "the throat zone" as the build already defines it
// (GDD 10.3) — the band where nothing opaque is drawn because nothing down
// there can be read. Reusing it is deliberate; a second constant for the same
// band would be two numbers to keep in step.
function pickSpawnLane(state, well) {
  let lane = rngInt(state.rng, well.lanes);
  for (let i = 1; i < C.SPAWN_LANE_TRIES && laneCrowded(state, well, lane); i++) {
    lane = rngInt(state.rng, well.lanes);
  }
  return lane;
}

// Is something already sitting in this lane, down in the throat zone?
function laneCrowded(state, well, lane) {
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    if (e.depth > C.READABILITY_DEPTH) continue;
    if (Math.abs(laneDelta(well, lane, e.lane)) < 1) return true;
  }
  return false;
}

// Re-arm for a fresh well. ⛔ enterWell() (23-main.js) is the only caller —
// resetting the spawner without also clearing state.enemies leaves the
// previous well's craft in a well that may have fewer lanes.
function resetSpawner(state) {
  state.spawn.timer = 0;
  state.spawn.remaining = C.SPAWN_QUOTA;
}

// One simulation step of the spawner. Called from Game.update() AFTER the
// enemy pass and its filter, so the alive count it reads is this step's truth
// and not last step's plus whatever died a moment ago.
//
// ⛔ The timer HOLDS at the interval instead of growing past it. A spawn
// blocked by the concurrency limit therefore fires the instant a slot frees,
// which is what keeps the pressure constant; a timer that reset on a blocked
// beat would make a busy well quieter exactly when it should not be, and one
// that grew without bound would dump the backlog all at once.
function updateSpawner(state, well, dt) {
  const sp = state.spawn;
  if (sp.remaining <= 0) return;

  if (sp.timer < C.SPAWN_INTERVAL) sp.timer += dt;
  if (sp.timer < C.SPAWN_INTERVAL) return;
  if (state.enemies.length >= spawnLimit()) return;

  // Depth 0 is the throat — the far aperture, the only place a well releases
  // an enemy from. GDD 3.2's convention, not a magic number.
  const lane = pickSpawnLane(state, well);
  const e = spawnEnemy(pickSpawnKind(state), lane, 0);
  if (!e) return;              // refused (the cap): the quota is not spent

  sp.timer = 0;
  sp.remaining--;
}

// ⛔ TWO CONDITIONS, NOT ONE (GDD 2). The quota must be spent AND nothing that
// blocks the clear may be left alive. "The array is empty" alone is true one
// tick after startGame() and in every gap between spawns, and a well that
// cleared itself before releasing anything is the bug this exists to prevent.
//
// `blocksClear` is read off the entity, never a class name: CS004's Thorn is
// the first false, and that is exactly why a Thorn is still standing in the
// lane during the Dive (GDD 5) rather than being an oversight here.
function wellCleared(state) {
  if (state.spawn.remaining > 0) return false;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (!e.dead && e.blocksClear) return false;
  }
  return true;
}

// ==========================================================================
// 09-collision.js
// ==========================================================================
// 09-collision.js — the one collision pass, and the Purge (GDD 4.2, 4.3, 4.5,
// 6.5).
//
// ⛔ COLLISION IS 1-D. A lane match plus an overlap on `depth`, and nothing
// else. No trigonometry, no screen coordinates, no distance in pixels — every
// entity's position is (lane, depth) (GDD 3.2) and the projection that turns
// that into an x/y exists only inside draw code. Writing 2-D geometry into
// entity logic is the single most common source of subtle bugs in this kind of
// game: the moment a hit test reads a projected point, the same overlap starts
// passing at the rim and failing at the throat, because perspective() is not
// linear.
//
// ⛔ ONE PASS, in a FIXED ORDER: shots against enemies, then enemies against
// the Skimmer, each iterating its array front to back. GDD 17.1's replay
// guarantee is why — the same seed and the same recorded inputs must pick the
// same target every time, and "whichever one the loop happened to reach first"
// is only deterministic if the loop order is written down.
//
// ⛔ Called from Game.update() AFTER the entity pass and BEFORE the end-of-frame
// filters. Nothing here removes an array element; hits set `dead = true` and
// the caller's .filter() does the removal (GDD 6.5). Never splice mid-loop.
//
// ⛔ No scoring. addScore() is CS007's single entry point, and the way to keep
// it single is to not build a temporary second one here. C.PTS_VAULTER and
// C.PURGE_SAVED_BONUS are deliberately unread this changeset.

// Are two lanes the same lane, to within the contact tolerance? ⛔ laneDelta,
// never (a - b): on a 16-lane Ring the distance from lane 15.9 to lane 0 is
// +0.1, and the bare subtraction says 15.9 — a shot fired across the seam would
// miss the thing it is pointed at (03-wells.js).
function laneHit(well, a, b) {
  return Math.abs(laneDelta(well, a, b)) <= C.HIT_LANE_TOL;
}

// ---------------------------------------------------------------------------
// Shots vs enemies (GDD 4.2)
// ---------------------------------------------------------------------------
//
// ⛔ ONE SHOT RESOLVES AGAINST AT MOST ONE ENEMY PER STEP — the `break` below is
// unconditional, not conditional on consumption. A shot the enemy declines to
// consume (GDD 6.2's armour, and 07-enemies.js's base-class default) flies on
// and meets whatever is behind it on a LATER step, at a depth it has actually
// travelled to. Letting it walk the rest of the array in the same step would
// make one trigger pull kill a whole stacked lane, which is exactly the
// chip-away economy GDD 4.2 is built around inverted.
//
// The enemy decides what a hit does, not this pass: it only asks. That is what
// keeps CS004's Thorn (chip, consume) and an armoured entity (no damage, do not
// consume) out of here as special cases.
//
// ⚠ SETTLED — AN ENEMY MAY PUSH INTO state.enemies FROM INSIDE onShot, WHILE
// THIS LOOP IS ITERATING IT. CS004's Carrier does exactly that: a shot kills it
// and it splits into two children through spawnEnemy() (07-enemies.js), which
// appends to the array `j` is walking. That is safe, and it is safe because of
// three separate decisions rather than by luck:
//
//   1. the inner loop is INDEX-BASED and re-reads `.length` every iteration, so
//      an appended child is simply part of the array — nothing is invalidated,
//      no iterator is live across the push;
//   2. the `break` below is UNCONDITIONAL, so the shot that caused the split
//      stops here and cannot walk forward into the children it just created;
//   3. removal is still Game.update()'s end-of-frame `.filter()` — the dead
//      parent is skipped by `e.dead` for the rest of this step and removed
//      afterwards. Nothing is spliced mid-loop (GDD 6.5).
//
// ⛔ Do not "fix" this into a deferred spawn queue: a queue would put the
// children on the board one step late, at a depth they never occupied, and buy
// nothing. Do not make the `break` conditional either — that is item 2, and it
// is load-bearing for this as well as for the chip-away economy above.
//
// ⛔ NO TUNNELING CHECK IS NEEDED, and here is the arithmetic so a future
// session does not add one: a shot crosses C.SHOT_TIME (0.52 s) of depth in
// one step of C.FIXED_DT, i.e. 1/0.52/60 ≈ 0.032 depth units, and the hit band
// is 2 * C.HIT_DEPTH_TOL = 0.10 wide. The band is wider than the step, so a
// shot cannot step over an enemy. Retuning SHOT_TIME below ~0.3 s, or
// HIT_DEPTH_TOL below ~0.017, breaks that and would need swept-interval logic.
function collideShots(state, well) {
  for (let i = 0; i < state.shots.length; i++) {
    const shot = state.shots[i];
    if (shot.dead) continue;
    const sd = shot.depth();

    for (let j = 0; j < state.enemies.length; j++) {
      const e = state.enemies[j];
      if (e.dead) continue;
      if (Math.abs(sd - e.depth) > C.HIT_DEPTH_TOL) continue;
      if (!laneHit(well, shot.lane, e.lane)) continue;

      // Consumed retires the shot; the caller's filter frees its slot against
      // C.SHOT_MAX the same step, which is what makes camping a thorned lane
      // chip rapidly (GDD 4.2, ⚠ SETTLED — emergent, not a bug to smooth out).
      if (e.onShot(shot)) shot.dead = true;
      break;
    }
  }
}

// ---------------------------------------------------------------------------
// Enemies vs the Skimmer (GDD 4.5)
// ---------------------------------------------------------------------------
//
// ⛔ `killDepth` is read off the entity, never a class name (07-enemies.js).
// null means contact NEVER kills — the Weaver, whose projectile is the threat
// and whose body is not. A number is the depth at or past which contact in the
// Skimmer's lane is lethal: the Vaulter's is the rim band, the Drifter's will
// be 0 (lethal at any depth, GDD 4.5 item 2). Three of the five death
// conditions are that one comparison, which is why it is a field.
function collideSkimmer(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;

  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    if (e.killDepth === null || e.killDepth === undefined) continue;
    if (e.depth < e.killDepth) continue;
    if (!laneHit(well, e.lane, sk.lane)) continue;
    killSkimmer(state);
    return;   // one death per step, whatever else is touching
  }
}

// ⛔ THE ONE PLACE THE PLAYER DIES (GDD 4.4, 4.5). Every one of the five death
// conditions ends here, which is why the invulnerability guard, the life, the
// freeze and the game-over stop are written once rather than per condition.
//
// ⛔ WHAT IS NOT HERE, AND WHY. The respawn is not: Game.update() does not run
// during hit-stop, so a timer started on this line would not advance for the
// whole 1.2 s. The respawn is the first LIVE step after the freeze — the step
// that sees `skimmer.dead` — and it lives in respawnSkimmer() (23-main.js).
// GDD 4.4's rim push goes with it, for the same reason: pushing here would
// teleport the killing enemy away during the freeze the player is staring at,
// and the freeze exists to show them what happened.
//
// ⛔ No fragmentation and no score. Both are CS007's — the fragmentation is a
// kit-fx primitive, and addScore() is the one scoring entry point. Death in
// CS003 reads as hit-stop plus a respawn blink.
function killSkimmer(state) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;

  // ⛔ AN INVULNERABLE SKIMMER CANNOT DIE, and the guard is HERE rather than in
  // the collision pass so the four death conditions still to come get it for
  // free: CS004 adds item 4 (the Weaver's bolt), CS005 adds items 2 and 3 (the
  // Drifter and the Surger), and CS006 adds item 5 with the Dive. An
  // invulnerable craft can still fire and still move: invulnerability suspends
  // dying, not playing. state.invulnTime counts UP and is armed to zero by the
  // respawn (02-state.js), so "expired" is the at-or-past-threshold case.
  if (state.invulnTime < C.RESPAWN_INVULN) return;

  sk.dead = true;
  state.lives -= 1;

  // ⛔ THE BUTTON IS RE-LATCHED BY DEATH. Devices are still drained during
  // hit-stop (23-main.js — a freeze must not dump a second of banked mouse
  // motion into the first live step), so a Purge held across the freeze arrives
  // at the step after it looking like a fresh press. Forcing the latch true
  // makes that step read as "still held": the button needs a genuine release
  // before it can spend another charge. updatePurge() writes the latch as
  // `held` every step rather than only clearing it on release, which is what
  // lets this forced value behave correctly on the way out.
  state.purgeLatched = true;

  // ⛔ THE STOP, not a screen (GDD 4.4). CS007 owns the game-over UI, the score
  // submission and the restart flow; all this changeset does is stop stepping
  // the gameplay systems, in Game.update(). The freeze below still runs — the
  // last death of a run reads exactly like the others.
  if (state.lives <= 0) {
    state.lives = 0;
    state.screen = "gameover";
  }

  // ⛔ Simulation time freezes; rendering does not. Game.hitStop() is the one
  // freeze mechanism in the build (23-main.js) and the longest request wins.
  Game.hitStop(C.HIT_STOP_DEATH);
}

// ---------------------------------------------------------------------------
// The Purge (GDD 4.3)
// ---------------------------------------------------------------------------
//
// ⛔ ONE CHARGE PER WELL, re-armed by enterWell() and NEVER accumulated.
// state.purgeUses counts UP (GDD 16.3 — no countdown timers anywhere in the
// build) and is the whole rule:
//
//   1st use   every enemy with `purgeable` dies. ⛔ Non-purgeable ones are
//             untouched — GDD 4.3's "does not remove Thorns", read off the
//             entity's flag rather than a class name, which is what keeps this
//             two rules instead of a growing list of exceptions.
//   2nd use   exactly ONE enemy dies, the purgeable one nearest the rim. No
//             bonus. The weak second use is what converts the Purge from a spam
//             button into a decision.
//   3rd+      nothing.
//
// ⛔ No bonus and no points here (GDD 7 is CS007's). C.PURGE_SAVED_BONUS reads
// state.purgeUses === 0 when it lands; that is why this is a count and not the
// boolean CS003 P2 shipped.

// The second use's victim: the purgeable enemy nearest the RIM (highest depth).
//
// ⛔ THE TIE-BREAK IS PART OF THE FEATURE, not an implementation detail. GDD 4.3
// says "deterministically, so the player can predict it", so: highest depth,
// then lowest lane, then array order. The strict comparisons below are what
// give the last of those three for free — an equal candidate never displaces
// the one already held, so the earliest survivor of a full tie wins.
function purgeTarget(state) {
  let best = null;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !e.purgeable) continue;
    if (best === null) { best = e; continue; }
    if (e.depth > best.depth) { best = e; continue; }
    if (e.depth === best.depth && e.lane < best.lane) best = e;
  }
  return best;
}

// One simulation step of the Purge.
//
// ⛔ state.input.purge IS A LEVEL, NOT AN EDGE. All four devices in 04-input.js
// write a HELD boolean into the one input struct (GDD 9.5) — there is no
// "pressed this frame" anywhere in the build, and adding one to the input
// module would be a second input shape for every device to get right. So the
// edge is detected HERE: state.purgeLatched is simply "the button was held last
// step", and the charge is spent only on a false -> true transition. Holding
// the button down for a whole well spends exactly one charge.
//
// ⛔ CS003 P4 SETS state.purgeLatched ON DEATH, and this is why it can: input
// devices are still drained during hit-stop (23-main.js, deliberate — a freeze
// must not dump a second of banked mouse motion into the first live step), so a
// Purge held through a death arrives at the step after the freeze looking like
// a fresh press. Forcing the latch true makes that step read as "still held",
// and the button needs a genuine release before it fires again. Writing the
// latch as `held` every step, rather than only clearing it on release, is what
// makes that forced value survive correctly.
function updatePurge(state) {
  const held = !!state.input.purge;
  const rising = held && !state.purgeLatched;
  state.purgeLatched = held;
  if (!rising) return;

  state.purgeUses++;

  // ⚠ SETTLED — THE PURGE KILLS, IT DOES NOT ASK. Both branches below set
  // `dead` directly and NEITHER calls onShot(). That is why a Purge on a well
  // of CS004 Carriers leaves it empty instead of doubling it: splitting lives
  // in Carrier.onShot (07-enemies.js), and the Purge never goes there.
  //
  // ⛔ Do not route this through onShot "for consistency". The two are not the
  // same question — a shot asks the enemy what a hit does (GDD 6.5), and the
  // Purge is GDD 4.3's panic button, which is a statement rather than a
  // question. A panic button that doubles the enemy count is not a panic
  // button. This works by OMISSION, which is exactly the kind of thing that
  // gets "unified" by a later session, so it is written down here.
  if (state.purgeUses === 1) {
    for (let i = 0; i < state.enemies.length; i++) {
      const e = state.enemies[i];
      if (!e.dead && e.purgeable) e.dead = true;
    }
    return;
  }

  if (state.purgeUses === 2) {
    const victim = purgeTarget(state);
    // A second use with nothing left to kill is still SPENT. The charge is
    // consumed by the press, not by the result — otherwise a player could bank
    // the weak use by firing it into an empty well.
    if (victim) victim.dead = true;
  }
  // Third and later: nothing. The counter keeps rising so a HUD (CS007) can
  // tell "spent" from "spent twice" without a second field.
}

// The whole pass, in its fixed order. Called once per simulation step from
// Game.update().
function updateCollisions(state, well) {
  collideShots(state, well);
  collideSkimmer(state, well);
}

// ==========================================================================
// 13-render-well.js
// ==========================================================================
// 13-render-well.js — the well renderer (GDD 3.6, 3.7, 10.2). Consumes the
// depth model from 03-wells.js (rimPoint/throatPoint/screenPos/wellVertCount)
// and draws lanes + rim/throat rings. No game state read here beyond what a
// caller passes in — this module is pure `(ctx, well, level, laneState) -> pixels`.
//
// ⛔ Two primitives only: drawPoly (path builder, no fill) and glowStroke (two
// strokes composited with `lighter`, wide-and-dim then thin-and-bright). GDD
// 10.2: no per-entity pipelines, no fills, no sprites, no textures.
//
// Occupancy/shot/charge lighting (laneState) is wired through drawWell now so
// callers arriving later (shots, enemies, Surger) need no renderer change —
// it does nothing until a caller ever passes a lit lane, since none exists yet.

// Build a canvas 2D path from a point array. `closed` draws the final
// rim[n-1] -> rim[0] edge; open strips omit it (GDD 3.3's loop/strip split).
function drawPoly(ctx, points, closed) {
  if (!points.length) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  if (closed) ctx.closePath();
}

// Two-pass glow stroke on an already-built path: wide+dim, then thin+bright,
// composited with `lighter`. ⛔ Caller must have called ctx.beginPath()+path
// commands (e.g. via drawPoly) immediately before this, since it re-strokes
// the CURRENT path twice rather than taking a point array itself — that keeps
// the multi-segment lane case (draw once, stroke twice) cheap.
function glowStroke(ctx, color, width, alpha) {
  const a = alpha === undefined ? 1 : alpha;
  const prevOp = ctx.globalCompositeOperation;
  const prevAlpha = ctx.globalAlpha;
  const prevWidth = ctx.lineWidth;
  const prevStyle = ctx.strokeStyle;

  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = color;

  ctx.lineWidth = width * C.GLOW_WIDE_W;
  ctx.globalAlpha = C.GLOW_WIDE_ALPHA * a;
  ctx.stroke();

  ctx.lineWidth = width;
  ctx.globalAlpha = C.GLOW_THIN_ALPHA * a;
  ctx.stroke();

  ctx.globalCompositeOperation = prevOp;
  ctx.globalAlpha = prevAlpha;
  ctx.lineWidth = prevWidth;
  ctx.strokeStyle = prevStyle;
}

// Depth-varying line weight (GDD 10.1 — vector hardware couldn't do this).
// Linear in depth: thin at the throat, thick at the rim.
function laneLineWidth(depth) {
  const d = depth < 0 ? 0 : (depth > 1 ? 1 : depth);
  return C.LINE_W_THROAT + (C.LINE_W_RIM - C.LINE_W_THROAT) * d;
}

// GDD 3.6 band colour for a level. Past 99 the shape and heat hold and colour
// comes from the seeded RNG — `rng` is a 0..1 draw the caller supplies
// (mulberry32, per GDD 16.1); the RNG itself is never owned by this module.
function wellBandColor(level, rng) {
  if (level > 99) {
    const palette = C.BAND_RNG_COLORS;
    const r = rng === undefined ? 0 : rng;
    const i = Math.min(palette.length - 1, Math.floor(r * palette.length));
    return palette[i];
  }
  for (const band of C.BAND_COLORS) {
    if (level <= band.hi) return band.color;
  }
  return C.BAND_COLORS[C.BAND_COLORS.length - 1].color;
}

// GDD 3.7 — the dim band. Levels 65-80 render at DIM_BAND_ALPHA; everything
// else is fully opaque. ⚠ SETTLED — the band and its alpha are not tuning
// targets (GDD 3.7); do not adjust either from here.
function wellBaseAlpha(level) {
  return (level >= C.DIM_BAND_LO && level <= C.DIM_BAND_HI) ? C.DIM_BAND_ALPHA : 1.0;
}

// Project a normalized-space point array (well.rim or wellThroat(well)) into
// screen space via C.WELL_CX/CY/RADIUS — the same mapping screenPos uses, but
// applied to a whole polygon at once for the rim/throat rings, which sit at a
// single depth and so need no per-point perspective easing.
function projectPoly(points) {
  const out = new Array(points.length);
  for (let i = 0; i < points.length; i++) {
    out[i] = {
      x: C.WELL_CX + points[i].x * C.WELL_RADIUS,
      y: C.WELL_CY + points[i].y * C.WELL_RADIUS,
    };
  }
  return out;
}

// Draw one well: rim ring, throat ring, and every lane's rim->throat spoke.
//
//   well       from WELLS (03-wells.js)
//   level      game.level — drives band colour (GDD 3.6) and dim band (3.7)
//   laneState  optional per-lane lighting: array indexed by lane, each entry
//              `{ occupied, shotTravel, surgeCharge }` or falsy. Any truthy
//              flag lights that lane at LANE_LIT_ALPHA regardless of the dim
//              band — GDD 3.7's "lanes light on occupancy, shot travel, and
//              Surger charge" escape hatch. No caller supplies this yet.
//   rng        0..1 draw for the past-99 palette (wellBandColor); unused
//              otherwise.
function drawWell(ctx, well, level, laneState, rng) {
  const color = wellBandColor(level, rng);
  const baseAlpha = wellBaseAlpha(level);
  const rim = projectPoly(well.rim);
  const throat = projectPoly(wellThroat(well));
  const vcount = wellVertCount(well);

  // Rim and throat rings, each a single flat-weight stroke (they sit at one
  // depth apiece, so there is no line-weight gradient to apply within them).
  drawPoly(ctx, rim, well.closed);
  glowStroke(ctx, color, C.LINE_W_RIM, baseAlpha);

  drawPoly(ctx, throat, well.closed);
  glowStroke(ctx, color, C.LINE_W_THROAT, baseAlpha);

  // Spokes: rim vertex -> throat vertex at every vertex index, one spoke per
  // index. Each spoke bounds up to two lanes (the one ending here and the one
  // starting here — GDD 3.3's lane IS the edge between two consecutive rim
  // vertices, so a spoke is shared exactly where two lanes meet). A spoke
  // lights if EITHER neighbouring lane is lit; a closed well's spoke 0 wraps
  // to lane `lanes-1` on one side, and an open well's end spokes (0 and
  // vcount-1) have only one neighbouring lane.
  for (let i = 0; i < vcount; i++) {
    const laneEndingHere = well.closed ? (i - 1 + well.lanes) % well.lanes : i - 1;
    const laneStartingHere = well.closed ? (i % well.lanes) : i;
    const lit = laneState && (
      isLaneLit(laneState[laneEndingHere]) || isLaneLit(laneState[laneStartingHere])
    );
    const alpha = lit ? Math.max(baseAlpha, C.LANE_LIT_ALPHA) : baseAlpha;

    ctx.beginPath();
    ctx.moveTo(rim[i].x, rim[i].y);
    ctx.lineTo(throat[i].x, throat[i].y);
    glowStroke(ctx, color, laneLineWidth(0.5), alpha);
  }
}

// laneState is a sparse array; an out-of-range index (open-well end spokes)
// reads undefined, which this treats as unlit.
function isLaneLit(s) {
  return !!s && (s.occupied || s.shotTravel || s.surgeCharge);
}

// ==========================================================================
// 14-render-entities.js
// ==========================================================================
// 14-render-entities.js — entity draw code, kept apart from 06-shots.js so the
// glow/particle primitives here can move into kit-fx wholesale later (CLAUDE.md
// "Modules built here, destined for the kit"). CS002 P3 added the shot streak;
// CS003 P1 adds the shared entity projection helper and the Vaulter; CS004 P2
// adds the Carrier's hull and its cargo glyphs, P3 the Weaver and its bolt, and
// P4 the Thorn — which is the first entity here that is NOT a silhouette at a
// point and so does not use entityPoints() at all. See drawThorn() at the foot.
//
// ⛔ drawPoly + glowStroke only (GDD 10.2). No fill, no sprite, no texture.
//
// ⛔ Readability contract (GDD 10.3): nothing opaque below C.READABILITY_DEPTH.
// A shot's leading edge fades linearly to nothing as it nears the throat,
// rather than snapping to invisible at the boundary or staying legible into
// the throat zone. GDD 10.3 carries the reason that band is a rule at all.
//
// ⛔ GDD 18 item 1 / CLAUDE.md: the title this game is an homage to is not
// written in any file in this repo, comments included — this one used to name
// it and CS004 P5 removed it. `src/` is concatenated into the shipped artifact,
// so a comment here is a string in dist/vector-vortex.html.

// Preallocated projection scratch — one point per end of the streak. Like
// screenPos() and skimmerPoints(), this makes drawShot() non-reentrant; it is
// a leaf call, so that is fine.
const _shotHead = { x: 0, y: 0 };
const _shotTail = { x: 0, y: 0 };

// 1 at/above READABILITY_DEPTH; below it, fades linearly to 0 at the throat.
function shotAlpha(depth) {
  if (depth >= C.READABILITY_DEPTH) return 1;
  return depth <= 0 ? 0 : depth / C.READABILITY_DEPTH;
}

// A short streak from the shot's leading edge (toward the throat) back to its
// trailing edge (toward the rim), C.SHOT_LEN deep. The trailing edge is capped
// at depth 1 — a shot fired this instant must not draw a tail past the rim.
function drawShot(ctx, well, lane, depth) {
  const tail = depth + C.SHOT_LEN > 1 ? 1 : depth + C.SHOT_LEN;
  screenPos(well, lane, depth, _shotHead);
  screenPos(well, lane, tail, _shotTail);
  drawPoly(ctx, [_shotHead, _shotTail], false);
  glowStroke(ctx, C.SKIMMER_COLOR, laneLineWidth(depth), shotAlpha(depth));
}

// ---------------------------------------------------------------------------
// entityPoints — the shared silhouette projection. ALL NINE ENEMIES USE THIS.
// ---------------------------------------------------------------------------
//
// A local-space point array `poly` becomes screen points for an entity sitting
// at (lane, depth). Each point is:
//
//   l   lane offset in HALF-WIDTH units. l = ±1 is ±size/2 lanes, so the
//       silhouette spans exactly `size` lane widths at its extremes.
//   d   depth offset in HALF-EXTENT units, ±1, measured in PERSPECTIVE SPACE
//       and scaled by C.ENEMY_DEPTH_SCALE. Positive is toward the rim.
//
// ⛔ THE TRAP, AND IT IS NOT OBVIOUS. perspective() is depth^0.55, and screenPos
// lerps LINEARLY in perspective space. A silhouette built with a CONSTANT depth
// offset — the way SKIMMER_POLY is, correctly, because the Skimmer never leaves
// depth 1 — therefore covers about 13% of the well's screen length at the
// throat and about 3% at the rim. An enemy drawn that way is huge when it is
// far away and shrinks as it comes at you: the exact inverse of perspective,
// and it reads as a bug in the well, not in the enemy.
//
// So the depth extent is a fraction of the entity's OWN perspective position:
// half-extent = p * C.ENEMY_DEPTH_SCALE, converted back to a depth through
// invPerspective(). Screen size then falls off with distance the same way the
// lane width already does, and one constant tunes every enemy.
//
// The whole shape is pulled inward when it would otherwise reach past the rim,
// rather than letting invPerspective's clamp collapse the outer points onto the
// rim line. A rim-hunting Vaulter is the enemy the player most needs to read at
// a glance (GDD 1.1 P2), and it sits at exactly the depth where the clamp would
// flatten it into a different silhouette.
//
// ⛔ No per-frame allocation (GDD 17, perf budget). Each poly memoizes its own
// scratch array of screen points on first use — the same non-enumerable cache
// pattern wellThroat() uses, and for the same reason. Consequences: the array
// is SHARED, so copy out of it if you need to keep it, and entityPoints is
// non-reentrant PER POLY. Draw calls are sequential leaves, so that is fine.
function entityScratch(poly) {
  if (!poly._pts) {
    const pts = new Array(poly.length);
    for (let i = 0; i < poly.length; i++) pts[i] = { x: 0, y: 0 };
    Object.defineProperty(poly, "_pts", { value: pts, enumerable: false });
  }
  return poly._pts;
}

function entityPoints(well, lane, depth, poly, size) {
  const out = entityScratch(poly);
  const half = size / 2;
  const scale = C.ENEMY_DEPTH_SCALE;

  // The largest outward reach this shape asks for, and the centre position that
  // keeps it inside the rim. At depth 1 the shape sits with its outermost
  // points ON the rim and the rest inside it — the same relationship the
  // Skimmer's prongs have with the rim, arrived at from the other direction.
  let maxD = 0;
  for (let i = 0; i < poly.length; i++) if (poly[i].d > maxD) maxD = poly[i].d;
  const pMax = 1 / (1 + maxD * scale);
  let p = perspective(depth);
  if (p > pMax) p = pMax;

  for (let i = 0; i < poly.length; i++) {
    const q = poly[i];
    // ⛔ The lane offset is NOT normalized. On an open well an end-lane entity
    // reaches past the wall, and polyAt's backstop clamps it to the end vertex
    // — the silhouette flattens against the wall instead of teleporting to the
    // far side of the well. Normalizing here would wrap it (closed) or square
    // it off half a lane early (open), and the first is GDD 3.5's bug wearing
    // a rendering hat.
    screenPos(well, lane + q.l * half, invPerspective(p * (1 + q.d * scale)), out[i]);
  }
  return out;
}

// ---------------------------------------------------------------------------
// The Vaulter's silhouette (GDD 6.1, 18).
// ---------------------------------------------------------------------------
//
// GDD 6.1's flattened X, as one CLOSED concave outline: four arms reaching out
// across the lanes, a waist pinched in at each side, and a notch top and
// bottom. Wider across the lanes than it is deep — the flattening — so it reads
// as a wingspan blocking a lane rather than as a diamond.
//
// ⛔ GDD 18 item 3: this has to be OURS. The shape Atari's is remembered for is
// a bowtie — two solid triangles meeting at a point, with nothing pinched and
// no notch. The four notches are the difference, and they are load-bearing, not
// decoration. Do not "simplify" this back to six points.
//
// Shape DATA, the same class of thing as WELLS' rim polygons. The scale is the
// tunable, and it lives in C.VAULTER_SIZE.
const VAULTER_POLY = [
  { l: -1.00, d: -0.55 },   // upper-left arm tip
  { l: -0.30, d:  0.00 },   // left waist
  { l: -1.00, d:  0.55 },   // lower-left arm tip
  { l:  0.00, d:  0.26 },   // near notch
  { l:  1.00, d:  0.55 },   // lower-right arm tip
  { l:  0.30, d:  0.00 },   // right waist
  { l:  1.00, d: -0.55 },   // upper-right arm tip
  { l:  0.00, d: -0.26 },   // far notch
];

// ⛔ drawPoly + glowStroke, one closed path, no fill (GDD 10.2). Line weight
// tracks depth exactly as the well's lanes do (laneLineWidth), so the craft
// belongs to the geometry it is climbing rather than sitting on top of it.
//
// ⛔ FULL ALPHA AT EVERY DEPTH — no shotAlpha()-style fade here. GDD 10.3 is a
// rule about what may be drawn OVER the throat zone (explosions, particles,
// popups); the enemy is the approaching thing that rule protects. Fading a
// Vaulter into the throat is the readability failure, not the fix for it.
function drawVaulter(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, VAULTER_POLY, C.VAULTER_SIZE), true);
  glowStroke(ctx, C.VAULTER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Carrier's silhouette (GDD 6.1, 6.2, 18) — a hollow diamond hull with a
// cargo glyph inside it.
// ---------------------------------------------------------------------------
//
// ⛔ THE TWO SHAPES READ AS ONE ENTITY AND ARE TWO POLYS. entityPoints()
// memoizes a scratch array PER POLY ARRAY (see its header), so a second poly
// costs one more projection loop and zero allocation. Drawing the glyph as
// extra points on the hull's own path would join them with a stroke and turn
// two shapes into one scribble.
//
// ⛔ GDD 18 item 3: ours, not Atari's. GDD 6.1 names the silhouette — a hollow
// diamond — and a rhombus outline is generic geometry, so the divergence has to
// live somewhere else, and it does: the PROPORTION (this one is deep rather
// than long, which is what makes it read as a container beside the Vaulter's
// wide shallow X), the glyph, and GDD 10.1's depth-varying line weight and
// glow. If a future pass wants more separation, add it here — do not reach for
// a name or a colour from the game this is an homage to.
//
// Shape DATA, the same class of thing as WELLS' rim polygons. The lane extent
// is scaled by C.CARRIER_SIZE; the depth extent is NOT (entityPoints scales `d`
// by C.ENEMY_DEPTH_SCALE alone), so the ±0.85 below is what makes the hull
// deeper than the Vaulter's ±0.55 at the same distance.
const CARRIER_POLY = [
  { l:  0.00, d: -0.85 },   // far tip, toward the throat
  { l:  1.00, d:  0.00 },
  { l:  0.00, d:  0.85 },   // near tip, toward the rim
  { l: -1.00, d:  0.00 },
];

// ⛔ ONE GLYPH PER CARGO, keyed by the CARGO name (07-enemies.js). GDD 6.2 says
// reading the glyph fast is the skill that separates competent from good, so
// the design rule for a new row is legibility at THROAT depth, not detail at
// the rim: two or three points, one unmistakable gesture, and no feature that
// survives only at full size. CS005's rows are drifter and surger.
//
// The Vaulter's is a chevron aimed at the player — an OPEN path, so it never
// reads as a second closed outline nested in the hull, and angled rather than
// flat so it cannot be mistaken for a piece of the diamond it sits in. Its
// extents are ~42% of the hull's on both axes (0.34 / 0.80 across the lanes,
// 0.36 / 0.85 on depth), which is what keeps it visibly INSIDE the hull at
// every depth but one: at the rim, entityPoints clamps every poly so its
// outermost point lands exactly ON the rim, so the chevron's apex and the
// hull's near tip meet there. That is inherent to the clamp, it happens to
// both, and it is the depth at which the Carrier is about to kill you rather
// than the depth at which you are reading its cargo.
const CARGO_GLYPHS = {
  vaulter: [
    { l: -1.00, d: -0.36 },
    { l:  0.00, d:  0.36 },
    { l:  1.00, d: -0.36 },
  ],
};

// ⛔ drawPoly + glowStroke, no fill (GDD 10.2), and FULL ALPHA AT EVERY DEPTH
// for the same reason the Vaulter has it: GDD 10.3 governs what may be drawn
// OVER the throat zone, and the enemy is the approaching thing that rule
// protects.
//
// ⚠ The glyph is stroked in C.CARRIER_COLOR, the hull's own colour, rather than
// in the cargo's. The palette note in 00-config.js is why: hue alone cannot
// separate eight simultaneous things, so silhouette carries the read and the
// palette's job is narrower. A cargo-coloured glyph is a real option for the
// first art pass — it is one lookup — but it is an art decision and it is not
// this phase's to make.
function drawCarrier(ctx, well, lane, depth, cargo) {
  drawPoly(ctx, entityPoints(well, lane, depth, CARRIER_POLY, C.CARRIER_SIZE), true);
  glowStroke(ctx, C.CARRIER_COLOR, laneLineWidth(depth), 1);

  // An unknown cargo draws the hull and nothing else, matching the way an
  // unknown kind spawns nothing and an unknown cargo carries nothing. A
  // Carrier with no glyph is visibly wrong; a thrown exception is a black
  // screen.
  const glyph = CARGO_GLYPHS[cargo];
  if (!glyph) return;
  drawPoly(ctx, entityPoints(well, lane, depth, glyph, C.CARRIER_GLYPH_SIZE), false);
  glowStroke(ctx, C.CARRIER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Weaver's silhouette (GDD 6.1, 18) — GDD 6.1's OPEN SPIRAL.
// ---------------------------------------------------------------------------
//
// ⛔ AN OPEN PATH. drawPoly's `closed` argument is false for this one, and it is
// not a stylistic choice: a spiral that closes is a set of nested boxes, and the
// unwinding is the whole read. This is the roster's first open silhouette.
//
// ⛔ IT MUST NOT READ AS A THREAT THE WAY THE VAULTER DOES, BECAUSE IT IS NOT
// ONE. Its body never kills (07-enemies.js — killDepth is null); what the
// player is afraid of is what it LEAVES and what it FIRES. So there are no arm
// tips, no points aimed at the rim, and nothing that reads as a wingspan
// blocking a lane. A coil unwinding in place is the opposite gesture: busy,
// occupied, indifferent to you.
//
// ⛔ GDD 18 item 3: ours, not Atari's. The shape that game's equivalent is
// remembered for is a rod with a wave running along it — a straight spine,
// which this deliberately has none of.
//
// A rectangular coil, four turns, wound outward from the centre. `l` reaches
// exactly ±1 at the extremes, so C.WEAVER_SIZE means what it means on every
// other silhouette: the lane widths the shape spans. The inner turns are the
// first thing lost at throat depth and that is correct — the outer sweep is
// what carries the read down there.
//
// Shape DATA, the same class of thing as WELLS' rim polygons.
const WEAVER_POLY = [
  { l:  0.00, d:  0.00 },   // the eye of the coil
  { l:  0.30, d:  0.00 },
  { l:  0.30, d:  0.34 },
  { l: -0.40, d:  0.34 },
  { l: -0.40, d: -0.44 },
  { l:  0.66, d: -0.44 },
  { l:  0.66, d:  0.70 },
  { l: -1.00, d:  0.70 },
  { l: -1.00, d: -0.90 },
  { l:  1.00, d: -0.90 },   // the loose end, trailing toward the throat
];

// ⛔ drawPoly + glowStroke, ONE OPEN path, no fill (GDD 10.2), and FULL ALPHA AT
// EVERY DEPTH for the same reason the Vaulter and the Carrier have it: GDD 10.3
// governs what may be drawn OVER the throat zone, and the enemy is the
// approaching thing that rule protects.
function drawWeaver(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, WEAVER_POLY, C.WEAVER_SIZE), false);
  glowStroke(ctx, C.WEAVER_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Weaver's bolt (GDD 4.5 item 4, 18) — a small dart, aimed at the rim.
// ---------------------------------------------------------------------------
//
// ⛔ IT HAS TO READ AS AIMED, because dodging it is the only answer the player
// has (it is not shootable — 07-enemies.js). So: a tip toward the RIM, two
// barbs swept back toward the throat, and a notched tail. Closed, small, and
// deliberately unlike both of the other two shapes it will share a lane with —
// the Carrier's cargo chevron is open and has no tip, and the Weaver that fired
// this has no straight edges at all.
//
// The depth extent reaches d = 1, the largest in the roster, so entityPoints'
// rim clamp holds it a fraction further off the rim than a Vaulter at the same
// depth. That is the right way round: the tip is what the player is reading.
const WEAVER_BOLT_POLY = [
  { l:  0.00, d:  1.00 },   // tip, toward the rim
  { l:  1.00, d: -0.40 },
  { l:  0.00, d:  0.00 },   // notched tail
  { l: -1.00, d: -0.40 },
];

// ⛔ Its own colour, a paler relative of its parent's (00-config.js), so a bolt
// is legibly the Weaver's output rather than a second Weaver. ⚠ Both are
// provisional, as the whole enemy palette is.
function drawWeaverBolt(ctx, well, lane, depth) {
  drawPoly(ctx, entityPoints(well, lane, depth, WEAVER_BOLT_POLY, C.WEAVER_BOLT_SIZE), true);
  glowStroke(ctx, C.WEAVER_BOLT_COLOR, laneLineWidth(depth), 1);
}

// ---------------------------------------------------------------------------
// The Thorn (GDD 6.1, 4.2, 10.2, 10.3, 18) — a bright lane segment.
// ---------------------------------------------------------------------------
//
// ⛔ entityPoints() DOES NOT APPLY HERE, AND THAT IS NOT AN OVERSIGHT. Every
// other enemy is a silhouette AT a point: a local-space poly projected around
// one (lane, depth). A Thorn is a SEGMENT ALONG the lane, from the throat to
// its tip, and it has no local-space shape at all — it is the same class of
// drawing as a shot's streak or the well's own spokes. The pattern it reuses is
// drawShot()'s at the top of this file: preallocated scratch points, screenPos
// per end, drawPoly, glowStroke. CS005's Surger telegraph is the other one.
//
// ⛔ NO PER-FRAME ALLOCATION (GDD 17's perf budget). The two point PAIRS are
// preallocated as well as the points, because `drawPoly(ctx, [a, b])` allocates
// an array literal every call — cheap, and still an allocation in a per-frame
// path with up to C.ENEMY_CAP Thorns in it.
const _thornRoot = { x: 0, y: 0 };   // the throat end — always depth 0
const _thornNeck = { x: 0, y: 0 };   // C.THORN_TIP_LEN back from the tip
const _thornTip  = { x: 0, y: 0 };
const _thornBody = [_thornRoot, _thornTip];
const _thornCrown = [_thornNeck, _thornTip];

// ⛔ FULL ALPHA AT EVERY DEPTH, INCLUDING INSIDE THE THROAT ZONE. GDD 10.3 is a
// rule about what may be drawn OVER that zone — explosions, particles, score
// popups, the things that hide an approaching enemy. A Thorn is not drawn over
// the well, it IS lane geometry, and the player has to be able to see which
// lanes are thorned from the moment one starts growing. Fading it would be the
// readability failure, exactly as it would be on a Vaulter.
//
// The tip is brighter because it is drawn TWICE — glowStroke composites with
// `lighter`, so the last C.THORN_TIP_LEN of the segment accumulates both
// strokes. ⛔ That is why there is no second colour and no alpha split: a chip
// landing is a visible step of the bright band down the lane, and one constant
// controls how much band there is.
//
// Line weight follows the well's own spokes (13-render-well.js): a stroke that
// spans a range of depths takes the weight of its MIDPOINT, because a single
// stroke has one width and the lane it lies in is getting narrower. The body's
// midpoint is depth/2; the crown sits at the tip and is therefore the wider of
// the two, which is the right way round for the thing the player is aiming at.
function drawThorn(ctx, well, lane, depth) {
  const tip = depth > 1 ? 1 : (depth < 0 ? 0 : depth);
  if (tip <= 0) return;   // a Thorn with no length yet — the step a Weaver
                          // stands one up. Nothing to draw, and drawing it
                          // would be a zero-length path.

  screenPos(well, lane, 0, _thornRoot);
  screenPos(well, lane, tip, _thornTip);
  drawPoly(ctx, _thornBody, false);
  glowStroke(ctx, C.THORN_COLOR, laneLineWidth(tip / 2), 1);

  const neck = tip - C.THORN_TIP_LEN;
  screenPos(well, lane, neck < 0 ? 0 : neck, _thornNeck);
  drawPoly(ctx, _thornCrown, false);
  glowStroke(ctx, C.THORN_COLOR, laneLineWidth(tip), 1);
}
