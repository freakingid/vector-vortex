// climbing enemy — lethal from the throat on its spawn step, having travelled
// nowhere, which is the unaccountable death GDD 6.3's ⛔ exists to prevent. Here
// it is a C.SURGE_DISCHARGE window the player was given a C.SURGE_TELEGRAPH
// fuse to walk out of. A permanent kill zone is not a discharge.
//
// ⛔ AND THE FUSE IS THE FAIRNESS (GDD 6.3). The lane is NEVER lethal during the
// telegraph — killDepth stays on the rim band for the whole of it. A fuse that
// kills is not a fuse, and that sentence is the whole of that section's rule.
//
// THE CYCLE, and a player watching one should be able to name it — it climbs,
// its lane arms from the throat up, the lane goes live, it climbs again:
//
//   climb      depth rises at SURGE_CLIMB. surgeTimer counts UP toward
//              surgeInterval().  killDepth = the rim band.
//   telegraph  C.SURGE_TELEGRAPH. The fuse grows throat -> rim in the lane
//              (14-render-entities.js).  ⛔ killDepth = STILL the rim band.
//   discharge  C.SURGE_DISCHARGE. ⛔ killDepth = 0; the whole lane is live.
//   climb      …
//
// ⛔ IT STARTS IN climb WITH surgeTimer = 0 AND CAN NEVER DISCHARGE ON ITS FIRST
// STEP, from any spawn depth. A Surger that arrived already discharging is the
// same unaccountable death as a Drifter with a zero killDepth, and it is also
// what keeps test-cs004-p1.js's spawnRow case green — that case drives one
// G.update(DT) over a freshly spawned row with a Surger in it.
//
// ⛔ ONE LANE, NEVER HOPS. It touches no lane helper; `lane` is written once, by
// the constructor. That is the Carrier's and the Weaver's absence of code, and
// it is what lets CS005 P5's soak give this entity the STRONG lane assertion —
// Object.is equality with its spawn lane — rather than a per-step speed bound.
//
// ⛔ THE PHASE IS THE WHOLE STATE MACHINE and the timer counts UP (GDD 16.3).
// There is no second flag saying whether the lane is live: `killDepth` is
// derived from the phase at each transition and nowhere else.
class Surger extends Enemy {
  // `dir` is ignored — a Surger never hops. The spawner still spends its draw
  // on one (08-spawner.js), which is what keeps the run's ONE stream aligned
  // regardless of which kind came out of the throat.
  constructor(lane, depth) {
    super(lane, depth);

    // ⛔ THE RIM BAND, and it is the value this field spends most of its life
    // holding — the same expression the Vaulter, the Carrier, the bolt and the
    // Drifter use, so retuning C.RIM_CONTACT_DEPTH moves every rim-contact
    // entity together. The discharge REPLACES it for C.SURGE_DISCHARGE and puts
    // it back; see setPhase() below, which is the only writer.
    //
    // ⚠ SO THE SURGER KILLS BY TWO OF GDD 4.5's FIVE CONDITIONS, and it is the
    // only entity in the roster that does. Item 3 is the discharge; item 1 —
    // "an enemy reaching the rim in your lane and making contact" — is this
    // resting value, which it carries exactly as the Vaulter does. A Surger
    // that gets to the rim is dangerous for the ordinary reason as well as for
    // its own; there is nothing to add for that, which is the point of a field.
    this.killDepth = 1 - C.RIM_CONTACT_DEPTH;

    // "climb" | "telegraph" | "discharge". ⛔ Born in climb — see the header.
    this.phase = "climb";

    // ⛔ Counts UP, and it is RESET AT EVERY TRANSITION rather than compared
    // against a running total (GDD 16.3 — no countdown clocks in this build).
    // One timer for three phases is what makes "the phase decides what the
    // number means" true; a per-phase timer would be three things to keep in
    // step for no reader's benefit.
    this.surgeTimer = 0;
  }

  // ⛔ THE ONE WRITER OF BOTH `phase` AND `killDepth`, which is the only reason
  // the two can never disagree. A discharge that ended without restoring the
  // band would leave a permanently lane-lethal enemy on the board and nothing
  // downstream could tell it from a bug in the collision pass.
  setPhase(phase) {
    this.phase = phase;
    this.surgeTimer = 0;
    this.killDepth = phase === "discharge" ? 0 : 1 - C.RIM_CONTACT_DEPTH;
  }

  // How far the fuse has grown, as 0..1 of the lane, or 0 when the lane is not
  // arming. The draw path's one input (14-render-entities.js) and a phase read
  // rather than a fourth field.
  chargeTip() {
    if (this.phase === "discharge") return 1;
    if (this.phase !== "telegraph") return 0;
    const t = this.surgeTimer / C.SURGE_TELEGRAPH;
    return t > 1 ? 1 : t;
  }

  // `well` and `state` are unused: a Surger has no topology and no AI. The
  // signature is the contract's (GDD 6.5), not this entity's.
  update(dt, well, state) {
    this.surgeTimer += dt;

    if (this.phase === "climb") {
      // ⛔ Monotonic, and it STOPS at the rim rather than passing it — the
      // Vaulter's rule for the Vaulter's reason: depth > 1 is not a legal
      // position, and every downstream comparison (killDepth, the readability
      // zone, the respawn push) would be reading a number no other system can
      // produce.
      //
      // ⛔ AND IT RISES IN THIS PHASE ONLY. The Drifter is the entity whose
      // climb runs in every phase, and it needs that because riding is
      // unshootable and a parked unshootable entity is a concurrency squatter.
      // A Surger is shootable in all three phases, so nothing forces it, and
      // the pause is worth having: the bar stops moving at the instant its lane
      // starts arming, which is a fourth channel on GDD 6.3's fuse for free.
      if (this.depth < 1) {
        this.depth += C.SURGE_CLIMB * climbMult() * dt;
        if (this.depth > 1) this.depth = 1;
      }
      if (this.surgeTimer >= surgeInterval()) this.setPhase("telegraph");
      return;
    }

    if (this.phase === "telegraph") {
      // ⛔ NOTHING ELSE HAPPENS HERE, AND THAT IS THE FEATURE. killDepth is
      // untouched, so the lane is exactly as lethal as it was a step ago: the
      // rim band, like every other climbing enemy. The fuse is a drawing.
      if (this.surgeTimer >= C.SURGE_TELEGRAPH) this.setPhase("discharge");
      return;
    }

    // discharge — killDepth is 0 for this window and the whole lane is lethal.
    // ⛔ The restore is unconditional and it happens BEFORE the collision pass
    // of the step that ends the window, so the discharge is exactly
    // C.SURGE_DISCHARGE of lethal steps and not one more.
    if (this.surgeTimer >= C.SURGE_DISCHARGE) this.setPhase("climb");
  }

  // ⛔ drawPoly + glowStroke only (GDD 10.2). The silhouette AND the lane fuse
  // live in 14-render-entities.js; the entity hands over its phase as a single
  // 0..1 tip plus whether the lane is live, so the two states can never drift
  // apart from the two behaviours.
  draw(ctx, well) {
    drawSurger(ctx, well, this.lane, this.depth, this.chargeTip(), this.phase === "discharge");
  }

  // Any shot kills it and the shot is spent (GDD 6.1) — 200 points, when CS008
  // builds addScore(). ⛔ IN EVERY PHASE, THE DISCHARGE INCLUDED: the lane being
  // live is a threat to the player standing in it, never armour for the thing
  // making it. The answer to a Surger is to shoot it, and the fuse is the
  // window the player is given to decide whether to shoot or to leave.
  onShot(shot) {
    this.dead = true;
    return true;
  }
}

// ==========================================================================
// 08-spawner.js
// ==========================================================================
// 08-spawner.js — what releases enemies into a well, and what decides the well
// is finished (GDD 2, 6.3, 6.5, 12, 16.3).
//
// ⛔ ONE ENTRY POINT: spawnEnemy(kind, lane, depth). Every enemy that enters
// state.enemies comes through it — the interval spawner below, and CS004's
// Carrier split, which is not a spawn the player can predict but is still an
// enemy appearing in a lane. That is the whole reason this is a function
// rather than three call sites doing `state.enemies.push(new Vaulter(...))`:
// GDD 6.3's safe-spawn rule and C.ENEMY_CAP are enforced in ONE place, so a
// later enemy inherits them instead of re-implementing them (and forgetting).
//
// ⛔ EVERY DRAW COMES FROM state.rng (01-rng.js). Nothing here reaches for the
// platform generator — GDD 17.1's replay guarantee is the reason, and the
// suite scans the built file for it.
//
// ⛔ The two numbers live in state.spawn (02-state.js): `timer` counts UP
// toward spawnInterval(), `remaining` is a count spent downward. Neither is a
// countdown clock (GDD 16.3).

// The kind table. ⛔ A spawn names a kind as a STRING and this table is the one
// place a string becomes a class — CS004's Carrier split asks for "vaulter" by
// name and gets whatever this row says, so the roster grows here and nowhere
// else. `dir` is the initial heading, drawn from the run's stream by the
// caller and handed in, so an enemy that has no use for one simply ignores it.
const ENEMY_KINDS = {
  vaulter: (lane, depth, dir) => new Vaulter(lane, depth, dir),
  // ⛔ ONE ROW PER CARRIER VARIANT, not one row for "a Carrier". The cargo is
  // half of what the entity IS (GDD 6.2 — reading the glyph is the skill), so
  // it belongs in the string, exactly as the class it becomes belongs in this
  // table. `dir` is ignored by all three: a Carrier never hops, and the draw
  // for it is still spent (see spawnEnemy below).
  //
  // ⛔ THREE ROWS, ONE CLASS, NO BRANCH. The cargo is a CARGO key handed to the
  // same constructor — Carrier.onShot() and splitLanes() serve all three rows
  // and neither takes a cargo. CS005 P4 completed GDD 6.2's table by adding the
  // two rows below and nothing else; a fourth cargo is the same three lines
  // (a CARGO entry, a row here, a glyph) in three files.
  carrierVaulter: (lane, depth) => new Carrier(lane, depth, "vaulter"),
  carrierDrifter: (lane, depth) => new Carrier(lane, depth, "drifter"),
  carrierSurger:  (lane, depth) => new Carrier(lane, depth, "surger"),
  // `dir` is ignored by both of these too: a Weaver never hops and a bolt
  // travels the lane it was fired in. The draw is still spent — see spawnEnemy.
  weaver: (lane, depth) => new Weaver(lane, depth),
  // ⛔ A ROW FOR THE PROJECTILE, because the projectile is an enemy in the one
  // array like everything else (GDD 6.5). Weaver.fire() asks for it by name, so
  // the bolt inherits C.ENEMY_CAP and GDD 6.3's safe-spawn rule for free —
  // exactly as the Carrier's split does. ⚠ It is NOT a GDD 6.1 roster row, so
  // it is not counted among the enemies in scratchpad/test-registry.js.
  weaverBolt: (lane, depth) => new WeaverBolt(lane, depth),
  // ⛔ A ROW FOR THE THORN, and `depth` here is the only place in this table
  // where that argument is not a POSITION: a Thorn's depth is the TIP OF AN
  // EXTENT rooted at the throat (07-enemies.js's `anchored`). Weaver.layThorn()
  // asks for one at the Weaver's own depth, one climb step above the throat,
  // and grows it from there — which is exactly why GDD 6.3's safe-spawn
  // LOWERING below is harmless on it. ⚠ A caller that asked for a finished
  // full-length Thorn in the Skimmer's lane would not have it lowered, it would
  // have it SHORTENED; nothing does, and nothing should.
  thorn: (lane, depth) => new Thorn(lane, depth),
  // ⛔ THE FIRST ROW THAT ACTUALLY USES `dir`. Every row above either takes one
  // and ignores it or does not name it at all; the Vaulter takes one but a
  // Vaulter that never vaults (level 1, GDD 6.3) never spends it. A Drifter
  // crosses on its FIRST update, so the draw spawnEnemy() spends below is read
  // immediately — which is what makes a replay of a seed put the same Drifter
  // on the same side of the lane it was born in.
  //
  // ⛔ It is handed an integer lane CENTRE like everything else and crosses onto
  // the boundary lattice itself (07-enemies.js). This table stays a function of
  // (lane, depth, dir) and learns nothing about any entity's lattice.
  drifter: (lane, depth, dir) => new Drifter(lane, depth, dir),
  // ⛔ `dir` is ignored — a Surger never hops, and `lane` is written once by its
  // constructor. The draw spawnEnemy() spends below is STILL SPENT: a kind that
  // skipped it would make the run's one stream depend on which kind came out of
  // the throat, and GDD 17.1's replay guarantee is exactly that dependency not
  // existing. The Weaver, the bolt and the Thorn are the same case.
  surger: (lane, depth) => new Surger(lane, depth),
};

// The RELEASE BUDGET — how many THREATS may be alive at once. ⛔ The MIN of the
// two, and they are not the same kind of number: enemyConcurrent() is the
// difficulty knob and it now RISES WITH HEAT (CS007 P2, 00-config.js), while
// C.ENEMY_CAP is a readability ceiling that is never raised for difficulty.
// Reading only one of them is how a retune of the knob quietly walks past the
// ceiling. ⛔ MEASURED: the shipped ladder tops out at 8, so the cap is never
// approached and the min() is belt and braces rather than a live clamp.
function spawnLimit() {
  return Math.min(enemyConcurrent(), C.ENEMY_CAP);
}

// How many things on the board are THREATS — GDD 6.5's `blocksClear`, read off
// the entity and never off a class name, exactly as wellCleared() reads it.
//
// ⛔ THIS IS WHAT THE RELEASE BUDGET COUNTS, AND IT IS NOT WHAT C.ENEMY_CAP
// COUNTS. Paul's call, 2026-08-31 (DECISIONS.md, "the spawner-stall call"):
// the concurrency budget counts THREATS; the readability ceiling keeps counting
// ENTITIES. Before the split both questions read state.enemies.length, and a
// Thorn — permanent, unshootable-by-accident, and something the player is not
// obliged to remove (GDD 6.1) — therefore held a release slot forever. Three
// standing Thorns at a release budget of 3 shut the spawner: the quota never
// spent, the well never cleared, and nothing threatened the player either.
//
// ⛔ Three follow-ons are settled with it and are NO CHANGE: no Thorn expires
// (GDD 5's lesson — clear thorns before the last enemy — depends on it
// persisting), wellCleared() is untouched, and C.ENEMY_CAP is not raised.
function threatCount(state) {
  let n = 0;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (!e.dead && e.blocksClear) n++;
  }
  return n;
}

// Is `lane` the Skimmer's lane? ⛔ laneDelta, never (a - b): on a Ring, lane 15
// and lane 0 are neighbours (03-wells.js).
//
// The Skimmer's lane is CONTINUOUS — a player parked between two centres is
// half in each — so "its lane" is anything within one lane of it rather than
// Math.round()'s single answer. The wider reading is the safe direction to be
// wrong in: it declines a spawn the player might have been under, and the cost
// of declining is one lane redrawn.
function inSkimmerLane(well, lane, skimmer) {
  if (!skimmer || skimmer.dead) return false;
  return Math.abs(laneDelta(well, lane, skimmer.lane)) < 1;
}

// ⛔ THE ONLY WAY AN ENEMY ENTERS THE WELL. Returns the enemy, or null if the
// spawn was refused. Refusals are not errors — a caller that cares checks the
// return, and the interval spawner below spends no quota on one.
//
// It owns two rules:
//
//   ⛔ GDD 6.3 — never spawn in the Skimmer's lane above C.SAFE_SPAWN_DEPTH.
//      Enforced by LOWERING the depth to the safe line rather than by moving
//      the lane or refusing: a Carrier split has to put its two children
//      somewhere specific (GDD 6.2's "adjacent" / "flanking"), and relocating
//      them sideways would break the shape the player is being taught to read.
//      Dropping one deeper only ever gives the player more time.
//
//   ⛔ C.ENEMY_CAP — the readability ceiling, refused outright. It is not a
//      difficulty knob and this is the one place it is enforced. ⛔ It counts
//      RAW state.enemies.length, Thorns and bolts included, and CS007 P1's
//      threats split did NOT touch it: a Thorn is drawn, so a ceiling on what
//      is legible on screen counts it. threatCount() above is the other half.
function spawnEnemy(kind, lane, depth) {
  const make = ENEMY_KINDS[kind];
  if (!make) return null;
  if (state.enemies.length >= C.ENEMY_CAP) return null;

  const well = WELLS[state.wellIndex];
  const l = laneNormalize(well, lane);
  let d = depth || 0;
  if (d < 0) d = 0;
  if (d > 1) d = 1;
  if (d > C.SAFE_SPAWN_DEPTH && inSkimmerLane(well, l, state.skimmer)) {
    d = C.SAFE_SPAWN_DEPTH;
  }

  // ⛔ The heading comes from the run's ONE stream, so a replay of the seed
  // produces the same well. Drawn here rather than in the caller so every
  // spawn spends exactly one draw on it and the stream stays aligned.
  const dir = state.rng() < 0.5 ? -1 : 1;
  const e = make(l, d, dir);
  state.enemies.push(e);
  return e;
}

// GDD 8.1's INTRODUCTION SCHEDULE, read (CS007 P3). Which kinds the well may
// release at `level` — ⛔ A FUNCTION OF THE LEVEL AND NOTHING ELSE. No board
// state, no heat, no draw: GDD 1.1 P3 is "escalation you can name", and a set
// that depended on what happened to be on screen is not nameable.
//
// ⛔ THE SCHEDULE ITSELF IS DATA IN C (C.SPAWN_SCHEDULE, 00-config.js), where
// the reasoning lives — the cumulative rule, why `thorn` and `weaverBolt` are
// absent, why there is no cargo weight table, and which two of GDD 8.1's rows
// were already true before CS007. This function is the whole of the mechanism:
// the rows at or below the level, in schedule order.
//
// ⛔ IT IS THE SET THAT GROWS, NOT THE MIX THAT SHIFTS. The three Carrier
// variants are three separate rows, so GDD 8's "cargo weights shift toward
// Drifter/Surger" falls out of this loop and out of the uniform pick below.
//
// The array is allocated per call and that is deliberate: the one caller is
// pickSpawnKind(), which runs once per interval spawn — of the order of once a
// second, and never in the draw path, which is where GDD 17's no-allocation
// budget applies. Returning a shared array would hand a mutable schedule to
// whatever asked for it.
function eligibleKinds(level) {
  const out = [];
  for (let i = 0; i < C.SPAWN_SCHEDULE.length; i++) {
    const row = C.SPAWN_SCHEDULE[i];
    if (level >= row.level) out.push(row.kind);
  }
  return out;
}

// Which kind the interval spawner releases next. ⛔ ITS NAME, SIGNATURE AND
// NO-DRAW CONTRACT ARE UNCHANGED FROM CS004; only its READER moved, from the
// ⚠ TEMPORARY bench list CS007 P3 deleted to the schedule above. updateSpawner()
// below still asks a function rather than naming a kind, which is why the swap
// touched nothing else in this file.
//
// ⛔ A UNIFORM PICK OVER THE ELIGIBLE SET, AND THERE IS NO WEIGHT TABLE
// (Paul, 2026-08-31 — DECISIONS.md). See C.SPAWN_SCHEDULE for why that is a
// decision: the cargo mix shifts because the SET grows, not because anything
// here weighs it.
//
// ⛔ A ONE-ENTRY SET SPENDS NO DRAW, AND THAT IS NOT AN OPTIMISATION.
// rngPick() on a single-element array still advances the run's ONE stream
// (01-rng.js), and the stream is shared: one extra draw per spawn moves every
// spawn lane in every run, including the 10,000-tick replay GDD 17 item 1
// hashes. The game shipped without this function, so the no-choice case has to
// spend exactly what the old `spawnEnemy("vaulter", ...)` literal did — which
// is nothing. There is no genuine choice to make, so no randomness is spent
// making it. ⛔ Levels 1-2 are that case, and they are the levels every golden
// recording in the suite lives in.
function pickSpawnKind(state) {
  const kinds = eligibleKinds(state.level);
  if (kinds.length < 2) return kinds[0];
  return rngPick(state.rng, kinds);
}

// A lane for the next interval spawn. Draws from state.rng and redraws up to
// C.SPAWN_LANE_TRIES times to avoid stacking a new enemy on one that is still
// in the throat zone — two silhouettes at the same lane and nearly the same
// depth read as one, which is GDD 1.1 P2 ("legible before lethal") failing at
// the moment the player has the most time to react.
//
// ⛔ BOUNDED, and it settles for the last draw rather than looping until it is
// happy. An unbounded search spends a board-dependent number of draws, and the
// run's stream is shared: the next spawn, and everything else that draws,
// would shift depending on what happened to be on screen.
//
// C.READABILITY_DEPTH is "the throat zone" as the build already defines it
// (GDD 10.3) — the band where nothing opaque is drawn because nothing down
// there can be read. Reusing it is deliberate; a second constant for the same
// band would be two numbers to keep in step.
function pickSpawnLane(state, well) {
  let lane = rngInt(state.rng, well.lanes);
  for (let i = 1; i < C.SPAWN_LANE_TRIES && laneCrowded(state, well, lane); i++) {
    lane = rngInt(state.rng, well.lanes);
  }
  return lane;
}

// Is something already sitting in this lane, down in the throat zone?
function laneCrowded(state, well, lane) {
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    if (e.depth > C.READABILITY_DEPTH) continue;
    if (Math.abs(laneDelta(well, lane, e.lane)) < 1) return true;
  }
  return false;
}

// Re-arm for a fresh well. ⛔ enterWell() (23-main.js) is the only caller —
// resetting the spawner without also clearing state.enemies leaves the
// previous well's craft in a well that may have fewer lanes.
function resetSpawner(state) {
  state.spawn.timer = 0;
  state.spawn.remaining = C.SPAWN_QUOTA;
}

// One simulation step of the spawner. Called from Game.update() AFTER the
// enemy pass and its filter, so the alive count it reads is this step's truth
// and not last step's plus whatever died a moment ago.
//
// ⛔ AND THE INTERVAL IS HEAT-DERIVED (CS007 P2) — spawnInterval(), read ONCE
// per call into a local. Reading it twice would be harmless today and would
// stop being harmless the first time anything moved the clock mid-step.
// ⚠ A FALLING INTERVAL AND A HELD TIMER INTERACT, AND IT IS THE INTENDED
// BEHAVIOUR: a timer parked at the old, longer interval is already past the new
// one when the level advances, so the first spawn of a harder well is immediate
// rather than late. That is the same "a freed slot fires at once" rule below,
// arriving from the other side.
//
// ⛔ The timer HOLDS at the interval instead of growing past it. A spawn
// blocked by the concurrency limit therefore fires the instant a slot frees,
// which is what keeps the pressure constant; a timer that reset on a blocked
// beat would make a busy well quieter exactly when it should not be, and one
// that grew without bound would dump the backlog all at once.
//
// ⛔ AND THE BLOCK COUNTS THREATS, NOT ENTITIES (CS007 P1) — threatCount()
// above, against the release budget. A slot is held by something the player
// must remove to finish the well; a Thorn is not, so a Thorn does not hold one.
// The C.ENEMY_CAP refusal inside spawnEnemy() still counts everything, so a
// well full of Thorns stops releasing at the ceiling rather than at the budget.
function updateSpawner(state, well, dt) {
  const sp = state.spawn;
  if (sp.remaining <= 0) return;

  const interval = spawnInterval();
  if (sp.timer < interval) sp.timer += dt;
  if (sp.timer < interval) return;

  // ⛔ FROM HERE DOWN THE SPAWNER WANTED TO RELEASE: quota left, timer at the
  // interval. A step that gets this far and releases nothing is a BLOCKED BEAT
  // — PLANNED-FEATURES-CS007.md 4.2's metric, and the stall's own signature in
  // a played run. ⛔ Counted for telemetry and read by nothing here (02-state.js
  // at `tally`): both refusals below already existed and neither changed.
  if (threatCount(state) >= spawnLimit()) { state.tally.spawnBlockedTicks++; return; }

  // Depth 0 is the throat — the far aperture, the only place a well releases
  // an enemy from. GDD 3.2's convention, not a magic number.
  const lane = pickSpawnLane(state, well);
  const e = spawnEnemy(pickSpawnKind(state), lane, 0);
  // Refused (the cap): the quota is not spent. ⛔ The SECOND blocked beat, and
  // it is a different cause from the one above — the budget counts THREATS and
  // the cap counts ENTITIES (CS007 P1), so a well full of Thorns blocks here
  // and not there. One column counts both; the two are told apart by reading
  // `thornsStanding` beside it.
  if (!e) { state.tally.spawnBlockedTicks++; return; }

  sp.timer = 0;
  sp.remaining--;
}

// ⛔ TWO CONDITIONS, NOT ONE (GDD 2). The quota must be spent AND nothing that
// blocks the clear may be left alive. "The array is empty" alone is true one
// tick after startGame() and in every gap between spawns, and a well that
// cleared itself before releasing anything is the bug this exists to prevent.
//
// `blocksClear` is read off the entity, never a class name: CS004's Thorn is
// the first false, and that is exactly why a Thorn is still standing in the
// lane during the Dive (GDD 5) rather than being an oversight here.
function wellCleared(state) {
  if (state.spawn.remaining > 0) return false;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (!e.dead && e.blocksClear) return false;
  }
  return true;
}

// ==========================================================================
// 09-collision.js
// ==========================================================================
// 09-collision.js — the one collision pass, and the Purge (GDD 4.2, 4.3, 4.5,
// 6.5).
//
// ⛔ COLLISION IS 1-D. A lane match plus an overlap on `depth`, and nothing
// else. No trigonometry, no screen coordinates, no distance in pixels — every
// entity's position is (lane, depth) (GDD 3.2) and the projection that turns
// that into an x/y exists only inside draw code. Writing 2-D geometry into
// entity logic is the single most common source of subtle bugs in this kind of
// game: the moment a hit test reads a projected point, the same overlap starts
// passing at the rim and failing at the throat, because perspective() is not
// linear.
//
// ⛔ ONE PASS, in a FIXED ORDER: shots against enemies, then enemies against
// the Skimmer, each iterating its array front to back. GDD 17.1's replay
// guarantee is why — the same seed and the same recorded inputs must pick the
// same target every time, and "whichever one the loop happened to reach first"
// is only deterministic if the loop order is written down.
//
// ⛔ Called from Game.update() AFTER the entity pass and BEFORE the end-of-frame
// filters. Nothing here removes an array element; hits set `dead = true` and
// the caller's .filter() does the removal (GDD 6.5). Never splice mid-loop.
//
// ⛔ No scoring. addScore() is CS008's single entry point, and the way to keep
// it single is to not build a temporary second one here. C.PTS_VAULTER and
// C.PURGE_SAVED_BONUS are deliberately unread this changeset.

// Are two lanes the same lane, to within the contact tolerance? ⛔ laneDelta,
// never (a - b): on a 16-lane Ring the distance from lane 15.9 to lane 0 is
// +0.1, and the bare subtraction says 15.9 — a shot fired across the seam would
// miss the thing it is pointed at (03-wells.js).
function laneHit(well, a, b) {
  return Math.abs(laneDelta(well, a, b)) <= C.HIT_LANE_TOL;
}

// ---------------------------------------------------------------------------
// Shots vs enemies (GDD 4.2)
// ---------------------------------------------------------------------------
//
// ⛔ ONE SHOT RESOLVES AGAINST AT MOST ONE ENEMY PER STEP — the `break` below is
// unconditional, not conditional on consumption. A shot the enemy declines to
// consume (GDD 6.2's armour, and 07-enemies.js's base-class default) flies on
// and meets whatever is behind it on a LATER step, at a depth it has actually
// travelled to. Letting it walk the rest of the array in the same step would
// make one trigger pull kill a whole stacked lane, which is exactly the
// chip-away economy GDD 4.2 is built around inverted.
//
// The enemy decides what a hit does, not this pass: it only asks. That is what
// keeps CS004's Thorn (chip, consume) and an armoured entity (no damage, do not
// consume) out of here as special cases.
//
// ⚠ SETTLED — AN ENEMY MAY PUSH INTO state.enemies FROM INSIDE onShot, WHILE
// THIS LOOP IS ITERATING IT. CS004's Carrier does exactly that: a shot kills it
// and it splits into two children through spawnEnemy() (07-enemies.js), which
// appends to the array `j` is walking. That is safe, and it is safe because of
// three separate decisions rather than by luck:
//
//   1. the inner loop is INDEX-BASED and re-reads `.length` every iteration, so
//      an appended child is simply part of the array — nothing is invalidated,
//      no iterator is live across the push;
//   2. the `break` below is UNCONDITIONAL, so the shot that caused the split
//      stops here and cannot walk forward into the children it just created;
//   3. removal is still Game.update()'s end-of-frame `.filter()` — the dead
//      parent is skipped by `e.dead` for the rest of this step and removed
//      afterwards. Nothing is spliced mid-loop (GDD 6.5).
//
// ⛔ Do not "fix" this into a deferred spawn queue: a queue would put the
// children on the board one step late, at a depth they never occupied, and buy
// nothing. Do not make the `break` conditional either — that is item 2, and it
// is load-bearing for this as well as for the chip-away economy above.
//
// ⛔ NO TUNNELING CHECK IS NEEDED, and here is the arithmetic so a future
// session does not add one: a shot crosses C.SHOT_TIME (0.52 s) of depth in
// one step of C.FIXED_DT, i.e. 1/0.52/60 ≈ 0.032 depth units, and the hit band
// is 2 * C.HIT_DEPTH_TOL = 0.10 wide. The band is wider than the step, so a
// shot cannot step over an enemy. Retuning SHOT_TIME below ~0.3 s, or
// HIT_DEPTH_TOL below ~0.017, breaks that and would need swept-interval logic.
function collideShots(state, well) {
  for (let i = 0; i < state.shots.length; i++) {
    const shot = state.shots[i];
    if (shot.dead) continue;
    const sd = shot.depth();

    for (let j = 0; j < state.enemies.length; j++) {
      const e = state.enemies[j];
      if (e.dead) continue;
      if (Math.abs(sd - e.depth) > C.HIT_DEPTH_TOL) continue;
      if (!laneHit(well, shot.lane, e.lane)) continue;

      // Consumed retires the shot; the caller's filter frees its slot against
      // C.SHOT_MAX the same step, which is what makes camping a thorned lane
      // chip rapidly (GDD 4.2, ⚠ SETTLED — emergent, not a bug to smooth out).
      if (e.onShot(shot)) shot.dead = true;
      // ⛔ TELEMETRY ONLY (02-state.js's `tally`), and read off `e.dead` rather
      // than off the return value: onShot() answers "was the shot consumed",
      // which is a different question from "did the enemy die" — a Thorn chips
      // and lives, and a Carrier that splits dies. Nothing here branches on it.
      if (e.dead) state.tally.kills++;
      break;
    }
  }
}

// ---------------------------------------------------------------------------
// Enemies vs the Skimmer (GDD 4.5)
// ---------------------------------------------------------------------------
//
// ⛔ `killDepth` is read off the entity, never a class name (07-enemies.js).
// null means contact NEVER kills — the Weaver, whose projectile is the threat
// and whose body is not. A number is the depth at or past which contact in the
// Skimmer's lane is lethal, and every enemy that has one holds the same rim
// band `1 - C.RIM_CONTACT_DEPTH` at rest. FOUR of the five death conditions are
// that one comparison, which is why it is a field.
//
// ⛔ AND IT IS READ FRESH EVERY STEP BECAUSE ONE ENTITY MUTATES IT. CS005 P3's
// Surger sets killDepth to 0 for its C.SURGE_DISCHARGE window and puts the rim
// band back on the way out (07-enemies.js's setPhase). With 0 the depth test
// below is unconditionally true and the only remaining term is laneHit(), which
// is GDD 4.5 item 3 — "being in a Surger's lane when it discharges" — verbatim.
// ⛔ That is the whole of item 3, and this pass has NO BRANCH for it: caching
// the value, or reading it once per well, or special-casing a class here, would
// each break a death condition that today costs zero lines.
//
// ⛔ THERE IS NO TERM HERE FOR WHERE THE SKIMMER IS, and that is what makes a
// killDepth of 0 mean something other than it looks like. The craft is always
// at depth 1, so `e.depth >= 0` is true at EVERY legal depth: a `killDepth = 0`
// enemy is lethal from the throat, on its spawn step, having travelled nowhere.
// This header predicted 0 for the Drifter until CS005 P2; GDD 4.5 item 2's "any
// depth" is about there being no safe PHASE — a Drifter kills you while it is
// armoured, so you can neither shoot it nor touch it — and the Drifter ships on
// the rim band with everything else. ⚠ Zero becomes honest as a RESTING value
// the moment the craft can leave the rim (GDD 5's Dive, GDD 14.2's Jump) and
// this pass has two depths to compare. Until then a PERMANENT zero is an
// unaccountable death, and GDD 6.3 names that as the most common complaint
// about games in this genre.
//
// ⛔ CS006 P3 SETTLED WHICH OF THOSE TWO MOMENTS IT IS, AND IT IS THE JUMP
// ALONE. The Dive shipped and is NOT that moment: Game.update() short-circuits
// the whole gameplay pass while state.dive.active, so this function does not
// run during a dive at all, and the sentence above stays literally true. GDD 5's
// descent depth lives on state.dive and never on the craft (02-state.js,
// 11-dive.js), and GDD 4.5 item 5 is a strike test in that module rather than a
// killDepth here. GDD 14.2's Jump is the thing that puts a craft off the rim
// WHILE THIS PASS IS RUNNING, and it is the one that gives this pass a second
// depth to compare.
//
// ⚠ WHICH IS WHY THE SURGER'S ZERO IS RIGHT AND THE DRIFTER'S WOULD NOT BE, and
// it is the same number both times. The Surger's lasts C.SURGE_DISCHARGE and is
// preceded by C.SURGE_TELEGRAPH of visible fuse in which the lane is NOT lethal
// (GDD 6.3): the player is told, and then given time. A permanent kill zone is
// not a discharge, and a fuse that kills is not a fuse.
function collideSkimmer(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;

  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    if (e.killDepth === null || e.killDepth === undefined) continue;
    if (e.depth < e.killDepth) continue;
    if (!laneHit(well, e.lane, sk.lane)) continue;
    killSkimmer(state);
    return;   // one death per step, whatever else is touching
  }
}

// ⛔ THE ONE PLACE THE PLAYER DIES (GDD 4.4, 4.5). Every one of the five death
// conditions ends here, which is why the invulnerability guard, the life, the
// freeze and the game-over stop are written once rather than per condition.
//
// ⛔ WHAT IS NOT HERE, AND WHY. The respawn is not: Game.update() does not run
// during hit-stop, so a timer started on this line would not advance for the
// whole 1.2 s. The respawn is the first LIVE step after the freeze — the step
// that sees `skimmer.dead` — and it lives in respawnSkimmer() (23-main.js).
// GDD 4.4's rim push goes with it, for the same reason: pushing here would
// teleport the killing enemy away during the freeze the player is staring at,
// and the freeze exists to show them what happened.
//
// ⛔ No fragmentation and no score. Both are CS008's — the fragmentation is a
// kit-fx primitive, and addScore() is the one scoring entry point. Death in
// CS003 reads as hit-stop plus a respawn blink.
function killSkimmer(state) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return;

  // ⛔ AN INVULNERABLE SKIMMER CANNOT DIE, and the guard is HERE rather than in
  // the collision pass so the four death conditions still to come get it for
  // free: CS004 added item 4 (the Weaver's bolt), CS005 added items 2 and 3 (the
  // Drifter and the Surger, and neither cost this function a line), and CS006
  // adds item 5 with the Dive. An
  // invulnerable craft can still fire and still move: invulnerability suspends
  // dying, not playing. state.invulnTime counts UP and is armed to zero by the
  // respawn (02-state.js), so "expired" is the at-or-past-threshold case.
  if (state.invulnTime < C.RESPAWN_INVULN) return;

  sk.dead = true;
  state.lives -= 1;
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`). Counted HERE and never derived
  // as START_LIVES - lives: CS008's extra-life awards raise `lives` mid-run,
  // and the derived form would start quietly under-reporting the moment they
  // land. Below the invulnerability guard, so a declined kill is not a death.
  state.tally.deaths++;

  // ⛔ THE BUTTON IS RE-LATCHED BY DEATH. Devices are still drained during
  // hit-stop (23-main.js — a freeze must not dump a second of banked mouse
  // motion into the first live step), so a Purge held across the freeze arrives
  // at the step after it looking like a fresh press. Forcing the latch true
  // makes that step read as "still held": the button needs a genuine release
  // before it can spend another charge. updatePurge() writes the latch as
  // `held` every step rather than only clearing it on release, which is what
  // lets this forced value behave correctly on the way out.
  state.purgeLatched = true;

  // ⛔ THE STOP, not a screen (GDD 4.4). CS008 owns the game-over UI, the score
  // submission and the restart flow; all this changeset does is stop stepping
  // the gameplay systems, in Game.update(). The freeze below still runs — the
  // last death of a run reads exactly like the others.
  if (state.lives <= 0) {
    state.lives = 0;
    state.screen = "gameover";
  }

  // ⛔ Simulation time freezes; rendering does not. Game.hitStop() is the one
  // freeze mechanism in the build (23-main.js) and the longest request wins.
  Game.hitStop(C.HIT_STOP_DEATH);
}

// ---------------------------------------------------------------------------
// The Purge (GDD 4.3)
// ---------------------------------------------------------------------------
//
// ⛔ ONE CHARGE PER WELL, re-armed by enterWell() and NEVER accumulated.
// state.purgeUses counts UP (GDD 16.3 — no countdown timers anywhere in the
// build) and is the whole rule:
//
//   1st use   every enemy with `purgeable` dies. ⛔ Non-purgeable ones are
//             untouched — GDD 4.3's "does not remove Thorns", read off the
//             entity's flag rather than a class name, which is what keeps this
//             two rules instead of a growing list of exceptions.
//   2nd use   exactly ONE enemy dies, the purgeable one nearest the rim. No
//             bonus. The weak second use is what converts the Purge from a spam
//             button into a decision.
//   3rd+      nothing.
//
// ⛔ No bonus and no points here (GDD 7 is CS008's). C.PURGE_SAVED_BONUS reads
// state.purgeUses === 0 when it lands; that is why this is a count and not the
// boolean CS003 P2 shipped.

// The second use's victim: the purgeable enemy nearest the RIM (highest depth).
//
// ⛔ THE TIE-BREAK IS PART OF THE FEATURE, not an implementation detail. GDD 4.3
// says "deterministically, so the player can predict it", so: highest depth,
// then lowest lane, then array order. The strict comparisons below are what
// give the last of those three for free — an equal candidate never displaces
// the one already held, so the earliest survivor of a full tie wins.
function purgeTarget(state) {
  let best = null;
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !e.purgeable) continue;
    if (best === null) { best = e; continue; }
    if (e.depth > best.depth) { best = e; continue; }
    if (e.depth === best.depth && e.lane < best.lane) best = e;
  }
  return best;
}

// One simulation step of the Purge.
//
// ⛔ state.input.purge IS A LEVEL, NOT AN EDGE. All four devices in 04-input.js
// write a HELD boolean into the one input struct (GDD 9.5) — there is no
// "pressed this frame" anywhere in the build, and adding one to the input
// module would be a second input shape for every device to get right. So the
// edge is detected HERE: state.purgeLatched is simply "the button was held last
// step", and the charge is spent only on a false -> true transition. Holding
// the button down for a whole well spends exactly one charge.
//
// ⛔ CS003 P4 SETS state.purgeLatched ON DEATH, and this is why it can: input
// devices are still drained during hit-stop (23-main.js, deliberate — a freeze
// must not dump a second of banked mouse motion into the first live step), so a
// Purge held through a death arrives at the step after the freeze looking like
// a fresh press. Forcing the latch true makes that step read as "still held",
// and the button needs a genuine release before it fires again. Writing the
// latch as `held` every step, rather than only clearing it on release, is what
// makes that forced value survive correctly.
function updatePurge(state) {
  const held = !!state.input.purge;
  const rising = held && !state.purgeLatched;
  state.purgeLatched = held;
  if (!rising) return;

  state.purgeUses++;
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`). A CHARGE CONSUMED, which is uses
  // 1 and 2 and never 3+ — the counter above keeps rising so a HUD can tell
  // "spent" from "spent twice", and a telemetry column that followed it would
  // report a player mashing an empty button as having spent five purges.
  if (state.purgeUses <= 2) state.tally.purgesSpent++;

  // ⚠ SETTLED — THE PURGE KILLS, IT DOES NOT ASK. Both branches below set
  // `dead` directly and NEITHER calls onShot(). That is why a Purge on a well
  // of CS004 Carriers leaves it empty instead of doubling it: splitting lives
  // in Carrier.onShot (07-enemies.js), and the Purge never goes there.
  //
  // ⛔ Do not route this through onShot "for consistency". The two are not the
  // same question — a shot asks the enemy what a hit does (GDD 6.5), and the
  // Purge is GDD 4.3's panic button, which is a statement rather than a
  // question. A panic button that doubles the enemy count is not a panic
  // button. This works by OMISSION, which is exactly the kind of thing that
  // gets "unified" by a later session, so it is written down here.
  if (state.purgeUses === 1) {
    for (let i = 0; i < state.enemies.length; i++) {
      const e = state.enemies[i];
      if (!e.dead && e.purgeable) { e.dead = true; state.tally.kills++; }
    }
    return;
  }

  if (state.purgeUses === 2) {
    const victim = purgeTarget(state);
    // A second use with nothing left to kill is still SPENT. The charge is
    // consumed by the press, not by the result — otherwise a player could bank
    // the weak use by firing it into an empty well.
    // ⛔ `kills` is "the player destroyed it", by shot or by Purge, so both
    // branches of the panic button count here (02-state.js's `tally`).
    if (victim) { victim.dead = true; state.tally.kills++; }
  }
  // Third and later: nothing. The counter keeps rising so a HUD (CS008) can
  // tell "spent" from "spent twice" without a second field.
}

// The whole pass, in its fixed order. Called once per simulation step from
// Game.update().
function updateCollisions(state, well) {
  collideShots(state, well);
  collideSkimmer(state, well);
}

// ==========================================================================
// 11-dive.js
// ==========================================================================
// 11-dive.js — the Dive (GDD 5, 4.5 item 5, 2, 16.3). The beat between wells,
// and the last of GDD 4.5's five death conditions.
//
//   wellCleared()  ->  startDive()  ->  [ GRACE ]  ->  [ DESCENT ]  ->  nextWell()
//                                           |              |
//                                      rotate only    rotate; Thorn strike live
//
// ⛔ IT REPLACED CS003 P2's ONE-SECOND BETWEEN-WELLS HOLD, IT DOES NOT SIT
// BESIDE IT. That hold was this module's placeholder, and all three parts of it
// are deleted: its constant in 00-config.js, its field on `state`, and the
// branch at the foot of Game.update() that read them. ⛔ Neither name survives
// anywhere in the built file, and test-cs006-p3.js asserts that — a placeholder
// that outlives its replacement is what this file exists to prevent.
//
// ⛔ AND IT DOES NOT SIT WHERE THE HOLD SAT. The hold was a branch at the BOTTOM
// of update() that the whole gameplay pass fell through every step. The Dive
// SHORT-CIRCUITS: while state.dive.active there is no spawner, no enemy pass,
// no Purge, no collision pass and no well-clear check. Two edits in 23-main.js,
// not one — the branch near the top, and startDive() at the foot where the hold
// used to advance the level.
//
// ⛔ THE DIVE READS THE OUTGOING WELL. enterWell() clears state.enemies and
// mints a craft for the NEW well's lane count, so the dive has to run BEFORE
// it: nextWell() is called at the dive's END. A dive that ran after enterWell()
// would thread an empty new well and be a 2.6 s pause with a doppler on it.
//
// ⛔ IT SPENDS NO RNG. Nothing here calls state.rng() — not the strike, not the
// respawn-lane search, not the repeat. The run's ONE stream (01-rng.js) is
// untouched by a dive, which is what lets the two draws nextWell() spends past
// level 99 stay the only draws a well transition costs.
//
// ⛔ NO RENDERING. GDD 5's camera widen and doppler are presentation and are not
// this changeset's; the Dive is simulation only, and update() never touches the
// canvas (23-main.js).

// ---------------------------------------------------------------------------
// The beat fields, in one place
// ---------------------------------------------------------------------------
//
// ⛔ THE ONE WRITER OF state.dive OUTSIDE updateDive(). enterWell() calls it
// where CS003 P2's one-line hold reset used to sit, which is what makes the
// end of a dive and the `w` debug cycler agree without either knowing about the
// other: nextWell() -> enterWell() -> here.
function resetDive(state) {
  const d = state.dive;
  d.active = false;
  d.phase = "grace";
  d.timer = 0;
  d.depth = 1;
}

// ---------------------------------------------------------------------------
// Starting a dive — and ⛔ THE FILTER, which is the trap in this feature
// ---------------------------------------------------------------------------
//
// ⛔ THE DIVE IS NOT THORNS-ONLY. It is tempting to reason that a well is
// cleared before a dive, so the only thing left standing is Thorns. It is not:
// WeaverBolt ships `blocksClear = false` deliberately and with a comment
// (07-enemies.js — "a bolt in flight must not hold a cleared well open"), so
// wellCleared() returns true with a bolt travelling, and that bolt carries
// killDepth = 1 - C.RIM_CONTACT_DEPTH and is climbing toward the rim the player
// is about to leave.
//
// ⛔ SO THE BOARD IS FILTERED DOWN TO `anchored` ENTITIES, READ OFF THE CONTRACT
// FIELD AND NEVER A CLASS NAME (GDD 6.5). Today `anchored` is exactly the
// Thorn, and the rule generalises correctly rather than by coincidence:
// `anchored` means "`depth` is a LENGTH", and the Dive's hazard IS the lane
// extent. What survives a dive and what threatens it are one set, not two.
//
// ⛔ GDD 5's ⚠ SETTLED "in-flight shots are cleared at dive start" is the
// player's half of the same rule and is unchanged — a Thorn you were about to
// destroy is still there, deliberately, and the lesson is "clear thorns before
// the last enemy". Do not soften it.
//
// ⛔ `!e.dead` IS LOAD-BEARING ON THE REPEAT PATH, not belt and braces. A dive
// that ends in a strike restarts through here, and on a fully-thorned well the
// struck Thorn was killed by diveRespawn() one line earlier — without the
// deadness test it would survive the filter and be struck again forever, which
// is the exact loop the termination guarantee exists to close.
function startDive(state) {
  resetDive(state);
  state.dive.active = true;
  state.shots = [];
  state.enemies = state.enemies.filter(e => e.anchored && !e.dead);
}

// ---------------------------------------------------------------------------
// The strike (GDD 4.5 item 5) — ⛔ AND IT IS NOT A killDepth
// ---------------------------------------------------------------------------
//
// The Thorn's killDepth stays null forever. The two quantities are different
// kinds of number and the whole point of the `anchored` field is saying which:
//
//   an anchored entity's `depth`  a LENGTH — the extent [0, depth] rooted at
//                                 the throat
//   dive.depth                    a POSITION, running 1 -> 0
//
// So the strike is `dive.depth <= e.depth`, ⛔ THE ONLY TWO-DEPTH COMPARISON IN
// THE BUILD, which is why it lives here and not in the one collision pass
// (09-collision.js), whose header's "there is no term here for where the
// Skimmer is" has to stay literally true.
//
// A long Thorn is struck early in the descent and a short one late — thorn
// length IS the hazard, exactly as GDD 8 intends when it makes Weaver thorn
// length a difficulty axis. And because every extent is rooted at the throat,
// reaching depth 0 in a thorned lane is always a strike: "thread between the
// Thorns" means "be in a lane that has none", which is also why snap assist
// stays live (see updateDive).
//
// ⛔ laneHit(), the same lane-sameness the rest of the build uses — half a lane
// either side, via laneDelta so a Ring's seam is a neighbourhood and not a
// fifteen-lane gap (09-collision.js). There is no second idea of sameness here.
function diveHazard(state, well, lane, depth) {
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead || !e.anchored) continue;
    if (depth > e.depth) continue;               // above the tip: clear
    if (!laneHit(well, e.lane, lane)) continue;
    return e;
  }
  return null;
}

// Would a diver in `lane` be struck at some point in the descent? Any live
// anchored entity in the lane will do it: the extent is rooted at the throat,
// so depth 0 is inside every one of them. ⛔ Hence depth 0 here rather than a
// length threshold — a "short enough to survive" Thorn does not exist.
function diveLaneBlocked(state, well, lane) {
  return diveHazard(state, well, lane, 0) !== null;
}

// One strike test. Returns whether the craft actually died.
//
// ⛔ IT ROUTES THROUGH killSkimmer() LIKE EVERY OTHER DEATH CONDITION
// (09-collision.js), so item 5 inherits the invulnerability guard, the life,
// the purge re-latch, the freeze and the game-over stop without writing any of
// them. ⛔ And the return value is read off `sk.dead` rather than assumed:
// killSkimmer() declines while state.invulnTime is inside C.RESPAWN_INVULN, and
// an invulnerable diver must pass through the Thorn rather than destroy it for
// free — the repeat below is not a consolation prize.
function diveStrike(state, well) {
  const sk = state.skimmer;
  if (!sk || sk.dead) return false;
  if (!diveHazard(state, well, sk.lane, state.dive.depth)) return false;
  killSkimmer(state);
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`), and behind the same `sk.dead`
  // the return value is read off: an invulnerable diver passes through the
  // Thorn, and a strike that killed nobody is not a death. GDD 4.5 item 5.
  if (sk.dead) state.tally.thornDeaths++;
  return sk.dead;
}

// ---------------------------------------------------------------------------
// ⛔ THE DEATH LOOP GUARD. The naive respawn does not terminate.
// ---------------------------------------------------------------------------
//
// Work it through with nothing but the shipped rules: strike -> killSkimmer() ->
// hit-stop -> respawnSkimmer() puts the craft back in the lane it died in
// (GDD 4.4) -> the Thorn is still there, CORRECTLY, because the rim-push clamp
// skips `anchored` entities -> the dive repeats -> the strike is true again the
// instant C.RESPAWN_INVULN expires. A full-length Thorn burns a life every
// 1.5 s until the run ends.
//
// ⛔ THE GUARD IS THE LANE. A dive respawn lands in the nearest Thorn-free lane,
// chosen deterministically: lowest |laneDelta| from the lane it died in, ties
// toward INCREASING lane. Written as an outward walk (+1, -1, +2, -2, ...)
// rather than a scan with a comparator, because the walk IS the tie-break and
// there is nothing left to get wrong.
//
// ⛔ NO RNG. The run has ONE stream (01-rng.js) and a dive spends none of it; a
// draw here would make the well transition's cost depend on the board.
//
// ⛔ laneDelta's topology is inside laneWrap/the range test, not here: on a
// closed well the walk wraps, on an open one it skips candidates the well does
// not have rather than clamping them (which would visit the end lane twice and
// silently prefer it).
function diveRespawnLane(state, well, diedLane) {
  const n = well.lanes;
  const base = laneNormalize(well, Math.round(diedLane));
  for (let step = 0; step <= n; step++) {
    for (let s = 0; s < (step === 0 ? 1 : 2); s++) {
      const raw = base + (s === 0 ? step : -step);
      if (!well.closed && (raw < 0 || raw > n - 1)) continue;
      const lane = laneWrap(well, raw);
      if (!diveLaneBlocked(state, well, lane)) return lane;
    }
  }
  return null;
}

// The first LIVE step after a dive death — the same trigger as the gameplay
// pass's (23-main.js): the step that finds `skimmer.dead` IS the respawn step,
// never a timer started at death, which would not have advanced through the
// freeze.
//
// ⛔ AND IF EVERY LANE HOLDS A THORN, THE STRUCK THORN DIES INSTEAD. That is the
// termination guarantee, and it is ⛔ THE ONLY PATH IN THE BUILD BY WHICH A
// THORN IS DESTROYED BY SOMETHING OTHER THAN A SHOT (07-enemies.js says so at
// the class). Killing it frees the died lane, so the walk above finds it at
// step 0 on the repeat and the dive cannot cycle: every pass either lands
// somewhere safe or removes one Thorn, and there are finitely many.
//
// ⛔ Through respawnSkimmer(), the one respawn path, handed the lane rather
// than forking it: the rim push, the invulnerability arming and the ⚠ SETTLED
// anchored skip are all its and none of them are rewritten here. The push is a
// no-op on a dive board — every survivor is anchored — and that is a
// consequence of the filter, not a second rule.
//
// ⛔ The dive then repeats FROM THE GRACE BEAT and state.level does NOT advance:
// GDD 5, "repeats the dive, not the well."
function diveRespawn(state, well) {
  const diedLane = state.skimmer.lane;
  let lane = diveRespawnLane(state, well, diedLane);

  if (lane === null) {
    // ⛔ THE LANE IS RESOLVED FIRST AND THE HAZARD IS LOOKED UP AT IT. The craft
    // dies on a CONTINUOUS lane and comes back on a lane CENTRE, and at
    // C.HIT_LANE_TOL 0.5 a craft sitting exactly on a boundary matches the
    // Thorns in both neighbouring lanes — so killing "the one in the lane it
    // died on" could destroy a Thorn that was not blocking the lane it lands
    // in, and the repeat would strike again with nothing freed. Asking at the
    // landing lane makes the entity destroyed provably the one in the way.
    lane = laneNormalize(well, Math.round(diedLane));
    const struck = diveHazard(state, well, lane, 0);
    if (struck) struck.dead = true;
  }

  respawnSkimmer(state, well, lane);
  startDive(state);
}

// ---------------------------------------------------------------------------
// One simulation step of a dive. ⛔ THE WHOLE GAMEPLAY PASS IS SHORT-CIRCUITED.
// ---------------------------------------------------------------------------
//
// Called from Game.update() below the game-over stop and above everything else,
// which returns immediately after. What that leaves running is exactly the list
// GDD 5 describes and nothing more: the respawn aftermath, the invulnerability
// clock, the craft's own rotation, the beat, and the strike.
//
// ⛔ SNAP ASSIST STAYS LIVE, and it is not an oversight. C.HIT_LANE_TOL is 0.5,
// so safety is lane-GRANULAR — "thread between the Thorns" means "be in a lane
// that has none" — and snapping to a lane centre is what makes that
// unambiguous. Snapping is aligned with the hazard rather than against it. This
// is pillar P1 and it does not get suspended for a set piece.
//
// ⛔ THE STRIKE IS TESTED BEFORE THE COMPLETION CHECK. The last step of a
// descent is at depth 0, which is inside every extent rooted at the throat, so
// testing completion first would let a player who never left a thorned lane
// walk out of it on the final step.
function updateDive(state, well, dt) {
  const d = state.dive;

  // ⛔ The death aftermath first, exactly as the gameplay pass does it, and the
  // invulnerability clock is the ELSE branch so the respawn step is not also
  // aged. Falling through afterwards is deliberate: diveRespawn() has just
  // restarted the dive at timer 0, and the step it lands on is a grace step,
  // where there is no strike test to be caught by.
  if (state.skimmer.dead) diveRespawn(state, well);
  else if (state.invulnTime < C.RESPAWN_INVULN) state.invulnTime += dt;

  state.skimmer.update(dt, well, state.input);

  // ⛔ COUNTS UP, through the WHOLE dive (GDD 16.3 — no countdown anywhere in
  // the build). C.DIVE_TIME is the total and C.DIVE_GRACE is a slice off its
  // front, so the descent is DIVE_TIME - DIVE_GRACE and retuning either one
  // moves the beats together.
  d.timer += dt;

  if (d.timer < C.DIVE_GRACE) {
    d.phase = "grace";
    d.depth = 1;
  } else {
    d.phase = "descent";
    const span = C.DIVE_TIME - C.DIVE_GRACE;
    const t = span > 0 ? (d.timer - C.DIVE_GRACE) / span : 1;
    d.depth = t >= 1 ? 0 : 1 - t;
  }

  // GDD 4.5 item 5. ⛔ Descent only — the grace beat is the input opportunity a
  // full-length Thorn would otherwise never give (00-config.js at DIVE_GRACE).
  if (d.phase === "descent" && diveStrike(state, well)) return;

  // ⛔ The dive's state is put back by nextWell() -> enterWell() -> resetDive(),
  // the one path, rather than by a second write here. On the last life
  // killSkimmer() has already set screen = "gameover" and Game.update() returns
  // above this on every later step, so a dive death that ends a run stops the
  // dive too and the frozen board stays on screen.
  // ⛔ TELEMETRY ONLY (02-state.js's `tally`), and ⚠ it is `divesCompleted`
  // rather than "divesSurvived": a diver who loses a life to a Thorn respawns
  // and finishes the dive, so this counts dives that REACHED C.DIVE_TIME. The
  // lives lost inside them are `thornDeaths`, beside it.
  if (d.timer >= C.DIVE_TIME) { state.tally.divesCompleted++; nextWell(); }
}
